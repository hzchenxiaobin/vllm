<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C53030"/>
    </marker>
  </defs>
  <rect width="960" height="450" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#1A365D">Day 27 · 同一条 8192-token 长 prompt：整段 prefill vs 512 切块，decode 用户体感对比</text>

  <!-- ================= Panel A: chunk OFF ================= -->
  <rect x="40" y="48" width="880" height="176" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/>
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#9B2C2C">① chunk OFF：整段 prefill 占据一个 step（宽度按 18ms : 2048ms ≈ 1:110 近似按比例画）</text>

  <!-- decode-only steps -->
  <g>
    <rect x="70"  y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="98"  y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="126" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="154" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="182" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
  </g>
  <text x="137" y="86" text-anchor="middle" font-size="9.5" fill="#2A4365">decode step ≈ 18ms（B=64）</text>

  <!-- giant prefill step -->
  <rect x="228" y="92" width="500" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1.4"/>
  <text x="478" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B341E">一个 step：prefill 8192 tokens = 0.25 × 8192 ≈ 2048ms</text>
  <text x="478" y="126" text-anchor="middle" font-size="9.5" fill="#7B341E">（budget ≥ max_model_len 才放得进来 → budget 被迫开大 → 混部进一步恶化）</text>

  <!-- decode resumes -->
  <g>
    <rect x="754" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="782" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="810" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    <rect x="838" y="92" width="22" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
  </g>
  <text x="812" y="86" text-anchor="middle" font-size="9.5" fill="#2A4365">decode 恢复</text>

  <!-- token ticks of a concurrent decode request -->
  <line x1="70" y1="156" x2="870" y2="156" stroke="#A0AEC0" stroke-width="1"/>
  <g stroke="#2D3748" stroke-width="1.6">
    <line x1="81"  y1="150" x2="81"  y2="162"/>
    <line x1="109" y1="150" x2="109" y2="162"/>
    <line x1="137" y1="150" x2="137" y2="162"/>
    <line x1="165" y1="150" x2="165" y2="162"/>
    <line x1="193" y1="150" x2="193" y2="162"/>
    <line x1="765" y1="150" x2="765" y2="162"/>
    <line x1="793" y1="150" x2="793" y2="162"/>
    <line x1="821" y1="150" x2="821" y2="162"/>
    <line x1="849" y1="150" x2="849" y2="162"/>
  </g>
  <path d="M 193 146 L 765 146" stroke="#C53030" stroke-width="1.6" fill="none" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="479" y="142" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#C53030">并发 decode 请求 R1 的一个 token 间隔：18ms → 2066ms（≈110×）</text>
  <text x="60" y="184" font-size="10.5" fill="#9B2C2C">head-of-line blocking（Day 11）：R1 之后的每个 running 请求都在这 2 秒里无产出；TTFT 队列同步淤积 → TPOT p99 由它决定</text>
  <text x="60" y="204" font-size="10.5" fill="#9B2C2C">预算死结：不让长请求进 = 饥饿；让它进 = 全体停摆 —— static budget 下无解，必须切块</text>

  <!-- ================= Panel B: chunk ON ================= -->
  <rect x="40" y="244" width="880" height="176" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/>
  <text x="60" y="268" font-size="13" font-weight="bold" fill="#22543D">② chunk ON（CHUNK_SIZE=512）：同一条 prompt 摊成 16 个混合 step</text>

  <!-- 16 mixed steps -->
  <g>
    <!-- each step: orange prefill chunk + blue decode in the SAME step -->
    <g transform="translate(70,288)">
      <rect x="0"   y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="36"  y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="54"  y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="90"  y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="108" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="144" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="162" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="198" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="216" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="252" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="270" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="306" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="324" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="360" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="378" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="414" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="432" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="468" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="486" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="522" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="540" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="576" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="594" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="630" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="648" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="684" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="702" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="738" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
      <rect x="756" y="0" width="34" height="38" fill="#FEEBC8" stroke="#DD6B20" stroke-width="1"/>
      <rect x="792" y="0" width="10" height="38" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="1"/>
    </g>
  </g>
  <text x="478" y="282" text-anchor="middle" font-size="9.5" fill="#7B341E">每个混合 step ≈ 0.25×512 + 18 ≈ 146ms：橙 = 长 prompt 的一块，蓝 = 并发 decode（同 step 内共存，共享 TokenBudget）</text>

  <!-- token ticks -->
  <line x1="70" y1="352" x2="870" y2="352" stroke="#A0AEC0" stroke-width="1"/>
  <g stroke="#2D3748" stroke-width="1.4">
    <line x1="111" y1="346" x2="111" y2="358"/>
    <line x1="165" y1="346" x2="165" y2="358"/>
    <line x1="219" y1="346" x2="219" y2="358"/>
    <line x1="273" y1="346" x2="273" y2="358"/>
    <line x1="327" y1="346" x2="327" y2="358"/>
    <line x1="381" y1="346" x2="381" y2="358"/>
    <line x1="435" y1="346" x2="435" y2="358"/>
    <line x1="489" y1="346" x2="489" y2="358"/>
    <line x1="543" y1="346" x2="543" y2="358"/>
    <line x1="597" y1="346" x2="597" y2="358"/>
    <line x1="651" y1="346" x2="651" y2="358"/>
    <line x1="705" y1="346" x2="705" y2="358"/>
    <line x1="759" y1="346" x2="759" y2="358"/>
    <line x1="813" y1="346" x2="813" y2="358"/>
  </g>
  <path d="M 111 342 L 165 342" stroke="#2F855A" stroke-width="1.6" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="390" y="338" font-size="10.5" font-weight="bold" fill="#2F855A">R1 的 token 间隔上界钳到 ≈146ms（14× 改善，且可预测）</text>

  <text x="60" y="380" font-size="10.5" fill="#22543D">代价（不是免费午餐）：该 prompt 的 TTFT +（16−1）×18ms 摊销；窗口内所有并发请求 TPOT 每步 +128ms ——「把一个用户的灾难重新分配成所有用户的小税」</text>
  <text x="60" y="400" font-size="10.5" fill="#22543D">一般式：TPOT 上界 ≈ t_decode(B) + 0.25 × CHUNK_SIZE；budget 可以缩回 2048，长请求不再撑爆预算</text>
</svg>
