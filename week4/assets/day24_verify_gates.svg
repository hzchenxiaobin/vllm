<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="cr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C53030"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A365D">量化验证闭环：三道闸 + 不通过时的回退路径</text>

  <!-- start -->
  <rect x="30" y="70" width="180" height="70" rx="10" fill="#1A365D"/>
  <text x="120" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">量化 checkpoint</text>
  <text x="120" y="118" text-anchor="middle" font-size="10" fill="#BEE3F8">官方 FP8 或自产</text>
  <line x1="210" y1="105" x2="250" y2="105" stroke="#4A5568" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- Gate 1: resource -->
  <rect x="255" y="60" width="200" height="90" rx="8" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="355" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">闸 1 · 资源（启动日志）</text>
  <text x="355" y="104" text-anchor="middle" font-size="10" fill="#2D3748">"Loading model weights took"</text>
  <text x="355" y="119" text-anchor="middle" font-size="10" fill="#2D3748">"# GPU blocks" / "Maximum concurrency"</text>
  <text x="355" y="137" text-anchor="middle" font-size="9.5" fill="#2B6CB0">对照 4.1 显存预期表</text>
  <line x1="455" y1="105" x2="495" y2="105" stroke="#4A5568" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- Gate 2: performance -->
  <rect x="500" y="60" width="200" height="90" rx="8" fill="#C6F6D5" stroke="#276749"/>
  <text x="600" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">闸 2 · 性能（bench serve）</text>
  <text x="600" y="104" text-anchor="middle" font-size="10" fill="#2D3748">TTFT p99 · TPOT/ITL p99</text>
  <text x="600" y="119" text-anchor="middle" font-size="10" fill="#2D3748">吞吐 / goodput（按 SLO 过滤）</text>
  <text x="600" y="137" text-anchor="middle" font-size="9.5" fill="#276749">对照 4.2 / 4.3 期望公式</text>
  <line x1="700" y1="105" x2="740" y2="105" stroke="#4A5568" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- Gate 3: accuracy -->
  <rect x="745" y="60" width="170" height="90" rx="8" fill="#FEEBC8" stroke="#DD6B20"/>
  <text x="830" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#9C4221">闸 3 · 精度（eval）</text>
  <text x="830" y="104" text-anchor="middle" font-size="10" fill="#2D3748">PPL：ΔNLL ≤ 0.01/0.02</text>
  <text x="830" y="119" text-anchor="middle" font-size="10" fill="#2D3748">生成 diff · lm-eval 掉点</text>
  <text x="830" y="137" text-anchor="middle" font-size="9.5" fill="#9C4221">PPL 比 = e^ΔNLL</text>

  <!-- pass path -->
  <line x1="830" y1="150" x2="830" y2="200" stroke="#4A5568" stroke-width="1.5" marker-end="url(#c)"/>
  <rect x="700" y="202" width="260" height="56" rx="10" fill="#276749"/>
  <text x="830" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">上线（灰度 → 全量）</text>
  <text x="830" y="245" text-anchor="middle" font-size="10" fill="#C6F6D5">A/B 对照跑一周线上指标再全量</text>

  <!-- fail path -->
  <text x="830" y="180" font-size="9.5" fill="#276749">三闸全过</text>
  <path d="M 830 150 L 830 168 L 470 168 L 470 260" fill="none" stroke="#C53030" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="650" y="160" font-size="9.5" fill="#C53030">任一闸不过 ↓</text>

  <!-- remediation panel -->
  <rect x="30" y="262" width="880" height="230" rx="10" fill="#FFF5F5" stroke="#C53030"/>
  <text x="50" y="290" font-size="13" font-weight="bold" fill="#C53030">回退决策表：按"哪道闸挂了 + 挂的模式"选处置</text>

  <rect x="50" y="308" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#C53030"/>
  <text x="185" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">闸 3 挂 · PPL/生成崩</text>
  <text x="185" y="348" text-anchor="middle" font-size="10" fill="#742A2A">查 lm_head 是否被量化 → 校准集换贴域</text>
  <text x="185" y="364" text-anchor="middle" font-size="10" fill="#742A2A">→ W4 升 FP8 → 仍不行回 BF16</text>

  <rect x="335" y="308" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#C53030"/>
  <text x="470" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">闸 2 挂 · TPOT 没到预期</text>
  <text x="470" y="348" text-anchor="middle" font-size="10" fill="#742A2A">先看 batch/ctx 是否已稀释收益（4.2 公式）</text>
  <text x="470" y="364" text-anchor="middle" font-size="10" fill="#742A2A">→ 大 batch 负载改攻 KV 量化 / 并发容量</text>

  <rect x="620" y="308" width="270" height="72" rx="8" fill="#FFFFFF" stroke="#C53030"/>
  <text x="755" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">闸 2 挂 · TTFT 反而变差</text>
  <text x="755" y="348" text-anchor="middle" font-size="10" fill="#742A2A">W4A16 的预期行为（4.3）→ 换 FP8</text>
  <text x="755" y="364" text-anchor="middle" font-size="10" fill="#742A2A">FP8 也差 → 查 kernel fallback（日志）</text>

  <rect x="50" y="392" width="840" height="82" rx="8" fill="#FFFAF0" stroke="#DD6B20"/>
  <text x="65" y="414" font-size="11" font-weight="bold" fill="#9C4221">两个常见误判（面试加分点）</text>
  <text x="65" y="432" font-size="10.5" fill="#9C4221">① 低并发短上下文测得"量化没收益"→ 该负载瓶颈在 ovh/KV，不是权重——换并发/ctx 扫描再下结论（实验 1 步骤 b）</text>
  <text x="65" y="450" font-size="10.5" fill="#9C4221">② 只跑 PPL 就上线 → PPL 对采样分布尾部不敏感，生成 diff 与下游任务是必须的第二第三道闸</text>
  <text x="65" y="468" font-size="10.5" fill="#9C4221">（方法均复用 Day 5 指标体系 + Day 6/13 压测与三段式归档）</text>

  <text x="30" y="530" font-size="10" fill="#A0AEC0">闭环口径：预期（公式）→ 实测（三道闸）→ 归因（回退表）→ 重产（换 scheme/校准集）——而不是"测一次就定论"</text>
</svg>
