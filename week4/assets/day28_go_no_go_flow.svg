<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect width="980" height="860" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A365D">生产上线决策流程：投机解码该不该开、怎么开、何时退</text>
  <text x="490" y="52" text-anchor="middle" font-size="11" fill="#4A5568">回答"老板说论文有 3 倍加速我们也开吧"的标准动作——每一步都有数据支撑，不是拍脑袋</text>

  <!-- step 1: load health check -->
  <rect x="70" y="80" width="280" height="70" rx="10" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="210" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">1. 负载体检（离线，零成本）</text>
  <text x="210" y="127" text-anchor="middle" font-size="10" fill="#2D3748">历史流量 / ngram 模拟器估 β</text>
  <text x="210" y="142" text-anchor="middle" font-size="10" fill="#2D3748">代码补全 / RAG / Agent → β 高；开放创作 → β 低</text>

  <line x1="350" y1="115" x2="400" y2="115" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- diamond 1: beta -->
  <polygon points="520,60 640,115 520,170 400,115" fill="#FFF5F5" stroke="#C53030"/>
  <text x="520" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">β ≥ 0.5 且</text>
  <text x="520" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#C53030">TPOT 是主要 SLO？</text>

  <line x1="640" y1="115" x2="700" y2="115" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="655" y="105" font-size="10" fill="#C53030">否</text>
  <rect x="700" y="80" width="250" height="70" rx="10" fill="#FFF5F5" stroke="#C53030"/>
  <text x="825" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#C53030">不开</text>
  <text x="825" y="124" text-anchor="middle" font-size="10" fill="#742A2A">收益趋零成本照付；吞吐型业务</text>
  <text x="825" y="139" text-anchor="middle" font-size="10" fill="#742A2A">优先走量化 / P-D 分离路线</text>

  <line x1="520" y1="170" x2="520" y2="205" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="532" y="192" font-size="10" fill="#2F855A">是</text>

  <!-- step 2: route selection -->
  <rect x="330" y="205" width="380" height="92" rx="10" fill="#C6F6D5" stroke="#276749"/>
  <text x="520" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">2. 选路线（按获取成本从低到高试）</text>
  <text x="520" y="249" text-anchor="middle" font-size="10" fill="#22543D">模型自带 MTP 头 → deepseek_mtp（零额外部署）</text>
  <text x="520" y="264" text-anchor="middle" font-size="10" fill="#22543D">无头、想零成本试水 → ngram（c=0，重复性负载白拿 1.5~2×）</text>
  <text x="520" y="279" text-anchor="middle" font-size="10" fill="#22543D">存量模型、要高 β → EAGLE-3（草稿头训练几 GPU 时）</text>
  <text x="520" y="291" text-anchor="middle" font-size="9.5" fill="#22543D">配对硬约束：draft 与 target 词表/tokenizer 必须一致（配置期校验）</text>

  <line x1="520" y1="297" x2="520" y2="330" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- step 3: concurrency tier -->
  <polygon points="520,330 655,385 520,440 385,385" fill="#FFFAF0" stroke="#DD6B20"/>
  <text x="520" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#DD6B20">并发档位：</text>
  <text x="520" y="394" text-anchor="middle" font-size="11" font-weight="bold" fill="#DD6B20">低并发交互 or 高并发吞吐？</text>

  <line x1="655" y1="385" x2="715" y2="385" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="672" y="375" font-size="10" fill="#DD6B20">高</text>
  <rect x="715" y="350" width="235" height="70" rx="10" fill="#FFFAF0" stroke="#DD6B20"/>
  <text x="832" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#DD6B20">开但带熔断</text>
  <text x="832" y="392" text-anchor="middle" font-size="10" fill="#7B341E">speculative_disable_by_batch_size</text>
  <text x="832" y="407" text-anchor="middle" font-size="10" fill="#7B341E">低并发段吃收益，高并发段自动退回</text>

  <line x1="520" y1="440" x2="520" y2="472" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="532" y="460" font-size="10" fill="#2F855A">低</text>

  <!-- step 4: k sweep -->
  <rect x="330" y="472" width="380" height="76" rx="10" fill="#C6F6D5" stroke="#276749"/>
  <text x="520" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">3. k 扫参（1→5，同负载同并发对照）</text>
  <text x="520" y="516" text-anchor="middle" font-size="10" fill="#22543D">先写 S_pred = E[τ]/(γ+kc)，再看 S_meas；峰值即你的 k*</text>
  <text x="520" y="531" text-anchor="middle" font-size="10" fill="#22543D">经验 k* ≈ 3~4；β &lt; 0.5 时 k ≤ 2；负载/并发档位变了要重扫</text>

  <line x1="520" y1="548" x2="520" y2="580" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- step 5: acceptance gates -->
  <rect x="240" y="580" width="560" height="104" rx="10" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="520" y="605" text-anchor="middle" font-size="12" font-weight="bold" fill="#2B6CB0">4. 三道验收闸（全过才上线）</text>
  <text x="520" y="625" text-anchor="middle" font-size="10" fill="#2D3748">性能闸：S_TPOT ≥ 预期下限 · S_thr ≥ 1（吞吐不亏）· TTFT 不显著劣化</text>
  <text x="520" y="641" text-anchor="middle" font-size="10" fill="#2D3748">接受率闸：acceptance 达负载体检预估 · 深度衰减曲线决定 k 去留</text>
  <text x="520" y="657" text-anchor="middle" font-size="10" fill="#2D3748">质量闸：greedy diff = 0 · 抽样输出对比无漂移（理论无损 ≠ 工程无损）</text>
  <text x="520" y="673" text-anchor="middle" font-size="10" fill="#2D3748">任一不过 → 回退：k↓ → 换路线 → 关闭（与量化三道闸同一方法论）</text>

  <line x1="520" y1="684" x2="520" y2="716" stroke="#4A5568" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- step 6: online ops -->
  <rect x="240" y="716" width="560" height="92" rx="10" fill="#E9D8FD" stroke="#6B46C1"/>
  <text x="520" y="741" text-anchor="middle" font-size="12" font-weight="bold" fill="#44337A">5. 上线后持续运营</text>
  <text x="520" y="760" text-anchor="middle" font-size="10" fill="#44337A">acceptance 时间窗差分监控（累计值会骗人）· 持续 &lt;0.4 告警 → 换路线或关</text>
  <text x="520" y="776" text-anchor="middle" font-size="10" fill="#44337A">熔断触发观察（acceptance 计数停止增长 = 熔断生效）· 负载漂移时重扫 k</text>
  <text x="520" y="792" text-anchor="middle" font-size="10" fill="#44337A">进阶：按负载分池（代码流量与对话流量分开）· P/D 分离后只在 D 侧低并发档开（Day 29-31）</text>

  <!-- footer -->
  <rect x="70" y="826" width="840" height="24" rx="6" fill="#FFFFF0" stroke="#B7791F"/>
  <text x="490" y="842" text-anchor="middle" font-size="10" fill="#975A16">判据一句话：S = E[τ]/(γ+kc) &gt; 1 才值得开——分子看负载（β），分母看档位（γ、c）与工程开销，系统层看 budget 与显存</text>
</svg>
