<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 830" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#ffffff"/>
  <text x="620" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">70B 白板自测：15 分钟完整推演（不看任何笔记）</text>
  <text x="620" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Llama-3-70B · 2×H100 80GB · TP=2 · ctx=4096 · util=0.9 —— Day 2 题 1/题 2 的闭卷重演 + 指标收口</text>

  <!-- ===== 配置条 ===== -->
  <rect x="80"  y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="168"  y="91" text-anchor="middle" font-size="11.5" fill="#334155">L = 80</text>
  <rect x="268" y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="356" y="91" text-anchor="middle" font-size="11.5" fill="#334155">H = 8192 · d = 128</text>
  <rect x="456" y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="544" y="91" text-anchor="middle" font-size="11.5" fill="#334155">H_q=64 · H_kv=8（GQA）</text>
  <rect x="644" y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="732" y="91" text-anchor="middle" font-size="11.5" fill="#334155">FFN 28672 · 词表 128256</text>
  <rect x="832" y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="920" y="91" text-anchor="middle" font-size="11.5" fill="#334155">N ≈ 70.6B（GEMM 69.5B）</text>
  <rect x="1020" y="68" width="177" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="1108" y="91" text-anchor="middle" font-size="11.5" fill="#334155">3.35 TB/s · 72 GB/卡</text>

  <!-- ===== ① KV/token ===== -->
  <rect x="80" y="118" width="1117" height="64" rx="8" fill="#ecfeff" stroke="#0891b6" stroke-width="1.5"/>
  <text x="96" y="141" font-size="13" font-weight="bold" fill="#155e75">① KV/token = 2 × L × H_kv × d × P</text>
  <text x="96" y="162" font-size="11.5" fill="#334155">BF16：320 KiB（TP2 每卡 4 头 → 160 KiB）　·　FP8：160 KiB（TP2 每卡 → 80 KiB）</text>
  <text x="96" y="177" font-size="11.5" fill="#334155">每序列/卡 @4K：BF16 = 4096×160 KiB ≈ 0.671 GB　·　FP8 = 4096×80 KiB ≈ 0.336 GB　（TP 按 KV 头切分，分子分母同除 2）</text>

  <!-- ===== ② 显存四件套 ===== -->
  <text x="80" y="212" font-size="13" font-weight="bold" fill="#334155">② 显存四件套（每卡预算 = 80 × 0.9 = 72 GB；比例尺：900 px = 72 GB）</text>

  <!-- BF16 bar -->
  <text x="160" y="247" text-anchor="end" font-size="12.5" font-weight="bold" fill="#9a3412">BF16</text>
  <rect x="170" y="228" width="882" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="611" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">权重 70.6 GB/卡（141.2 ÷ 2）</text>
  <rect x="1052" y="228" width="25" height="34" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1064" y="219" text-anchor="middle" font-size="9.5" fill="#c2410c">激活≈2G</text>
  <circle cx="1170" cy="245" r="14" fill="#dc2626"/>
  <text x="1170" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">✕</text>
  <text x="170" y="280" font-size="11" fill="#991b1b">KV 池 = 72 − 70.6 − 2 ≈ −0.6 GB → 装不下。口径敏感性：util=0.9 且激活=0 → 2 路；util=1.0 且激活=0 → 14 路 —— 全部指向「不可用」</text>

  <!-- FP8 bar -->
  <text x="160" y="322" text-anchor="end" font-size="12.5" font-weight="bold" fill="#065f46">FP8</text>
  <rect x="170" y="303" width="441" height="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">权重 35.3 GB/卡</text>
  <rect x="611" y="303" width="25" height="34" fill="#ffedd5" stroke="#ea580c"/>
  <text x="623" y="294" text-anchor="middle" font-size="9.5" fill="#c2410c">激活≈2G</text>
  <rect x="636" y="303" width="434" height="34" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="853" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">KV 池 ≈ 34.7 GB/卡</text>
  <circle cx="1170" cy="320" r="14" fill="#059669"/>
  <text x="1170" y="325" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">✓</text>
  <text x="170" y="355" font-size="11" fill="#065f46">结论：70B 的 BF16 是「装得下权重、装不下业务」→ 转 FP8（W 与 KV 同时减半）：下界 41.5→20.9 ms，KV 池 −0.6→34.7 GB</text>

  <!-- ===== ③④⑤ 三个盒子 ===== -->
  <rect x="80" y="374" width="361" height="112" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="96" y="397" font-size="12.5" font-weight="bold" fill="#065f46">③ 并发上限（FP8）</text>
  <text x="96" y="419" font-size="11.5" fill="#334155">C_kv = 34.7 GB ÷ 0.336 GB/序列</text>
  <text x="96" y="437" font-size="11.5" font-weight="bold" fill="#065f46">≈ 103 路（满长 4K 口径）</text>
  <text x="96" y="458" font-size="10.5" fill="#64748b">BF16 对照 ≈ 0~14 路 ✕</text>
  <text x="96" y="474" font-size="10.5" fill="#64748b">对账：启动日志 "Maximum concurrency ≈ 100x"</text>

  <rect x="457" y="374" width="361" height="112" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="473" y="397" font-size="12.5" font-weight="bold" fill="#9a3412">④ TPOT 下界（FP8，每卡）</text>
  <text x="473" y="419" font-size="11.5" fill="#334155">B=1：(34.75+0.34)/3.35 ≈ 10.5 ms</text>
  <text x="473" y="437" font-size="11.5" fill="#334155">B=103：(34.75+34.6)/3.35 ≈ 20.7 ms</text>
  <text x="473" y="458" font-size="11.5" font-weight="bold" fill="#9a3412">工程口径 ×1.5 ≈ 31 ms</text>
  <text x="473" y="474" font-size="10.5" fill="#64748b">计算项 71 µs，差 294×（= ridge 591 ÷ AI 2）</text>

  <rect x="834" y="374" width="363" height="112" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="850" y="397" font-size="12.5" font-weight="bold" fill="#1e3a8a">⑤ 三重上限收口</text>
  <text x="850" y="419" font-size="11.5" fill="#334155">C_slo@50ms = (167.5−34.75)/0.336 ≈ 396</text>
  <text x="850" y="437" font-size="11.5" font-weight="bold" fill="#1e3a8a">C* = min(103, 396, 1024) = 103 → KV 绑定</text>
  <text x="850" y="458" font-size="10.5" fill="#64748b">B* = 34.75/0.336 ≈ 104 ≈ C_kv</text>
  <text x="850" y="474" font-size="10.5" fill="#64748b">（KV 池恰与权重等量 → 膝点即容量点）</text>

  <!-- ===== ⑥ 指标收口 ===== -->
  <rect x="80" y="502" width="1117" height="96" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="96" y="525" font-size="12.5" font-weight="bold" fill="#6b21a8">⑥ 指标收口（把 Day 5 的恒等式接上）</text>
  <text x="96" y="547" font-size="11.5" fill="#334155">吞吐 ≈ 103/0.031 ≈ 3.3K tok/s（下界口径 5.0K）　·　E2E(n=512) = TTFT 0.2 s + 511×31 ms ≈ 16 s　·　TPOT 31 ms ≤ SLO 50 ms ✓</text>
  <text x="96" y="567" font-size="11.5" fill="#334155">Little's Law：λ_req ≈ 103/16 ≈ 6.4 req/s；λ_tok ≈ 3.3K tok/s（两口径互验 ±2%）</text>
  <text x="96" y="587" font-size="11.5" fill="#334155">集群外推：峰值 100 QPS → 100 ÷ 6.4 ≈ 16 台 × 1.4 冗余 ≈ 22 台（部署点取 goodput 膝点左侧，非容量上限）</text>

  <!-- ===== 3 分钟流程卡 ===== -->
  <rect x="80" y="618" width="1117" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="645" font-size="13.5" font-weight="bold" fill="#334155">3 分钟流程卡（面试白板直接用——面试前最后看的就是它）</text>

  <rect x="96"  y="660" width="162" height="72" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="177" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">① 抄配置</text>
  <text x="177" y="701" text-anchor="middle" font-size="10" fill="#475569">L, H_kv, d, N, P</text>
  <text x="177" y="716" text-anchor="middle" font-size="10" fill="#475569">查 config 勿反推</text>

  <line x1="258" y1="696" x2="276" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="278" y="660" width="162" height="72" rx="8" fill="#ecfeff" stroke="#0891b6"/>
  <text x="359" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#155e75">② KV 公式</text>
  <text x="359" y="701" text-anchor="middle" font-size="10" fill="#475569">2·L·H_kv·d·P</text>
  <text x="359" y="716" text-anchor="middle" font-size="10" fill="#475569">单序列 = ×max_len</text>

  <line x1="440" y1="696" x2="458" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="460" y="660" width="162" height="72" rx="8" fill="#f0fdf4" stroke="#059669"/>
  <text x="541" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">③ 显存账</text>
  <text x="541" y="701" text-anchor="middle" font-size="10" fill="#475569">池 = Mem×util−N·P/TP−A</text>
  <text x="541" y="716" text-anchor="middle" font-size="10" fill="#475569">并发 = 池 ÷ 单序列/TP</text>

  <line x1="622" y1="696" x2="640" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="642" y="660" width="162" height="72" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="723" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a3412">④ 时延账</text>
  <text x="723" y="701" text-anchor="middle" font-size="10" fill="#475569">TPOT ≥ (W+B·s̄·KV)/BW</text>
  <text x="723" y="716" text-anchor="middle" font-size="10" fill="#475569">×1.2~2 报工程口径</text>

  <line x1="804" y1="696" x2="822" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="824" y="660" width="162" height="72" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="905" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">⑤ SLO / 三重上限</text>
  <text x="905" y="701" text-anchor="middle" font-size="10" fill="#475569">C* = min(C_kv,C_slo,</text>
  <text x="905" y="716" text-anchor="middle" font-size="10" fill="#475569">max_num_seqs)；SLO&gt;W/BW</text>

  <line x1="986" y1="696" x2="1004" y2="696" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="1006" y="660" width="174" height="72" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1093" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">⑥ 对锚点</text>
  <text x="1093" y="701" text-anchor="middle" font-size="10" fill="#475569">70B FP8 单卡 21ms·TP2 103路</text>
  <text x="1093" y="716" text-anchor="middle" font-size="10" fill="#475569">8B→8ms@A100 · ridge 295/591</text>

  <text x="640" y="760" text-anchor="middle" font-size="11.5" fill="#334155">主动声明假设（激活取 2 GB、无 prefix caching、s̄ = 满长 4K）比算得精确更加分；量级对不上先查 H_kv、GiB/GB、util 三处</text>
  <text x="640" y="786" text-anchor="middle" font-size="11.5" fill="#64748b">60 秒版本：BF16 装不下（−0.6 GB）→ FP8：权重/卡 35.3 GB，KV 池 34.7 GB → 103 路；TPOT 下界 10.5→20.7 ms（工程 31 ms）→ 吞吐 3.3K tok/s，KV 容量绑定</text>
</svg>
