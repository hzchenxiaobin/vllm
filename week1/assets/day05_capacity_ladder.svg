<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
  <text x="620" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">三重上限阶梯：C* = min( C_kv , C_slo , C_maxseq ) —— 谁先绑定，谁就是容量</text>
  <text x="620" y="50" text-anchor="middle" font-size="12" fill="#64748b">Qwen3-8B BF16 · 80GB 单卡（KV 池 54.1 GB，Day 2 题 3）· C_kv=KV 容量 · C_slo=TPOT SLO 反推（Day 2 题 3c 的推广）· C_maxseq=调度上限（V1 默认 1024）</text>

  <!-- ===== 阶梯① ===== -->
  <rect x="30" y="72" width="232" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="146" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">场景① H100 · s̄=600</text>
  <text x="146" y="112" text-anchor="middle" font-size="11" fill="#1e3a8a">TPOT SLO = 100 ms（宽松）</text>
  <text x="146" y="136" text-anchor="middle" font-size="10.5" fill="#475569">短上下文 + 松 SLO：</text>
  <text x="146" y="152" text-anchor="middle" font-size="10.5" fill="#475569">SLO 根本绑不到，</text>
  <text x="146" y="168" text-anchor="middle" font-size="10.5" fill="#475569">显存先到顶</text>

  <line x1="280" y1="124" x2="1160" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="146" font-size="10" fill="#64748b">0</text>
  <text x="438" y="146" text-anchor="middle" font-size="10" fill="#64748b">200</text>
  <text x="596" y="146" text-anchor="middle" font-size="10" fill="#64748b">400</text>
  <text x="754" y="146" text-anchor="middle" font-size="10" fill="#64748b">600</text>
  <text x="912" y="146" text-anchor="middle" font-size="10" fill="#64748b">800</text>
  <text x="1070" y="146" text-anchor="middle" font-size="10" fill="#64748b">1000</text>

  <line x1="763" y1="98" x2="763" y2="150" stroke="#2563eb" stroke-width="3"/>
  <circle cx="763" cy="124" r="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="763" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">★ C_kv = 611（绑定）</text>
  <line x1="1089" y1="98" x2="1089" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="1089" y="92" text-anchor="middle" font-size="10.5" fill="#64748b">C_maxseq = 1024</text>
  <text x="1156" y="112" text-anchor="end" font-size="10.5" fill="#c2410c">C_slo = 2339 →</text>
  <text x="763" y="172" text-anchor="middle" font-size="10.5" fill="#334155">C* = 611 路：KV 容量是天花板（权重摊销后 TPOT 才 10 ms 量级，SLO 不构成约束）</text>

  <!-- ===== 阶梯② ===== -->
  <rect x="30" y="192" width="232" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="146" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">场景② A100 · s̄=2000</text>
  <text x="146" y="232" text-anchor="middle" font-size="11" fill="#9a3412">TPOT SLO = 20 ms（紧）</text>
  <text x="146" y="256" text-anchor="middle" font-size="10.5" fill="#475569">Day 4 的 182 路（η=99.6%）</text>
  <text x="146" y="272" text-anchor="middle" font-size="10.5" fill="#475569">在紧 SLO 下只能用一半——</text>
  <text x="146" y="288" text-anchor="middle" font-size="10.5" fill="#475569">PagedAttention 的收益被 SLO 折价</text>

  <line x1="280" y1="244" x2="1160" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="266" font-size="10" fill="#64748b">0</text>
  <text x="438" y="266" text-anchor="middle" font-size="10" fill="#64748b">200</text>
  <text x="596" y="266" text-anchor="middle" font-size="10" fill="#64748b">400</text>
  <text x="754" y="266" text-anchor="middle" font-size="10" fill="#64748b">600</text>
  <text x="912" y="266" text-anchor="middle" font-size="10" fill="#64748b">800</text>
  <text x="1070" y="266" text-anchor="middle" font-size="10" fill="#64748b">1000</text>

  <line x1="349" y1="218" x2="349" y2="270" stroke="#ea580c" stroke-width="3"/>
  <circle cx="349" cy="244" r="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="349" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">★ C_slo = 87（绑定）</text>
  <line x1="425" y1="218" x2="425" y2="270" stroke="#2563eb" stroke-width="3"/>
  <text x="425" y="286" text-anchor="middle" font-size="10.5" fill="#1e3a8a">C_kv = 183</text>
  <line x1="1089" y1="218" x2="1089" y2="270" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="1089" y="212" text-anchor="middle" font-size="10.5" fill="#64748b">C_maxseq = 1024</text>
  <text x="600" y="292" text-anchor="middle" font-size="10.5" fill="#334155">C* = 87 路（×0.48）；SLO=10 ms → 18 路；SLO=7 ms &lt; 下界 7.4 ms → 无解（换硬件或量化）</text>

  <!-- ===== 阶梯③ ===== -->
  <rect x="30" y="312" width="232" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="146" y="334" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">场景③ A100 · 满长 8192</text>
  <text x="146" y="352" text-anchor="middle" font-size="11" fill="#5b21b6">TPOT SLO = 50 ms</text>
  <text x="146" y="376" text-anchor="middle" font-size="10.5" fill="#475569">按 max_model_len 满长算</text>
  <text x="146" y="392" text-anchor="middle" font-size="10.5" fill="#475569">（启动日志的保守口径，</text>
  <text x="146" y="408" text-anchor="middle" font-size="10.5" fill="#475569">Day 2 题 3 / Day 4 实验 2）</text>

  <line x1="280" y1="364" x2="1160" y2="364" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="386" font-size="10" fill="#64748b">0</text>
  <text x="438" y="386" text-anchor="middle" font-size="10" fill="#64748b">200</text>
  <text x="596" y="386" text-anchor="middle" font-size="10" fill="#64748b">400</text>
  <text x="754" y="386" text-anchor="middle" font-size="10" fill="#64748b">600</text>
  <text x="912" y="386" text-anchor="middle" font-size="10" fill="#64748b">800</text>
  <text x="1070" y="386" text-anchor="middle" font-size="10" fill="#64748b">1000</text>

  <line x1="315" y1="338" x2="315" y2="390" stroke="#2563eb" stroke-width="3"/>
  <circle cx="315" cy="364" r="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="300" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">★ C_kv = 44（绑定）</text>
  <line x1="337" y1="338" x2="337" y2="390" stroke="#ea580c" stroke-width="3"/>
  <text x="337" y="406" text-anchor="middle" font-size="10.5" fill="#c2410c">C_slo = 72</text>
  <line x1="1089" y1="338" x2="1089" y2="390" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="1089" y="332" text-anchor="middle" font-size="10.5" fill="#64748b">C_maxseq = 1024</text>
  <text x="620" y="412" text-anchor="middle" font-size="10.5" fill="#334155">C* = 44 路：长上下文把 KV 池吃干——这就是「长上下文的显存悬崖」（Day 2 §2.2）</text>

  <!-- ===== 底部两盒 ===== -->
  <rect x="30" y="432" width="580" height="186" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="320" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">公式与前提（白板必写）</text>
  <text x="48" y="484" font-size="11.5" fill="#334155">C_kv = KV 池 ÷ ( s̄ · KV_per_token )　（Day 2/4）</text>
  <text x="48" y="508" font-size="11.5" fill="#334155">C_slo = ( TPOT_SLO · BW_eff − W ) ÷ ( s̄ · KV_tok )</text>
  <text x="48" y="532" font-size="11.5" fill="#334155">C_maxseq = max_num_seqs（V1 默认 1024）</text>
  <text x="48" y="560" font-size="11.5" fill="#b45309">前提：TPOT_SLO &gt; W ÷ BW（Day 2 下界），否则 C_slo = 0 无解</text>
  <text x="48" y="584" font-size="11.5" fill="#334155">C* 是天花板；部署点还要在 C* 左侧留排队余量（goodput knee，</text>
  <text x="48" y="604" font-size="11.5" fill="#334155">见前图）——「容量」与「工作点」是两个数</text>

  <rect x="630" y="432" width="580" height="186" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="920" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">量化：SLO 可行域的「扩容器」（Day 22-24 预告）</text>
  <text x="648" y="484" font-size="11.5" fill="#047857">FP8（权重+KV 同时减半，池 54.1→61.6 GB）三条线同时右移：</text>
  <text x="648" y="508" font-size="11.5" fill="#047857">· TPOT 下界 7.4 → 3.7 ms（SLO=10ms 从无解变有解）</text>
  <text x="648" y="532" font-size="11.5" fill="#047857">· C_slo @20ms：87 → 225 路（×2.6）</text>
  <text x="648" y="556" font-size="11.5" fill="#047857">· C_kv：183 → 418 路（权重省下的显存全部变 KV）</text>
  <text x="648" y="584" font-size="11.5" fill="#334155">同一台机器、同一个 SLO，容量 ×2.6——这就是「量化的容量效应」</text>
  <text x="648" y="604" font-size="11.5" fill="#334155">与「时延效应」（下界减半）一体两面（Day 2 Q3）</text>
</svg>
