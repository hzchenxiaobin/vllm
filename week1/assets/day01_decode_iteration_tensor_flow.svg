<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 930" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#ffffff"/>
  <text x="620" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一次 Decode 迭代的张量流（batch=1，以 Qwen3-8B · BF16 为例）</text>

  <!-- ===== LEFT: tensor flow ===== -->
  <rect x="230" y="52" width="220" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-size="12.5" fill="#0f172a">token_id(i−1)（标量）</text>

  <line x1="340" y1="84" x2="340" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="190" y="108" width="300" height="44" rx="6" fill="#eff6ff" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Embedding 查表</text>
  <text x="340" y="144" text-anchor="middle" font-size="10.5" fill="#334155">读词表的 1 行 ≈ 8 KB（表本身不必全读）</text>

  <line x1="340" y1="152" x2="340" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="350" y="166" font-size="11" fill="#334155">h [1×4096]</text>

  <!-- layer container -->
  <rect x="60" y="178" width="580" height="566" rx="10" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="80" y="202" font-size="13" font-weight="bold" fill="#475569">Transformer 层 × 36（串行执行，每层都走一遍）</text>
  <text x="624" y="202" text-anchor="end" font-size="12.5" font-weight="bold" fill="#7c3aed">权重读取 ≈ 386 MB/层</text>

  <rect x="220" y="214" width="240" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="231" text-anchor="middle" font-size="11.5" fill="#0f172a">RMSNorm</text>
  <line x1="340" y1="240" x2="340" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="100" y="260" width="480" height="46" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">QKV 投影（GEMV）　★ 读 W_qkv[4096×6144] = 50 MB</text>
  <text x="340" y="297" text-anchor="middle" font-size="10.5" fill="#5b21b6">输出 q,k,v [1×(32+8+8)×128]</text>

  <line x1="270" y1="306" x2="270" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="328" font-size="10.5" fill="#334155">q_i [1×4096]</text>

  <!-- KV cache block -->
  <rect x="470" y="318" width="156" height="160" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="548" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">KV Cache（本层）</text>
  <rect x="486" y="348" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="513" y="348" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="540" y="348" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="567" y="348" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="594" y="348" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/>
  <rect x="486" y="364" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="513" y="364" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="540" y="364" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="567" y="364" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="594" y="364" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/>
  <rect x="486" y="380" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="513" y="380" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="540" y="380" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="567" y="380" width="24" height="12" rx="2" fill="#a7f3d0" stroke="#059669"/><rect x="594" y="380" width="24" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="2 2"/>
  <text x="548" y="410" text-anchor="middle" font-size="10.5" fill="#065f46">K[0..i] 与 V[0..i]</text>
  <text x="548" y="430" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">decode：整块读出 ★</text>
  <text x="548" y="448" text-anchor="middle" font-size="10" fill="#065f46">追加写 4 KiB / 读 (i+1)·4 KiB</text>
  <text x="548" y="466" text-anchor="middle" font-size="10" fill="#065f46">（vLLM 中按 block 组织 → Day 4）</text>

  <line x1="468" y1="306" x2="502" y2="315" stroke="#059669" stroke-width="2" marker-end="url(#arG)"/>

  <rect x="100" y="344" width="340" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Attention：softmax(q_i · K^T / √d) · V</text>
  <text x="270" y="382" text-anchor="middle" font-size="10.5" fill="#334155">读 K[0..i]、V[0..i] ★（i+1 个槽位，非连续 block）</text>
  <line x1="470" y1="398" x2="446" y2="386" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arB)"/>

  <line x1="270" y1="392" x2="270" y2="408" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="100" y="412" width="340" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">O 投影（GEMV）</text>
  <text x="270" y="446" text-anchor="middle" font-size="10.5" fill="#5b21b6">★ 读 W_o[4096×4096] = 34 MB</text>
  <line x1="270" y1="452" x2="270" y2="466" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="170" y="470" width="200" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="270" y="487" text-anchor="middle" font-size="11.5" fill="#0f172a">残差相加 ＋ RMSNorm</text>
  <line x1="270" y1="496" x2="270" y2="510" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="100" y="514" width="340" height="64" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="270" y="533" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">gate / up 投影（GEMV）★ 读 2×[4096×12288] = 201 MB</text>
  <text x="270" y="551" text-anchor="middle" font-size="11" fill="#5b21b6">SwiGLU：silu(g) ⊙ u</text>
  <text x="270" y="569" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">down 投影（GEMV）★ 读 [12288×4096] = 101 MB</text>
  <line x1="270" y1="578" x2="270" y2="592" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="170" y="596" width="200" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="270" y="613" text-anchor="middle" font-size="11.5" fill="#0f172a">残差相加 ＋ RMSNorm</text>

  <text x="350" y="652" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c3aed">↑ 单层合计：读权重 ≈ 386 MB ＋ 读 KV (i+1)×4 KiB ＋ 写 KV 4 KiB</text>
  <line x1="270" y1="622" x2="270" y2="752" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="282" y="700" font-size="10.5" fill="#334155">h 逐层传递</text>

  <rect x="220" y="758" width="240" height="26" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="775" text-anchor="middle" font-size="11.5" fill="#0f172a">Final RMSNorm</text>
  <line x1="340" y1="784" x2="340" y2="800" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="120" y="804" width="440" height="44" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="823" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">lm_head（GEMV）　★ 读 W_lm[4096×151936] = 1.24 GB</text>
  <text x="340" y="841" text-anchor="middle" font-size="10.5" fill="#5b21b6">logits [1×151936]</text>
  <line x1="340" y1="848" x2="340" y2="864" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="170" y="868" width="340" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="888" text-anchor="middle" font-size="12" fill="#0f172a">sample（temperature / top-p）→ token_id(i)</text>

  <path d="M 510 884 H 662 V 68 H 236" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <text x="524" y="878" font-size="10.5" font-weight="bold" fill="#475569">自回归循环：输出即下一步输入</text>

  <!-- ===== RIGHT: memory bill ===== -->
  <rect x="690" y="52" width="530" height="848" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="710" y="80" font-size="15" font-weight="bold" fill="#9a3412">本步 HBM 读取账单（batch=1）</text>

  <rect x="710" y="96" width="490" height="78" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="726" y="118" font-size="12.5" font-weight="bold" fill="#0f172a">① 权重（36 层 GEMM ＋ lm_head）</text>
  <text x="726" y="136" font-size="11" fill="#334155">36 × 386 MB ＋ 1.24 GB</text>
  <text x="1186" y="130" text-anchor="end" font-size="15" font-weight="bold" fill="#7c3aed">≈ 15.1 GB</text>
  <text x="726" y="156" font-size="10" fill="#64748b">总权重 16.4 GB；Embedding 只查 1 行（≈8 KB），不计全表</text>

  <rect x="710" y="184" width="490" height="78" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="726" y="206" font-size="12.5" font-weight="bold" fill="#0f172a">② KV cache（设 ctx = 8192）</text>
  <text x="726" y="224" font-size="11" fill="#334155">8192 × 144 KiB（每 token 2×36×8×128×2 B）</text>
  <text x="1186" y="218" text-anchor="end" font-size="15" font-weight="bold" fill="#059669">≈ 1.13 GB</text>
  <text x="726" y="244" font-size="10" fill="#64748b">读全部历史 ＋ 追加 1 个槽位；随 ctx 线性增长</text>

  <rect x="710" y="272" width="490" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="726" y="294" font-size="12.5" font-weight="bold" fill="#0f172a">③ 激活 / 嵌入行 / 采样状态</text>
  <text x="1186" y="296" text-anchor="end" font-size="13" font-weight="bold" fill="#64748b">≈ MB 级（零头）</text>
  <text x="726" y="314" font-size="10" fill="#64748b">M=1 时激活读写与 ①② 相比可忽略</text>

  <rect x="710" y="342" width="490" height="118" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="726" y="366" font-size="13" font-weight="bold" fill="#9a3412">TPOT 下界 ≈ (① ＋ ②) ÷ HBM 带宽</text>
  <text x="726" y="390" font-size="11.5" fill="#334155">A100 80GB（2.04 TB/s）：16.2 GB ÷ 2.04 ≈ 8.0 ms → ≤ 125 tok/s</text>
  <text x="726" y="410" font-size="11.5" fill="#334155">H100（3.35 TB/s）：16.2 GB ÷ 3.35 ≈ 4.9 ms → ≤ 207 tok/s</text>
  <text x="726" y="436" font-size="10" fill="#9a3412">→ Day 2 把它变成手算公式；Day 3 用 Roofline 解释为什么</text>

  <rect x="710" y="476" width="490" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="726" y="500" font-size="12.5" font-weight="bold" fill="#0f172a">batch = B 时，账单怎么变？</text>
  <text x="726" y="522" font-size="11" fill="#334155">① 权重：不变！B 个 token 共读一次 → 被摊销</text>
  <text x="726" y="542" font-size="11" fill="#334155">② KV：× B（各读各的历史）</text>
  <text x="726" y="562" font-size="11" fill="#334155">③ 激活：× B（仍是零头）</text>
  <text x="726" y="590" font-size="10.5" font-weight="bold" fill="#ea580c">→ 吞吐随 B 上升、TPOT 缓涨 = continuous batching 的第一性原理</text>
  <text x="726" y="608" font-size="10.5" fill="#9a3412">（→ Day 2 例题三 / Day 5 goodput / Day 11 混排调度）</text>

  <rect x="710" y="642" width="490" height="234" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="726" y="666" font-size="12.5" font-weight="bold" fill="#92400e">从这张图能直接看出的系统设计动机</text>
  <text x="726" y="690" font-size="10" fill="#78350f">· KV 要支持非连续 block 读取 → PagedAttention（Day 4 / 15）</text>
  <text x="726" y="714" font-size="10" fill="#78350f">· decode 的 shape 与地址固定 → CUDA Graph（Day 18）</text>
  <text x="726" y="738" font-size="10" fill="#78350f">· 权重每步必读 → 权重量化直接压低 TPOT 下界（Day 22-24）</text>
  <text x="726" y="762" font-size="10" fill="#78350f">· ① 与 B 无关 → prefill / decode 混排摊销权重读取（Day 11 / 29）</text>
  <text x="726" y="786" font-size="10" fill="#78350f">· ② 随 ctx 线性增长 → 长上下文时 KV 反超权重成第一大头（Day 2）</text>
  <text x="726" y="810" font-size="10" fill="#78350f">· 账单全在 HBM → 算子融合 / 片上驻留是通用优化方向</text>
  <text x="726" y="840" font-size="10" fill="#92400e">（对照你的昇腾 L1 全载模板：同一直觉，GPU 上换成融合＋batch 摊销）</text>

  <text x="726" y="892" font-size="10" fill="#64748b">★ = 权重访存（每步必读，与 batch 无关）｜紫色 = GEMV｜绿色 = KV cache 访存</text>
</svg>
