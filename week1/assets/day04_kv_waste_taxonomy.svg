<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <pattern id="hatchRed" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fef2f2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#fca5a5" stroke-width="2.5"/>
    </pattern>
    <pattern id="hatchGray" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>
  <text x="620" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">KV Cache 显存浪费：朴素「按 max_len 预留」 vs PagedAttention「分页」</text>
  <text x="620" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">论文 Fig.2/3 复刻 · 实测口径：现有系统有效 KV 仅占预留的 20~40%（浪费 60~80%）· 分页后仅剩块尾浪费，实测 &lt;4%</text>

  <!-- ================= 左面板：朴素方案 ================= -->
  <rect x="28" y="64" width="576" height="436" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="316" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">朴素方案（HF / TGI / 早期 Triton IS / FasterTransformer）</text>
  <text x="316" y="108" text-anchor="middle" font-size="11" fill="#64748b">每请求预留 max_len 连续显存段 · 输出长度未知 → 只能按最大值预留</text>

  <!-- 内存条：请求 A -->
  <text x="48" y="136" font-size="11" fill="#334155">请求 A（实际 2K tok）</text>
  <rect x="180" y="122" width="88" height="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="268" y="122" width="340" height="26" fill="url(#hatchRed)" stroke="#dc2626" stroke-width="1"/>
  <text x="224" y="139" text-anchor="middle" font-size="10" fill="#14532d">有效 2K</text>
  <text x="438" y="139" text-anchor="middle" font-size="10" fill="#991b1b">内部碎片：预留 8K 未用（75%）</text>

  <!-- 请求 B -->
  <text x="48" y="170" font-size="11" fill="#334155">请求 B（实际 3K tok）</text>
  <rect x="180" y="156" width="132" height="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="312" y="156" width="296" height="26" fill="url(#hatchRed)" stroke="#dc2626" stroke-width="1"/>
  <text x="246" y="173" text-anchor="middle" font-size="10" fill="#14532d">有效 3K</text>
  <text x="460" y="173" text-anchor="middle" font-size="10" fill="#991b1b">内部碎片（63%）</text>

  <!-- 空洞 -->
  <rect x="180" y="190" width="176" height="26" fill="url(#hatchGray)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="48" y="204" font-size="11" fill="#334155">（某请求结束）</text>
  <text x="268" y="207" text-anchor="middle" font-size="10" fill="#475569">空洞：空闲但放不下下一段</text>
  <text x="362" y="207" font-size="10" fill="#475569">← 外部碎片</text>

  <!-- 请求 C -->
  <text x="48" y="238" font-size="11" fill="#334155">请求 C（实际 2K tok）</text>
  <rect x="180" y="224" width="88" height="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="268" y="224" width="340" height="26" fill="url(#hatchRed)" stroke="#dc2626" stroke-width="1"/>
  <text x="224" y="241" text-anchor="middle" font-size="10" fill="#14532d">有效 2K</text>
  <text x="438" y="241" text-anchor="middle" font-size="10" fill="#991b1b">内部碎片</text>

  <!-- 请求 E：预留代价 -->
  <text x="48" y="272" font-size="11" fill="#334155">请求 E（新来）</text>
  <rect x="180" y="258" width="428" height="26" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="394" y="275" text-anchor="middle" font-size="10" fill="#991b1b">放不下 8K 连续段 → 整请求换出 / 重算 / 排队（预留代价）</text>

  <!-- 测量框 -->
  <rect x="44" y="300" width="544" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="60" y="322" font-size="12" font-weight="bold" fill="#991b1b">论文 Fig.3 实测（TGI / FasterTransformer @ ShareGPT trace）</text>
  <text x="60" y="342" font-size="11.5" fill="#991b1b">有效 KV ÷ 预留显存 = 20~40%　→　浪费 60~80%</text>
  <text x="60" y="360" font-size="11" fill="#7c2d12">今日例算（§3.1）：E[L]=2000、max=8192 → 利用率 24.4%，正落在该区间</text>

  <!-- 为什么不能 compact -->
  <rect x="44" y="384" width="544" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="406" font-size="12" font-weight="bold" fill="#0f172a">为什么不能「GC 紧凑化」？</text>
  <text x="60" y="426" font-size="10.8" fill="#334155">① GPU 张量地址已被 kernel / CUDA Graph 持有，搬动 = 全量拷贝（GB 级）；</text>
  <text x="60" y="444" font-size="10.8" fill="#334155">② cudaMalloc 不支持碎片整理，无 OS 式 compaction；</text>
  <text x="60" y="462" font-size="10.8" fill="#334155">③ 就算零外部碎片，长度未知 → 内部碎片（预留）依旧存在。</text>
  <text x="60" y="480" font-size="10.8" font-weight="bold" fill="#991b1b">根治法不是「打扫」，是「改供给粒度」→ 分页</text>

  <!-- ================= 右面板：PagedAttention ================= -->
  <rect x="628" y="64" width="584" height="436" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="920" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">PagedAttention（vLLM）：等大 block + block table 间接层</text>
  <text x="920" y="108" text-anchor="middle" font-size="11" fill="#64748b">序列按 block_size=16 tok 切块 · 逻辑连续 ←查表→ 物理散布 · 等大块任意顶替</text>

  <!-- 逻辑序列 -->
  <text x="648" y="138" font-size="11" fill="#334155">S1 逻辑块：</text>
  <rect x="720" y="124" width="72" height="24" fill="#bfdbfe" stroke="#2563eb"/><text x="756" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a">B0</text>
  <rect x="792" y="124" width="72" height="24" fill="#bfdbfe" stroke="#2563eb"/><text x="828" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a">B1</text>
  <rect x="864" y="124" width="72" height="24" fill="#bfdbfe" stroke="#2563eb"/><text x="900" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a">B2</text>
  <rect x="936" y="124" width="72" height="24" fill="#bfdbfe" stroke="#2563eb"/><text x="972" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a">B3</text>
  <rect x="1008" y="124" width="72" height="24" fill="#dbeafe" stroke="#2563eb"/><rect x="1008" y="124" width="34" height="24" fill="#bfdbfe"/><text x="1044" y="140" text-anchor="middle" font-size="10" fill="#1e3a8a">B4(部分)</text>

  <!-- 块表 -->
  <text x="648" y="172" font-size="11" fill="#334155">block table：</text>
  <rect x="720" y="158" width="72" height="24" fill="#eff6ff" stroke="#2563eb"/><text x="756" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">#7</text>
  <rect x="792" y="158" width="72" height="24" fill="#eff6ff" stroke="#2563eb"/><text x="828" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">#2</text>
  <rect x="864" y="158" width="72" height="24" fill="#eff6ff" stroke="#2563eb"/><text x="900" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">#15</text>
  <rect x="936" y="158" width="72" height="24" fill="#eff6ff" stroke="#2563eb"/><text x="972" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">#4</text>
  <rect x="1008" y="158" width="72" height="24" fill="#eff6ff" stroke="#2563eb"/><text x="1044" y="174" text-anchor="middle" font-size="11" fill="#1e3a8a">#8</text>
  <text x="1092" y="174" font-size="10.5" fill="#64748b">逻辑号→物理号</text>
  <line x1="756" y1="150" x2="756" y2="156" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="1044" y1="150" x2="1044" y2="156" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- 物理块池 -->
  <text x="648" y="212" font-size="11" fill="#334155">物理块池（启动时按层预分配大张量 → 等大切块；同色 = 同一序列的块）：</text>
  <!-- 8 列 x 4 行，块 58x40，gap 8 -->
  <g font-size="10">
    <!-- row 1 -->
    <rect x="648" y="222" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="677" y="246" text-anchor="middle" fill="#94a3b8">#0</text>
    <rect x="714" y="222" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="743" y="246" text-anchor="middle" fill="#94a3b8">#1</text>
    <rect x="780" y="222" width="58" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="809" y="240" text-anchor="middle" fill="#1e3a8a" font-weight="bold">#2</text><text x="809" y="254" text-anchor="middle" fill="#1e3a8a">ref=2</text>
    <rect x="846" y="222" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="875" y="246" text-anchor="middle" fill="#94a3b8">#3</text>
    <rect x="912" y="222" width="58" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="941" y="240" text-anchor="middle" fill="#1e3a8a" font-weight="bold">#4</text><text x="941" y="254" text-anchor="middle" fill="#1e3a8a">ref=2</text>
    <rect x="978" y="222" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1007" y="246" text-anchor="middle" fill="#94a3b8">#5</text>
    <rect x="1044" y="222" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1073" y="246" text-anchor="middle" fill="#94a3b8">#6</text>
    <rect x="1110" y="222" width="58" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="1139" y="240" text-anchor="middle" fill="#1e3a8a" font-weight="bold">#7</text><text x="1139" y="254" text-anchor="middle" fill="#1e3a8a">ref=2</text>
    <!-- row 2 -->
    <rect x="648" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="677" y="294" text-anchor="middle" fill="#94a3b8">#8</text>
    <rect x="714" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="743" y="294" text-anchor="middle" fill="#94a3b8">#9</text>
    <rect x="780" y="270" width="58" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="809" y="288" text-anchor="middle" fill="#1e3a8a" font-weight="bold">#15</text><text x="809" y="302" text-anchor="middle" fill="#1e3a8a">ref=2</text>
    <rect x="846" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="875" y="294" text-anchor="middle" fill="#94a3b8">#10</text>
    <rect x="912" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="941" y="294" text-anchor="middle" fill="#94a3b8">#11</text>
    <rect x="978" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1007" y="294" text-anchor="middle" fill="#94a3b8">#12</text>
    <rect x="1044" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1073" y="294" text-anchor="middle" fill="#94a3b8">#13</text>
    <rect x="1110" y="270" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1139" y="294" text-anchor="middle" fill="#94a3b8">#14</text>
    <!-- row 3 -->
    <rect x="648" y="318" width="58" height="40" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><rect x="648" y="318" width="30" height="40" fill="#86efac"/><text x="677" y="342" text-anchor="middle" fill="#14532d" font-weight="bold">#8</text>
    <rect x="714" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="743" y="342" text-anchor="middle" fill="#94a3b8">#16</text>
    <rect x="780" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="809" y="342" text-anchor="middle" fill="#94a3b8">#17</text>
    <rect x="846" y="318" width="58" height="40" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><rect x="846" y="318" width="34" height="40" fill="#fdba74"/><text x="875" y="342" text-anchor="middle" fill="#7c2d12" font-weight="bold">#9</text>
    <rect x="912" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="941" y="342" text-anchor="middle" fill="#94a3b8">#18</text>
    <rect x="978" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1007" y="342" text-anchor="middle" fill="#94a3b8">#19</text>
    <rect x="1044" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1073" y="342" text-anchor="middle" fill="#94a3b8">#20</text>
    <rect x="1110" y="318" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1139" y="342" text-anchor="middle" fill="#94a3b8">#21</text>
    <!-- row 4 -->
    <rect x="648" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="677" y="390" text-anchor="middle" fill="#94a3b8">#22</text>
    <rect x="714" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="743" y="390" text-anchor="middle" fill="#94a3b8">#23</text>
    <rect x="780" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="809" y="390" text-anchor="middle" fill="#94a3b8">#24</text>
    <rect x="846" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="875" y="390" text-anchor="middle" fill="#94a3b8">#25</text>
    <rect x="912" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="941" y="390" text-anchor="middle" fill="#94a3b8">#26</text>
    <rect x="978" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1007" y="390" text-anchor="middle" fill="#94a3b8">#27</text>
    <rect x="1044" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1073" y="390" text-anchor="middle" fill="#94a3b8">#28</text>
    <rect x="1110" y="366" width="58" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="1139" y="390" text-anchor="middle" fill="#94a3b8">#29</text>
  </g>
  <text x="648" y="430" font-size="10.5" fill="#1e40af">蓝= S1/S2 共享前缀块（ref_cnt=2，来自同一 prompt）</text>
  <text x="648" y="446" font-size="10.5" fill="#14532d">绿= S1 尾块（半满）　橙= S2 尾块（COW 复制所得，详见 day04_paged_layout.svg）</text>
  <text x="648" y="462" font-size="10.5" fill="#475569">白= free（等大、任意顶替 → 结构性消灭外部碎片与「放不下」）</text>
  <text x="648" y="482" font-size="11" font-weight="bold" fill="#1e3a8a">剩余浪费 = 每序列块尾（≤ b−1 tok）+ COW 瞬时 → 论文实测 &lt;4%</text>

  <!-- ================= 底部要点 ================= -->
  <rect x="28" y="512" width="1184" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="620" y="538" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">利用率 η 直接乘进并发上限（Day 2 §2.3 公式的隐藏系数）：并发 = η · KV 池 ÷ ( E[L] · KV_per_token )</text>
  <text x="620" y="560" text-anchor="middle" font-size="11" fill="#334155">今日例算（§3.3，A100 · Qwen3-8B · 池 54.1 GB）：η 24.4% → 99.6% ⇒ 并发 44 路 → 182 路；两状态每步总 KV 字节相同 → TPOT 不变（≈33.5 ms）</text>
  <text x="620" y="580" text-anchor="middle" font-size="11" fill="#334155">→ 吞吐 = 并发 ÷ TPOT，同样 ×4.1 —— 这就是论文「2-4× vs TGI/Orca」的算术来源（对比 HF 朴素管线差距更大，见原文实验图）</text>
  <text x="620" y="606" text-anchor="middle" font-size="11" fill="#047857">Roofline 视角（Day 3 衔接）：分页不改变单 kernel 的 AI，它扩大的是「可实现的 batch B」——把系统工作点沿吞吐-B 曲线推向膝点</text>
  <text x="620" y="628" text-anchor="middle" font-size="11" fill="#047857">代价：paged gather 的非连续访存计入 Day 2 的 BW_eff 折扣（60~85%），但相对 batch 收益是零头</text>
</svg>
