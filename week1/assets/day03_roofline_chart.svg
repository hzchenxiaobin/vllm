<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#ffffff"/>
  <text x="620" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">GPU Roofline：可达性能 = min( 峰值算力 , AI × 峰值带宽 )</text>
  <text x="620" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">BF16 口径 · A100 vs H100 SXM · 标出 LLM 推理核心 kernel 的落点（对数-对数坐标）——Day 1 的「AI = 2M/P」与 Day 2 的「两条下界」在这张图上合流</text>

  <!-- ===== 主绘图区 ===== -->
  <rect x="90" y="68" width="925" height="500" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="565" y="86" text-anchor="middle" font-size="12" fill="#64748b">横轴：算术强度 AI（FLOP / Byte）　纵轴：可达性能（TFLOPS）　两者均对数坐标</text>

  <!-- 网格 -->
  <line x1="247.6" y1="95" x2="247.6" y2="490" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="415.7" y1="95" x2="415.7" y2="490" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="583.8" y1="95" x2="583.8" y2="490" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="751.9" y1="95" x2="751.9" y2="490" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="920"   y1="95" x2="920"   y2="490" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="415.5" x2="1000" y2="415.5" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="341"   x2="1000" y2="341"   stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="266.4" x2="1000" y2="266.4" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="191.9" x2="1000" y2="191.9" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="130" y1="117.9" x2="1000" y2="117.9" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 坐标轴 -->
  <line x1="130" y1="490" x2="1012" y2="490" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="130" y1="492" x2="130"  y2="92"  stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="247.6" y="507" text-anchor="middle" font-size="10.5" fill="#64748b">1</text>
  <text x="415.7" y="507" text-anchor="middle" font-size="10.5" fill="#64748b">10</text>
  <text x="583.8" y="507" text-anchor="middle" font-size="10.5" fill="#64748b">10²</text>
  <text x="751.9" y="507" text-anchor="middle" font-size="10.5" fill="#64748b">10³</text>
  <text x="920"   y="507" text-anchor="middle" font-size="10.5" fill="#64748b">10⁴</text>
  <text x="565" y="530" text-anchor="middle" font-size="11.5" fill="#334155">算术强度 AI（FLOP / Byte，log）</text>
  <text x="122" y="494" text-anchor="end" font-size="10.5" fill="#64748b">0.01</text>
  <text x="122" y="419.5" text-anchor="end" font-size="10.5" fill="#64748b">0.1</text>
  <text x="122" y="345" text-anchor="end" font-size="10.5" fill="#64748b">1</text>
  <text x="122" y="270.4" text-anchor="end" font-size="10.5" fill="#64748b">10</text>
  <text x="122" y="195.9" text-anchor="end" font-size="10.5" fill="#64748b">100</text>
  <text x="122" y="121.9" text-anchor="end" font-size="10.5" fill="#64748b">1000</text>
  <text x="103" y="300" font-size="11.5" fill="#334155" transform="rotate(-90 103 300)">可达性能（TFLOPS，log）</text>

  <!-- 屋脊虚线 -->
  <line x1="615" y1="160" x2="615" y2="488" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.65"/>
  <text x="607" y="330" font-size="10.5" fill="#2563eb" text-anchor="middle" transform="rotate(-90 607 330)">ridge 153（A100）</text>
  <line x1="663" y1="123" x2="663" y2="488" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.65"/>
  <text x="655" y="330" font-size="10.5" fill="#ea580c" text-anchor="middle" transform="rotate(-90 655 330)">ridge 295（H100）</text>
  <line x1="714" y1="95" x2="714" y2="488" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
  <text x="720" y="102" font-size="10.5" font-weight="bold" fill="#dc2626">H100 FP8 ridge = 591（屋顶×2 → 屋脊右移×2）</text>

  <!-- A100 屋顶线 -->
  <path d="M 130 370 L 615 155.2 L 1000 155.2" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="615" cy="155.2" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
  <text x="995" y="149" text-anchor="end" font-size="11" font-weight="bold" fill="#1e40af">A100：312 TFLOPS BF16 · ridge 153</text>

  <!-- H100 屋顶线 -->
  <path d="M 130 354 L 663 117.9 L 1000 117.9" fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="663" cy="117.9" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="995" y="111" text-anchor="end" font-size="11" font-weight="bold" fill="#9a3412">H100：989 TFLOPS BF16 · ridge 295</text>

  <text x="450" y="200" font-size="11" fill="#7c2d12" text-anchor="middle" transform="rotate(-24 450 200)">斜坡段：P = AI × BW（log-log 下斜率恒为 1，与精度无关）</text>

  <!-- 区域标注 -->
  <text x="340" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">memory bound（斜坡区：P = AI × BW）</text>
  <text x="880" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#94a3b8">compute bound（屋顶区：P = F_peak）</text>
  <text x="145" y="110" font-size="10.5" fill="#64748b">● = LLM kernel 落点（H100 线上）</text>

  <!-- kernel 落点 -->
  <circle cx="247.6" cy="301.9" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="272" y="318" font-size="10.5" fill="#991b1b">decode GEMV / attention（B=1）</text>
  <text x="272" y="334" font-size="10.5" fill="#991b1b">AI ≈ 1：距 ridge ~300×，斜坡最深处</text>

  <circle cx="551" cy="167.3" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="602" cy="144.9" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="556" y1="172" x2="757" y2="211" stroke="#dc2626" stroke-width="1.2"/>
  <line x1="606" y1="150" x2="757" y2="236" stroke="#dc2626" stroke-width="1.2"/>
  <text x="760" y="215" font-size="10.5" fill="#991b1b">decode attention B=64：AI = 64（KV 共读）</text>
  <text x="760" y="240" font-size="10.5" fill="#991b1b">decode GEMM B=64 FP8：AI=128（仍斜坡）</text>

  <circle cx="775" cy="117.9" r="5.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
  <text x="790" y="140" font-size="10.5" fill="#166534">prefill GEMM / attention</text>
  <text x="790" y="156" font-size="10.5" fill="#166534">AI ≥ 1300 → 屋顶（compute bound）</text>

  <!-- 优化方向箭头 -->
  <line x1="620" y1="440" x2="840" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="620" y="463" font-size="10.5" fill="#334155">横轴右移 = 减字节（量化）/ 摊销（batch）——decode 的唯一杠杆</text>
  <text x="620" y="481" font-size="10.5" fill="#334155">纵轴天花板 = 屋顶：prefill 靠 tiling 贴满、FP8 抬高一倍</text>

  <!-- ===== 右侧面板 ===== -->
  <rect x="1025" y="75" width="205" height="27" rx="5" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1127" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">ridge = 峰值算力 ÷ 带宽</text>

  <text x="1033" y="122" font-size="10.5" fill="#64748b">平台（BF16）</text>
  <text x="1222" y="122" text-anchor="end" font-size="10.5" fill="#64748b">FLOP/B</text>
  <text x="1033" y="140" font-size="10.5" fill="#1e40af">A100 80GB SXM</text><text x="1222" y="140" text-anchor="end" font-size="10.5" fill="#1e40af">153</text>
  <text x="1033" y="158" font-size="10.5" fill="#9a3412">H100 80GB SXM</text><text x="1222" y="158" text-anchor="end" font-size="10.5" fill="#9a3412">295</text>
  <text x="1033" y="176" font-size="10.5" fill="#334155">H200 SXM</text><text x="1222" y="176" text-anchor="end" font-size="10.5" fill="#334155">206</text>
  <text x="1033" y="194" font-size="10.5" fill="#334155">RTX 4090</text><text x="1222" y="194" text-anchor="end" font-size="10.5" fill="#334155">163</text>
  <text x="1033" y="212" font-size="10.5" fill="#334155">B200（约）</text><text x="1222" y="212" text-anchor="end" font-size="10.5" fill="#334155">~280</text>
  <rect x="1028" y="220" width="200" height="18" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1033" y="233" font-size="10.5" font-weight="bold" fill="#991b1b">H100（FP8 口径）</text>
  <text x="1222" y="233" text-anchor="end" font-size="10.5" font-weight="bold" fill="#991b1b">591</text>

  <rect x="1025" y="248" width="205" height="132" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="1035" y="268" font-size="11" font-weight="bold" fill="#065f46">ridge 是平台的身份证</text>
  <text x="1035" y="288" font-size="10.5" fill="#047857">带宽 2→3.35→4.8→8 TB/s 与</text>
  <text x="1035" y="304" font-size="10.5" fill="#047857">算力十年同步增长，ridge 稳定</text>
  <text x="1035" y="320" font-size="10.5" fill="#047857">在 150~600 FLOP/B →</text>
  <text x="1035" y="340" font-size="10.5" font-weight="bold" fill="#065f46">decode 的 AI≈1~2，在任何</text>
  <text x="1035" y="356" font-size="10.5" font-weight="bold" fill="#065f46">GPU 上都是 memory bound</text>
  <text x="1035" y="374" font-size="10" fill="#64748b">（平台无关的结论）</text>

  <rect x="1025" y="390" width="205" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1035" y="410" font-size="11" font-weight="bold" fill="#1e3a8a">两个易错点</text>
  <text x="1035" y="430" font-size="10.5" fill="#1e40af">① 斜坡 P=AI×BW 与精度无关；</text>
  <text x="1035" y="446" font-size="10.5" fill="#1e40af">FP8 把屋顶×2 → ridge×2。量化</text>
  <text x="1035" y="462" font-size="10.5" fill="#1e40af">不改变斜坡上的相对位置，</text>
  <text x="1035" y="478" font-size="10.5" fill="#1e40af">只把时间同比缩短（Day 22-24）</text>
  <text x="1035" y="500" font-size="10.5" fill="#1e40af">② 单 kernel AI ≠ 整步 AI：</text>
  <text x="1035" y="516" font-size="10.5" fill="#1e40af">AI_步 = 2NB/(NP+B·ctx·KV)，</text>
  <text x="1035" y="532" font-size="10.5" fill="#1e40af">被权重与 KV 两个上界夹住</text>
  <text x="1035" y="548" font-size="10" fill="#64748b">（decode 渐近上限 → §3.3 题 3）</text>

  <!-- ===== 底部要点 ===== -->
  <text x="620" y="594" text-anchor="middle" font-size="11" fill="#334155">① 判定尺：P = min(F_peak, AI×BW)，ridge = F_peak/BW（A100 153 / H100 295 / H100-FP8 591 FLOP/B）——AI ≥ ridge 上屋顶，AI &lt; ridge 在斜坡</text>
  <text x="620" y="616" text-anchor="middle" font-size="11" fill="#334155">② LLM 落点：decode B=1 AI≈1（差 ~300×）· B=64 FP8 AI=128 仍斜坡 · prefill AI≥1300 上屋顶；斜坡上优化 = 右移（减字节/摊销），屋顶上优化 = 贴满（tiling/精度）</text>
  <text x="620" y="638" text-anchor="middle" font-size="11" fill="#334155">③ 实测闭环：ncu 的 SM busy / DRAM busy 判单 kernel（→ day03_ncu_decision_tree.svg）；TPOT 反推 BW_eff 判整个系统（Day 2 KPI）；实测点通常在斜坡的 60~85%</text>
</svg>
