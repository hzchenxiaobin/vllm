<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mL1" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="740" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">白板第 1 件 · 显存估算四步阶梯</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">例题：Qwen3-32B（64 层 · GQA 8 KV 头 · head_dim 128）FP8 权重 · 4×H100 80G · TP=4 · 32K 上下文 · KV FP16 —— 目标 3 分钟讲完</text>

  <!-- ================= Staircase ================= -->
  <!-- Step 1 -->
  <rect x="40" y="470" width="215" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="494" font-size="13" font-weight="bold" fill="#1e40af">Step 1 · 权重字节数</text>
  <text x="60" y="516" font-size="11.5" fill="#334155">W = P × b_w</text>
  <text x="60" y="536" font-size="11" fill="#334155">32 B × 1 B = 32 GB</text>
  <text x="60" y="556" font-size="11" fill="#334155">TP=4 → 8 GB/卡</text>
  <text x="60" y="578" font-size="10" fill="#64748b">先算权重：它决定池的「底」</text>

  <!-- Step 2 -->
  <rect x="275" y="360" width="215" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="384" font-size="13" font-weight="bold" fill="#1e40af">Step 2 · 每 token KV</text>
  <text x="295" y="406" font-size="11.5" fill="#334155">2 × L × kv_heads × d × b_kv</text>
  <text x="295" y="426" font-size="11" fill="#334155">2 × 64 × 8 × 128 × 2 B</text>
  <text x="295" y="446" font-size="11" font-weight="bold" fill="#b91c1c">= 256 KiB</text>
  <text x="295" y="468" font-size="10" fill="#b91c1c">b_kv 跟 KV dtype 走，不跟权重！</text>

  <!-- Step 3 -->
  <rect x="510" y="250" width="215" height="125" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="274" font-size="13" font-weight="bold" fill="#1e40af">Step 3 · 可用 KV 池</text>
  <text x="530" y="296" font-size="11.5" fill="#334155">显存 × util − W − 激活/工作区</text>
  <text x="530" y="316" font-size="11" fill="#334155">(80 × 0.9 − 8 − 4) × 4 卡</text>
  <text x="530" y="336" font-size="11" font-weight="bold" fill="#166534">= 240 GB</text>
  <text x="530" y="358" font-size="10" fill="#64748b">工作区 2~4 GB 是经验值，随 ctx/TP 变</text>

  <!-- Step 4 -->
  <rect x="745" y="140" width="215" height="125" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="765" y="164" font-size="13" font-weight="bold" fill="#166534">Step 4 · 并发上限</text>
  <text x="765" y="186" font-size="11.5" fill="#334155">池 ÷ (KV_token × ctx)</text>
  <text x="765" y="206" font-size="11" fill="#334155">单序列 = 256 KiB × 32K = 8 GiB</text>
  <text x="765" y="227" font-size="12.5" font-weight="bold" fill="#166534">≈ 30 条</text>
  <text x="765" y="249" font-size="10" fill="#64748b">报完数就给旋钮（右下）</text>

  <!-- arrows between steps -->
  <line x1="255" y1="470" x2="272" y2="425" stroke="#2563eb" stroke-width="2" marker-end="url(#mL1)"/>
  <line x1="490" y1="360" x2="507" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#mL1)"/>
  <line x1="725" y1="250" x2="742" y2="205" stroke="#2563eb" stroke-width="2" marker-end="url(#mL1)"/>

  <!-- timer badge -->
  <rect x="820" y="60" width="140" height="46" rx="23" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="890" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">⏱ 目标 3 分钟</text>
  <text x="890" y="96" text-anchor="middle" font-size="10" fill="#9a3412">第 1 遍学 · 第 3 遍抽</text>

  <!-- ================= Bottom: traps & knobs ================= -->
  <rect x="40" y="615" width="455" height="105" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="60" y="640" font-size="13" font-weight="bold" fill="#991b1b">⚠ 两个必踩坑（评分点，踩一个扣一档）</text>
  <text x="60" y="663" font-size="11" fill="#334155">① kv_heads ≠ heads：GQA 下 Qwen3-32B 是 64 个 Q 头 vs 8 个</text>
  <text x="60" y="681" font-size="11" fill="#334155">    KV 头，差 8 倍——写出 kv_heads 直接加分</text>
  <text x="60" y="703" font-size="11" fill="#334155">② 「模型 FP8」≠「KV FP8」：dtype 项跟 --kv-cache-dtype</text>
  <text x="60" y="721" font-size="11" fill="#334155">    走（Day 1 §2.2），FP8 权重 + FP16 KV 是常见组合</text>

  <rect x="515" y="615" width="445" height="105" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="535" y="640" font-size="13" font-weight="bold" fill="#166534">结论句模板 + 三个旋钮（算完主动说）</text>
  <text x="535" y="663" font-size="11" fill="#334155">「320 GB 显存、权重 32 GB、剩 240 GB 给 KV；每 token 256 KiB、</text>
  <text x="535" y="681" font-size="11" fill="#334155">    32K 序列 8 GiB → 撑 30 条并发。」</text>
  <text x="535" y="703" font-size="11" fill="#334155">旋钮：FP8 KV → 60 条 ｜ P/D 分离（两类池独立配比）</text>
  <text x="535" y="721" font-size="11" fill="#334155">｜ offload 冷 KV / 缩 max_model_len</text>

  <!-- base line -->
  <line x1="40" y1="600" x2="960" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
</svg>
