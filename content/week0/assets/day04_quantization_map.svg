<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrQ" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">量化全景：三个正交开关，收益落在哪个指标由 bound 决定</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">对象（W / A / KV）× 格式（INT8 / FP8 / INT4）× 粒度（tensor / channel / group-128）——TPOT 看字节压缩比，TTFT 看计算是否也走量化</text>

  <!-- ================= Panel A: W/A matrix ================= -->
  <rect x="40" y="70" width="580" height="350" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="95" font-size="14" font-weight="bold" fill="#1e3a8a">开关一+二：权重 × 激活的组合（每行一个方案）</text>

  <g font-size="10.5">
    <!-- header -->
    <text x="60" y="118" font-weight="bold" fill="#475569">方案</text>
    <text x="180" y="118" font-weight="bold" fill="#475569">权重字节</text>
    <text x="280" y="118" font-weight="bold" fill="#475569">计算路径</text>
    <text x="450" y="118" font-weight="bold" fill="#475569">TPOT(decode)</text>
    <text x="545" y="118" font-weight="bold" fill="#475569">TTFT(prefill)</text>

    <!-- row 1: W16A16 -->
    <rect x="55" y="128" width="550" height="56" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="150" font-weight="bold" fill="#334155">W16A16（基线）</text>
    <text x="60" y="168" font-size="9.5" fill="#64748b">bf16 权重+激活</text>
    <text x="180" y="150">2 B/param</text>
    <text x="280" y="150">bf16</text>
    <text x="450" y="150">—</text>
    <text x="545" y="150">—</text>

    <!-- row 2: W8A8 FP8 -->
    <rect x="55" y="188" width="550" height="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="60" y="210" font-weight="bold" fill="#14532d">W8A8 FP8</text>
    <text x="60" y="228" font-size="9.5" fill="#166534">H100 原生支持，精度近无损</text>
    <text x="180" y="210">1 B/param</text>
    <text x="280" y="210">FP8 Tensor Core</text>
    <text x="280" y="228" font-size="9.5" fill="#166534">990 → 1979 TFLOPS</text>
    <text x="450" y="210" fill="#15803d" font-weight="bold">↓ ~2×</text>
    <text x="545" y="210" fill="#15803d" font-weight="bold">↓ 1.6~1.8×</text>

    <!-- row 3: W8A8 INT8 -->
    <rect x="55" y="248" width="550" height="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="60" y="270" font-weight="bold" fill="#14532d">W8A8 INT8</text>
    <text x="60" y="288" font-size="9.5" fill="#166534">需校准（SmoothQuant 搬 outlier）</text>
    <text x="180" y="270">1 B/param</text>
    <text x="280" y="270">INT8</text>
    <text x="450" y="270" fill="#15803d" font-weight="bold">↓ ~2×</text>
    <text x="545" y="270" fill="#15803d" font-weight="bold">↓ 1.5~1.8×</text>

    <!-- row 4: W4A16 -->
    <rect x="55" y="308" width="550" height="56" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="60" y="330" font-weight="bold" fill="#78350f">W4A16（GPTQ / AWQ）</text>
    <text x="60" y="348" font-size="9.5" fill="#92400e">Marlin/Machete：4bit 直读 + 片上反量化</text>
    <text x="180" y="330">0.5 B/param</text>
    <text x="280" y="330">仍 bf16</text>
    <text x="280" y="348" font-size="9.5" fill="#92400e">kernel 内反量化，零额外 HBM 流量</text>
    <text x="450" y="330" fill="#15803d" font-weight="bold">↓ 2.5~3.5×</text>
    <text x="545" y="330" fill="#b91c1c" font-weight="bold">可能 ↑ 负收益</text>

    <!-- row 5: KV -->
    <rect x="55" y="368" width="550" height="44" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="60" y="386" font-weight="bold" fill="#4c1d95">KV cache FP8/INT8</text>
    <text x="60" y="402" font-size="9.5" fill="#6d28d9">改的是另一个公式：并发 = KV 池 ÷（每 token KV × 上下文）</text>
    <text x="450" y="394" fill="#15803d" font-weight="bold">显存/带宽减半</text>
    <text x="545" y="394" fill="#6d28d9" font-weight="bold">并发 ×2</text>
  </g>

  <!-- ================= Panel B: outliers ================= -->
  <rect x="640" y="70" width="320" height="350" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="658" y="95" font-size="14" font-weight="bold" fill="#7f1d1d">开关三的前置课：激活 outlier</text>

  <!-- bar chart of activations with outliers -->
  <g>
    <rect x="665" y="130" width="14" height="60" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="683" y="150" width="14" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="701" y="145" width="14" height="45" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="719" y="118" width="14" height="72" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <text x="726" y="112" text-anchor="middle" font-size="9" fill="#991b1b">outlier ×100</text>
    <rect x="737" y="152" width="14" height="38" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="755" y="148" width="14" height="42" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="773" y="150" width="14" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="791" y="112" width="14" height="78" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <text x="798" y="106" text-anchor="middle" font-size="9" fill="#991b1b">outlier</text>
    <rect x="809" y="146" width="14" height="44" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="827" y="150" width="14" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="845" y="153" width="14" height="37" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="863" y="149" width="14" height="41" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <rect x="881" y="150" width="14" height="40" fill="#fca5a5" stroke="#dc2626" stroke-width="1"/>
    <line x1="658" y1="190" x2="940" y2="190" stroke="#475569" stroke-width="1"/>
    <text x="658" y="204" font-size="9" fill="#64748b">各通道激活幅值：per-tensor scale 被 outlier 撑大 → 其余通道精度崩</text>
  </g>

  <g font-size="10.5">
    <text x="658" y="228" font-weight="bold" fill="#7f1d1d">三大离线算法（推理时零成本）：</text>
    <rect x="658" y="240" width="284" height="40" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
    <text x="668" y="256" font-weight="bold" fill="#991b1b">SmoothQuant：搬家</text>
    <text x="668" y="272" font-size="9.5" fill="#7f1d1d">(X/s)·(sW) 等价缩放，难度从激活搬到权重</text>
    <rect x="658" y="286" width="284" height="40" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
    <text x="668" y="302" font-weight="bold" fill="#991b1b">AWQ：保通道</text>
    <text x="668" y="318" font-size="9.5" fill="#7f1d1d">1% salient 通道用 per-channel scale 保护</text>
    <rect x="658" y="332" width="284" height="40" fill="#ffffff" stroke="#f87171" stroke-width="1"/>
    <text x="668" y="348" font-weight="bold" fill="#991b1b">GPTQ：找补</text>
    <text x="668" y="364" font-size="9.5" fill="#7f1d1d">Hessian 二阶信息逐层补偿量化误差</text>
    <text x="658" y="396" font-size="9.5" fill="#7f1d1d">权重分布平滑对称 → 好量化；</text>
    <text x="658" y="410" font-size="9.5" fill="#7f1d1d">激活有 outlier → 难量化（这就是 W4A16 把 A 留在 16bit 的原因）</text>
  </g>

  <!-- ================= Panel C: bound attribution ================= -->
  <rect x="40" y="440" width="920" height="220" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="58" y="465" font-size="14" font-weight="bold" fill="#1e293b">收益归属：为什么 W4 救 TPOT 却可能伤 TTFT</text>

  <!-- decode line -->
  <text x="58" y="495" font-size="11" font-weight="bold" fill="#1e3a8a">decode（memory-bound）</text>
  <text x="58" y="512" font-size="10" fill="#334155">TPOT ≈ 权重字节 / 带宽 → 压缩比直接兑换</text>
  <g>
    <rect x="330" y="490" width="90" height="26" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><text x="375" y="507" text-anchor="middle" font-size="10">bf16 · 4.9ms</text>
    <line x1="420" y1="503" x2="470" y2="503" stroke="#475569" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="470" y="490" width="90" height="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><text x="515" y="507" text-anchor="middle" font-size="10">FP8 · 2.4ms</text>
    <line x1="560" y1="503" x2="610" y2="503" stroke="#475569" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="610" y="490" width="110" height="26" fill="#86efac" stroke="#15803d" stroke-width="1.5"/><text x="665" y="507" text-anchor="middle" font-size="10" font-weight="bold">W4A16 · 1.2ms</text>
  </g>
  <text x="740" y="500" font-size="9.5" fill="#334155">Qwen3-8B @ H100 手算</text>
  <text x="740" y="514" font-size="9.5" fill="#334155">（Day 1 公式二 + 1.2 节）</text>

  <!-- prefill line -->
  <text x="58" y="555" font-size="11" font-weight="bold" fill="#b45309">prefill（compute-bound）</text>
  <text x="58" y="572" font-size="10" fill="#334155">TTFT ∝ FLOPs / 算力 → 只有计算也量化的方案受益</text>
  <g>
    <rect x="330" y="552" width="90" height="26" fill="#fde68a" stroke="#d97706" stroke-width="1"/><text x="375" y="569" text-anchor="middle" font-size="10">bf16 · 990 TF</text>
    <line x1="420" y1="565" x2="470" y2="565" stroke="#475569" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="470" y="552" width="110" height="26" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><text x="525" y="569" text-anchor="middle" font-size="10">FP8 · 1979 TF（≈2×）</text>
    <line x1="580" y1="565" x2="630" y2="565" stroke="#475569" stroke-width="1.5" marker-end="url(#arrQ)"/>
    <rect x="630" y="552" width="130" height="26" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="695" y="569" text-anchor="middle" font-size="10" font-weight="bold">W4A16：算力不变</text>
  </g>
  <text x="775" y="562" font-size="9.5" fill="#b91c1c">prefill 权重读取本就不是瓶颈，</text>
  <text x="775" y="576" font-size="9.5" fill="#b91c1c">反量化还要多付计算 → 可能负收益</text>

  <!-- conclusion -->
  <rect x="58" y="600" width="884" height="44" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="619" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">结论模板：先问 SLO 落在哪——decode 敏感选 W4A16（性价比最高），TTFT+TPOT 全面收益选 FP8 W8A8，长上下文并发瓶颈先量化 KV</text>
  <text x="500" y="636" text-anchor="middle" font-size="10" fill="#047857">vLLM：在线 --quantization fp8 ｜ 离线 GPTQ/AWQ/ModelOpt/DeepSeek-FP8 checkpoint 自动识别 ｜ KV 用 --kv-cache-dtype（backend 支持矩阵随版本变化）</text>

  <!-- footer -->
  <text x="500" y="690" text-anchor="middle" font-size="10.5" fill="#64748b">与 Day 1 的衔接：这三行分别是 Day 1 公式二（TPOT 下界）、公式脊点（990/3.35≈296 FLOP/B）、公式三（并发上限）的量化版</text>
  <text x="500" y="710" text-anchor="middle" font-size="10.5" fill="#64748b">与昇腾的衔接：WeightQuantBatchMatmulV2 = Marlin/Machete 的同构物；bound 分界模型 = roofline；tiling 搜优 = kernel autotune</text>
</svg>
