<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Chunked Prefill：token budget 内切块，与 decode 混排</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">Qwen3-8B @ H100（η≈40% ≈ 400 TFLOPs，HBM 3.35 TB/s）：4K prompt 整段 prefill ≈ 170ms；16 路 decode 一步 ≈ 8ms</text>

  <!-- ================= Panel 1: no chunking ================= -->
  <rect x="40" y="70" width="920" height="215" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#7f1d1d">① budget ≥ prompt 长（等效关闭 chunking）：长 prompt 独占一个 step</text>

  <!-- TPOT trace -->
  <polyline points="110,150 190,150 270,150 500,118 660,150 740,150" fill="none" stroke="#dc2626" stroke-width="2"/>
  <g fill="#dc2626"><circle cx="110" cy="150" r="3"/><circle cx="190" cy="150" r="3"/><circle cx="270" cy="150" r="3"/><circle cx="500" cy="118" r="4"/><circle cx="660" cy="150" r="3"/><circle cx="740" cy="150" r="3"/></g>
  <text x="530" y="112" font-size="11" font-weight="bold" fill="#dc2626">TPOT 尖峰 ×21（~170ms）</text>
  <text x="112" y="138" font-size="10" fill="#94a3b8">TPOT 曲线（每步一个点）</text>

  <!-- step bars -->
  <g>
    <rect x="110" y="170" width="55" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="170" y="170" width="55" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="230" y="170" width="290" height="34" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
    <rect x="525" y="170" width="55" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="585" y="170" width="55" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#1e3a8a">
    <text x="137" y="185">decode</text><text x="137" y="198">8ms</text>
    <text x="197" y="185">decode</text><text x="197" y="198">8ms</text>
    <text x="375" y="185" font-weight="bold" fill="#7f1d1d">prefill 4096 tok ≈ 170ms（独占整步）</text>
    <text x="552" y="185">decode</text><text x="552" y="198">8ms</text>
    <text x="612" y="185">decode</text><text x="612" y="198">8ms</text>
  </g>
  <text x="500" y="240" text-anchor="middle" font-size="11.5" fill="#7f1d1d">同 batch 的 15 个 decode 请求在这 170ms 里<tspan font-weight="bold">全部停摆</tspan> → 流式用户直接感知卡顿（Sarathi 论文要解决的 stall）</text>
  <text x="500" y="262" text-anchor="middle" font-size="11" fill="#7f1d1d">吞吐视角：prefill 深度 compute-bound，HBM 带宽整步闲置；纯 decode 步则反过来闲置算力</text>

  <!-- ================= Panel 2: chunked ================= -->
  <rect x="40" y="300" width="920" height="235" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="325" font-size="14" font-weight="bold" fill="#14532d">② budget = 1024：每步「chunk 1024 + decode 16」混排，同一个前向</text>

  <!-- TPOT trace: flat -->
  <polyline points="110,352 210,352 310,352 410,352 510,352 610,352" fill="none" stroke="#16a34a" stroke-width="2"/>
  <g fill="#16a34a"><circle cx="110" cy="352" r="3"/><circle cx="210" cy="352" r="3"/><circle cx="310" cy="352" r="3"/><circle cx="410" cy="352" r="3"/><circle cx="510" cy="352" r="3"/><circle cx="610" cy="352" r="3"/></g>
  <text x="618" y="356" font-size="11" font-weight="bold" fill="#16a34a">TPOT 平稳（~50ms）</text>

  <!-- 4 mixed steps -->
  <g>
    <rect x="110" y="375" width="78" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="188" y="375" width="32" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="260" y="375" width="78" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="338" y="375" width="32" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="410" y="375" width="78" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="488" y="375" width="32" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="560" y="375" width="78" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="638" y="375" width="32" height="34" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <g font-size="9" text-anchor="middle">
    <text x="149" y="390" fill="#881337">P 1024</text><text x="149" y="402" fill="#881337">≈42ms</text>
    <text x="204" y="390" fill="#1e3a8a">D16</text><text x="204" y="402" fill="#1e3a8a">≈8ms</text>
    <text x="299" y="390" fill="#881337">P 1024</text><text x="299" y="402" fill="#881337">≈42ms</text>
    <text x="354" y="390" fill="#1e3a8a">D16</text><text x="354" y="402" fill="#1e3a8a">≈8ms</text>
    <text x="449" y="390" fill="#881337">P 1024</text><text x="449" y="402" fill="#881337">≈42ms</text>
    <text x="504" y="390" fill="#1e3a8a">D16</text><text x="504" y="402" fill="#1e3a8a">≈8ms</text>
    <text x="599" y="390" fill="#881337">P 1024</text><text x="599" y="402" fill="#881337">≈42ms</text>
    <text x="654" y="390" fill="#1e3a8a">D16</text><text x="654" y="402" fill="#1e3a8a">≈8ms</text>
  </g>
  <text x="390" y="437" text-anchor="middle" font-size="10.5" fill="#475569">step 1（1/4 prompt）　　step 2（2/4）　　step 3（3/4）　　step 4（4K 进完，产出首 token）</text>

  <text x="500" y="470" text-anchor="middle" font-size="11.5" fill="#14532d">TPOT 尖峰消失；代价：4K prompt 跨 4 步完成 → <tspan font-weight="bold">TTFT 略增</tspan>（拿 TTFT 换 TPOT 的显式交易）</text>
  <text x="500" y="492" text-anchor="middle" font-size="11" fill="#166534">被切的请求转 running，下一 step 在 schedule() 第一段<tspan font-weight="bold">优先续切</tspan>；budget 是 TTFT/TPOT 的总旋钮（经验起点 2048~8192）</text>

  <!-- ================= Panel 3: budget bar ================= -->
  <rect x="40" y="550" width="440" height="210" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="575" font-size="13" font-weight="bold" fill="#1e3a8a">③ 一个 step 的 token budget = max_num_batched_tokens</text>
  <rect x="70" y="600" width="380" height="34" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <rect x="70" y="600" width="6" height="34" fill="#2563eb"/>
  <rect x="76" y="600" width="374" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1"/>
  <text x="263" y="621" text-anchor="middle" font-size="10.5" fill="#881337">本 step 的 prefill chunk（= 剩余预算，不是固定值）</text>
  <text x="73" y="594" font-size="9" fill="#1e3a8a">decode×16</text>
  <text x="70" y="655" font-size="10.5" fill="#334155">先保 running（decode 每 seq ≥1 token + 未切完的续切），</text>
  <text x="70" y="671" font-size="10.5" fill="#334155">剩余预算给 waiting 的新 prefill；prompt 超出部分下步再切。</text>
  <text x="70" y="695" font-size="10.5" fill="#334155" font-family="monospace">num_new_tokens = min(需求, token_budget, ...)</text>
  <text x="70" y="716" font-size="10.5" fill="#64748b">V1 默认开启（无 V0 式 prefill/decode 分离循环）</text>

  <!-- ================= Panel 4: roofline ================= -->
  <rect x="500" y="550" width="460" height="210" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="575" font-size="13" font-weight="bold" fill="#4c1d95">④ 为什么混排更接近 roofline 脊点</text>

  <!-- plot area x 545..925 (AI 1..10^4), y 600..720 -->
  <line x1="545" y1="720" x2="925" y2="720" stroke="#475569" stroke-width="1.5"/>
  <line x1="545" y1="720" x2="545" y2="595" stroke="#475569" stroke-width="1.5"/>
  <line x1="545" y1="680" x2="743" y2="585" stroke="#7c3aed" stroke-width="2.5"/>
  <line x1="743" y1="585" x2="925" y2="585" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="743" y1="585" x2="743" y2="720" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="747" y="712" font-size="9.5" fill="#64748b">脊点 ≈ 300</text>

  <circle cx="652" cy="645" r="5" fill="#2563eb"/>
  <text x="652" y="668" text-anchor="middle" font-size="9.5" fill="#1e3a8a">纯 decode</text>
  <text x="652" y="680" text-anchor="middle" font-size="9" fill="#1e3a8a">AI≈1~10</text>
  <circle cx="800" cy="585" r="5" fill="#e11d48"/>
  <text x="800" y="604" text-anchor="middle" font-size="9.5" fill="#881337">混合步</text>
  <text x="800" y="616" text-anchor="middle" font-size="9" fill="#881337">AI≈620</text>
  <circle cx="875" cy="585" r="5" fill="#dc2626"/>
  <text x="875" y="604" text-anchor="middle" font-size="9.5" fill="#991b1b">纯 prefill</text>
  <text x="875" y="616" text-anchor="middle" font-size="9" fill="#991b1b">AI≈C=1024</text>

  <path d="M 660,638 Q 730,600 790,590" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG2)"/>
  <text x="700" y="640" font-size="9.5" fill="#166534">decode 搭便车：</text>
  <text x="700" y="652" font-size="9.5" fill="#166534">塞进 compute-bound 的</text>
  <text x="700" y="664" font-size="9.5" fill="#166534">step，闲置带宽白送</text>

  <text x="545" y="735" font-size="9.5" fill="#64748b">10⁰</text>
  <text x="700" y="735" font-size="9.5" fill="#64748b">10²</text>
  <text x="880" y="735" font-size="9.5" fill="#64748b">10⁴　算术强度 AI（FLOP/Byte）</text>
  <text x="552" y="600" font-size="9.5" fill="#64748b">FLOPs/s</text>
  <defs>
    <marker id="arrG2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
