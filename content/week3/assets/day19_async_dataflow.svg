<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="df19a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="df19g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="df19b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Async Scheduling 数据流全景：三个进程、两条共享内存队列、三级重叠（v0.11.0）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">P1 EngineCore（调度领先一步）· P2 Worker（执行 + 旁路 D2H）· 前端（detokenize/输出）——带编号绿圈 = 与 GPU 执行重叠的 CPU 工作</text>

  <!-- ================= Column 1: Frontend ================= -->
  <rect x="40" y="80" width="270" height="560" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="175" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">前端进程（API server）</text>
  <text x="175" y="122" text-anchor="middle" font-size="8.6" fill="#64748b">async_llm.py · processor.py · output_processor.py</text>

  <rect x="56" y="136" width="238" height="52" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="175" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">AsyncLLM.generate / serve</text>
  <text x="175" y="172" text-anchor="middle" font-size="8.4" fill="#475569">HTTP/SSE 接入；把请求交给 Processor</text>

  <rect x="56" y="196" width="238" height="62" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="175" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">Processor：tokenize → Request</text>
  <text x="175" y="232" text-anchor="middle" font-size="8.4" fill="#475569">Day 9 的入口链路；输出 EngineCoreRequest</text>
  <text x="175" y="246" text-anchor="middle" font-size="8.4" fill="#475569">block hash 预计算也在这里（Day 16）</text>

  <rect x="56" y="266" width="238" height="88" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.4"/>
  <circle cx="70" cy="282" r="9" fill="#059669"/><text x="70" y="286" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>
  <text x="175" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">OutputProcessor + IncrementalDetokenizer</text>
  <text x="175" y="302" text-anchor="middle" font-size="8.4" fill="#166534">detokenize / stop-string / 流式切分都在前端进程做</text>
  <text x="175" y="316" text-anchor="middle" font-size="8.4" fill="#166534">与 EngineCore 物理隔离（GIL 不争抢——Day 8 伏笔回收）</text>
  <text x="175" y="330" text-anchor="middle" font-size="8.4" fill="#166534">不占调度/执行线程</text>

  <rect x="56" y="362" width="238" height="46" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="175" y="382" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">HTTP/SSE 流式返回</text>
  <text x="175" y="398" text-anchor="middle" font-size="8.4" fill="#475569">RequestOutput → 客户端</text>

  <!-- ZMQ arrows frontend <-> P1 -->
  <line x1="294" y1="170" x2="378" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#df19a)"/>
  <text x="336" y="160" text-anchor="middle" font-size="8" fill="#475569">EngineCoreRequest</text>
  <text x="336" y="184" text-anchor="middle" font-size="7.6" fill="#94a3b8">ZMQ DEALER→ROUTER</text>
  <line x1="378" y1="420" x2="294" y2="420" stroke="#475569" stroke-width="1.6" marker-end="url(#df19a)"/>
  <text x="336" y="410" text-anchor="middle" font-size="8" fill="#475569">EngineCoreOutputs</text>
  <text x="336" y="434" text-anchor="middle" font-size="7.6" fill="#94a3b8">ZMQ PUSH（零拷贝 buffer 复用）</text>

  <!-- ================= Column 2: EngineCore ================= -->
  <rect x="380" y="80" width="420" height="560" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.4"/>
  <text x="590" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">P1 · EngineCore 进程（v1/engine/core.py）</text>
  <text x="590" y="122" text-anchor="middle" font-size="8.6" fill="#64748b">独立进程承载调度器：与前端 / worker 互不抢 GIL</text>

  <rect x="396" y="136" width="388" height="46" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="590" y="154" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">input / output socket 线程（ZMQ IO）</text>
  <text x="590" y="170" text-anchor="middle" font-size="8.2" fill="#7f1d1d">与 GPU 并行做收发与序列化（core.py:501-505 注释原文：ZMQ 释放 GIL）</text>

  <rect x="396" y="192" width="388" height="400" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="590" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">busy loop → step_with_batch_queue（core.py:300-352）</text>

  <rect x="412" y="228" width="356" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <circle cx="426" cy="244" r="9" fill="#059669"/><text x="426" y="248" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>
  <text x="590" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">AsyncScheduler.schedule()（调度领先一步）</text>
  <text x="590" y="262" text-anchor="middle" font-size="8.2" fill="#78350f">乐观记账 num_output_placeholders；产出 SchedulerOutput</text>
  <text x="590" y="276" text-anchor="middle" font-size="8.2" fill="#78350f">此刻 update(N-1) 尚未执行——状态「晚一步」（图 3）</text>

  <rect x="412" y="294" width="356" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="590" y="312" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">executor.execute_model(non_block=True)</text>
  <text x="590" y="328" text-anchor="middle" font-size="8.2" fill="#78350f">collective_rpc 走 io_thread_pool → 返回 Future，不阻塞</text>
  <text x="590" y="342" text-anchor="middle" font-size="8.2" fill="#78350f">SchedulerOutput 经 shm MessageQueue 广播给所有 rank</text>

  <rect x="412" y="360" width="356" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="590" y="378" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">batch_queue（deque, maxlen=2）appendleft</text>
  <text x="590" y="394" text-anchor="middle" font-size="8.2" fill="#78350f">深度 = max_concurrent_batches = 2（multiproc_executor.py:331-332）</text>
  <text x="590" y="408" text-anchor="middle" font-size="8.2" fill="#78350f">队列未满且最老 Future 未完成 → 早返回，继续调度下一批</text>

  <rect x="412" y="426" width="356" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="590" y="444" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">队列满 → pop 最老 → future.result()</text>
  <text x="590" y="460" text-anchor="middle" font-size="8.2" fill="#78350f">阻塞点仅此一处：等 worker 的拷贝线程把输出物化并发回</text>
  <text x="590" y="474" text-anchor="middle" font-size="8.2" fill="#78350f">此刻 update(N-1) 才补上——比 schedule(N) 晚了一整步</text>

  <rect x="412" y="492" width="356" height="56" rx="6" fill="#ffffff" stroke="#fca5a5"/>
  <text x="590" y="510" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">scheduler.update_from_output()</text>
  <text x="590" y="526" text-anchor="middle" font-size="8.2" fill="#78350f">stop 检查 / finish / free / ph 扣减（async_scheduler.py:29-47）</text>
  <text x="590" y="540" text-anchor="middle" font-size="8.2" fill="#78350f">→ EngineCoreOutputs → output_queue → output socket 线程</text>

  <text x="590" y="566" text-anchor="middle" font-size="8.4" fill="#9a3412">batch_queue 机制最初为消除 PP bubble 而生（core.py:142-144 注释），async 复用之、深度设 2</text>

  <!-- shm arrows P1 <-> Worker -->
  <line x1="800" y1="322" x2="872" y2="322" stroke="#059669" stroke-width="2" marker-end="url(#df19g)"/>
  <text x="836" y="308" text-anchor="middle" font-size="8" font-weight="bold" fill="#047857">SchedulerOutput</text>
  <text x="836" y="342" text-anchor="middle" font-size="7.4" fill="#94a3b8">shm MQ（零拷贝）</text>
  <line x1="872" y1="500" x2="800" y2="500" stroke="#2563eb" stroke-width="2" marker-end="url(#df19b)"/>
  <text x="836" y="486" text-anchor="middle" font-size="8" font-weight="bold" fill="#1e40af">ModelRunnerOutput</text>
  <text x="836" y="520" text-anchor="middle" font-size="7.4" fill="#94a3b8">worker_response_mq → Future 兑现</text>

  <!-- ================= Column 3: Worker ================= -->
  <rect x="874" y="80" width="326" height="560" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="1037" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">P2 · Worker 进程（GPU）</text>
  <text x="1037" y="122" text-anchor="middle" font-size="8.6" fill="#64748b">multiproc_executor.py · gpu_model_runner.py</text>

  <rect x="890" y="136" width="294" height="50" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="1037" y="156" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">worker_busy_loop</text>
  <text x="1037" y="172" text-anchor="middle" font-size="8.2" fill="#166534">rpc_broadcast_mq.dequeue("execute_model")</text>

  <rect x="890" y="196" width="294" height="86" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="1037" y="216" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">execute_model（Day 18 六步路径）</text>
  <text x="1037" y="232" text-anchor="middle" font-size="8.2" fill="#166534">_update_states → _prepare_inputs（写持久 buffer）</text>
  <text x="1037" y="246" text-anchor="middle" font-size="8.2" fill="#166534">护栏：prepare_inputs_event.synchronize()——上一步</text>
  <text x="1037" y="260" text-anchor="middle" font-size="8.2" fill="#166534">的 H2D 还没被 GPU 读完时，不得覆写 pinned buffer</text>
  <text x="1037" y="274" text-anchor="middle" font-size="8.2" fill="#166534">→ CG replay forward → _sample</text>

  <rect x="890" y="292" width="294" height="72" rx="6" fill="#ffffff" stroke="#86efac"/>
  <circle cx="904" cy="308" r="9" fill="#059669"/><text x="904" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>
  <text x="1044" y="310" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">_bookkeeping_sync：无 D2H 分支</text>
  <text x="1037" y="326" text-anchor="middle" font-size="8.2" fill="#166534">不做 .tolist()（同步模式在此阻塞，:2124）；采样结果</text>
  <text x="1037" y="340" text-anchor="middle" font-size="8.2" fill="#166534">留 GPU：prev_sampled_token_ids；CPU 侧只写 -1 占位</text>
  <text x="1037" y="354" text-anchor="middle" font-size="8.2" fill="#166534">下一步 input_ids 直接 D2D 直拷（:830-903）</text>

  <rect x="890" y="374" width="294" height="72" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="1037" y="394" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">AsyncGPUModelRunnerOutput（:130-170）</text>
  <text x="1037" y="410" text-anchor="middle" font-size="8.2" fill="#166534">在旁路 CUDA stream 上发起 non_blocking D2H</text>
  <text x="1037" y="424" text-anchor="middle" font-size="8.2" fill="#166534">record event 后立即返回——不等拷贝完成</text>
  <text x="1037" y="438" text-anchor="middle" font-size="8.2" fill="#166534">get_output() 才会 block（谁调用谁阻塞）</text>

  <rect x="890" y="456" width="294" height="64" rx="6" fill="#ffffff" stroke="#86efac"/>
  <text x="1037" y="476" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#14532d">WorkerAsyncOutputCopy 线程</text>
  <text x="1037" y="492" text-anchor="middle" font-size="8.2" fill="#166534">async_output_queue → get_output()（等 event）</text>
  <text x="1037" y="506" text-anchor="middle" font-size="8.2" fill="#166534">→ enqueue_output → worker_response_mq</text>
  <text x="1037" y="520" text-anchor="middle" font-size="8.2" fill="#166534">与主线程的下一个 execute_model 并行（:646-650）</text>

  <rect x="890" y="530" width="294" height="88" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1037" y="550" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">同进程三并行：主线程 prep(N+1) ∥ GPU forward(N+1) ∥ 拷贝线程收 N</text>
  <text x="1037" y="568" text-anchor="middle" font-size="8.2" fill="#166534">TP&gt;1 时所有 rank 从同一 shm MQ 收 SchedulerOutput 广播；</text>
  <text x="1037" y="582" text-anchor="middle" font-size="8.2" fill="#166534">只有 output rank（TP0/PP尾）回传输出（multiproc_executor.py:335-345）</text>
  <text x="1037" y="596" text-anchor="middle" font-size="8.2" fill="#166534">OMP_NUM_THREADS 默认压到 1：防止 host CPU 争抢（:703-726）</text>

  <!-- ================= Bottom strip: key objects ================= -->
  <text x="60" y="678" font-size="13" font-weight="bold" fill="#0f172a">四个关键对象（源码行号为 v0.11.0）</text>
  <g>
    <rect x="40" y="692" width="287" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="712" font-size="10" font-weight="bold" fill="#7c3aed">batch_queue（core.py:145-151）</text>
    <text x="56" y="730" font-size="8.4" fill="#334155">深度 2 的调度-执行流水线；「为 PP 消 bubble</text>
    <text x="56" y="744" font-size="8.4" fill="#334155">而生」的注释（:142-144）说明它的出身；async</text>
    <text x="56" y="758" font-size="8.4" fill="#334155">scheduling 复用同一机制，把深度固定为 2：</text>
    <text x="56" y="772" font-size="8.4" fill="#334155">调度恰好领先执行一步——与 placeholder 的</text>
    <text x="56" y="786" font-size="8.4" fill="#334155">「只承诺 1 个 token」语义严格配套</text>

    <rect x="337" y="692" width="287" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="353" y="712" font-size="10" font-weight="bold" fill="#7c3aed">num_output_placeholders（request.py:93）</text>
    <text x="353" y="730" font-size="8.4" fill="#334155">调度器对「尚不存在」的 token 的乐观记账：</text>
    <text x="353" y="744" font-size="8.4" fill="#334155">schedule 后 +1（async_scheduler.py:16-27），</text>
    <text x="353" y="758" font-size="8.4" fill="#334155">真 token 到账后 −1（:29-47）。它是调度公式</text>
    <text x="353" y="772" font-size="8.4" fill="#334155">num_new_tokens = num_tokens_with_spec + ph</text>
    <text x="353" y="786" font-size="8.4" fill="#334155">− num_computed_tokens 里的那个 +1（:213-215）</text>

    <rect x="634" y="692" width="287" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="650" y="712" font-size="10" font-weight="bold" fill="#7c3aed">prev_sampled_token_ids（gpu_input_batch.py:279）</text>
    <text x="650" y="730" font-size="8.4" fill="#334155">上一步采样结果驻留 GPU。下一步 decode 的</text>
    <text x="650" y="744" font-size="8.4" fill="#334155">input_ids 从它 D2D 直拷（快路径整段 slice，</text>
    <text x="650" y="758" font-size="8.4" fill="#334155">:876-887；乱序走 scatter :888-903）——</text>
    <text x="650" y="772" font-size="8.4" fill="#334155">token 值不经过 CPU 往返，这是「零开销」的</text>
    <text x="650" y="786" font-size="8.4" fill="#334155">数据面前提；占位 -1 写进 token_ids_cpu</text>

    <rect x="931" y="692" width="269" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="947" y="712" font-size="10" font-weight="bold" fill="#7c3aed">prepare_inputs_event（:385-391）</text>
    <text x="947" y="730" font-size="8.4" fill="#334155">CUDA event 护栏：H2D 拷贝异步化之后，</text>
    <text x="947" y="744" font-size="8.4" fill="#334155">pinned CPU buffer 可能在下一步 _prepare_inputs</text>
    <text x="947" y="758" font-size="8.4" fill="#334155">时仍被 GPU 读着——synchronize_input_prep</text>
    <text x="947" y="772" font-size="8.4" fill="#334155">（:2215-2228）先等 event 再覆写：</text>
    <text x="947" y="786" font-size="8.4" fill="#334155">乒乓 buffer 的「地址固定、生命周期对齐」</text>
  </g>

  <text x="620" y="830" text-anchor="middle" font-size="9.5" fill="#475569">三级重叠小结：① P1 的 schedule(N+1) 与 GPU forward(N) 并行 · ② 旁路 stream 的 D2H copy(N) 与 forward(N+1) 并行 · ③ 前端进程的 detokenize/HTTP 输出与引擎主循环并行</text>
  <text x="620" y="850" text-anchor="middle" font-size="9.5" fill="#475569">约束（v0.11.0）：PP&gt;1 / 投机解码直接报错；未指定后端时自动切 mp（arg_utils.py:1289-1304）；structured outputs 在 docstring 中列为不支持（config/scheduler.py:139-143）</text>
  <text x="620" y="870" text-anchor="middle" font-size="9.5" fill="#64748b">开启方式：vllm serve ... --async-scheduling；启动日志应出现「Batch queue is enabled with size 2」（core.py:149-150）——实验 1 的检查点</text>
</svg>
