<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar18a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar18b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar18c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="ar18d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">为什么 decode 必须用 CUDA Graph：launch 开销的账（Qwen3-8B / H100 示意）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">左：单步 kernel 计数账单 · 右：launch 开销公式（roofline 之外的第三类瓶颈）· 中：eager vs CG 时间线 · 下：batch × 加速比曲线</text>

  <!-- ================= Left top: kernel count bill ================= -->
  <text x="60" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">一张账单：一个 decode step 要 launch 多少 kernel</text>
  <rect x="40" y="88" width="600" height="212" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="58" y="108" font-size="10" font-weight="bold" fill="#4c1d95">每层 12 个 kernel（Qwen3/Llama 类，eager、未融合口径）</text>
  <g font-size="9">
    <!-- two columns of 6 -->
    <rect x="58" y="116" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="66" y="131" fill="#334155">1  input_layernorm（rmsnorm）</text>
    <rect x="346" y="116" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="131" fill="#334155">7  residual add</text>
    <rect x="58" y="142" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="66" y="157" fill="#334155">2  qkv_proj（GEMM，q/k/v 已合并）</text>
    <rect x="346" y="142" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="157" fill="#334155">8  post_attention_layernorm</text>
    <rect x="58" y="168" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="66" y="183" fill="#334155">3  rotary_emb</text>
    <rect x="346" y="168" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="183" fill="#334155">9  gate_up_proj（GEMM，已合并）</text>
    <rect x="58" y="194" width="284" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="66" y="209" fill="#78350f">4  reshape_and_cache_flash（写 KV，D17）</text>
    <rect x="346" y="194" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="209" fill="#334155">10 silu_and_mul</text>
    <rect x="58" y="220" width="284" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="66" y="235" fill="#78350f">5  flash_attn_varlen_func（D17）</text>
    <rect x="346" y="220" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="235" fill="#334155">11 down_proj（GEMM）</text>
    <rect x="58" y="246" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="66" y="261" fill="#334155">6  o_proj（GEMM）</text>
    <rect x="346" y="246" width="284" height="22" rx="4" fill="#ede9fe" stroke="#c4b5fd"/><text x="354" y="261" fill="#334155">12 residual add</text>
  </g>
  <rect x="58" y="272" width="572" height="20" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="344" y="286" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">12 × 36 层 + embedding / final norm / lm_head / 采样 ≈ 440~450 次 launch / step（week3 README 的 200~400 为部分融合口径）</text>

  <!-- ================= Right top: launch cost formula ================= -->
  <text x="676" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">launch 开销：roofline 图上没有的一类瓶颈</text>
  <rect x="660" y="88" width="540" height="212" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>

  <text x="678" y="112" font-size="10" font-weight="bold" fill="#7c2d12">CPU 侧单步发射成本（eager）</text>
  <rect x="678" y="120" width="504" height="44" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="930" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">T_cpu(step) ≈ K × t_launch ≈ 440 × (3~10 μs) ≈ 1.3 ~ 4.4 ms</text>
  <text x="930" y="156" text-anchor="middle" font-size="8.6" fill="#9a3412">t_launch = Python 解释器 + aten dispatcher + cudaLaunchKernel（实验 1 实测你的机器）</text>

  <text x="678" y="184" font-size="10" font-weight="bold" fill="#7c2d12">GPU 侧单步消化成本（Day 2 下界）</text>
  <rect x="678" y="192" width="504" height="34" rx="6" fill="#ffffff" stroke="#fdba74"/>
  <text x="930" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">T_gpu(batch=1) ≈ 权重 16.4 GB ÷ 3.35 TB/s ≈ 4.9 ms（Qwen3-8B BF16 @ H100）</text>
  <text x="930" y="221" text-anchor="middle" font-size="8.6" fill="#9a3412">batch=1 时每 kernel GPU 时间 ~10-50 μs，与 t_launch 同量级 → 发射喂不满消化</text>

  <rect x="678" y="234" width="504" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="930" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">第三类瓶颈：执行开销既不在「算」也不在「读」，在「指挥」</text>
  <text x="930" y="268" text-anchor="middle" font-size="9" fill="#991b1b">Day 3 的 roofline 只有 SM busy / DRAM busy 两轴；launch-bound 时两轴都不忙——</text>
  <text x="930" y="282" text-anchor="middle" font-size="9" fill="#991b1b">GPU 在等 CPU 发指令。CUDA Graph 把 440 次 launch 合并成 1 次图重放</text>

  <!-- ================= Middle: timelines ================= -->
  <text x="60" y="326" font-size="13.5" font-weight="bold" fill="#0f172a">单步时间线（batch=1 示意，实验 3 用 nsys 实拍）</text>

  <!-- eager block -->
  <rect x="40" y="340" width="600" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="58" y="360" font-size="10.5" font-weight="bold" fill="#991b1b">eager：CPU 是流水线瓶颈，GPU 出现 gap</text>
  <!-- CPU lane -->
  <text x="58" y="380" font-size="9" fill="#475569">CPU</text>
  <g>
    <rect x="92" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="156" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="220" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="284" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="348" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="412" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="476" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/><rect x="540" y="368" width="64" height="16" fill="#fecaca" stroke="#dc2626"/>
  </g>
  <text x="610" y="380" font-size="8.6" fill="#dc2626">440×launch ≈ 1.3~4.4 ms</text>
  <!-- GPU lane with gaps -->
  <text x="58" y="424" font-size="9" fill="#475569">GPU</text>
  <g>
    <rect x="92" y="412" width="40" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="146" y="412" width="18" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="180" y="412" width="46" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="240" y="412" width="20" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="272" y="412" width="40" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="322" y="412" width="16" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="350" y="412" width="44" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="404" y="412" width="18" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="434" y="412" width="38" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="484" y="412" width="20" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="516" y="412" width="40" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="566" y="412" width="38" height="16" fill="#bfdbfe" stroke="#2563eb"/>
  </g>
  <g stroke="#dc2626" stroke-width="1.2" stroke-dasharray="2,2">
    <line x1="134" y1="420" x2="144" y2="420"/><line x1="166" y1="420" x2="178" y2="420"/><line x1="228" y1="420" x2="238" y2="420"/><line x1="260" y1="420" x2="270" y2="420"/><line x1="314" y1="420" x2="320" y2="420"/><line x1="338" y1="420" x2="348" y2="420"/><line x1="396" y1="420" x2="402" y2="420"/><line x1="424" y1="420" x2="432" y2="420"/><line x1="476" y1="420" x2="482" y2="420"/><line x1="506" y1="420" x2="514" y2="420"/><line x1="558" y1="420" x2="564" y2="420"/>
  </g>
  <text x="344" y="448" text-anchor="middle" font-size="9" fill="#991b1b">↑ gap：CPU 还没发射完，GPU 已消化完上一个 kernel（两轴都不忙）</text>
  <text x="344" y="466" text-anchor="middle" font-size="9" fill="#475569">step 时长 ≈ max(T_cpu, T_gpu) + 串行化损耗 → 被 CPU 指挥时间垫底</text>

  <!-- CG block -->
  <rect x="660" y="340" width="540" height="140" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="678" y="360" font-size="10.5" font-weight="bold" fill="#065f46">CUDA Graph：一次 launch，kernel 背靠背</text>
  <text x="678" y="380" font-size="9" fill="#475569">CPU</text>
  <g>
    <rect x="712" y="368" width="88" height="16" fill="#d1fae5" stroke="#059669"/><rect x="812" y="368" width="150" height="16" fill="#a7f3d0" stroke="#059669"/>
  </g>
  <text x="712" y="362" font-size="7.6" fill="#065f46">写状态 buffer</text>
  <text x="812" y="362" font-size="7.6" fill="#065f46">cudaGraphLaunch ×1</text>
  <text x="978" y="380" font-size="8.6" fill="#059669">合计 ~几十 μs</text>
  <text x="678" y="424" font-size="9" fill="#475569">GPU</text>
  <g>
    <rect x="712" y="412" width="46" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="760" y="412" width="44" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="806" y="412" width="48" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="856" y="412" width="42" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="900" y="412" width="46" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="948" y="412" width="44" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="994" y="412" width="46" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="1042" y="412" width="42" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="1086" y="412" width="46" height="16" fill="#bfdbfe" stroke="#2563eb"/><rect x="1134" y="412" width="44" height="16" fill="#bfdbfe" stroke="#2563eb"/>
  </g>
  <text x="930" y="448" text-anchor="middle" font-size="9" fill="#065f46">图内 kernel 由 GPU 侧依赖关系自动衔接，无 CPU 逐个发射</text>
  <text x="930" y="466" text-anchor="middle" font-size="9" fill="#065f46">step 时长 ≈ T_gpu（Day 2 的下界成为实际形状）</text>

  <!-- ================= Bottom: speedup curve ================= -->
  <text x="60" y="510" font-size="13.5" font-weight="bold" fill="#0f172a">batch size × CG 加速比（预期形状——实验 2 的验证目标，不是结论）</text>
  <rect x="40" y="522" width="1160" height="330" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- axes -->
  <line x1="110" y1="800" x2="1130" y2="800" stroke="#475569" stroke-width="1.6" marker-end="url(#ar18a)"/>
  <line x1="110" y1="800" x2="110" y2="560" stroke="#475569" stroke-width="1.6" marker-end="url(#ar18a)"/>
  <text x="620" y="836" text-anchor="middle" font-size="11" fill="#334155">decode batch size（并发，log 刻度示意）</text>
  <text x="66" y="680" font-size="11" fill="#334155" transform="rotate(-90 66 680)">TPOT(eager) / TPOT(CG) 加速比</text>

  <!-- y ticks -->
  <g font-size="9" fill="#64748b">
    <text x="100" y="804" text-anchor="end">1.0×</text>
    <text x="100" y="744" text-anchor="end">1.1×</text>
    <text x="100" y="684" text-anchor="end">1.2×</text>
    <text x="100" y="624" text-anchor="end">1.3×</text>
    <text x="100" y="564" text-anchor="end">1.4×</text>
    <line x1="110" y1="740" x2="1130" y2="740" stroke="#e2e8f0" stroke-dasharray="3,3"/><line x1="110" y1="680" x2="1130" y2="680" stroke="#e2e8f0" stroke-dasharray="3,3"/><line x1="110" y1="620" x2="1130" y2="620" stroke="#e2e8f0" stroke-dasharray="3,3"/><line x1="110" y1="560" x2="1130" y2="560" stroke="#e2e8f0" stroke-dasharray="3,3"/>
  </g>
  <!-- x ticks -->
  <g font-size="9" fill="#64748b" text-anchor="middle">
    <text x="150" y="818">1</text><text x="330" y="818">4</text><text x="510" y="818">16</text><text x="690" y="818">64</text><text x="870" y="818">128</text><text x="1060" y="818">256+</text>
  </g>

  <!-- curve -->
  <path d="M 150 572 C 260 578, 300 596, 380 626 C 470 660, 560 692, 700 716 C 830 737, 960 744, 1080 748" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <g fill="#7c3aed">
    <circle cx="150" cy="572" r="4"/><circle cx="330" cy="608" r="4"/><circle cx="510" cy="678" r="4"/><circle cx="690" cy="716" r="4"/><circle cx="870" cy="734" r="4"/><circle cx="1060" cy="747" r="4"/>
  </g>

  <!-- zone annotations -->
  <rect x="120" y="546" width="220" height="246" rx="6" fill="#fef3c7" opacity="0.28"/>
  <rect x="860" y="546" width="260" height="246" rx="6" fill="#dcfce7" opacity="0.3"/>
  <text x="230" y="566" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">launch-bound 区</text>
  <text x="230" y="582" text-anchor="middle" font-size="8.6" fill="#92400e">小 batch：kernel 瘦、GPU 消化快</text>
  <text x="230" y="595" text-anchor="middle" font-size="8.6" fill="#92400e">CPU 指挥是短板，CG 收益最大</text>
  <text x="990" y="566" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">memory-bound 区</text>
  <text x="990" y="582" text-anchor="middle" font-size="8.6" fill="#14532d">大 batch：GEMM 变胖、步长 ms 级</text>
  <text x="990" y="595" text-anchor="middle" font-size="8.6" fill="#14532d">launch 占比 &lt;5%，收益收窄</text>

  <!-- side formulas -->
  <rect x="150" y="752" width="360" height="34" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="330" y="766" text-anchor="middle" font-size="9" fill="#4c1d95">机制：batch 大 → 单 kernel 变胖（M 维变大）→ t_gpu(kernel) ↑</text>
  <text x="330" y="779" text-anchor="middle" font-size="9" fill="#4c1d95">→ K × t_launch 占 T_step 比例 ↓ → 加速比 → 1</text>

  <rect x="700" y="640" width="410" height="58" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="905" y="658" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4c1d95">为什么 prefill 通常不用 full CG（同一张图的右侧逻辑）</text>
  <text x="905" y="674" text-anchor="middle" font-size="8.8" fill="#4c1d95">prefill 是 compute-bound（Day 1）：8K token 一步几十 ms，launch 的 1~4 ms 占比本就小；</text>
  <text x="905" y="688" text-anchor="middle" font-size="8.8" fill="#4c1d95">且序列长度方差大 → 桶要么爆炸（capture 时间/显存）要么 padding 浪费大量计算 → 不值得</text>

  <text x="620" y="846" text-anchor="middle" font-size="8.6" fill="#64748b">纵轴量级参考：vLLM 官方 piecewise CG 博客口径「小 batch decode 最高 ~30%+」；你机器上的绝对值以实验 2 为准——形状比数字重要</text>
</svg>
