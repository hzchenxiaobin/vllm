<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d20a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="d20b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="d20d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">mini 引擎（项目 B · Day 20 版）：物理层组件图与 vLLM V1 字段级对照</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">左：BlockTable → BlockPool → FreeBlockQueue → KVCacheBlock（底部：Day 21 契约五方法 + 不变式安全网） · 右：vLLM v0.11.0 三层（P1 簿记 / P2 物理） · ①~⑤ = 字段级对应</text>

  <!-- ================= LEFT: mini engine ================= -->
  <rect x="40" y="64" width="560" height="700" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">mini 引擎（纯 Python，今日交付 ~230 行）</text>

  <rect x="170" y="100" width="300" height="30" rx="15" fill="#ffffff" stroke="#94a3b8"/>
  <text x="320" y="119" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#334155">Day 21 调度器（明天）：只依赖 ↓ 五个方法</text>
  <line x1="320" y1="130" x2="320" y2="144" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <rect x="64" y="146" width="96" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="112" y="163" text-anchor="middle" font-size="7.6" font-weight="bold" fill="#1e3a8a">① num_free_blocks</text>
  <rect x="168" y="146" width="96" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="216" y="163" text-anchor="middle" font-size="7.6" font-weight="bold" fill="#1e3a8a">② would_allocate</text>
  <rect x="272" y="146" width="96" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="320" y="163" text-anchor="middle" font-size="7.6" font-weight="bold" fill="#1e3a8a">③ append_slots</text>
  <rect x="376" y="146" width="96" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="424" y="163" text-anchor="middle" font-size="7.6" font-weight="bold" fill="#1e3a8a">④ free_request</text>
  <rect x="480" y="146" width="96" height="26" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="528" y="163" text-anchor="middle" font-size="7.6" font-weight="bold" fill="#1e3a8a">⑤ get_block_ids</text>
  <line x1="320" y1="172" x2="320" y2="184" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <!-- BlockTable -->
  <rect x="64" y="186" width="512" height="168" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="80" y="208" font-size="11" font-weight="bold" fill="#4c1d95">BlockTable（kv_cache.py）—— 簿记层</text>
  <text x="80" y="228" font-size="8.6" fill="#334155">req_blocks: {rid → [KVCacheBlock]}  ←→ SingleTypeKVCacheManager.req_to_blocks（P1 对象账本）</text>
  <text x="80" y="244" font-size="8.6" fill="#334155">req_used: {rid → 已写槽位数}  尾块记账：free_slots = len(blocks)×B − used → append O(1)</text>
  <text x="80" y="264" font-size="8.6" fill="#334155">would_allocate(rid, n) → int   ★ COW 感知：共享尾块将被写入时 +1（fork）</text>
  <text x="80" y="280" font-size="8.6" fill="#334155">append_slots(rid, n) → [新块 id]   尾块先用满再开新块；返回值含 fork 块 = P2 增量</text>
  <text x="80" y="296" font-size="8.6" fill="#334155">free_request(rid)：逆序归还（链尾先进队）· hash 保留</text>
  <text x="80" y="312" font-size="8.6" fill="#334155">get_block_ids(rid) · slot_mapping(rid)：slot = block_id×B + off（Day 17 写侧公式）</text>
  <text x="80" y="328" font-size="8.6" fill="#334155">share_prefix(src, dst, k)：今天的共享入口（替身 = hash 命中 + touch，Day 27 退役）</text>
  <text x="80" y="346" font-size="8" fill="#7c3aed">事务性护栏：先 would_allocate peek 后动池 —— 失败零副作用（§2.4 欠预留 bug 的解）</text>
  <circle cx="552" cy="200" r="10" fill="#7c3aed"/>
  <text x="552" y="204" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>

  <line x1="150" y1="354" x2="150" y2="366" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>
  <line x1="320" y1="354" x2="320" y2="366" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>
  <line x1="490" y1="354" x2="490" y2="366" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>
  <text x="108" y="364" font-size="7.8" fill="#475569">allocate / free</text>
  <text x="298" y="364" font-size="7.8" fill="#475569">touch</text>
  <text x="470" y="364" font-size="7.8" fill="#475569">fork（COW）</text>

  <!-- BlockPool -->
  <rect x="64" y="370" width="512" height="128" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="80" y="392" font-size="11" font-weight="bold" fill="#1e3a8a">BlockPool（block.py）—— 物理层（全池唯一）</text>
  <text x="80" y="412" font-size="8.6" fill="#334155">blocks: [KVCacheBlock × num_blocks] · free_queue · cached: {hash → block}（今天只摘不注册）</text>
  <text x="80" y="432" font-size="8.6" fill="#334155">allocate(n)：队头取 n 块；带 hash = 顺手驱逐（驱逐 = 分配）；清 token_ids 残留（§4.4-1）</text>
  <text x="80" y="448" font-size="8.6" fill="#334155">free_blocks(bs)：ref−1 → 归零回队尾；hash 保留（Day 15 不变式②）</text>
  <text x="80" y="464" font-size="8.6" fill="#334155">touch(bs)：在队则 O(1) 摘出 + ref+1（命中挂载，Day 16）</text>
  <text x="80" y="480" font-size="8.6" fill="#334155">fork(b)：V0 式真 COW —— 开新块继承 token_ids，原块 ref−1（V1 已结构性免除，§2.5）</text>
  <text x="80" y="494" font-size="8" fill="#1d4ed8">num_free_blocks（契约①）= len(free_queue)，含可驱逐缓存块</text>
  <circle cx="552" cy="384" r="10" fill="#2563eb"/>
  <text x="552" y="388" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <!-- FreeBlockQueue -->
  <rect x="64" y="506" width="512" height="98" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="80" y="526" font-size="10" font-weight="bold" fill="#1e3a8a">FreeBlockQueue —— 双向链表 = 驱逐优先级队列</text>
  <rect x="84" y="538" width="26" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="97" y="553" text-anchor="middle" font-size="7.5" fill="#475569">head</text>
  <line x1="110" y1="549" x2="130" y2="549" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <line x1="130" y1="543" x2="110" y2="543" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <rect x="132" y="538" width="52" height="22" rx="4" fill="#f8fafc" stroke="#60a5fa"/>
  <text x="158" y="553" text-anchor="middle" font-size="8.5" fill="#334155">b3 ref=0</text>
  <line x1="184" y1="549" x2="204" y2="549" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <line x1="204" y1="543" x2="184" y2="543" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <rect x="206" y="538" width="52" height="22" rx="4" fill="#f8fafc" stroke="#60a5fa"/>
  <text x="232" y="553" text-anchor="middle" font-size="8.5" fill="#334155">b4 ref=0</text>
  <line x1="258" y1="549" x2="278" y2="549" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <line x1="278" y1="543" x2="258" y2="543" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <rect x="280" y="538" width="52" height="22" rx="4" fill="#fef9c3" stroke="#eab308"/>
  <text x="306" y="553" text-anchor="middle" font-size="8.5" fill="#713f12">b7 h=·</text>
  <line x1="332" y1="549" x2="352" y2="549" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <line x1="352" y1="543" x2="332" y2="543" stroke="#475569" stroke-width="1.2" marker-end="url(#d20d)"/>
  <rect x="354" y="538" width="26" height="22" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="367" y="553" text-anchor="middle" font-size="7.5" fill="#475569">tail</text>
  <text x="84" y="578" font-size="8" fill="#475569">队头 = 最久未用（分配 / 驱逐口，popleft_n） · 队尾 = 最新归还（push_back）</text>
  <text x="84" y="592" font-size="8" font-weight="bold" fill="#9a3412">remove(b)：O(1) 摘中间块 —— touch 的需求，双向链表的唯一理由（单向拿不到前驱）</text>
  <circle cx="552" cy="520" r="10" fill="#0ea5e9"/>
  <text x="552" y="524" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <line x1="320" y1="604" x2="320" y2="614" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <!-- KVCacheBlock -->
  <text x="80" y="630" font-size="10" font-weight="bold" fill="#334155">KVCacheBlock —— 块的三张身份证 + 链表指针</text>
  <rect x="64" y="638" width="76" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="102" y="653" text-anchor="middle" font-size="8" fill="#334155">block_id</text>
  <rect x="146" y="638" width="76" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="184" y="653" text-anchor="middle" font-size="8" fill="#334155">ref_cnt</text>
  <rect x="228" y="638" width="96" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="276" y="653" text-anchor="middle" font-size="8" fill="#78350f">token_ids★</text>
  <rect x="330" y="638" width="86" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="373" y="653" text-anchor="middle" font-size="8" fill="#334155">block_hash</text>
  <rect x="422" y="638" width="50" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="447" y="653" text-anchor="middle" font-size="8" fill="#334155">prev</text>
  <rect x="478" y="638" width="50" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="503" y="653" text-anchor="middle" font-size="8" fill="#334155">next</text>
  <text x="80" y="676" font-size="8" fill="#64748b">★ mini 专用（模拟槽位内容 / I4 断言）—— vLLM 版无此字段，防串靠 32B sha256（Day 16）</text>
  <circle cx="552" cy="644" r="10" fill="#64748b"/>
  <text x="552" y="648" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">4</text>

  <!-- invariant band -->
  <rect x="64" y="686" width="512" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="80" y="706" font-size="9.5" font-weight="bold" fill="#78350f">不变式安全网：check_invariants + fuzz（每步校验）</text>
  <text x="80" y="722" font-size="8.2" fill="#475569">I1 守恒：len(free) + |{ref&gt;0}| = N（共享块计一次） · I2 双条件：在队 ⇔ ref==0</text>
  <text x="80" y="736" font-size="8.2" fill="#475569">I3：每块 ≤ B · 账本一致 req_used == Σlen · I4：写只落自己表尾且先 fork</text>
  <text x="80" y="750" font-size="8.2" font-weight="bold" fill="#92400e">→ Day 21 调度器 / Day 27 preemption 的回归安全网（§2.6、图 3）</text>

  <!-- ================= RIGHT: vLLM V1 ================= -->
  <rect x="630" y="64" width="570" height="700" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="915" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">vLLM V1（v0.11.0 —— 坐标回收 Day 15/16/17）</text>

  <text x="650" y="108" font-size="9.5" font-weight="bold" fill="#475569">P1 簿记层（EngineCore 进程 · CPU · 纯元数据）</text>
  <rect x="815" y="114" width="210" height="24" rx="12" fill="#ffffff" stroke="#94a3b8"/>
  <text x="920" y="130" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#334155">Scheduler（sched/scheduler.py）</text>
  <line x1="920" y1="138" x2="920" y2="148" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <rect x="670" y="150" width="490" height="38" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="680" y="166" font-size="9" font-weight="bold" fill="#1e3a8a">KVCacheManager —— 门面</text>
  <text x="680" y="180" font-size="7.8" fill="#475569">allocate_slots / free / get_computed_blocks（kv_cache_manager.py:193-304，Day 15 九步）</text>
  <line x1="915" y1="188" x2="915" y2="198" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <rect x="670" y="200" width="490" height="34" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="680" y="214" font-size="9" font-weight="bold" fill="#1e3a8a">KVCacheCoordinator —— 工厂三选一</text>
  <text x="680" y="227" font-size="7.8" fill="#475569">NoPrefixCache / Unitary / Hybrid（:417-440）—— mini 单层单组，退化为直连</text>
  <line x1="915" y1="234" x2="915" y2="244" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <rect x="670" y="246" width="490" height="36" rx="6" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="680" y="261" font-size="9" font-weight="bold" fill="#4c1d95">SingleTypeKVCacheManager —— 每组一个</text>
  <text x="680" y="275" font-size="7.8" fill="#475569">持 req_to_blocks: {req → list[KVCacheBlock]}（P1 对象账本）· allocate_new_blocks :109 / free :156</text>
  <circle cx="1140" cy="260" r="10" fill="#7c3aed"/>
  <text x="1140" y="264" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">1</text>
  <line x1="915" y1="282" x2="915" y2="292" stroke="#475569" stroke-width="1.4" marker-end="url(#d20a)"/>

  <rect x="670" y="294" width="490" height="60" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="680" y="310" font-size="9" font-weight="bold" fill="#1e3a8a">BlockPool（block_pool.py:118）</text>
  <text x="680" y="324" font-size="7.8" fill="#475569">blocks + free_queue + cached_block_hash_to_block（hash 索引：注册 + 驱逐都在这）</text>
  <text x="680" y="338" font-size="7.8" fill="#475569">get_new_blocks :257（驱逐=分配）· touch :322 · free_blocks :338（hash 保留）· 无 fork/cow</text>
  <text x="680" y="350" font-size="7.8" font-weight="bold" fill="#9a3412">null_block :157-158 —— sliding window / encoder 层的占位块（mini 无）</text>
  <circle cx="1140" cy="308" r="10" fill="#2563eb"/>
  <text x="1140" y="312" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">2</text>

  <rect x="690" y="360" width="450" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="700" y="378" font-size="8.4" font-weight="bold" fill="#1e3a8a">FreeKVCacheBlockQueue（kv_cache_utils.py:216，双向链表 + 哨兵）</text>
  <circle cx="1112" cy="374" r="10" fill="#0ea5e9"/>
  <text x="1112" y="378" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">3</text>

  <rect x="690" y="394" width="450" height="34" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="700" y="409" font-size="8.4" font-weight="bold" fill="#334155">KVCacheBlock（kv_cache_utils.py:169-186）</text>
  <text x="700" y="422" font-size="7.8" fill="#475569">block_id / ref_cnt / block_hash + prev/next —— 不存 token_ids（Day 16）</text>
  <circle cx="1112" cy="411" r="10" fill="#64748b"/>
  <text x="1112" y="415" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">4</text>

  <line x1="650" y1="442" x2="1180" y2="442" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="915" y="458" text-anchor="middle" font-size="8.6" fill="#64748b">P1 元数据（逻辑） ↕ SchedulerOutput 块增量（new_block_ids → add_row / append_row） ↕ P2 物理（张量）</text>

  <text x="650" y="478" font-size="9.5" font-weight="bold" fill="#475569">P2 物理层（Worker 进程 · GPU · mini 用 list[int] 增量替身）</text>
  <rect x="670" y="486" width="490" height="42" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="680" y="502" font-size="9" font-weight="bold" fill="#065f46">BlockTable（int32 tensor）</text>
  <text x="680" y="516" font-size="7.8" fill="#475569">[max_reqs, max_blocks_per_req]（block_table.py:16）· add_row / append_row / move_row / swap_row</text>

  <rect x="670" y="534" width="490" height="42" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="680" y="550" font-size="9" font-weight="bold" fill="#065f46">KV cache buffer —— 唯一真实物理存储</text>
  <text x="680" y="564" font-size="7.8" fill="#475569">[num_blocks, B, H_kv, d] × num_layers（按层一份）· Qwen3-8B@H100 ≈ 24.1k 块（Day 15 手算）</text>

  <rect x="670" y="582" width="490" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="680" y="597" font-size="9" font-weight="bold" fill="#991b1b">slot_mapping（写侧，Day 17）</text>
  <text x="680" y="611" font-size="7.8" fill="#475569">slot = block_table[row, pos÷B]×B + pos mod B（block_table.py:107-113）—— K/V scatter 进池</text>
  <circle cx="1140" cy="596" r="10" fill="#dc2626"/>
  <text x="1140" y="600" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">5</text>

  <rect x="650" y="630" width="530" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="664" y="650" font-size="9" font-weight="bold" fill="#0f172a">对应关系（badge 同号）与三处刻意分歧</text>
  <text x="664" y="668" font-size="8" fill="#475569">① BlockTable.req_blocks ↔ req_to_blocks · ② BlockPool ↔ BlockPool（驱逐/touch/free 三入口同款）</text>
  <text x="664" y="682" font-size="8" fill="#475569">③ FreeBlockQueue ↔ FreeKVCacheBlockQueue · ④ KVCacheBlock ↔ KVCacheBlock（mini 多 token_ids）</text>
  <text x="664" y="696" font-size="8" fill="#475569">⑤ slot_mapping ↔ P2 写侧公式 —— 接真硬件时的 scatter 地址（§4.5 设计说明）</text>
  <text x="664" y="714" font-size="8" font-weight="bold" fill="#9a3412">分歧：fork（V0 式真 COW）V1 已结构性免除 · hash 注册推迟 Day 27 · mini 无 null_block / Coordinator</text>
  <text x="664" y="730" font-size="8" fill="#64748b">端口诀：token_ids→buffer · req_blocks→int32 张量 · 写模拟→kernel scatter · ref_cnt/LRU/COW 语义不变</text>

  <text x="620" y="796" text-anchor="middle" font-size="9.5" fill="#64748b">图 1 · mini 引擎 Day 20 版组件图 —— 左侧代码见 §4.1/4.2；右侧行号全部回收 Day 15/16/17 已核对锚点（v0.11.0 tag）</text>
</svg>
