<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar18e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar18f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar18g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="ar18h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">capture / replay 生命周期：一次录制、反复换状态重放（v0.11.0 源码坐标）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">左：启动期 capture（一次性成本，从大到小录）· 中：bucket padding 与持久 buffer（图引用地址不引用值）· 右：稳态每步 replay（状态写入 → dispatch → 重放）</text>

  <!-- ================= Left: startup capture flow ================= -->
  <text x="60" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">启动期：capture 主流程（capture_model，:3405-3482）</text>
  <rect x="40" y="88" width="370" height="750" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <g font-size="9.2">
    <rect x="58" y="104" width="334" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="72" y="122" font-weight="bold" fill="#4c1d95">① 尺寸集合从哪来</text>
    <text x="72" y="136" fill="#334155">_set_cudagraph_sizes（config/__init__.py:551）</text>
    <text x="72" y="150" fill="#334155">[1,2,4] + 8 的倍数 … min(2·max_num_seqs, 512)</text>

    <line x1="225" y1="158" x2="225" y2="172" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="58" y="174" width="334" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="72" y="192" font-weight="bold" fill="#0f172a">② init_with_cudagraph_sizes（:517-565）</text>
    <text x="72" y="206" fill="#334155">降序排列 + 预计算 bs_to_padded_graph_size：</text>
    <text x="72" y="220" fill="#334155">每个 0..max 的 batch size → 向上取整的桶值</text>
    <text x="72" y="234" fill="#334155">（list[int] 数组直查，O(1)）</text>

    <line x1="225" y1="240" x2="225" y2="254" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="58" y="256" width="334" height="100" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
    <text x="72" y="274" font-weight="bold" fill="#7c2d12">③ 逐尺寸 capture（_capture_cudagraphs :3484）</text>
    <text x="72" y="290" fill="#7c2d12">for num_tokens in [512 → 1]（★ 从大到小）：</text>
    <text x="72" y="304" fill="#7c2d12">  warmup ×1（cudagraph_num_of_warmups=1，</text>
    <text x="72" y="318" fill="#7c2d12">    mode=NONE 跑一遍：锁 shape/稳定显存）</text>
    <text x="72" y="332" fill="#7c2d12">  _dummy_run(mode=PIECEWISE/FULL) → 进入</text>
    <text x="72" y="346" fill="#7c2d12">    CUDAGraphWrapper 逐段 capture</text>

    <line x1="225" y1="356" x2="225" y2="370" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="58" y="372" width="334" height="88" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.4"/>
    <text x="72" y="390" font-weight="bold" fill="#065f46">④ capture 期间的四项工程优化</text>
    <text x="72" y="405" fill="#065f46">· 从大到小：小图复用大图已分配的 pool 内存</text>
    <text x="72" y="419" fill="#065f46">· graph_pool 全局共享（get_global_graph_pool）</text>
    <text x="72" y="433" fill="#065f46">· gc.freeze + patch gc.collect/empty_cache</text>
    <text x="72" y="447" fill="#065f46">· 输出 weak_ref_tensors（省显存，:174-178）</text>

    <rect x="58" y="472" width="334" height="60" rx="6" fill="#0f172a"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="8.8">
      <text x="72" y="492" fill="#7dd3fc">logger.info("Graph capturing finished in</text>
      <text x="72" y="506" fill="#7dd3fc">  %.0f secs, took %.2f GiB")   # :3480</text>
      <text x="72" y="522" fill="#94a3b8"># 典型 5~20 s、GiB 级——capture 是真实成本</text>
    </g>

    <rect x="58" y="548" width="334" height="96" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="72" y="566" font-weight="bold" fill="#991b1b">默认规模感（v0.11.0 默认配置）</text>
    <text x="72" y="581" fill="#991b1b">max_num_seqs=128 → sizes=[256] → 桶 =</text>
    <text x="72" y="595" fill="#991b1b">[1,2,4]+8 的倍数到 256 → 35 个</text>
    <text x="72" y="609" fill="#991b1b">FULL_AND_PIECEWISE：mixed 35 条链 × 37 段</text>
    <text x="72" y="623" fill="#991b1b">+ decode(≤128) 19 张 full ≈ 1300 个 CUDAGraph</text>
    <text x="72" y="637" fill="#991b1b">（数量随配置变化，方法见实验 0）</text>

    <rect x="58" y="656" width="334" height="70" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="72" y="674" font-weight="bold" fill="#1e40af">capture 的合法性围栏</text>
    <text x="72" y="689" fill="#1e40af">set_cudagraph_capturing_enabled(True/False)</text>
    <text x="72" y="703" fill="#1e40af">（monitor.py）：启动期之外任何意外 capture</text>
    <text x="72" y="717" fill="#1e40af">直接 raise——防运行时悄悄重录</text>
  </g>

  <!-- ================= Middle: bucket + buffers ================= -->
  <text x="440" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">两个静态化技巧：bucket + padding 与持久 buffer</text>
  <rect x="420" y="88" width="370" height="750" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="438" y="110" font-size="10" font-weight="bold" fill="#4c1d95">桶与向上取整（pad_for_cudagraph，config/__init__.py:240）</text>
  <g font-size="9">
    <rect x="438" y="118" width="334" height="24" rx="4" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="452" y="134" fill="#4c1d95">capture sizes（升序看）: 1 2 4 8 16 24 32 … 504 512</text>
  </g>
  <g font-size="9.2">
    <rect x="438" y="150" width="334" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="452" y="168" fill="#334155">实际 batch → 桶（bs_to_padded_graph_size）</text>
    <text x="452" y="185" fill="#334155">1 → <tspan font-weight="bold" fill="#7c3aed">1</tspan>   2 → <tspan font-weight="bold" fill="#7c3aed">2</tspan>   3 → <tspan font-weight="bold" fill="#7c3aed">4</tspan>   5~8 → <tspan font-weight="bold" fill="#7c3aed">8</tspan></text>
    <text x="452" y="202" fill="#334155">17~23 → <tspan font-weight="bold" fill="#7c3aed">24</tspan>（向上取整，绝不舍弃真 token）</text>
    <text x="452" y="219" fill="#334155">500 → <tspan font-weight="bold" fill="#7c3aed">504</tspan>   512 → <tspan font-weight="bold" fill="#7c3aed">512</tspan></text>
    <text x="452" y="236" fill="#dc2626">&gt; 512 → 不 pad，eager 执行（:1932 的判定）</text>
    <text x="452" y="253" fill="#64748b">VLLM_DISABLE_PAD_FOR_CUDAGRAPH 可关 pad</text>
  </g>

  <text x="438" y="288" font-size="10" font-weight="bold" fill="#7c2d12">padding 出来的 token 走 dummy 路径（Day 17 伏笔兑现）</text>
  <rect x="438" y="296" width="334" height="86" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <g font-size="9">
    <text x="452" y="314" fill="#7c2d12">· slot_mapping 尾部填 PAD_SLOT_ID = -1</text>
    <text x="452" y="328" fill="#7c2d12">  → 写 KV kernel 见 -1 直接 return（D17 §2.5）</text>
    <text x="452" y="342" fill="#7c2d12">· seq_lens 尾部 0 → attention 对空段无害</text>
    <text x="452" y="356" fill="#7c2d12">· logits 只按 logits_indices 取每请求最后 token</text>
    <text x="452" y="370" fill="#7c2d12">  → dummy token 的输出天然被丢弃</text>
  </g>

  <text x="438" y="406" font-size="10" font-weight="bold" fill="#065f46">持久 buffer：图引用地址，不引用值</text>
  <rect x="438" y="414" width="334" height="180" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="8.6">
    <text x="452" y="432" fill="#065f46"># _make_buffer → CpuGpuBuffer（pinned+GPU，:444）</text>
    <text x="452" y="448" fill="#334155">input_ids      [max_num_tokens]  int32</text>
    <text x="452" y="463" fill="#334155">positions      [max_num_tokens]  int64</text>
    <text x="452" y="478" fill="#334155">query_start_loc[max_num_reqs+1]  int32</text>
    <text x="452" y="493" fill="#334155">seq_lens       [max_num_reqs]    int32</text>
    <text x="452" y="508" fill="#334155">inputs_embeds  [max_tokens, hidden]</text>
    <text x="452" y="523" fill="#334155">+ InputBatch.block_table / slot_mapping（D15 P2 张量）</text>
  </g>
  <g font-size="9">
    <text x="452" y="546" fill="#065f46">capture 时：图内 kernel 拿到的是这些 buffer 的指针；</text>
    <text x="452" y="560" fill="#065f46">replay 前：只往 buffer 写新值（memcpy / np 写 CPU 侧），</text>
    <text x="452" y="574" fill="#065f46">地址永不变 → 图无需重录。debug 模式下 wrapper 还会</text>
    <text x="452" y="588" fill="#065f46">校验输入地址与 capture 时一致（cuda_graph.py:188-196）</text>
  </g>

  <rect x="438" y="606" width="334" height="106" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="452" y="626" font-size="10" font-weight="bold" fill="#991b1b">FA3 的额外静态化代价（flash_attn.py:193-217）</text>
  <g font-size="8.8">
    <text x="452" y="644" fill="#991b1b">· split 数不能用运行时启发式（会随 seq 变）→</text>
    <text x="452" y="658" fill="#991b1b">  AOT scheduler_metadata buffer + max_num_splits 封顶</text>
    <text x="452" y="672" fill="#991b1b">  （VLLM_FLASH_ATTN_MAX_NUM_SPLITS_FOR_CUDA_GRAPH，</text>
    <text x="452" y="686" fill="#991b1b">   中间 buffer 按 [splits, heads, tokens, d] 预分配）</text>
    <text x="452" y="700" fill="#991b1b">· full CG 的 capture size 上限 992（FA3 内部约束）</text>
  </g>

  <!-- ================= Right: steady-state replay ================= -->
  <text x="820" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">稳态每 step：replay 路径（execute_model，:2231）</text>
  <rect x="800" y="88" width="400" height="750" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <g font-size="9.2">
    <rect x="816" y="104" width="368" height="76" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
    <text x="830" y="122" font-weight="bold" fill="#4c1d95">① 状态写入（不碰图）</text>
    <text x="830" y="137" fill="#334155">_update_states + _prepare_inputs（:2239/:2257）</text>
    <text x="830" y="151" fill="#334155">block_table 增量 commit / positions np.add /</text>
    <text x="830" y="165" fill="#334155">input_ids.copy_to_gpu —— 全部写进持久 buffer</text>

    <line x1="1000" y1="180" x2="1000" y2="196" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="816" y="198" width="368" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="830" y="216" font-weight="bold" fill="#0f172a">② padding + 构造 BatchDescriptor</text>
    <text x="830" y="231" fill="#334155">_get_num_input_tokens（:1927）：</text>
    <text x="830" y="245" fill="#334155">  num_input_tokens = pad_for_cudagraph(n)</text>
    <text x="830" y="259" fill="#334155">uniform_decode =（全部请求 query_len == 1）</text>
    <text x="830" y="271" fill="#334155">BatchDescriptor(num_tokens, uniform_decode)</text>

    <line x1="1000" y1="276" x2="1000" y2="292" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="816" y="294" width="368" height="96" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
    <text x="830" y="312" font-weight="bold" fill="#7c2d12">③ dispatch：两级查 key（dispatcher.py:96-125）</text>
    <text x="830" y="328" fill="#7c2d12">uniform key ∈ FULL 集？→ FULL</text>
    <text x="830" y="342" fill="#7c2d12">non_uniform key ∈ FULL 集？→ FULL（升级复用）</text>
    <text x="830" y="356" fill="#7c2d12">non_uniform key ∈ PIECEWISE 集？→ PIECEWISE</text>
    <text x="830" y="370" fill="#7c2d12">否则 → NONE（eager，如 >512 的混合大 batch）</text>
    <text x="830" y="384" fill="#9a3412">key 集合 = 启动期 add_cudagraph_key 登记的桶</text>

    <line x1="1000" y1="390" x2="1000" y2="406" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="816" y="408" width="368" height="110" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.3"/>
    <text x="830" y="426" font-weight="bold" fill="#065f46">④ wrapper 按 mode 命中（cuda_graph.py:108-199）</text>
    <text x="830" y="442" fill="#065f46">set_forward_context(mode, descriptor) → model(...)</text>
    <text x="830" y="456" fill="#065f46">FULL wrapper：mode 匹配 → entry 有图 →</text>
    <text x="830" y="470" fill="#065f46">  entry.cudagraph.replay()（一次 cudaGraphLaunch）</text>
    <text x="830" y="484" fill="#065f46">PIECEWISE wrapper：每段子图各自 replay</text>
    <text x="830" y="498" fill="#065f46">mode 不匹配 → 透传 runnable（嵌套不串扰）</text>
    <text x="830" y="512" fill="#065f46">首次遇到新 descriptor → 现场 capture 并缓存</text>

    <line x1="1000" y1="518" x2="1000" y2="534" stroke="#475569" stroke-width="1.4" marker-end="url(#ar18e)"/>

    <rect x="816" y="536" width="368" height="76" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/>
    <text x="830" y="554" font-weight="bold" fill="#1e40af">⑤ 图外收尾（不在任何图里）</text>
    <text x="830" y="570" fill="#1e40af">compute_logits（按 logits_indices 切）→ _sample</text>
    <text x="830" y="584" fill="#1e40af">→ bookkeeping / detokenize / 输出</text>
    <text x="830" y="598" fill="#1e40af">（采样 shape 随 batch 变 + CPU 逻辑多，放图外）</text>

    <rect x="816" y="626" width="368" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="830" y="644" font-size="10" font-weight="bold" fill="#991b1b">为什么「换状态」是安全的</text>
    <text x="830" y="660" font-size="8.8" fill="#991b1b">CUDA Graph 录的是 kernel 序列 + 参数里的地址。</text>
    <text x="830" y="674" font-size="8.8" fill="#991b1b">地址由持久 buffer 固定；值每步刷新；形状由桶固定。</text>
    <text x="830" y="688" font-size="8.8" fill="#991b1b">三者合起来：同一张图，喂不同的「状态快照」。</text>
  </g>

  <!-- bottom arrows linking middle and right -->
  <g stroke="#7c3aed" stroke-width="1.6" fill="none" stroke-dasharray="5,3">
    <path d="M 754 500 C 780 500, 785 240, 812 240" marker-end="url(#ar18h)"/>
  </g>
  <text x="784" y="486" font-size="8.6" fill="#7c3aed" transform="rotate(90 784 486)">buffer 地址固定 → replay 只需写值</text>
</svg>
