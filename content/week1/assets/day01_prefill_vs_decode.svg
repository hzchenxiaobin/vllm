<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Prefill vs Decode：同一份权重，两种截然相反的瓶颈</text>

  <!-- ================= LEFT PANEL: PREFILL ================= -->
  <rect x="20" y="56" width="590" height="386" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="36" y="72" width="6" height="26" rx="2" fill="#2563eb"/>
  <text x="52" y="91" font-size="16" font-weight="bold" fill="#1e3a8a">Prefill · 提示词预填充</text>
  <text x="594" y="91" text-anchor="end" font-size="13" font-weight="bold" fill="#2563eb">→ 决定 TTFT</text>

  <text x="40" y="147" font-size="11" fill="#64748b">输入</text>
  <rect x="88"  y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="109" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">t1</text>
  <rect x="135" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="156" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">t2</text>
  <rect x="182" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="203" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">t3</text>
  <rect x="229" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="250" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">…</text>
  <rect x="276" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="297" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">…</text>
  <rect x="323" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="344" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">…</text>
  <rect x="370" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="391" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">…</text>
  <rect x="417" y="128" width="42" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="438" y="145" text-anchor="middle" font-size="11" fill="#1e3a8a">ts</text>
  <text x="472" y="145" font-size="11.5" fill="#1e3a8a">（s 个 token 一次进来）</text>

  <line x1="300" y1="158" x2="300" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="48" y="196" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="123" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">权重 W</text>
  <text x="123" y="238" text-anchor="middle" font-size="11" fill="#5b21b6">只读 1 遍</text>
  <text x="123" y="254" text-anchor="middle" font-size="11" fill="#5b21b6">N·P 字节</text>
  <line x1="198" y1="228" x2="234" y2="228" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="240" y="192" width="320" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="400" y="216" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e3a8a">大 GEMM：X[s×H] × W</text>
  <text x="400" y="236" text-anchor="middle" font-size="11" fill="#334155">一次算完 s 个 token</text>
  <text x="400" y="254" text-anchor="middle" font-size="11" fill="#334155">FLOPs ≈ 2·N·s</text>

  <line x1="400" y1="264" x2="400" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="48" y="292" width="512" height="58" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="304" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">KV cache：整段 prompt 的 K/V 一次性写入（s 个槽位）</text>
  <text x="304" y="334" text-anchor="middle" font-size="11" fill="#047857">访存 ≈ N·P（权重）＋ s·KV_per_token（写出）</text>

  <rect x="48" y="364" width="512" height="40" rx="6" fill="#2563eb"/>
  <text x="304" y="389" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">AI ≈ s FLOP/B → s ≳ 300 即 compute-bound（算力瓶颈）</text>

  <!-- ================= RIGHT PANEL: DECODE ================= -->
  <rect x="630" y="56" width="590" height="386" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="646" y="72" width="6" height="26" rx="2" fill="#ea580c"/>
  <text x="662" y="91" font-size="16" font-weight="bold" fill="#9a3412">Decode · 逐 token 生成</text>
  <text x="1204" y="91" text-anchor="end" font-size="13" font-weight="bold" fill="#ea580c">→ 决定 TPOT</text>

  <text x="640" y="147" font-size="11" fill="#64748b">输入</text>
  <rect x="880" y="128" width="64" height="26" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="912" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">t_i</text>
  <path d="M 956 141 C 996 141, 996 113, 954 113" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arO)"/>
  <text x="1006" y="132" font-size="11" fill="#9a3412">每步只来 1 个 token</text>

  <line x1="912" y1="154" x2="912" y2="182" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="648" y="196" width="150" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="723" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">权重 W</text>
  <text x="723" y="238" text-anchor="middle" font-size="11" fill="#5b21b6">每步重读 1 遍</text>
  <text x="723" y="254" text-anchor="middle" font-size="11" fill="#5b21b6">N·P 字节 / 步</text>
  <circle cx="790" cy="204" r="10" fill="#dc2626"/>
  <text x="790" y="208.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">!</text>
  <line x1="798" y1="228" x2="834" y2="228" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="840" y="192" width="320" height="72" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1000" y="216" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a3412">GEMV：x[1×H] × W</text>
  <text x="1000" y="236" text-anchor="middle" font-size="11" fill="#334155">M=1，算术强度塌缩</text>
  <text x="1000" y="254" text-anchor="middle" font-size="11" fill="#334155">FLOPs ≈ 2·N（每 token）</text>

  <line x1="1000" y1="264" x2="1000" y2="288" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="648" y="292" width="512" height="58" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="904" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">KV cache：读全部历史 K[0..i]、V[0..i] ＋ 追加 1 个槽位</text>
  <text x="904" y="334" text-anchor="middle" font-size="11" fill="#047857">访存 ≈ N·P（权重）＋ i·KV_per_token（读历史）</text>

  <rect x="648" y="364" width="512" height="40" rx="6" fill="#ea580c"/>
  <text x="904" y="389" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">AI ≈ 1 FLOP/B（BF16，B=1）→ memory-bound（带宽瓶颈）</text>

  <!-- ================= BOTTOM: AI SCALE ================= -->
  <rect x="20" y="458" width="1200" height="168" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="484" font-size="13" font-weight="bold" fill="#92400e">算术强度标尺（H100 SXM · BF16：峰值 989 TFLOPS ÷ HBM 3.35 TB/s → 屋脊点 ≈ 295 FLOP/B）</text>

  <rect x="80"  y="498" width="662" height="34" fill="#fff7ed"/>
  <rect x="742" y="498" width="438" height="34" fill="#eff6ff"/>
  <text x="411" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#ea580c">memory-bound（带宽瓶颈）</text>
  <text x="961" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">compute-bound（算力瓶颈）</text>

  <line x1="742" y1="492" x2="742" y2="584" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="742" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">屋脊点 ≈ 295</text>

  <line x1="80" y1="566" x2="1180" y2="566" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <line x1="152"  y1="560" x2="152"  y2="572" stroke="#64748b" stroke-width="1.5"/><text x="152"  y="586" text-anchor="middle" font-size="11" fill="#64748b">1</text>
  <line x1="391"  y1="560" x2="391"  y2="572" stroke="#64748b" stroke-width="1.5"/><text x="391"  y="586" text-anchor="middle" font-size="11" fill="#64748b">10</text>
  <line x1="630"  y1="560" x2="630"  y2="572" stroke="#64748b" stroke-width="1.5"/><text x="630"  y="586" text-anchor="middle" font-size="11" fill="#64748b">100</text>
  <line x1="742"  y1="560" x2="742"  y2="572" stroke="#dc2626" stroke-width="1.5"/><text x="742"  y="586" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">295</text>
  <line x1="869"  y1="560" x2="869"  y2="572" stroke="#64748b" stroke-width="1.5"/><text x="869"  y="586" text-anchor="middle" font-size="11" fill="#64748b">1000</text>
  <line x1="1108" y1="560" x2="1108" y2="572" stroke="#64748b" stroke-width="1.5"/><text x="1108" y="586" text-anchor="middle" font-size="11" fill="#64748b">10000</text>

  <circle cx="152" cy="566" r="7" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <text x="164" y="548" font-size="11.5" font-weight="bold" fill="#ea580c">decode B=1 → AI≈1</text>
  <circle cx="512" cy="566" r="6" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <text x="524" y="548" font-size="11.5" font-weight="bold" fill="#c2410c">decode B=32 → AI≈32（仍在左区）</text>
  <circle cx="943" cy="566" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="931" y="548" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2563eb">prefill s≈2048 → AI≈2048</text>

  <text x="630" y="612" text-anchor="middle" font-size="12" fill="#334155">算术强度 AI（FLOP / Byte，对数轴）</text>
  <text x="1180" y="612" text-anchor="end" font-size="11.5" font-weight="bold" fill="#92400e">判定式：AI = 2M/P（BF16 时 ≈ M；M=s → prefill，M=B → decode）</text>
</svg>
