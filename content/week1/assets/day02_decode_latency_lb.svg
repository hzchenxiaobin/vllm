<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#ffffff"/>
  <text x="620" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Decode 时延下界：TPOT(B) ≥ ( N·P ＋ B·ctx·KV_per_token ) ÷ HBM 带宽</text>
  <text x="620" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">示例曲线：Qwen3-8B BF16 · A100 80GB（2.04 TB/s）· ctx=8192</text>

  <!-- ===== 左列：推导链 ===== -->
  <rect x="20" y="70" width="450" height="86" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="245" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">每步必读字节（Day 1 decode 账单）</text>
  <text x="245" y="118" text-anchor="middle" font-size="12" fill="#334155">权重 N·P（与 B 无关）＋ B · ctx · KV_per_token</text>
  <text x="245" y="140" text-anchor="middle" font-size="11" fill="#94a3b8">＋ 激活/嵌入行零头（MB 级，忽略）＋ 写 1 槽 KV（小）</text>

  <line x1="245" y1="156" x2="245" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="258" y="171" font-size="11" fill="#64748b">÷ HBM 带宽 BW</text>

  <rect x="20" y="178" width="450" height="74" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="245" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">TPOT ≥ ( N·P + B·ctx·KV_tok ) / BW</text>
  <text x="245" y="228" text-anchor="middle" font-size="11.5" fill="#7c2d12">B=1、中等 ctx 时 → ≈ N·P / BW（单 token 时延下界）</text>
  <text x="245" y="244" text-anchor="middle" font-size="11" fill="#94a3b8">「模型参数字节数 ÷ HBM 带宽」</text>

  <rect x="20" y="264" width="450" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">为什么敢忽略计算？</text>
  <text x="245" y="308" text-anchor="middle" font-size="11.5" fill="#334155">2NB/峰值算力 ≪ 访存项（Day 1：17 µs vs 4.5 ms，差 260×）</text>

  <rect x="20" y="336" width="450" height="98" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="245" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">为什么叫「下界」？（单调性）</text>
  <text x="245" y="382" text-anchor="middle" font-size="11.5" fill="#334155">① 权重必须整份过 HBM（SMEM+L2 ≈ 60~80 MB ≪ 15 GB，驻留不了）</text>
  <text x="245" y="402" text-anchor="middle" font-size="11.5" fill="#334155">② 峰值带宽物理上打不满（ECC/TLB/paged gather/流水空隙）</text>
  <text x="245" y="422" text-anchor="middle" font-size="11.5" fill="#334155">→ 实测 TPOT 是下界的 1.2~2 倍；有效带宽 = 字节/TPOT ≈ 峰值的 60~85%</text>

  <rect x="20" y="448" width="450" height="170" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="245" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">下界的三个工程用途</text>
  <text x="40" y="500" font-size="11.5" fill="#047857">① 容量规划：选卡/选卡数（今天题 1、题 2）</text>
  <text x="40" y="524" font-size="11.5" fill="#047857">② 优化收益上限：任何 decode 优化不可能低于下界；</text>
  <text x="52" y="542" font-size="11.5" fill="#047857">量化的收益上限 = 精度字节的缩小倍数（→ Day 22-24）</text>
  <text x="40" y="566" font-size="11.5" fill="#047857">③ 实测对账 KPI：有效带宽 = 必读字节 ÷ 实测 TPOT，</text>
  <text x="52" y="584" font-size="11.5" fill="#047857">越接近峰值说明系统越健康（→ Day 19 / Day 46 监控）</text>
  <text x="40" y="608" font-size="10.5" fill="#64748b">prefill 侧对照：TTFT 下界 ≈ 2Ns/峰值算力（算力侧）→ Day 3 Roofline 两条边</text>

  <!-- ===== 右侧：TPOT vs B 曲线 ===== -->
  <rect x="500" y="70" width="720" height="430" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="860" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">TPOT 下界随 batch 的变化：权重摊销区 → KV 主导区</text>

  <line x1="560" y1="90"  x2="560" y2="470" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="166" x2="1180" y2="166" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="242" x2="1180" y2="242" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="318" x2="1180" y2="318" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="394" x2="1180" y2="394" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="560" y1="470" x2="1180" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="560" y1="470" x2="560" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

  <text x="550" y="398" text-anchor="end" font-size="10.5" fill="#64748b">10</text>
  <text x="550" y="322" text-anchor="end" font-size="10.5" fill="#64748b">20</text>
  <text x="550" y="246" text-anchor="end" font-size="10.5" fill="#64748b">30</text>
  <text x="550" y="170" text-anchor="end" font-size="10.5" fill="#64748b">40</text>
  <text x="512" y="475" font-size="11" fill="#334155">0</text>
  <text x="500" y="280" font-size="11.5" fill="#334155" transform="rotate(-90 500 280)">TPOT 下界 (ms)</text>

  <text x="637" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">8</text>
  <text x="715" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">16</text>
  <text x="870" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">32</text>
  <text x="1025" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">48</text>
  <text x="1180" y="492" text-anchor="middle" font-size="10.5" fill="#64748b">64</text>
  <text x="870" y="512" text-anchor="middle" font-size="11.5" fill="#334155">并发 batch B</text>

  <line x1="560" y1="413.6" x2="1180" y2="413.6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1175" y="430" text-anchor="end" font-size="11" font-weight="bold" fill="#7c3aed">纯权重下界 N·P/BW = 7.4 ms（B→0 渐近线）</text>

  <line x1="681" y1="90" x2="681" y2="470" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="681" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#dc2626">B* = N·P/(ctx·KV_tok) ≈ 12.5</text>
  <text x="681" y="128" text-anchor="middle" font-size="10.5" fill="#dc2626">KV 项 = 权重项的分界</text>

  <rect x="566" y="440" width="110" height="24" rx="4" fill="#eff6ff" stroke="#2563eb"/>
  <text x="621" y="456" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">B &lt; B*：摊销区</text>
  <rect x="940" y="440" width="150" height="24" rx="4" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1015" y="456" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">B &gt; B*：KV 主导区（线性）</text>

  <path d="M 570 409 L 599 396 L 638 377 L 681 357 L 715 342 L 870 269 L 986 215 L 1180 126"
        fill="none" stroke="#ea580c" stroke-width="3"/>
  <circle cx="570" cy="409" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="715" cy="342" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="870" cy="269" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="1180" cy="126" r="5" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="588" y="394" font-size="10.5" fill="#9a3412">B=1: 8.0</text>
  <text x="700" y="330" font-size="10.5" fill="#9a3412">B=16: 16.9</text>
  <text x="858" y="256" font-size="10.5" fill="#9a3412">B=32: 26.4</text>
  <text x="1120" y="114" font-size="10.5" fill="#9a3412">B=64: 45.3</text>

  <!-- 吞吐小柱图 -->
  <text x="860" y="538" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">吞吐下界 = B ÷ TPOT（tok/s）：边际递减</text>
  <line x1="560" y1="616" x2="1180" y2="616" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="553"  y="608" width="34" height="8"  fill="#93c5fd"/><text x="570"  y="602" text-anchor="middle" font-size="10" fill="#1e40af">125</text>
  <rect x="620"  y="575" width="34" height="41" fill="#60a5fa"/><text x="637"  y="569" text-anchor="middle" font-size="10" fill="#1e40af">658</text>
  <rect x="698"  y="557" width="34" height="59" fill="#3b82f6"/><text x="715"  y="551" text-anchor="middle" font-size="10" fill="#1e40af">947</text>
  <rect x="853"  y="540" width="34" height="76" fill="#2563eb"/><text x="870"  y="534" text-anchor="middle" font-size="10" fill="#1e40af">1214</text>
  <rect x="969"  y="534" width="34" height="82" fill="#1d4ed8"/><text x="986"  y="528" text-anchor="middle" font-size="10" fill="#1e40af">1315</text>
  <text x="1080" y="600" font-size="10.5" fill="#64748b">B=1→8 吞吐 ×5.3</text>
  <text x="1080" y="614" font-size="10.5" fill="#64748b">B=32→64 只 ×1.06</text>

  <text x="860" y="632" text-anchor="middle" font-size="11" fill="#64748b">SLO 反推示例：TPOT ≤ 20 ms → B ≤ 21（容量上限 44 之内）→ goodput 思维（Day 5）</text>
</svg>
