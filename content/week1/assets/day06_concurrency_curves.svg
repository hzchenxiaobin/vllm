<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#ffffff"/>
  <text x="620" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">并发扫描的曲线解剖：TTFT p99 早拐陡升 · TPOT p99 缓升 · 吞吐先线性后饱和</text>
  <text x="620" y="50" text-anchor="middle" font-size="12" fill="#64748b">闭环扫描：--max-concurrency C + --request-rate inf · Qwen3-8B BF16 @ H100-80GB · 图中为示意量级（§3 可推出），你的第一张图以实测为准</text>

  <!-- ================= 左图：p99 延迟 ================= -->
  <!-- 绘图区 x:120..600, y:110..560 -->
  <rect x="120" y="110" width="480" height="450" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 水平网格线：1/10/100/1000/10000 ms -->
  <line x1="120" y1="560" x2="600" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="447.5" x2="600" y2="447.5" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="335" x2="600" y2="335" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="222.5" x2="600" y2="222.5" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="110" x2="600" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <text x="112" y="564" text-anchor="end" font-size="10" fill="#64748b">1</text>
  <text x="112" y="451.5" text-anchor="end" font-size="10" fill="#64748b">10</text>
  <text x="112" y="339" text-anchor="end" font-size="10" fill="#64748b">100</text>
  <text x="112" y="226.5" text-anchor="end" font-size="10" fill="#64748b">1000</text>
  <text x="112" y="114" text-anchor="end" font-size="10" fill="#64748b">10⁴</text>
  <text x="60" y="335" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 60 335)">p99 延迟（ms，对数）</text>

  <!-- X 刻度：1..256 -->
  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="120" y="578">1</text><text x="180" y="578">2</text><text x="240" y="578">4</text>
    <text x="300" y="578">8</text><text x="360" y="578">16</text><text x="420" y="578">32</text>
    <text x="480" y="578">64</text><text x="540" y="578">128</text><text x="600" y="578">256</text>
  </g>
  <text x="360" y="600" text-anchor="middle" font-size="12" fill="#334155">并发 C（--max-concurrency，对数轴）</text>

  <!-- 区域①底纹：C<=8 -->
  <rect x="120" y="110" width="180" height="450" fill="#eff6ff" opacity="0.35"/>

  <!-- TTFT p99 曲线（蓝）：60,65,75,110,200,450,1100,3000,9000 ms -->
  <path d="M 120 360 L 180 356.1 L 240 349.1 L 300 330.4 L 360 301.1 L 420 261.5 L 480 217.9 L 540 168.8 L 600 115.2"
        fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <g fill="#2563eb">
    <circle cx="120" cy="360" r="3.4"/><circle cx="180" cy="356.1" r="3.4"/><circle cx="240" cy="349.1" r="3.4"/>
    <circle cx="300" cy="330.4" r="3.4"/><circle cx="360" cy="301.1" r="3.4"/><circle cx="420" cy="261.5" r="3.4"/>
    <circle cx="480" cy="217.9" r="3.4"/><circle cx="540" cy="168.8" r="3.4"/><circle cx="600" cy="115.2" r="3.4"/>
  </g>

  <!-- TPOT p99 曲线（橙）：8,8,9,9,11,14,19,27,42 ms -->
  <path d="M 120 458.4 L 180 458.4 L 240 452.7 L 300 452.7 L 360 442.9 L 420 431.1 L 480 416.1 L 540 399 L 600 377.4"
        fill="none" stroke="#ea580c" stroke-width="2.6"/>
  <g fill="#ea580c">
    <circle cx="120" cy="458.4" r="3.4"/><circle cx="180" cy="458.4" r="3.4"/><circle cx="240" cy="452.7" r="3.4"/>
    <circle cx="300" cy="452.7" r="3.4"/><circle cx="360" cy="442.9" r="3.4"/><circle cx="420" cy="431.1" r="3.4"/>
    <circle cx="480" cy="416.1" r="3.4"/><circle cx="540" cy="399" r="3.4"/><circle cx="600" cy="377.4" r="3.4"/>
  </g>

  <!-- ④ 越界外推（虚线） -->
  <path d="M 600 115.2 L 640 80" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 图例 -->
  <rect x="132" y="122" width="200" height="52" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="144" y1="140" x2="172" y2="140" stroke="#2563eb" stroke-width="2.6"/><circle cx="158" cy="140" r="3.4" fill="#2563eb"/>
  <text x="180" y="144" font-size="10.5" fill="#334155">TTFT p99</text>
  <line x1="144" y1="160" x2="172" y2="160" stroke="#ea580c" stroke-width="2.6"/><circle cx="158" cy="160" r="3.4" fill="#ea580c"/>
  <text x="180" y="164" font-size="10.5" fill="#334155">TPOT p99</text>

  <!-- 注释 -->
  <circle cx="152" cy="196" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="152" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">①</text>
  <text x="168" y="193" font-size="10" fill="#334155">平坦区：TTFT/TPOT ≈ 单请求水平（延迟主导）</text>
  <text x="168" y="206" font-size="10" fill="#334155">吞吐随 C 线性涨（右图贴着虚线）</text>

  <circle cx="420" cy="240" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="420" y="244" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">②</text>
  <text x="436" y="237" font-size="10" fill="#334155">TTFT 早拐：prefill 与 C 路 decode 抢 token budget</text>
  <text x="436" y="250" font-size="10" fill="#334155">+ 输出路径变挤 + 长尾 prompt 排队</text>

  <circle cx="560" cy="440" r="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="560" y="444" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a3412">③</text>
  <text x="548" y="462" text-anchor="end" font-size="10" fill="#334155">TPOT 缓升：权重读被 batch 摊销，</text>
  <text x="548" y="475" text-anchor="end" font-size="10" fill="#334155">增量主要来自 B·s̄ 的 KV 读（Day 2 公式）</text>

  <text x="646" y="74" font-size="10" fill="#dc2626">④ 输出更长 / 并发更高 → KV 超配</text>
  <text x="646" y="87" font-size="10" fill="#dc2626">→ preemption → p99 尖刺（实验 4）</text>

  <!-- ================= 右图：吞吐 ================= -->
  <rect x="700" y="110" width="480" height="450" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- 水平网格：100/1000/10000 tok/s -->
  <line x1="700" y1="560" x2="1180" y2="560" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="700" y1="335" x2="1180" y2="335" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="700" y1="110" x2="1180" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <text x="692" y="564" text-anchor="end" font-size="10" fill="#64748b">10²</text>
  <text x="692" y="339" text-anchor="end" font-size="10" fill="#64748b">10³</text>
  <text x="692" y="114" text-anchor="end" font-size="10" fill="#64748b">10⁴</text>
  <text x="640" y="335" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 640 335)">输出吞吐（tok/s，对数）</text>

  <g font-size="10" fill="#64748b" text-anchor="middle">
    <text x="700" y="578">1</text><text x="760" y="578">2</text><text x="820" y="578">4</text>
    <text x="880" y="578">8</text><text x="940" y="578">16</text><text x="1000" y="578">32</text>
    <text x="1060" y="578">64</text><text x="1120" y="578">128</text><text x="1180" y="578">256</text>
  </g>
  <text x="940" y="600" text-anchor="middle" font-size="12" fill="#334155">并发 C（对数轴）</text>

  <!-- 理想线性参考线（若 TPOT 恒定，吞吐 ∝ C）：125→8000 -->
  <line x1="700" y1="538.2" x2="1079" y2="110" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="826" y="292" font-size="9.5" fill="#64748b" transform="rotate(-29.5 826 292)">理想线性 ∝ C（若 TPOT 恒定）</text>

  <!-- 饱和平台渐近线：~7000 tok/s -->
  <line x1="700" y1="144.9" x2="1180" y2="144.9" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1172" y="138" text-anchor="end" font-size="9.5" fill="#dc2626">饱和平台：边际收益趋零，多余并发全变排队时延</text>

  <!-- knee 竖线：C=64 -->
  <line x1="1060" y1="110" x2="1060" y2="560" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="1050" y="128" text-anchor="end" font-size="10.5" font-weight="bold" fill="#7c3aed">knee（拐点）</text>

  <!-- 输出吞吐曲线（绿）：125,250,500,950,1700,2800,4400,5600,6200 -->
  <path d="M 700 538.2 L 760 470.6 L 820 402.7 L 880 340 L 940 283.2 L 1000 234.3 L 1060 190.2 L 1120 166.6 L 1180 156.7"
        fill="none" stroke="#16a34a" stroke-width="2.6"/>
  <g fill="#16a34a">
    <circle cx="700" cy="538.2" r="3.4"/><circle cx="760" cy="470.6" r="3.4"/><circle cx="820" cy="402.7" r="3.4"/>
    <circle cx="880" cy="340" r="3.4"/><circle cx="940" cy="283.2" r="3.4"/><circle cx="1000" cy="234.3" r="3.4"/>
    <circle cx="1060" cy="190.2" r="3.4"/><circle cx="1120" cy="166.6" r="3.4"/><circle cx="1180" cy="156.7" r="3.4"/>
  </g>

  <text x="986" y="330" font-size="10" fill="#334155">knee 之后：吞吐 ≈ 平台（TPOT 随 C 涨，</text>
  <text x="986" y="343" font-size="10" fill="#334155">两者相消）；SLO 交点决定 goodput</text>
  <text x="986" y="356" font-size="10" fill="#334155">最优工作点（Day 5 的卡片在这用上）</text>

  <text x="716" y="132" font-size="10" fill="#047857">理论上限 ≈ BW_eff ÷（s̄·KV_tok）—— 代入你的实测 s̄（§3.4）</text>

  <!-- ================= 底部：三个对账锚点 ================= -->
  <rect x="40" y="622" width="386" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="56" y="646" font-size="11" font-weight="bold" fill="#1e3a8a">锚点 ①：C=1 的 TPOT vs 理论下界</text>
  <text x="56" y="666" font-size="9.5" fill="#475569">Day 2 下界 16.4 GB ÷ 3.35 TB/s ≈ 4.9 ms；</text>
  <text x="56" y="680" font-size="9.5" fill="#475569">实测 / 下界 = 效率系数（预期 1.2~2×）</text>
  <text x="56" y="694" font-size="9.5" fill="#475569">—— 你这台机器的「BW_eff 折扣」从此有数</text>

  <rect x="440" y="622" width="386" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="456" y="646" font-size="11" font-weight="bold" fill="#14532d">锚点 ②：吞吐 ≈ C ÷ TPOT(C)</text>
  <text x="456" y="666" font-size="9.5" fill="#475569">Little's Law 变形（稳态闭环）；</text>
  <text x="456" y="680" font-size="9.5" fill="#475569">两图对不上 → 先查测量口径（SSE 打包、</text>
  <text x="456" y="694" font-size="9.5" fill="#475569">token 计数、是否把 prefill 混进 TPOT）</text>

  <rect x="840" y="622" width="360" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="856" y="646" font-size="11" font-weight="bold" fill="#991b1b">锚点 ③：KV 越界 → preemption</text>
  <text x="856" y="666" font-size="9.5" fill="#991b1b">--sharegpt-output-len 1024 后 C=256：</text>
  <text x="856" y="680" font-size="9.5" fill="#991b1b">256 × ~1524 tok × 144 KiB ≈ 56 GB &gt; 54 GB 池</text>
  <text x="856" y="694" font-size="9.5" fill="#991b1b">→ 抢占重算，TTFT/TPOT p99 尖刺（Day 12 预演）</text>
</svg>
