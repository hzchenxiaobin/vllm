<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar10c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">token budget 记账：一步 8192 个 token 怎么分（vLLM V1 · v0.11.0）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">上：预算条（RUNNING 先扣 :299 → WAITING 吃剩余 :524）· 中左：稳态容量三重上限 · 中右/下：budget 与时延的权衡</text>

  <!-- ================= 上：预算条 ================= -->
  <text x="30" y="74" font-size="10.5" font-weight="bold" fill="#0f172a">示例：K = 8192（H100 serve 默认）· 100 路在飞 decode · waiting：A/B/C/F/G 各 2000-token prompt，E 为 6000-token prompt</text>

  <!-- step 1 -->
  <text x="30" y="100" font-size="9.4" font-weight="bold" fill="#1d4ed8">step t</text>
  <rect x="90" y="84" width="10" height="34" fill="#3b82f6"/>
  <rect x="100" y="84" width="200" height="34" fill="#10b981"/>
  <rect x="300" y="84" width="200" height="34" fill="#10b981"/>
  <rect x="500" y="84" width="200" height="34" fill="#10b981"/>
  <rect x="700" y="84" width="209" height="34" fill="#f59e0b"/>
  <text x="200" y="105" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">A 整段 2000</text>
  <text x="400" y="105" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">B 整段 2000</text>
  <text x="600" y="105" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">C 整段 2000</text>
  <text x="804" y="99" text-anchor="middle" font-size="8.2" fill="#ffffff" font-weight="bold">E 切块 2092</text>
  <text x="804" y="111" text-anchor="middle" font-size="7.4" fill="#ffffff">（Day 11）</text>
  <line x1="95" y1="80" x2="70" y2="66" stroke="#475569" stroke-width="0.9" marker-end="url(#ar10c)"/>
  <text x="30" y="63" font-size="8" fill="#475569">decode 100 路 × 1 token（RUNNING 先扣，:299）</text>
  <text x="909" y="105" font-size="8.4" fill="#0f172a">← 6100 + 2092 = 8192 吃满</text>

  <!-- step 2 -->
  <text x="30" y="150" font-size="9.4" font-weight="bold" fill="#1d4ed8">step t+1</text>
  <rect x="90" y="134" width="10" height="34" fill="#3b82f6"/>
  <rect x="100" y="134" width="391" height="34" fill="#f59e0b"/>
  <rect x="491" y="134" width="200" height="34" fill="#10b981"/>
  <rect x="691" y="134" width="200" height="34" fill="#10b981"/>
  <rect x="891" y="134" width="18" height="34" fill="#cbd5e1"/>
  <text x="296" y="155" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">E 续块 3908（6000 − 2092，仍在 running 列表原位）</text>
  <text x="591" y="155" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">F 整段 2000</text>
  <text x="791" y="155" text-anchor="middle" font-size="8.6" fill="#ffffff" font-weight="bold">G 整段 2000</text>
  <text x="909" y="127" font-size="8.2" fill="#64748b">剩 184（本步无新 chunk）</text>

  <!-- legend -->
  <rect x="90" y="180" width="12" height="12" fill="#3b82f6"/><text x="108" y="190" font-size="8.4" fill="#0f172a">RUNNING decode（每路 1 token）</text>
  <rect x="300" y="180" width="12" height="12" fill="#10b981"/><text x="318" y="190" font-size="8.4" fill="#0f172a">WAITING 整段放行（min(need, budget) :437）</text>
  <rect x="580" y="180" width="12" height="12" fill="#f59e0b"/><text x="598" y="190" font-size="8.4" fill="#0f172a">budget 钳位切块（:220/:437 → Day 11）</text>
  <rect x="850" y="180" width="12" height="12" fill="#cbd5e1"/><text x="868" y="190" font-size="8.4" fill="#0f172a">剩余预算</text>

  <!-- ================= 中左：容量公式 ================= -->
  <rect x="30" y="208" width="580" height="200" rx="8" fill="#f0f9ff" stroke="#60a5fa"/>
  <text x="46" y="230" font-size="10.5" font-weight="bold" fill="#0c1e4e">稳态 decode 批的三重上限：B* ≤ min( S, K, N_KV )</text>
  <text x="46" y="250" font-size="9" fill="#0f172a" font-weight="bold">N_KV ≈ KV 池 token 数 ÷ 平均上下文长度</text>

  <rect x="46" y="262" width="548" height="26" fill="#0f172a"/>
  <text x="120" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">平均上下文</text>
  <text x="300" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">N_KV（Qwen3-8B@H100，池 ≈ 36.6 万 token）</text>
  <text x="530" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">先绷紧的闸</text>

  <rect x="46" y="288" width="548" height="24" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="120" y="304" text-anchor="middle" font-size="8.4" fill="#0f172a">1 K</text>
  <text x="300" y="304" text-anchor="middle" font-size="8.4" fill="#0f172a">~358 路</text>
  <text x="530" y="304" text-anchor="middle" font-size="8.4" fill="#0f172a">S（1024）之前 KV 先到</text>
  <rect x="46" y="312" width="548" height="24" fill="#f0f9ff" stroke="#bfdbfe"/>
  <text x="120" y="328" text-anchor="middle" font-size="8.4" fill="#0f172a">4 K</text>
  <text x="300" y="328" text-anchor="middle" font-size="8.4" fill="#0f172a">~89 路</text>
  <text x="530" y="328" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#991b1b">闸③ KV（离 S 还很远）</text>
  <rect x="46" y="336" width="548" height="24" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="120" y="352" text-anchor="middle" font-size="8.4" fill="#0f172a">16 K</text>
  <text x="300" y="352" text-anchor="middle" font-size="8.4" fill="#0f172a">~22 路</text>
  <text x="530" y="352" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#991b1b">闸③ KV（Day 12 的「22 路」）</text>

  <text x="46" y="378" font-size="8.6" fill="#1d4ed8" font-weight="bold">推论①：纯 decode 下 budget 几乎永不先爆 —— K ≥ S 校验（config/scheduler.py:245-249）</text>
  <text x="46" y="393" font-size="8.6" fill="#1d4ed8" font-weight="bold">推论②：budget 真正发力在 prefill 到来的瞬间（2000-token prompt = 2000 路 decode 的份额）</text>

  <!-- ================= 中右：ITL 上界 ================= -->
  <rect x="630" y="208" width="580" height="200" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="646" y="230" font-size="10.5" font-weight="bold" fill="#78350f">budget → 单步时长上界（ITL 上界的第一因）</text>
  <text x="646" y="250" font-size="9.4" fill="#0f172a" font-weight="bold">T_step ≈ T_fix + ρ · T_sched ， T_sched ≤ K ， ρ ≈ 2P / (η · R_peak)</text>

  <rect x="646" y="262" width="548" height="26" fill="#0f172a"/>
  <text x="726" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">平台（Qwen3-8B FP16）</text>
  <text x="880" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">ρ（每 token prefill 时间）</text>
  <text x="1060" y="279" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#f1f5f9">最坏混排步（K 默认）</text>

  <rect x="646" y="288" width="548" height="24" fill="#ffffff" stroke="#fde68a"/>
  <text x="726" y="304" text-anchor="middle" font-size="8.4" fill="#0f172a">H100（η=0.5）</text>
  <text x="880" y="304" text-anchor="middle" font-size="8.4" fill="#0f172a">2×8.03e9 ÷ 4.95e14 ≈ 32.4 µs</text>
  <text x="1060" y="304" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#0f172a">8192 × 32.4µs ≈ 265 ms</text>
  <rect x="646" y="312" width="548" height="24" fill="#fffbeb" stroke="#fde68a"/>
  <text x="726" y="328" text-anchor="middle" font-size="8.4" fill="#0f172a">A100（η=0.4）</text>
  <text x="880" y="328" text-anchor="middle" font-size="8.4" fill="#0f172a">2×8.03e9 ÷ 1.25e14 ≈ 128.7 µs</text>
  <text x="1060" y="328" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#0f172a">2048 × 128.7µs ≈ 263 ms</text>

  <rect x="646" y="344" width="548" height="50" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="362" font-size="8.8" font-weight="bold" fill="#78350f">关键观察：两代硬件、4 倍差异的默认 K，最坏单步殊途同归 ≈ 0.26 s</text>
  <text x="660" y="377" font-size="8.2" fill="#0f172a">默认值不是拍脑袋 —— 是「把最坏混排步钉在几百毫秒」的工程选择</text>
  <text x="660" y="390" font-size="8.2" fill="#475569">对照 decode-only 步 ≈ 5 ms（Day 2）：ITL 分布 = 5 ms 常态 + 偶发 ρ·K 毛刺（Day 11 治理）</text>

  <!-- ================= 下：权衡与调参 ================= -->
  <rect x="30" y="424" width="580" height="240" rx="8" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text x="46" y="446" font-size="10.5" font-weight="bold" fill="#065f46">K 调大 / 调小：一个旋钮，两头受力</text>

  <rect x="46" y="458" width="264" height="128" rx="5" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="60" y="476" font-size="9.2" font-weight="bold" fill="#065f46">K ↑</text>
  <text x="60" y="492" font-size="8.2" fill="#0f172a">✔ 高负载 TTFT ↓（每步消化更多 prefill）</text>
  <text x="60" y="507" font-size="8.2" fill="#0f172a">✔ prefill 吞吐 ↑（大 GEMM + T_fix 摊薄）</text>
  <text x="60" y="522" font-size="8.2" font-weight="bold" fill="#991b1b">✘ 最坏 ITL ↑（ρ·K 线性涨）</text>
  <text x="60" y="537" font-size="8.2" fill="#991b1b">✘ 混排步占比 ↑（CG 覆盖面受影响，Day 18）</text>
  <text x="60" y="552" font-size="8" fill="#64748b">✘ A100：吞吐可能反降（PR #17885，</text>
  <text x="60" y="564" font-size="8" fill="#64748b">arg_utils.py:1601-1605 NOTE(Kuntai)）</text>

  <rect x="330" y="458" width="264" height="128" rx="5" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="344" y="476" font-size="9.2" font-weight="bold" fill="#065f46">K ↓</text>
  <text x="344" y="492" font-size="8.2" fill="#0f172a">✔ ITL 平滑（毛刺上界 ↓）</text>
  <text x="344" y="507" font-size="8.2" fill="#0f172a">✔ 对在飞 decode 干扰更分散</text>
  <text x="344" y="522" font-size="8.2" font-weight="bold" fill="#991b1b">✘ prefill 拉成 k 步：ΔTTFT ≈ (k−1)·T_fix</text>
  <text x="344" y="537" font-size="8.2" fill="#991b1b">✘ 长 prompt 调度次数 ↑</text>
  <text x="344" y="552" font-size="8" fill="#64748b">（Day 11 §3 的推导，k = ⌈L / K⌉）</text>

  <rect x="46" y="596" width="548" height="56" rx="5" fill="#eef2ff" stroke="#818cf8"/>
  <text x="60" y="614" font-size="8.8" font-weight="bold" fill="#1e3a8a">A100 反直觉现象（面试引用需带硬件前缀）</text>
  <text x="60" y="629" font-size="8.2" fill="#0f172a">「budget 越大吞吐越高」在 A100 上不成立：大 prefill 批把 decode 挤到批尾、kernel 效率随批形更陡</text>
  <text x="60" y="643" font-size="8.2" fill="#475569">—— 所以 arg_utils 显式按设备名排除 A100（:1605），默认给 2048 而非 8192</text>

  <rect x="630" y="424" width="580" height="240" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="646" y="446" font-size="10.5" font-weight="bold" fill="#4c1d95">调参姿势：ITL SLO 反推 K，再看 TTFT</text>

  <rect x="646" y="460" width="548" height="88" rx="5" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="660" y="480" font-size="9.4" font-weight="bold" fill="#4c1d95">K ≤ ( T_ITL_max − T_fix ) / ρ</text>
  <text x="660" y="497" font-size="8.4" fill="#0f172a">例 1：H100 保 ITL ≤ 100 ms → K ≤ (0.1 − 0.005) ÷ 32.4µs ≈ 2947 → 取 2048</text>
  <text x="660" y="512" font-size="8.4" fill="#0f172a">例 2：H100 保 ITL ≤ 50 ms → K ≤ (0.05 − 0.005) ÷ 32.4µs ≈ 1470 → 2K prompt 必切两步</text>
  <text x="660" y="527" font-size="8.2" fill="#475569">（ITL SLO 与小 TTFT 在短 budget 下直接冲突 —— §3.3 跷跷板）</text>
  <text x="660" y="541" font-size="8.2" fill="#475569">然后压测 TTFT：不达标再升 K 并盯 ITL p99 毛刺（实验 3 / Day 13 预演）</text>

  <rect x="646" y="560" width="548" height="92" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="580" font-size="8.8" font-weight="bold" fill="#4c1d95">两条制度性校验（config/scheduler.py:235-249）</text>
  <text x="660" y="597" font-size="8.2" fill="#0f172a">① chunked 关闭时 K ≥ max_model_len（长 prompt 否则永远进不来；V1 chunked 恒开，通常不触发）</text>
  <text x="660" y="612" font-size="8.2" font-weight="bold" fill="#991b1b">② K ≥ S：纯 decode 稳态每在飞请求每步至少 1 token —— 违反 = ITL 断裂，直接拒启</text>
  <text x="660" y="627" font-size="8.2" fill="#475569">常见报错场景：--max-num-seqs 2048 --max-num-batched-tokens 1024（自测 T5）</text>
  <text x="660" y="642" font-size="8" fill="#64748b">默认值兜底链：usage context 分档（arg_utils）→ 无 context 时 DEFAULT_MAX_NUM_BATCHED_TOKENS = 2048</text>
</svg>
