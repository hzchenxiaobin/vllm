<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar13s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar13sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">实验 13.1 预测图：budget 分组——单步上界 · chunk 时序 · 晚到者判决</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">Qwen3-8B · H100 80G · ρ ≈ 32.4 µs/token · T_fixed ≈ 5 ms · A100 全部 ×3.5 · 负载：32 × (8192+128) @ rate 2 · 预测先填、实测后对账</text>

  <!-- ================= Panel A: single-step upper bound ================= -->
  <text x="70" y="80" font-size="13" font-weight="bold" fill="#0f172a">A · 单步时延上界 T_step ≈ ρ·B + T_fixed</text>
  <rect x="60" y="88" width="540" height="280" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- y axis -->
  <line x1="110" y1="110" x2="110" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <text x="102" y="334" text-anchor="end" font-size="8.5" fill="#64748b">0</text>
  <text x="102" y="258" text-anchor="end" font-size="8.5" fill="#64748b">200</text>
  <text x="102" y="182" text-anchor="end" font-size="8.5" fill="#64748b">400</text>
  <text x="102" y="112" text-anchor="end" font-size="8.5" fill="#64748b">600 ms</text>
  <line x1="106" y1="254" x2="580" y2="254" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="106" y1="178" x2="580" y2="178" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <text x="80" y="220" font-size="9" fill="#64748b" transform="rotate(-90 80 220)">单步时延 (ms)</text>

  <!-- bars: scale 330px = 600ms -> 0.55 px/ms; baseline y=330 -->
  <!-- B=2048: rho*B=66 -> 36px; Tfix=5 -> 3px -->
  <rect x="150" y="291" width="90" height="36" fill="#60a5fa"/>
  <rect x="150" y="288" width="90" height="3" fill="#f59e0b"/>
  <text x="195" y="281" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">71 ms</text>
  <!-- B=8192: 265 -> 146px; Tfix 3px -->
  <rect x="310" y="181" width="90" height="146" fill="#60a5fa"/>
  <rect x="310" y="178" width="90" height="3" fill="#f59e0b"/>
  <text x="355" y="171" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">270 ms</text>
  <!-- B=16384: 530 -> 292px; Tfix 3px -->
  <rect x="470" y="35" width="90" height="292" fill="#60a5fa"/>
  <rect x="470" y="32" width="90" height="3" fill="#f59e0b"/>
  <text x="515" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">535 ms</text>

  <!-- x labels -->
  <line x1="110" y1="330" x2="580" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <text x="195" y="346" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">B=2048</text>
  <text x="195" y="358" text-anchor="middle" font-size="8.5" fill="#64748b">k = 4~5</text>
  <text x="355" y="346" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">B=8192</text>
  <text x="355" y="358" text-anchor="middle" font-size="8.5" fill="#64748b">k = 2</text>
  <text x="515" y="346" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">B=16384</text>
  <text x="515" y="358" text-anchor="middle" font-size="8.5" fill="#64748b">k = 1（洪峰期两请求拼满 → 535）</text>

  <!-- legend -->
  <rect x="130" y="118" width="14" height="10" fill="#60a5fa"/><text x="150" y="127" font-size="8.5" fill="#475569">ρ·B（prefill 计算）</text>
  <rect x="260" y="118" width="14" height="10" fill="#f59e0b"/><text x="280" y="127" font-size="8.5" fill="#475569">T_fixed（每步固定开销）</text>
  <text x="130" y="150" font-size="9" fill="#334155">在飞 decode 的 ITL 上界 ≈ T_step（搭车混排步，边际计算 ≈ 0）</text>
  <text x="130" y="165" font-size="9" fill="#334155">→ 预测 ITL p99：71 / 270 / 535 ms（比例 ≈ 1 : 3.8 : 7.5）</text>
  <text x="130" y="188" font-size="9" fill="#059669" font-weight="bold">纯 decode 步（无混排）≈ 6~8 ms，三组相同</text>
  <text x="130" y="206" font-size="8.5" fill="#64748b">（它把「budget 影响 ITL」限定在混排步这一个机制上）</text>
  <text x="130" y="228" font-size="8.5" fill="#64748b">A100：ρ ≈ 114 µs/token → 241 / 941 / 1870 ms</text>

  <!-- ================= Panel B: chunk timeline ================= -->
  <text x="630" y="80" font-size="13" font-weight="bold" fill="#0f172a">B · 同一 8192-token prompt 的切块时序（prefill 总时长守恒）</text>
  <rect x="620" y="88" width="560" height="280" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- time axis: x0=650, 600ms -> 460px (0.767 px/ms) -->
  <line x1="650" y1="330" x2="1120" y2="330" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar13s)"/>
  <text x="650" y="346" font-size="8.5" fill="#64748b">0</text>
  <text x="880" y="346" font-size="8.5" fill="#64748b">300 ms</text>
  <text x="1110" y="346" font-size="8.5" fill="#64748b">600</text>

  <!-- track B=2048: 5 chunks (4 x 2017..2048 tok + tail) total ~290ms -->
  <text x="652" y="117" font-size="9.5" font-weight="bold" fill="#334155">B=2048（k=4~5）</text>
  <rect x="650" y="124" width="55" height="22" fill="#60a5fa"/><text x="677" y="139" text-anchor="middle" font-size="7.5" fill="#f1f5f9">2048</text>
  <rect x="707" y="124" width="55" height="22" fill="#60a5fa"/><text x="734" y="139" text-anchor="middle" font-size="7.5" fill="#f1f5f9">2048</text>
  <rect x="764" y="124" width="55" height="22" fill="#60a5fa"/><text x="791" y="139" text-anchor="middle" font-size="7.5" fill="#f1f5f9">2048</text>
  <rect x="821" y="124" width="55" height="22" fill="#60a5fa"/><text x="848" y="139" text-anchor="middle" font-size="7.5" fill="#f1f5f9">2048</text>
  <rect x="878" y="124" width="12" height="22" fill="#93c5fd"/>
  <text x="898" y="139" font-size="8.5" fill="#475569">总 ≈ 290 ms（5 步 × 71 ms）</text>
  <text x="650" y="158" font-size="8" fill="#64748b">每步之间 decode 搭车（d ≤ 31 时 chunk ≈ 2017）</text>

  <!-- track B=8192: 2 chunks -->
  <text x="652" y="195" font-size="9.5" font-weight="bold" fill="#334155">B=8192（k=2）</text>
  <rect x="650" y="202" width="206" height="22" fill="#60a5fa"/><text x="753" y="217" text-anchor="middle" font-size="7.5" fill="#f1f5f9">chunk 1 ≈ 8161 tok（269 ms）</text>
  <rect x="858" y="202" width="8" height="22" fill="#93c5fd"/>
  <text x="874" y="217" font-size="8.5" fill="#475569">尾 31 tok</text>
  <text x="650" y="236" font-size="8" fill="#64748b">总 ≈ 275 ms（2 步）——比 B=2048 只少付 3 次 T_fixed</text>

  <!-- track B=16384: 1 chunk -->
  <text x="652" y="273" font-size="9.5" font-weight="bold" fill="#334155">B=16384（k=1）</text>
  <rect x="650" y="280" width="207" height="22" fill="#60a5fa"/><text x="753" y="295" text-anchor="middle" font-size="7.5" fill="#f1f5f9">单步 8191 tok（270 ms）</text>
  <rect x="861" y="280" width="207" height="22" fill="#cbd5e1" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="964" y="295" text-anchor="middle" font-size="7.5" fill="#475569">洪峰期：第二个 8K 请求拼进同一步</text>
  <text x="650" y="314" font-size="8" fill="#64748b">单请求 270 ms；两请求拼满 16384 → 535 ms（Panel A 的第三根条）</text>

  <text x="630" y="382" font-size="9.5" font-weight="bold" fill="#991b1b">TTFT 预测：290 / 275 / 270 ms —— 近似守恒，差 ≈ (k−1)·T_fixed（几十 ms 量级）</text>

  <!-- ================= Panel C: latecomer experiment ================= -->
  <text x="70" y="416" font-size="13" font-weight="bold" fill="#0f172a">C · 晚到者判决实验（Day 11 §2.7⑤ 兑现）：16K 长 prompt @ t=0，256-token 短请求 @ t=+100ms</text>
  <rect x="60" y="424" width="1120" height="290" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- time axis: x0=110, 700ms -> 840px (1.2 px/ms) -->
  <line x1="110" y1="676" x2="970" y2="676" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar13s)"/>
  <text x="110" y="692" font-size="8.5" fill="#64748b">0</text>
  <text x="530" y="692" font-size="8.5" fill="#64748b">350 ms</text>
  <text x="950" y="692" font-size="8.5" fill="#64748b">700</text>
  <!-- arrival marker line at t=100ms -> x=230 -->
  <line x1="230" y1="440" x2="230" y2="676" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="230" y="436" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#ef4444">短请求到达 t=+100ms</text>

  <!-- G1: B=2048, 8 chunks x 71ms = 568ms; each chunk 85px -->
  <text x="72" y="466" font-size="9.5" font-weight="bold" fill="#334155">G1 · B=2048</text>
  <text x="72" y="479" font-size="8" fill="#64748b">长请求切 8 块</text>
  <rect x="110" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="197" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="284" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="371" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="458" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="545" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="632" y="484" width="85" height="20" fill="#60a5fa"/>
  <rect x="719" y="484" width="85" height="20" fill="#60a5fa"/><text x="761" y="498" text-anchor="middle" font-size="7.5" fill="#f1f5f9">8×71ms</text>
  <!-- short waits till 568 (x=792) then prefills 13ms -->
  <line x1="230" y1="508" x2="792" y2="508" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ar13sr)"/>
  <text x="510" y="504" font-size="8" fill="#ef4444">等待在飞 chunk 链走完（FCFS 吃满预算）</text>
  <rect x="792" y="500" width="16" height="16" fill="#059669"/>
  <text x="990" y="466" font-size="9.5" font-weight="bold" fill="#991b1b">短 TTFT ≈ 480~520 ms</text>
  <text x="990" y="480" font-size="8" fill="#64748b">＝等 8 步（490ms）+ 自身 prefill 13ms</text>

  <!-- G2: B=16384, one giant step 535ms -->
  <text x="72" y="546" font-size="9.5" font-weight="bold" fill="#334155">G2 · B=16384</text>
  <text x="72" y="559" font-size="8" fill="#64748b">长请求单巨步</text>
  <rect x="110" y="564" width="642" height="20" fill="#60a5fa"/><text x="431" y="578" text-anchor="middle" font-size="7.5" fill="#f1f5f9">16383 tok 单步（535 ms）</text>
  <line x1="230" y1="588" x2="752" y2="588" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ar13sr)"/>
  <text x="490" y="584" font-size="8" fill="#ef4444">等巨型步走完（预算被一次占满）</text>
  <rect x="752" y="580" width="16" height="16" fill="#059669"/>
  <text x="990" y="546" font-size="9.5" font-weight="bold" fill="#991b1b">短 TTFT ≈ 430~470 ms</text>
  <text x="990" y="560" font-size="8" fill="#64748b">与 G1 同量级 —— 预算速率守恒！</text>
  <text x="990" y="574" font-size="8" fill="#64748b">缩 budget 只把一次长等切成多次短等</text>

  <!-- G3: B=16384 + threshold 2048 -->
  <text x="72" y="626" font-size="9.5" font-weight="bold" fill="#334155">G3 · B=16384</text>
  <text x="72" y="639" font-size="8" fill="#64748b">+threshold 2048</text>
  <rect x="110" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="197" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="284" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="371" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="458" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="545" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="632" y="644" width="85" height="20" fill="#60a5fa"/>
  <rect x="719" y="644" width="85" height="20" fill="#60a5fa"/>
  <!-- short admitted at next step boundary 142ms (x=281), rides step 3 -->
  <rect x="284" y="632" width="85" height="10" fill="#059669"/><text x="373" y="641" font-size="7.5" fill="#059669">短请求搭车同一步</text>
  <line x1="230" y1="668" x2="281" y2="668" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ar13sr)"/>
  <text x="238" y="664" font-size="7.5" fill="#ef4444">只等 1 个步边界</text>
  <text x="990" y="626" font-size="9.5" font-weight="bold" fill="#059669">短 TTFT ≈ 100~150 ms（~4× 改善）</text>
  <text x="990" y="640" font-size="8" fill="#64748b">threshold 钳位 → 每步预算留白</text>
  <text x="990" y="654" font-size="8" fill="#64748b">→ 短请求在下一调度边界即被搭车</text>

  <!-- conclusion band -->
  <rect x="76" y="702" width="1090" height="4" fill="#0f172a"/>
  <text x="76" y="722" font-size="9.5" font-weight="bold" fill="#0f172a">结论：budget 决定「每步总量」（被动），long_prefill_token_threshold 决定「长请求每步最多吃多少」（主动留白）—— 晚到者的公平靠后者；代价仅 + (k−1)·T_fixed ≈ 35 ms（长请求自身 TTFT）</text>
  <text x="76" y="738" font-size="8.5" fill="#64748b">config/scheduler.py:59 定义、:53-57 docstring 明示动机（"allow shorter prompts to jump the queue"）· 默认 0 = 不钳 · 预测数字为量级演示，以实测为准</text>
</svg>
