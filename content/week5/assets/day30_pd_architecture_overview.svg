<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C3E50"/>
    </marker>
    <marker id="a3r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
    <marker id="a3g" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27AE60"/>
    </marker>
    <marker id="a3p" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8E44ED"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1e3a5f">图 1｜P/D 分离系统全景：请求网 · KV 数据网 · 元数据网（三张网）</text>

  <!-- ============ client & router ============ -->
  <rect x="60" y="52" width="150" height="36" rx="6" fill="#F4F6F7" stroke="#7F8C8D"/>
  <text x="135" y="75" font-size="12" fill="#2C3E50" text-anchor="middle" font-weight="bold">客户端（流式）</text>

  <rect x="380" y="46" width="200" height="48" rx="8" fill="#F4ECF7" stroke="#8E44ED" stroke-width="2"/>
  <text x="480" y="66" font-size="14" font-weight="bold" fill="#6C3483" text-anchor="middle">Router</text>
  <text x="480" y="84" font-size="10" fill="#6C3483" text-anchor="middle">① 选 prefill ④ 派 decode（带 KV 位置）</text>

  <line x1="210" y1="70" x2="378" y2="70" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="294" y="62" font-size="10" fill="#2C3E50" text-anchor="middle">① 请求</text>

  <path d="M 382 62 L 250 62 L 250 40 L 138 40 L 138 50" fill="none" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a3g)"/>
  <text x="250" y="30" font-size="10" fill="#27AE60" text-anchor="middle">③⑤ token 流（首 token 来自 prefill，其余来自 decode）</text>

  <!-- ============ prefill node ============ -->
  <rect x="70" y="150" width="380" height="220" rx="8" fill="#FEF9F2" stroke="#E67E22" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="260" y="174" font-size="14" font-weight="bold" fill="#B9770E" text-anchor="middle">节点 A · Prefill 实例（vLLM V1, kv_producer）</text>
  <text x="260" y="190" font-size="10" fill="#9C640C" text-anchor="middle">同节点 NVLink 域（HCCS 域的对应物）</text>

  <g>
    <rect x="95"  y="205" width="80" height="58" rx="4" fill="#FDEBD0" stroke="#E67E22"/>
    <rect x="185" y="205" width="80" height="58" rx="4" fill="#FDEBD0" stroke="#E67E22"/>
    <rect x="275" y="205" width="80" height="58" rx="4" fill="#FDEBD0" stroke="#E67E22"/>
    <rect x="365" y="205" width="70" height="58" rx="4" fill="#F4F6F7" stroke="#BDC3C7"/>
    <text x="135" y="228" font-size="11" fill="#B9770E" text-anchor="middle">GPU0</text>
    <text x="135" y="248" font-size="10" fill="#B9770E" text-anchor="middle">prefill</text>
    <text x="225" y="228" font-size="11" fill="#B9770E" text-anchor="middle">GPU1</text>
    <text x="225" y="248" font-size="10" fill="#B9770E" text-anchor="middle">prefill</text>
    <text x="315" y="228" font-size="11" fill="#B9770E" text-anchor="middle">GPU2</text>
    <text x="315" y="248" font-size="10" fill="#B9770E" text-anchor="middle">prefill</text>
    <text x="400" y="228" font-size="11" fill="#7F8C8D" text-anchor="middle">…</text>
  </g>
  <text x="260" y="290" font-size="10" fill="#9C640C" text-anchor="middle">大 chunk 奔满 MFU · 逐层产出 KV（②）</text>

  <!-- layer strip: per-layer KV production -->
  <g>
    <rect x="100" y="304" width="46" height="22" fill="#F5B041" opacity="0.85"/>
    <rect x="150" y="304" width="46" height="22" fill="#F5B041" opacity="0.7"/>
    <rect x="200" y="304" width="46" height="22" fill="#F5B041" opacity="0.55"/>
    <rect x="250" y="304" width="46" height="22" fill="#F5B041" opacity="0.4"/>
    <rect x="300" y="304" width="46" height="22" fill="#F5B041" opacity="0.25"/>
    <rect x="350" y="304" width="46" height="22" fill="#F5B041" opacity="0.15"/>
    <text x="252" y="346" font-size="9" fill="#9C640C" text-anchor="middle">层 0 … 层 L-1：每层算完即产出该层 KV —— 分层流水传输的"货源"</text>
  </g>

  <!-- ============ decode node ============ -->
  <rect x="510" y="150" width="380" height="220" rx="8" fill="#FEF9F2" stroke="#2E86C1" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="700" y="174" font-size="14" font-weight="bold" fill="#1A5276" text-anchor="middle">节点 B · Decode 实例（vLLM V1, kv_consumer）</text>
  <text x="700" y="190" font-size="10" fill="#1A5276" text-anchor="middle">大 KV 池 = 并发资产（Day 15-16 的 block pool）</text>

  <g>
    <rect x="535" y="205" width="80" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="625" y="205" width="80" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="715" y="205" width="80" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="805" y="205" width="70" height="58" rx="4" fill="#F4F6F7" stroke="#BDC3C7"/>
    <text x="575" y="228" font-size="11" fill="#1A5276" text-anchor="middle">GPU0</text>
    <text x="575" y="248" font-size="10" fill="#1A5276" text-anchor="middle">decode</text>
    <text x="665" y="228" font-size="11" fill="#1A5276" text-anchor="middle">GPU1</text>
    <text x="665" y="248" font-size="10" fill="#1A5276" text-anchor="middle">decode</text>
    <text x="755" y="228" font-size="11" fill="#1A5276" text-anchor="middle">GPU2</text>
    <text x="755" y="248" font-size="10" fill="#1A5276" text-anchor="middle">decode</text>
    <text x="840" y="228" font-size="11" fill="#7F8C8D" text-anchor="middle">…</text>
  </g>
  <text x="700" y="290" font-size="10" fill="#1A5276" text-anchor="middle">稳定 batch + CUDA Graph（Day 18 收益兑现）</text>

  <rect x="545" y="304" width="330" height="30" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-dasharray="4 3"/>
  <text x="710" y="323" font-size="10" fill="#1A5276" text-anchor="middle">WAITING_FOR_REMOTE_KVS：收齐前不进 running batch（④）</text>

  <!-- ============ router <-> nodes request paths ============ -->
  <path d="M 430 94 L 430 120 L 260 120 L 260 148" fill="none" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="330" y="112" font-size="10" fill="#2C3E50">② 派发 prefill</text>
  <path d="M 530 94 L 530 120 L 700 120 L 700 148" fill="none" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="640" y="112" font-size="10" fill="#2C3E50">④ 派发 decode</text>

  <!-- ============ KV data network ============ -->
  <rect x="70" y="400" width="820" height="86" rx="10" fill="#FDEDEC" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="480" y="420" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">KV 数据网（大块、连续、怕带宽）</text>

  <line x1="260" y1="370" x2="260" y2="440" stroke="#C0392B" stroke-width="4" marker-end="url(#a3r)"/>
  <line x1="700" y1="440" x2="700" y2="372" stroke="#C0392B" stroke-width="4" marker-end="url(#a3r)"/>

  <!-- RDMA network cloud in middle -->
  <rect x="360" y="430" width="240" height="40" rx="20" fill="#FADBD8" stroke="#C0392B"/>
  <text x="480" y="447" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">RDMA / IB 交换机</text>
  <text x="480" y="462" font-size="9" fill="#C0392B" text-anchor="middle">GPUDirect · 200/400 Gb（25-50 GB/s）</text>
  <line x1="260" y1="445" x2="358" y2="448" stroke="#C0392B" stroke-width="4" marker-end="url(#a3r)"/>
  <line x1="600" y1="448" x2="698" y2="445" stroke="#C0392B" stroke-width="4" marker-end="url(#a3r)"/>
  <text x="480" y="496" font-size="10" fill="#C0392B" text-anchor="middle">③ KV block 直传（逐层流水隐藏，§3.3）—— 干扰的新形态：prefill 产 KV 速率 &gt; 链路排水速率 ⇒ decode 侧堆积</text>

  <!-- ============ same-node variant ============ -->
  <rect x="70" y="510" width="360" height="120" rx="8" fill="#F4F6F7" stroke="#7F8C8D"/>
  <text x="250" y="532" font-size="12" font-weight="bold" fill="#2C3E50" text-anchor="middle">变体：同节点分离（NVLink 900 GB/s）</text>
  <rect x="105" y="548" width="110" height="46" rx="4" fill="#FDEBD0" stroke="#E67E22"/>
  <text x="160" y="568" font-size="10" fill="#B9770E" text-anchor="middle">prefill GPU</text>
  <text x="160" y="583" font-size="9" fill="#B9770E" text-anchor="middle">（独立进程）</text>
  <rect x="285" y="548" width="110" height="46" rx="4" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="340" y="568" font-size="10" fill="#1A5276" text-anchor="middle">decode GPU</text>
  <text x="340" y="583" font-size="9" fill="#1A5276" text-anchor="middle">（独立进程）</text>
  <line x1="217" y1="571" x2="283" y2="571" stroke="#27AE60" stroke-width="5" marker-end="url(#a3g)"/>
  <text x="250" y="562" font-size="9" fill="#1E8449" text-anchor="middle" font-weight="bold">KV 0.3-3 ms</text>
  <text x="250" y="608" font-size="9" fill="#7F8C8D" text-anchor="middle">80% 干扰消除收益 / 20% 复杂度；但 P:D 配比锁死在 GPU 粒度</text>

  <!-- ============ metadata network ============ -->
  <rect x="470" y="510" width="440" height="120" rx="8" fill="#EAF7F0" stroke="#16A085" stroke-width="1.5"/>
  <text x="690" y="532" font-size="12" font-weight="bold" fill="#0E6655" text-anchor="middle">元数据网（极小消息、极高频次、怕延迟）</text>
  <g font-size="10" fill="#0E6655">
    <text x="490" y="556">• block 清单对账：请求 R 的 KV 在哪些 block id（⑥）</text>
    <text x="490" y="576">• 传输完成通知：decode 侧"收齐了"才放行（握手）</text>
    <text x="490" y="596">• 承载组件：etcd / Redis / NATS（Dynamo）· scheduler 插件（llm-d）</text>
    <text x="490" y="616">• 账本丢失 = KV 泄漏：双向清理是必须的收尾动作</text>
  </g>
  <path d="M 260 486 L 260 508" fill="none" stroke="#16A085" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#a3)"/>
  <path d="M 700 486 L 700 508" fill="none" stroke="#16A085" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#a3)"/>

  <!-- ============ bottom strip ============ -->
  <rect x="30" y="650" width="900" height="34" rx="6" fill="#1e3a5f"/>
  <text x="480" y="671" font-size="12" fill="#FFFFFF" text-anchor="middle">三张网各自独立扩容：请求网怕延迟（路由 CPU）、KV 网怕带宽（NIC/NVLink）、元数据网怕延迟与一致性（协调服务）——分离 = 把调度器内部的耦合搬到基础设施层。</text>
</svg>
