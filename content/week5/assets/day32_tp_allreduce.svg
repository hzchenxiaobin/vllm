<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C3E50"/>
    </marker>
    <marker id="a1o" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#E67E22"/>
    </marker>
    <marker id="a1r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="740" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1e3a5f">图 1｜TP：Megatron 式切分、每层 2 次 all-reduce 与 NVLink 拓扑约束</text>

  <!-- ============ LEFT: layer sharding dataflow ============ -->
  <rect x="20" y="52" width="540" height="610" rx="8" fill="#F8FAFC" stroke="#BDC3C7"/>
  <text x="290" y="76" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">一个 Transformer 层（TP=2 示意，p 卡同理）</text>

  <!-- input X replicated -->
  <rect x="150" y="90" width="280" height="30" rx="5" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="290" y="110" font-size="11" fill="#2E86C1" text-anchor="middle">输入 X（all-reduce 后每卡完整复制）</text>

  <!-- GPU lanes -->
  <rect x="30" y="132" width="240" height="500" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/>
  <text x="150" y="154" font-size="12" font-weight="bold" fill="#9A7D0A" text-anchor="middle">GPU 0</text>
  <rect x="310" y="132" width="240" height="500" rx="8" fill="#FEF9E7" stroke="#B7950B" stroke-width="1.5"/>
  <text x="430" y="154" font-size="12" font-weight="bold" fill="#9A7D0A" text-anchor="middle">GPU 1</text>

  <!-- QKV col-parallel -->
  <line x1="230" y1="120" x2="150" y2="172" stroke="#2C3E50" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="350" y1="120" x2="430" y2="172" stroke="#2C3E50" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="50" y="168" width="200" height="44" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="150" y="187" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">QKV（column-parallel）</text>
  <text x="150" y="203" font-size="9.5" fill="#1E8449" text-anchor="middle">按 attention head 切：heads 0..h/2-1</text>
  <rect x="330" y="168" width="200" height="44" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="430" y="187" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">QKV（column-parallel）</text>
  <text x="430" y="203" font-size="9.5" fill="#1E8449" text-anchor="middle">按 attention head 切：heads h/2..h-1</text>

  <rect x="50" y="228" width="200" height="36" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="150" y="251" font-size="11" fill="#1E8449" text-anchor="middle">Attention（本卡 heads）</text>
  <rect x="330" y="228" width="200" height="36" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="430" y="251" font-size="11" fill="#1E8449" text-anchor="middle">Attention（本卡 heads）</text>

  <!-- o_proj row-parallel -->
  <rect x="50" y="280" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="150" y="297" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">o_proj（row-parallel）</text>
  <text x="150" y="312" font-size="9.5" fill="#1E8449" text-anchor="middle">完整输出维 × 部分输入 → 部分和</text>
  <rect x="330" y="280" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="430" y="297" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">o_proj（row-parallel）</text>
  <text x="430" y="312" font-size="9.5" fill="#1E8449" text-anchor="middle">完整输出维 × 部分输入 → 部分和</text>

  <!-- all-reduce 1 -->
  <line x1="150" y1="320" x2="150" y2="352" stroke="#E67E22" stroke-width="1.6"/>
  <line x1="430" y1="320" x2="430" y2="352" stroke="#E67E22" stroke-width="1.6"/>
  <line x1="150" y1="352" x2="430" y2="352" stroke="#E67E22" stroke-width="2.2" marker-end="url(#a1o)"/>
  <line x1="430" y1="352" x2="150" y2="352" stroke="#E67E22" stroke-width="2.2" marker-end="url(#a1o)"/>
  <rect x="212" y="338" width="156" height="26" rx="13" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
  <text x="290" y="356" font-size="12" font-weight="bold" fill="#B9770E" text-anchor="middle">all-reduce ①</text>

  <!-- MLP -->
  <rect x="50" y="392" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="150" y="409" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">gate / up（column-parallel）</text>
  <text x="150" y="424" font-size="9.5" fill="#1E8449" text-anchor="middle">按中间维 I 切</text>
  <rect x="330" y="392" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="430" y="409" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">gate / up（column-parallel）</text>
  <text x="430" y="424" font-size="9.5" fill="#1E8449" text-anchor="middle">按中间维 I 切</text>

  <rect x="50" y="448" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="150" y="465" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">down（row-parallel）</text>
  <text x="150" y="480" font-size="9.5" fill="#1E8449" text-anchor="middle">部分输入 × 完整输出维 → 部分和</text>
  <rect x="330" y="448" width="200" height="40" rx="5" fill="#EAF7F1" stroke="#27AE60"/>
  <text x="430" y="465" font-size="11" font-weight="bold" fill="#1E8449" text-anchor="middle">down（row-parallel）</text>
  <text x="430" y="480" font-size="9.5" fill="#1E8449" text-anchor="middle">部分输入 × 完整输出维 → 部分和</text>

  <!-- all-reduce 2 -->
  <line x1="150" y1="488" x2="150" y2="520" stroke="#E67E22" stroke-width="1.6"/>
  <line x1="430" y1="488" x2="430" y2="520" stroke="#E67E22" stroke-width="1.6"/>
  <line x1="150" y1="520" x2="430" y2="520" stroke="#E67E22" stroke-width="2.2" marker-end="url(#a1o)"/>
  <line x1="430" y1="520" x2="150" y2="520" stroke="#E67E22" stroke-width="2.2" marker-end="url(#a1o)"/>
  <rect x="212" y="506" width="156" height="26" rx="13" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
  <text x="290" y="524" font-size="12" font-weight="bold" fill="#B9770E" text-anchor="middle">all-reduce ②</text>

  <!-- output -->
  <rect x="130" y="548" width="320" height="30" rx="5" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="290" y="568" font-size="11" fill="#2E86C1" text-anchor="middle">输出（完整，复制到每卡）→ 进下一层</text>

  <text x="290" y="606" font-size="10.5" fill="#7F8C8D" text-anchor="middle">col 与 row 配对：中间无需 all-gather；部分和必须加全 → 每层恰好 2 次 all-reduce</text>
  <text x="290" y="626" font-size="10.5" fill="#7F8C8D" text-anchor="middle">每 step 合计 2L 次（70B：160 次），全部在关键路径上串行</text>
  <text x="290" y="646" font-size="10.5" fill="#B9770E" text-anchor="middle" font-weight="bold">每次消息 V = B·S·H·b；ring all-reduce 每 GPU 搬 2(p−1)/p · V</text>

  <!-- ============ RIGHT: topology ============ -->
  <rect x="580" y="52" width="360" height="300" rx="8" fill="#F4ECF7" stroke="#8E44ED" stroke-width="1.5"/>
  <text x="760" y="76" font-size="13" font-weight="bold" fill="#6C3483" text-anchor="middle">拓扑约束：TP 住在 NVSwitch 域内</text>

  <!-- node box with 8 GPUs + NVSwitch -->
  <rect x="610" y="92" width="300" height="180" rx="8" fill="#FFFFFF" stroke="#8E44ED"/>
  <text x="760" y="110" font-size="10.5" fill="#6C3483" text-anchor="middle">单节点（NVSwitch 全互联，900 GB/s）</text>

  <rect x="630" y="122" width="56" height="34" rx="4" fill="#FEF9E7" stroke="#B7950B"/>
  <text x="658" y="143" font-size="10" text-anchor="middle" fill="#9A7D0A">GPU0</text>
  <rect x="694" y="122" width="56" height="34" rx="4" fill="#FEF9E7" stroke="#B7950B"/>
  <text x="722" y="143" font-size="10" text-anchor="middle" fill="#9A7D0A">GPU1</text>
  <rect x="758" y="122" width="56" height="34" rx="4" fill="#FEF9E7" stroke="#B7950B"/>
  <text x="786" y="143" font-size="10" text-anchor="middle" fill="#9A7D0A">…</text>
  <rect x="822" y="122" width="56" height="34" rx="4" fill="#FEF9E7" stroke="#B7950B"/>
  <text x="850" y="143" font-size="10" text-anchor="middle" fill="#9A7D0A">GPU7</text>

  <rect x="630" y="216" width="248" height="30" rx="4" fill="#E8DAEF" stroke="#8E44ED"/>
  <text x="754" y="236" font-size="11" font-weight="bold" fill="#6C3483" text-anchor="middle">NVSwitch</text>
  <line x1="658" y1="156" x2="690" y2="216" stroke="#8E44ED" stroke-width="1.2"/>
  <line x1="722" y1="156" x2="730" y2="216" stroke="#8E44ED" stroke-width="1.2"/>
  <line x1="786" y1="156" x2="778" y2="216" stroke="#8E44ED" stroke-width="1.2"/>
  <line x1="850" y1="156" x2="818" y2="216" stroke="#8E44ED" stroke-width="1.2"/>

  <text x="760" y="288" font-size="10.5" fill="#6C3483" text-anchor="middle">TP 组 ≤ 8 卡（一个 NVSwitch 域）✅</text>
  <text x="760" y="330" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="bold">TP 跨域 = all-reduce 走 50 GB/s 的 IB → ρ ×18，decode 被通信淹没 ❌</text>

  <!-- bandwidth ladder -->
  <rect x="580" y="372" width="360" height="290" rx="8" fill="#FEF9F2" stroke="#E67E22" stroke-width="1.5"/>
  <text x="760" y="396" font-size="13" font-weight="bold" fill="#B9770E" text-anchor="middle">带宽阶梯（H100 SXM 口径）</text>

  <g font-size="11" fill="#2C3E50">
    <rect x="600" y="412" width="320" height="24" fill="#2E86C1" opacity="0.9"/>
    <text x="610" y="429" fill="#FFFFFF" font-weight="bold">HBM 3.35 TB/s</text>
    <text x="912" y="429" fill="#2C3E50" text-anchor="end">1×</text>

    <rect x="600" y="444" width="86" height="24" fill="#8E44ED" opacity="0.9"/>
    <text x="694" y="461">NVLink + NVSwitch（机内）</text>
    <text x="912" y="461" text-anchor="end">0.27×　900 GB/s</text>

    <rect x="600" y="476" width="8" height="24" fill="#E67E22" opacity="0.9"/>
    <text x="616" y="493">PCIe 5.0 x16（卡间）</text>
    <text x="912" y="493" text-anchor="end">0.02×　64 GB/s</text>

    <rect x="600" y="508" width="6" height="24" fill="#C0392B" opacity="0.9"/>
    <text x="614" y="525">IB NDR 400G（跨机/卡）</text>
    <text x="912" y="525" text-anchor="end">0.015×　50 GB/s</text>

    <rect x="600" y="540" width="4" height="24" fill="#C0392B" opacity="0.7"/>
    <text x="612" y="557">RoCE 200G（跨机，昇腾集群同款）</text>
    <text x="912" y="557" text-anchor="end">0.0075×　25 GB/s</text>
  </g>

  <rect x="600" y="580" width="320" height="66" rx="6" fill="#FDEDEC" stroke="#C0392B"/>
  <text x="760" y="602" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">工程铁律</text>
  <text x="760" y="620" font-size="10.5" fill="#C0392B" text-anchor="middle">TP 保持单 NVSwitch 域内（≤8 卡）</text>
  <text x="760" y="636" font-size="10.5" fill="#C0392B" text-anchor="middle">跨机扩展用 PP / EP + 多实例路由</text>
</svg>
