<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="c3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C3E50"/>
    </marker>
    <marker id="c3r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
    <marker id="c3g" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27AE60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1e3a5f">图 3｜三个工业系统：同一问题空间，三种"一等公民"</text>

  <!-- ============ col 1: Mooncake ============ -->
  <rect x="30" y="56" width="290" height="540" rx="8" fill="#FEF9F2" stroke="#E67E22" stroke-width="2"/>
  <text x="175" y="82" font-size="15" font-weight="bold" fill="#B9770E" text-anchor="middle">Mooncake（Moonshot/Kimi）</text>
  <text x="175" y="100" font-size="11" fill="#B9770E" text-anchor="middle">一等公民：KV cache</text>

  <rect x="55" y="115" width="240" height="52" rx="6" fill="#FDEBD0" stroke="#E67E22"/>
  <text x="175" y="135" font-size="12" font-weight="bold" fill="#B9770E" text-anchor="middle">Conductor（全局调度器）</text>
  <text x="175" y="153" font-size="9" fill="#9C640C" text-anchor="middle">cache-aware + 负载预测器（预测 prefill/decode 长度）</text>

  <rect x="55" y="182" width="110" height="40" rx="6" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="110" y="200" font-size="10" fill="#1A5276" text-anchor="middle">prefill 池</text>
  <text x="110" y="214" font-size="8" fill="#1A5276" text-anchor="middle">高算力实例</text>
  <rect x="185" y="182" width="110" height="40" rx="6" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="240" y="200" font-size="10" fill="#1A5276" text-anchor="middle">decode 池</text>
  <text x="240" y="214" font-size="8" fill="#1A5276" text-anchor="middle">大显存实例</text>

  <rect x="55" y="238" width="240" height="66" rx="6" fill="#F4ECF7" stroke="#8E44ED"/>
  <text x="175" y="258" font-size="12" font-weight="bold" fill="#6C3483" text-anchor="middle">全局 KV 池（分层）</text>
  <text x="175" y="274" font-size="9" fill="#6C3483" text-anchor="middle">集群空闲 DRAM + SSD 聚合</text>
  <text x="175" y="290" font-size="9" fill="#6C3483" text-anchor="middle">命中 ⇒ 直接装配 KV，跳过整段 prefill</text>

  <rect x="55" y="318" width="240" height="46" rx="6" fill="#FDEDEC" stroke="#C0392B"/>
  <text x="175" y="336" font-size="11" font-weight="bold" fill="#C0392B" text-anchor="middle">自研 Transfer Engine</text>
  <text x="175" y="352" font-size="9" fill="#C0392B" text-anchor="middle">RDMA 分块传输 + 轮询完成 + 拓扑感知限速</text>

  <g font-size="10" fill="#2C3E50">
    <text x="55" y="388">• 中心化 Conductor：全局最优 vs 单点复杂度</text>
    <text x="55" y="408">• 预测式调度：依赖负载重复性（对话/Agent）</text>
    <text x="55" y="428">• 前缀命中可"免 prefill"——缓存经济学</text>
    <text x="55" y="448">• 论文口径：真实负载 SLO 内吞吐 ~+75%</text>
    <text x="55" y="468">• 与 vLLM：vllm-mooncake connector</text>
  </g>
  <rect x="55" y="486" width="240" height="40" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="175" y="504" font-size="9" fill="#2C3E50" text-anchor="middle">适合：超大规模 + 高重复前缀</text>
  <text x="175" y="518" font-size="9" fill="#2C3E50" text-anchor="middle">（Kimi 生产环境自用反推其负载画像）</text>

  <!-- ============ col 2: Dynamo ============ -->
  <rect x="345" y="56" width="290" height="540" rx="8" fill="#FDEDEC" stroke="#C0392B" stroke-width="2"/>
  <text x="490" y="82" font-size="15" font-weight="bold" fill="#C0392B" text-anchor="middle">NVIDIA Dynamo</text>
  <text x="490" y="100" font-size="11" fill="#C0392B" text-anchor="middle">一等公民：可插拔推理基础设施</text>

  <rect x="370" y="115" width="240" height="52" rx="6" fill="#FADBD8" stroke="#C0392B"/>
  <text x="490" y="135" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">Layer 1：请求调度层</text>
  <text x="490" y="153" font-size="9" fill="#C0392B" text-anchor="middle">HTTP 前端 + KV 感知路由（选 worker 策略）</text>

  <g>
    <rect x="370" y="182" width="112" height="40" rx="6" fill="#EBF5FB" stroke="#2E86C1"/>
    <text x="426" y="200" font-size="9" fill="#1A5276" text-anchor="middle">etcd：元数据/状态</text>
    <text x="426" y="214" font-size="8" fill="#1A5276" text-anchor="middle">账本</text>
    <rect x="498" y="182" width="112" height="40" rx="6" fill="#EBF5FB" stroke="#2E86C1"/>
    <text x="554" y="200" font-size="9" fill="#1A5276" text-anchor="middle">NATS：消息总线</text>
    <text x="554" y="214" font-size="8" fill="#1A5276" text-anchor="middle">请求派发</text>
  </g>

  <rect x="370" y="238" width="240" height="46" rx="6" fill="#F4ECF7" stroke="#8E44ED"/>
  <text x="490" y="256" font-size="11" font-weight="bold" fill="#6C3483" text-anchor="middle">Layer 2：GPU worker 池</text>
  <text x="490" y="272" font-size="9" fill="#6C3483" text-anchor="middle">引擎可插拔：vLLM / TensorRT-LLM / …</text>

  <rect x="370" y="298" width="240" height="66" rx="6" fill="#FDEBD0" stroke="#E67E22"/>
  <text x="490" y="318" font-size="11" font-weight="bold" fill="#B9770E" text-anchor="middle">NIXL：传输抽象层</text>
  <text x="490" y="334" font-size="9" fill="#B9770E" text-anchor="middle">TCP / UCX / GPUDirect 多后端</text>
  <text x="490" y="350" font-size="9" fill="#B9770E" text-anchor="middle">（vLLM 跨节点 connector 同源）</text>

  <g font-size="10" fill="#2C3E50">
    <text x="370" y="388">• KV 分层下沉：decode 中 GPU→CPU（layer-wise）</text>
    <text x="370" y="408">• worker 故障：用 CPU 副本迁移请求，非 re-prefill</text>
    <text x="370" y="428">• 单/多节点统一（NVL72 域内 + 跨节点）</text>
    <text x="370" y="448">• 消除 decode 侧 idle pinging（GB200 上数量级收益）</text>
    <text x="370" y="468">• 代价：组件多（etcd/NATS/router），运维面大</text>
  </g>
  <rect x="370" y="486" width="240" height="40" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="490" y="504" font-size="9" fill="#2C3E50" text-anchor="middle">适合：NVIDIA 全栈、异构引擎混部</text>
  <text x="490" y="518" font-size="9" fill="#2C3E50" text-anchor="middle">数据中心级"推理 OS"定位</text>

  <!-- ============ col 3: llm-d ============ -->
  <rect x="660" y="56" width="290" height="540" rx="8" fill="#EAF2F8" stroke="#2E86C1" stroke-width="2"/>
  <text x="805" y="82" font-size="15" font-weight="bold" fill="#1A5276" text-anchor="middle">llm-d（Red Hat 牵头）</text>
  <text x="805" y="100" font-size="11" fill="#1A5276" text-anchor="middle">一等公民：Kubernetes 生态</text>

  <rect x="685" y="115" width="240" height="52" rx="6" fill="#D6EAF8" stroke="#2E86C1"/>
  <text x="805" y="135" font-size="12" font-weight="bold" fill="#1A5276" text-anchor="middle">Gateway API 网关</text>
  <text x="805" y="153" font-size="9" fill="#1A5276" text-anchor="middle">prefix-aware 路由（流式/多协议）</text>

  <rect x="685" y="182" width="240" height="52" rx="6" fill="#D6EAF8" stroke="#2E86C1"/>
  <text x="805" y="202" font-size="12" font-weight="bold" fill="#1A5276" text-anchor="middle">K8s scheduler 插件</text>
  <text x="805" y="220" font-size="9" fill="#1A5276" text-anchor="middle">按 KV 缓存状态对 Pod 打分/过滤</text>

  <rect x="685" y="248" width="240" height="52" rx="6" fill="#EBF5FB" stroke="#2E86C1"/>
  <text x="805" y="268" font-size="11" font-weight="bold" fill="#1A5276" text-anchor="middle">vLLM Pod（P/D 分离）</text>
  <text x="805" y="286" font-size="9" fill="#1A5276" text-anchor="middle">KV connector 直连（NIXL 等）</text>

  <rect x="685" y="314" width="240" height="50" rx="6" fill="#E9F7EF" stroke="#27AE60"/>
  <text x="805" y="332" font-size="10" font-weight="bold" fill="#1E8449" text-anchor="middle">去中心化 KV 目录</text>
  <text x="805" y="348" font-size="9" fill="#1E8449" text-anchor="middle">Pod 广播本地前缀状态，网关实时查询</text>

  <g font-size="10" fill="#2C3E50">
    <text x="685" y="388">• 无中心 Conductor：发布/订阅 + 最终一致</text>
    <text x="685" y="408">• 运维 = K8s 声明式（HPA/多租户/自愈白拿）</text>
    <text x="685" y="428">• 分层缓存接 LMCache（GPU→CPU→disk）</text>
    <text x="685" y="448">• 控制面延迟受 K8s 组件制约</text>
    <text x="685" y="468">• 快速演进中（2025 发布，以官方文档为准）</text>
  </g>
  <rect x="685" y="486" width="240" height="40" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="805" y="504" font-size="9" fill="#2C3E50" text-anchor="middle">适合：云原生团队、多租户 K8s 集群</text>
  <text x="805" y="518" font-size="9" fill="#2C3E50" text-anchor="middle">"控制面就是 K8s 本身"</text>

  <!-- arrows between layers in each col -->
  <line x1="175" y1="167" x2="175" y2="180" stroke="#2C3E50" stroke-width="1" marker-end="url(#c3)"/>
  <line x1="490" y1="167" x2="490" y2="180" stroke="#2C3E50" stroke-width="1" marker-end="url(#c3)"/>
  <line x1="805" y1="167" x2="805" y2="180" stroke="#2C3E50" stroke-width="1" marker-end="url(#c3)"/>

  <!-- ============ bottom: common ground ============ -->
  <rect x="30" y="612" width="900" height="70" rx="6" fill="#1e3a5f"/>
  <text x="480" y="636" font-size="12" fill="#FFFFFF" text-anchor="middle">三个共识（2024-2025 业界收敛）：① P/D 分离 + 独立容量配比　② KV 感知路由（把缓存命中率变成调度输入）　③ KV 分层存储（GPU→CPU→SSD）</text>
  <text x="480" y="660" font-size="11" fill="#AED6F1" text-anchor="middle">分歧只在"谁来当大脑"：Mooncake=自研中心调度　Dynamo=etcd+NATS 编排　llm-d=K8s 原生——选型 = 选你已经会运维的那套控制面。</text>
</svg>
