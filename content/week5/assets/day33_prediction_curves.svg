<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d33p" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C3E50"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#FFFFFF"/>
  <text x="30" y="30" font-size="18" font-weight="bold" fill="#1e3a5f">图 2｜预测先行：TP=1 vs TP=2 两张对照曲线（Qwen3-8B · H100 · 量级示意，实测请填自己的数）</text>
  <text x="30" y="50" font-size="10" fill="#7F8C8D">曲线由 Day 32 §3.3 公式 T_step(p) = W/(p·BW_hbm) + 带宽项 + 2L·t_ar 生成；虚线是"理想 2×"参照——实测与虚线的差距就是通信税</text>

  <!-- ============ Panel A: throughput ============ -->
  <text x="270" y="82" font-size="13" font-weight="bold" fill="#1e3a5f" text-anchor="middle">(a) 聚合吞吐 vs 并发：TP2 永远够不到 2×TP1</text>

  <!-- axes -->
  <line x1="80" y1="380" x2="470" y2="380" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#d33p)"/>
  <line x1="80" y1="380" x2="80" y2="90" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#d33p)"/>

  <!-- y gridlines + labels (tok/s) -->
  <line x1="80" y1="318" x2="470" y2="318" stroke="#E5E8E8" stroke-width="1"/>
  <line x1="80" y1="256" x2="470" y2="256" stroke="#E5E8E8" stroke-width="1"/>
  <line x1="80" y1="194" x2="470" y2="194" stroke="#E5E8E8" stroke-width="1"/>
  <line x1="80" y1="132" x2="470" y2="132" stroke="#E5E8E8" stroke-width="1"/>
  <text x="72" y="384" font-size="9" fill="#566573" text-anchor="end">0</text>
  <text x="72" y="322" font-size="9" fill="#566573" text-anchor="end">10k</text>
  <text x="72" y="260" font-size="9" fill="#566573" text-anchor="end">20k</text>
  <text x="72" y="198" font-size="9" fill="#566573" text-anchor="end">30k</text>
  <text x="72" y="136" font-size="9" fill="#566573" text-anchor="end">40k</text>
  <text x="52" y="240" font-size="10" fill="#2C3E50" text-anchor="middle" transform="rotate(-90 52 240)">output tok/s</text>

  <!-- x labels -->
  <text x="100" y="396" font-size="9" fill="#566573" text-anchor="middle">1</text>
  <text x="185" y="396" font-size="9" fill="#566573" text-anchor="middle">4</text>
  <text x="270" y="396" font-size="9" fill="#566573" text-anchor="middle">16</text>
  <text x="355" y="396" font-size="9" fill="#566573" text-anchor="middle">64</text>
  <text x="440" y="396" font-size="9" fill="#566573" text-anchor="middle">256</text>
  <text x="275" y="414" font-size="10" fill="#2C3E50" text-anchor="middle">并发 C（--max-concurrency）</text>

  <!-- ideal 2x dashed -->
  <polyline points="100,378 185,373 270,353 355,280 440,106" fill="none" stroke="#B03A2E" stroke-width="1.6" stroke-dasharray="7,5"/>
  <!-- TP1 -->
  <polyline points="100,379 185,376 270,366 355,330 440,221" fill="none" stroke="#2E86C1" stroke-width="2.4"/>
  <!-- TP2 -->
  <polyline points="100,379 185,374 270,358 355,303 440,152" fill="none" stroke="#E67E22" stroke-width="2.4"/>

  <!-- points -->
  <circle cx="440" cy="221" r="3.5" fill="#2E86C1"/>
  <circle cx="440" cy="152" r="3.5" fill="#E67E22"/>
  <circle cx="440" cy="106" r="3.5" fill="#B03A2E"/>

  <!-- comm tax bracket -->
  <line x1="452" y1="106" x2="452" y2="152" stroke="#C0392B" stroke-width="1.4"/>
  <text x="460" y="132" font-size="9" fill="#C0392B">通信税</text>
  <text x="460" y="144" font-size="9" fill="#C0392B">≈30%</text>

  <!-- annotation -->
  <text x="300" y="112" font-size="9" fill="#B03A2E" text-anchor="middle">理想 2×TP1（线性扩展，永远够不到）</text>
  <text x="215" y="345" font-size="9" fill="#E67E22">1×TP2 ≈ 1.4×TP1</text>
  <text x="300" y="352" font-size="9" fill="#2E86C1" text-anchor="middle">1×TP1 基线</text>
  <rect x="96" y="98" width="130" height="26" rx="4" fill="#FEF9E7" stroke="#F39C12" stroke-width="0.8"/>
  <text x="161" y="114" font-size="8.5" fill="#B9770E" text-anchor="middle">低并发区：两边都被</text>
  <text x="161" y="118" font-size="8.5" fill="#B9770E" text-anchor="middle">TTFT/客户端开销支配</text>

  <!-- ============ Panel B: TPOT ============ -->
  <text x="750" y="82" font-size="13" font-weight="bold" fill="#1e3a5f" text-anchor="middle">(b) TPOT p50 vs 并发：改善只有 1.4~1.5×，不是 2×</text>

  <line x1="560" y1="380" x2="930" y2="380" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#d33p)"/>
  <line x1="560" y1="380" x2="560" y2="90" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#d33p)"/>

  <!-- y gridlines (ms) 0..12 -->
  <line x1="560" y1="307" x2="930" y2="307" stroke="#E5E8E8" stroke-width="1"/>
  <line x1="560" y1="233" x2="930" y2="233" stroke="#E5E8E8" stroke-width="1"/>
  <line x1="560" y1="160" x2="930" y2="160" stroke="#E5E8E8" stroke-width="1"/>
  <text x="552" y="384" font-size="9" fill="#566573" text-anchor="end">0</text>
  <text x="552" y="311" font-size="9" fill="#566573" text-anchor="end">3</text>
  <text x="552" y="237" font-size="9" fill="#566573" text-anchor="end">6</text>
  <text x="552" y="164" font-size="9" fill="#566573" text-anchor="end">9</text>
  <text x="552" y="130" font-size="9" fill="#566573" text-anchor="end">12</text>
  <text x="532" y="240" font-size="10" fill="#2C3E50" text-anchor="middle" transform="rotate(-90 532 240)">TPOT p50 (ms)</text>

  <text x="580" y="396" font-size="9" fill="#566573" text-anchor="middle">1</text>
  <text x="665" y="396" font-size="9" fill="#566573" text-anchor="middle">4</text>
  <text x="750" y="396" font-size="9" fill="#566573" text-anchor="middle">16</text>
  <text x="835" y="396" font-size="9" fill="#566573" text-anchor="middle">64</text>
  <text x="915" y="396" font-size="9" fill="#566573" text-anchor="middle">256</text>
  <text x="745" y="414" font-size="10" fill="#2C3E50" text-anchor="middle">并发 C</text>

  <!-- ideal TP1/2 dashed -->
  <polyline points="580,304 665,302 750,298 835,293 915,263" fill="none" stroke="#B03A2E" stroke-width="1.6" stroke-dasharray="7,5"/>
  <!-- TP1 -->
  <polyline points="580,228 665,223 750,216 835,205 915,146" fill="none" stroke="#2E86C1" stroke-width="2.4"/>
  <!-- TP2 -->
  <polyline points="580,280 665,277 750,273 835,259 915,217" fill="none" stroke="#E67E22" stroke-width="2.4"/>

  <circle cx="580" cy="228" r="3.5" fill="#2E86C1"/>
  <circle cx="580" cy="280" r="3.5" fill="#E67E22"/>
  <circle cx="915" cy="146" r="3.5" fill="#2E86C1"/>
  <circle cx="915" cy="217" r="3.5" fill="#E67E22"/>

  <!-- annotations -->
  <line x1="592" y1="280" x2="592" y2="304" stroke="#C0392B" stroke-width="1.4"/>
  <text x="598" y="288" font-size="9" fill="#C0392B">差距 ≈ 2L·t_ar ≈ 0.6~1.1ms（时延项，</text>
  <text x="598" y="300" font-size="9" fill="#C0392B">不随并发缩小——"按层收的人头税"）</text>

  <text x="700" y="250" font-size="9" fill="#2E86C1">1×TP1：decode 是访存墙，</text>
  <text x="700" y="262" font-size="9" fill="#2E86C1">TPOT 几乎不随并发涨（权重只读一遍）</text>

  <text x="835" y="140" font-size="9" fill="#B03A2E" text-anchor="middle">理想 TP1÷2（虚线）</text>

  <!-- bottom summary band -->
  <rect x="60" y="440" width="860" height="98" rx="6" fill="#F8F9F9" stroke="#7F8C8D" stroke-width="1"/>
  <text x="76" y="462" font-size="10" font-weight="bold" fill="#2C3E50">读图三句话（对拍时逐句核验）</text>
  <text x="76" y="482" font-size="9.5" fill="#2C3E50">① (b) 低并发：TP2 与理想线的差距 ≈ 时延项 2L·t_ar = 72 × 6~15μs——模型越小（计算项越短），这项税占比越高；TPOT 改善典型只有 1.3~1.5×。</text>
  <text x="76" y="500" font-size="9.5" fill="#2C3E50">② (a) 高并发：TP2 与理想 2× 的差距 = 时延项 + 带宽项（ρ 随 (p−1)·B 线性涨）；吞吐加速比典型 1.3~1.6×，每卡效率约 65~80%。</text>
  <text x="76" y="518" font-size="9.5" fill="#2C3E50">③ TTFT 不在这张图上：prefill 是 compute-bound，通信占比 &lt;1%，TP=2 的 TTFT 改善接近 2×——同一副卡，两个 bound 两种扩展性（Day 1 结论的 TP 版）。</text>
  <text x="76" y="534" font-size="9" fill="#7F8C8D">注：纵轴为公式推算的量级示意（非实测承诺）；曲线形态（次线性、双段差距来源）才是要带走的结论。PCIe 互联的机器上差距会放大一个量级（Day 32 §3.4）。</text>
</svg>
