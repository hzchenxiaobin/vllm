  <line x1="376" y1="145" x2="384" y2="145" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="140" cy="328" r="4" fill="#2563eb"/>
  <circle cx="260" cy="267" r="4" fill="#2563eb"/>
  <circle cx="380" cy="127" r="4" fill="#2563eb"/>
  <text x="140" y="345" text-anchor="middle" font-size="9.5" fill="#1e3a8a">236±14</text>
  <text x="260" y="290" text-anchor="middle" font-size="9.5" fill="#1e3a8a">512±30</text>
  <text x="380" y="162" text-anchor="middle" font-size="9.5" fill="#1e3a8a">1150±80</text>
  <text x="172" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">chunk ON</text>
  <text x="436" y="84" text-anchor="end" font-size="9.5" font-style="italic" fill="#d97706">示例数据（演示格式）</text>

  <!-- ============ Panel B: TTFT p50 ============ -->
  <text x="720" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">右：首字时延（低 = 好）</text>
  <line x1="540" y1="380" x2="900" y2="380" stroke="#334155" stroke-width="1.5"/>
  <line x1="540" y1="380" x2="540" y2="70" stroke="#334155" stroke-width="1.5"/>
