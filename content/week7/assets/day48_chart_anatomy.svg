<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="630" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一张合格主图的解剖：并列双子图讲「权衡」（消融一示例数据）</text>

