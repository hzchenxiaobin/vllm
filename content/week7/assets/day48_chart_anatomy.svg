  <line x1="720" y1="175" x2="720" y2="189" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="716" y1="175" x2="724" y2="175" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="716" y1="189" x2="724" y2="189" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="840" y1="220" x2="840" y2="230" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="836" y1="220" x2="844" y2="220" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="836" y1="230" x2="844" y2="230" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="600" cy="109" r="4" fill="#2563eb"/>
  <circle cx="720" cy="182" r="4" fill="#2563eb"/>
  <circle cx="840" cy="225" r="4" fill="#2563eb"/>
  <text x="600" y="134" text-anchor="middle" font-size="9.5" fill="#1e3a8a">2.71±0.09</text>
  <text x="720" y="205" text-anchor="middle" font-size="9.5" fill="#1e3a8a">1.98±0.07</text>
  <text x="840" y="250" text-anchor="middle" font-size="9.5" fill="#1e3a8a">1.55±0.05</text>
  <text x="655" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a8a">chunk ON</text>
  <text x="896" y="84" text-anchor="end" font-size="9.5" font-style="italic" fill="#d97706">示例数据（演示格式）</text>

  <!-- ============ callouts ============ -->
  <circle cx="58" cy="92" r="11" fill="#d97706"/>
  <text x="58" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1</text>
