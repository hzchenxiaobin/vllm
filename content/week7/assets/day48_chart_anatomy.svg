  <circle cx="566" cy="262" r="11" fill="#d97706"/>
  <text x="566" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3</text>
  <text x="582" y="266" font-size="10" fill="#92400e">基线参照（虚线 = OFF）</text>

  <circle cx="490" cy="220" r="11" fill="#d97706"/>
  <text x="490" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">5</text>
  <text x="490" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">两图并列讲权衡</text>
  <text x="490" y="266" text-anchor="middle" font-size="9.5" fill="#92400e">budget 调小 ⇒</text>
  <text x="490" y="281" text-anchor="middle" font-size="9.5" fill="#92400e">左图 p99 ↓（好）</text>
  <text x="490" y="296" text-anchor="middle" font-size="9.5" fill="#92400e">右图 TTFT ↑（差）</text>
  <text x="490" y="311" text-anchor="middle" font-size="9.5" fill="#92400e">剪刀差：没有免费旋钮</text>

  <!-- ============ caption ============ -->
  <rect x="80" y="425" width="800" height="78" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <circle cx="98" cy="464" r="11" fill="#d97706"/>
  <text x="98" y="468" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">6</text>
  <text x="118" y="447" font-size="10" fill="#78350f">图 1（示例数据）：长 prompt（8k–16k）混跑负载下，开启 chunked prefill 将 TPOT p99 从 1240±90 ms 压至 236~512 ms（budget=2048/8192）；</text>
  <text x="118" y="465" font-size="10" fill="#78350f">代价是 TTFT p50 上升 9%~91%。budget 是「尾延迟 ↔ 首字时延」的旋钮；budget=32768 已超过典型 prompt 长度，行为退化回巨石 step（p99 ≈ OFF）。</text>
  <text x="118" y="483" font-size="10" fill="#78350f">数据：results/abl1/{off,on_2048,on_8192,on_32768}_seed*.json（附录索引 A-1）；n=3 seeds，误差棒 = ±1σ</text>

  <!-- ============ checklist ============ -->
  <rect x="80" y="520" width="800" height="95" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="480" y="542" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">图表六要素自查（每张图交卷前过一遍）</text>
  <text x="210" y="564" text-anchor="middle" font-size="10" fill="#475569">□ 轴标签 + 单位 + 刻度</text>
  <text x="480" y="564" text-anchor="middle" font-size="10" fill="#475569">□ 线条 / 图例标注含负载条件</text>
  <text x="750" y="564" text-anchor="middle" font-size="10" fill="#475569">□ 一句话结论（含具体数字）</text>
  <text x="210" y="582" text-anchor="middle" font-size="10" fill="#475569">□ 误差棒 ±σ（caption 注明 n）</text>
  <text x="480" y="582" text-anchor="middle" font-size="10" fill="#475569">□ 图号 + 正文引用</text>
  <text x="750" y="582" text-anchor="middle" font-size="10" fill="#475569">□ 数据文件索引（附录）</text>
  <text x="480" y="604" text-anchor="middle" font-size="9.5" fill="#b91c1c">禁忌：双 y 轴挤两个量纲 · 3D 效果 · 无误差棒的平滑曲线 · 只报均值不报分位数（Day 43 §2.3 的坑）</text>
</svg>
