  <circle cx="208" cy="84" r="11" fill="#d97706"/>
  <text x="208" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4</text>
  <text x="224" y="88" font-size="10" fill="#92400e">每条线直接标注（含负载条件）</text>

  <circle cx="414" cy="150" r="11" fill="#d97706"/>
  <text x="414" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2</text>
  <line x1="404" y1="157" x2="386" y2="138" stroke="#d97706" stroke-width="1.2"/>
