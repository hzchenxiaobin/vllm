<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">显著性：误差棒怎么看（示例数据，n = 5 轮）</text>

  <!-- Panel A: TPOT p99 -->
  <g>
    <text x="250" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">A. TPOT p99（ms）—— 显著提升</text>
    <line x1="80" y1="80" x2="80" y2="340" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="340" x2="440" y2="340" stroke="#334155" stroke-width="1.5"/>
    <g font-size="10" fill="#64748b" text-anchor="end">
      <text x="74" y="344">0</text><text x="74" y="274">8</text><text x="74" y="204">16</text><text x="74" y="134">24</text><text x="74" y="78">30</text>
    </g>
    <line x1="80" y1="270" x2="440" y2="270" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="80" y1="200" x2="440" y2="200" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="80" y1="130" x2="440" y2="130" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="238" y="138" width="62" height="105" fill="#fee2e2" fill-opacity="0.45"/>
    <rect x="140" y="137" width="90" height="203" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="185" y1="130" x2="185" y2="144" stroke="#7f1d1d" stroke-width="2"/>
    <line x1="177" y1="130" x2="193" y2="130" stroke="#7f1d1d" stroke-width="2"/>
    <line x1="177" y1="144" x2="193" y2="144" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="290" y="175" width="90" height="165" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="335" y1="171" x2="335" y2="179" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="327" y1="171" x2="343" y2="171" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="327" y1="179" x2="343" y2="179" stroke="#1e3a8a" stroke-width="2"/>
    <text x="185" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">23.4 ± 0.8</text>
    <text x="335" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">19.1 ± 0.5</text>
    <text x="185" y="360" text-anchor="middle" font-size="12" fill="#334155">baseline</text>
    <text x="335" y="360" text-anchor="middle" font-size="12" fill="#334155">optimized</text>
    <path d="M 235 205 L 235 190 L 285 190" fill="none" stroke="#475569" stroke-width="1.3"/>
    <text x="250" y="206" font-size="11" font-weight="bold" fill="#334155">Δ = 4.3 ms（-18.4%）</text>
    <text x="250" y="392" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Δ ≈ 5.4σ，误差棒不重叠 → t ≈ 10 → 显著，可写进 PR</text>
  </g>

  <!-- divider -->
  <line x1="480" y1="60" x2="480" y2="400" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Panel B: TTFT p99 -->
  <g>
    <text x="710" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">B. TTFT p99（ms）—— 不显著</text>
    <line x1="540" y1="80" x2="540" y2="340" stroke="#334155" stroke-width="1.5"/>
    <line x1="540" y1="340" x2="900" y2="340" stroke="#334155" stroke-width="1.5"/>
    <g font-size="10" fill="#64748b" text-anchor="end">
      <text x="534" y="344">0</text><text x="534" y="257">300</text><text x="534" y="170">600</text><text x="534" y="83">900</text>
    </g>
    <line x1="540" y1="253" x2="900" y2="253" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="540" y1="166" x2="900" y2="166" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="622" y="251" width="42" height="20" fill="#fde68a" fill-opacity="0.5"/>
    <rect x="600" y="106" width="90" height="234" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
    <line x1="645" y1="97" x2="645" y2="115" stroke="#92400e" stroke-width="2"/>
    <line x1="637" y1="97" x2="653" y2="97" stroke="#92400e" stroke-width="2"/>
    <line x1="637" y1="115" x2="653" y2="115" stroke="#92400e" stroke-width="2"/>
    <rect x="750" y="110" width="90" height="230" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="795" y1="102" x2="795" y2="118" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="787" y1="102" x2="803" y2="102" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="787" y1="118" x2="803" y2="118" stroke="#1e3a8a" stroke-width="2"/>
    <text x="645" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">812 ± 31</text>
    <text x="795" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">798 ± 28</text>
    <text x="645" y="360" text-anchor="middle" font-size="12" fill="#334155">baseline</text>
    <text x="795" y="360" text-anchor="middle" font-size="12" fill="#334155">optimized</text>
    <text x="710" y="392" text-anchor="middle" font-size="11.5" fill="#92400e">Δ = 14 ms ≈ 0.45σ，柱落在 ±σ 带内 → t ≈ 0.75 → 只能写"无可测量的变化"</text>
  </g>

  <rect x="60" y="404" width="840" height="20" fill="none"/>
  <text x="480" y="419" text-anchor="middle" font-size="11.5" fill="#475569">判据速记：σ 与 Δ/3 比较——σ 大于 Δ/3 时结论必须标"不显著"；柱状图必须带误差棒，否则不进对比表</text>
</svg>
