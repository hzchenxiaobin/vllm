  <text x="706" y="76" font-size="13" font-weight="bold" fill="#5b21b6">③ 自动落盘（机器）</text>
  <g font-size="10.5" fill="#5b21b6">
    <text x="706" y="100">results/&lt;组&gt;/&lt;case&gt;_&lt;seed&gt;.json</text>
    <text x="706" y="118">metrics_&lt;ts&gt;.txt（/metrics 快照）</text>
    <text x="706" y="136">serve 全程日志 + 环境指纹</text>
    <text x="706" y="158" font-weight="bold">幂等键：组 / case / seed</text>
  </g>

  <!-- ④ Watch -->
