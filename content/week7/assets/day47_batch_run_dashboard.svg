  <line x1="250" y1="512" x2="250" y2="534" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="512" x2="710" y2="534" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="40" y="538" width="420" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="560" font-size="12.5" font-weight="bold" fill="#334155">anomaly_log.md（现场快照 + 初步归因）</text>
