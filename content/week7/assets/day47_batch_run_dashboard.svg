  <text x="516" y="580" font-size="10.5" fill="#475569">predictions.md 预对照：✔ 符合预期 / ✘ 反直觉</text>
  <text x="516" y="596" font-size="10.5" fill="#475569">反直觉的格子 = 理解盲区，Day 48 优先深挖</text>

  <line x1="250" y1="610" x2="250" y2="624" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="710" y1="610" x2="710" y2="624" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="230" y="628" width="500" height="36" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="651" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5b21b6">Day 48：数据分析 + 《vLLM 性能消融实验报告》</text>
  <text x="480" y="682" text-anchor="middle" font-size="11" fill="#475569">原则：机器的事（上半）全自动 · 人的事（下半）寸土不让 —— 注意力按「素材的不可再生性」分配</text>
