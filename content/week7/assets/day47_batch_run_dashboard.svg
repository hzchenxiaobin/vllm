  </defs>
  <rect width="960" height="690" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">项目 C 批量执行与异常盯防总控（Day 47）</text>

  <!-- ① Matrix -->
  <rect x="40" y="52" width="205" height="318" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="76" font-size="13" font-weight="bold" fill="#334155">① 实验矩阵（Day 46 冻结）</text>
  <g text-anchor="middle">
    <rect x="55" y="88" width="175" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="142" y="106" font-size="11.5" font-weight="bold" fill="#1e3a8a">消融一 chunked prefill</text>
    <text x="142" y="123" font-size="10.5" fill="#1e3a8a">开关 × budget × 长度（9 格）</text>
    <rect x="55" y="140" width="175" height="44" rx="6" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="142" y="158" font-size="11.5" font-weight="bold" fill="#115e59">消融二 prefix caching</text>
    <text x="142" y="175" font-size="10.5" fill="#115e59">命中率梯度 0/50/90%（6 格）</text>
    <rect x="55" y="192" width="175" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="142" y="210" font-size="11.5" font-weight="bold" fill="#991b1b">消融三 投机解码</text>
    <text x="142" y="227" font-size="10.5" fill="#991b1b">k × 负载（8 格）</text>
    <rect x="55" y="244" width="175" height="44" rx="6" fill="#fffbeb" stroke="#d97706"/>
    <text x="142" y="262" font-size="11.5" font-weight="bold" fill="#92400e">消融四 量化</text>
    <text x="142" y="279" font-size="10.5" fill="#92400e">精度档位（5 格）</text>
  </g>
  <text x="142" y="316" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">≈28 格 × 3 seeds ≈ 84 runs</text>
  <text x="142" y="334" text-anchor="middle" font-size="10.5" fill="#475569">predictions.md 已写每格预期</text>
  <text x="142" y="352" text-anchor="middle" font-size="10" fill="#64748b">（配置冻结，今天零改动）</text>
  <line x1="245" y1="211" x2="270" y2="211" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

