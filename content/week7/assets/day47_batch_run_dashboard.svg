    <text x="379" y="236" font-size="10" fill="#9a3412">已有 &lt;case&gt;_&lt;seed&gt;.json</text>
    <text x="379" y="250" font-size="10" fill="#9a3412">→ 直接下一格</text>
    <rect x="487" y="200" width="169" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="571" y="219" font-size="11" font-weight="bold" fill="#9a3412">失败隔离</text>
    <text x="571" y="236" font-size="10" fill="#9a3412">任一步失败：失败标记+日志尾</text>
    <text x="571" y="250" font-size="10" fill="#9a3412">→ 继续下一格，不烧整晚</text>
  </g>
  <text x="292" y="288" font-size="11" fill="#0c4a6e">× ~84 runs 串行推进（nohup / tmux 挂机，人巡检）</text>
  <text x="292" y="306" font-size="11" fill="#0c4a6e">每格启动前复核：锁频状态 + 显存干净（无残留进程）</text>
  <text x="292" y="324" font-size="11" fill="#0c4a6e">失败格落 failed/ 清单，收尾时统一补跑或降级</text>
  <text x="292" y="348" font-size="10.5" fill="#64748b">（协议同 Day 43：warmup 丢弃 / 轮间冷却 / seed 控制随机化）</text>

  <line x1="656" y1="122" x2="686" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
