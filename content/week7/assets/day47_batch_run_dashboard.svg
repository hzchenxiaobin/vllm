  <text x="292" y="76" font-size="13" font-weight="bold" fill="#0c4a6e">② run_matrix.sh 批量状态机（每格 = 独立事务）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="292" y="92" width="80" height="34" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="332" y="113" fill="#0c4a6e">载参</text>
    <rect x="378" y="92" width="80" height="34" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="418" y="113" fill="#0c4a6e">启动 serve</text>
