  <text x="56" y="419" font-size="13.5" font-weight="bold" fill="#065f46">⑤ sanity 三道关（每格 3 seeds 齐 → 当天判定）</text>
  <g text-anchor="middle">
    <rect x="56" y="432" width="200" height="56" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="156" y="452" font-size="11.5" font-weight="bold" fill="#065f46">关 1 · 单调性</text>
    <text x="156" y="468" font-size="10.5" fill="#047857">机制预期单调关系成立？</text>
    <text x="156" y="482" font-size="10" fill="#059669">（对照 predictions.md）</text>
    <rect x="276" y="432" width="200" height="56" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="376" y="452" font-size="11.5" font-weight="bold" fill="#065f46">关 2 · 量级常识</text>
    <text x="376" y="468" font-size="10.5" fill="#047857">TPOT 量级 / 加速比上限</text>
    <text x="376" y="482" font-size="10" fill="#059669">吞吐=0 → 先查脚本</text>
    <rect x="496" y="432" width="200" height="56" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="596" y="452" font-size="11.5" font-weight="bold" fill="#065f46">关 3 · 跨格一致</text>
    <text x="596" y="468" font-size="10.5" fill="#047857">同配置格彼此 ±σ 内</text>
    <text x="596" y="482" font-size="10" fill="#059669">（免费的配对数据）</text>
    <rect x="716" y="432" width="190" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="811" y="452" font-size="11.5" font-weight="bold" fill="#9a3412">离群判定（z &gt; 3）</text>
    <text x="811" y="468" font-size="10.5" fill="#9a3412">当天重跑 1~2 次</text>
    <text x="811" y="482" font-size="10" fill="#9a3412">复现→系统性｜消失→偶发</text>
    <line x1="256" y1="460" x2="274" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="476" y1="460" x2="494" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="696" y1="460" x2="714" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

