    <text x="706" y="288">running · waiting 齿形</text>
    <text x="706" y="305">gpu_cache_usage · 命中率</text>
    <text x="706" y="322">引擎日志：preemption 行</text>
    <text x="706" y="344" font-weight="bold" fill="#dc2626">异常 → 快照 → anomaly_log</text>
  </g>

  <!-- rerun loop -->
  <path d="M 811 428 L 811 380 L 480 380 L 480 374" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)"/>
  <text x="630" y="374" text-anchor="middle" font-size="10" fill="#c2410c">当天重跑（隔天环境不可比）</text>

