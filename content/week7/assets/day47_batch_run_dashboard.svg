    <rect x="378" y="150" width="80" height="34" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="418" y="171" fill="#0c4a6e">metrics 快照</text>
    <rect x="464" y="150" width="80" height="34" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="504" y="171" fill="#0c4a6e">停服</text>
    <rect x="550" y="150" width="80" height="34" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="590" y="171" fill="#0c4a6e">冷却 30 s</text>
    <line x1="372" y1="109" x2="376" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="458" y1="109" x2="462" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="544" y1="109" x2="548" y2="109" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
