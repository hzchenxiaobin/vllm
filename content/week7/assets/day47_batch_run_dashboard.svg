  <line x1="570" y1="186" x2="570" y2="198" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <g text-anchor="middle">
    <rect x="292" y="200" width="175" height="56" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
