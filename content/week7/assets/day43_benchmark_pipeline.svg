<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">前后对比 Benchmark 总体流水线（Day 43）</text>

  <!-- Layer 1: frozen environment -->
  <rect x="40" y="52" width="880" height="108" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="56" y="76" font-size="14" font-weight="bold" fill="#334155">① 环境冻结层（目标：消灭偏差）</text>
  <g font-size="12" fill="#1e3a8a" text-anchor="middle">
    <rect x="60"  y="88" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="107">vLLM commit hash（进对比表）</text>
    <rect x="344" y="88" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="480" y="107">模型 + 量化配置（不变）</text>
    <rect x="628" y="88" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="764" y="107">serve 启动脚本（原样保存）</text>
    <rect x="60"  y="124" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="196" y="143">数据集 + 固定 seed 生成</text>
    <rect x="344" y="124" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="480" y="143">并发 / request-rate 序列（不变）</text>
    <rect x="628" y="124" width="272" height="28" rx="6" fill="#eff6ff" stroke="#2563eb"/><text x="764" y="143">GPU 锁频 + 温度/频率快照</text>
  </g>
  <line x1="480" y1="160" x2="480" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 2: version x scenario matrix -->
  <text x="40" y="205" font-size="14" font-weight="bold" fill="#334155">② 版本 × 场景矩阵</text>
  <rect x="40" y="216" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="115" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">baseline</text>
  <text x="115" y="249" text-anchor="middle" font-size="11" fill="#9a3412">优化前 commit</text>
  <rect x="40" y="264" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="115" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">optim 分支</text>
  <text x="115" y="297" text-anchor="middle" font-size="11" fill="#065f46">当前优化实现</text>
  <line x1="190" y1="236" x2="226" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="190" y1="284" x2="226" y2="284" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <g text-anchor="middle">
    <rect x="230" y="212" width="212" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="336" y="234" font-size="13" font-weight="bold" fill="#991b1b">decode 密集</text>
    <text x="336" y="253" font-size="11" fill="#7f1d1d">短 prompt(128-512)</text>
    <text x="336" y="269" font-size="11" fill="#7f1d1d">长输出(≥1024)</text>
    <text x="336" y="293" font-size="12" font-weight="bold" fill="#991b1b">主指标：TPOT p99</text>
    <rect x="462" y="212" width="212" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="568" y="234" font-size="13" font-weight="bold" fill="#92400e">prefill 密集</text>
    <text x="568" y="253" font-size="11" fill="#78350f">长 prompt(8k-16k)</text>
    <text x="568" y="269" font-size="11" fill="#78350f">短输出(32-64)</text>
    <text x="568" y="293" font-size="12" font-weight="bold" fill="#92400e">主指标：TTFT p99</text>
    <rect x="694" y="212" width="212" height="96" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="800" y="234" font-size="13" font-weight="bold" fill="#115e59">混合场景</text>
    <text x="800" y="253" font-size="11" fill="#134e4a">ShareGPT + 泊松到达</text>
    <text x="800" y="269" font-size="11" fill="#134e4a">长短交织</text>
    <text x="800" y="293" font-size="12" font-weight="bold" fill="#115e59">主指标：goodput @SLO</text>
  </g>
  <line x1="480" y1="308" x2="480" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 3: round protocol -->
  <rect x="40" y="334" width="880" height="106" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="56" y="356" font-size="14" font-weight="bold" fill="#155e75">③ 轮次协议（目标：压缩噪声；每 seed 一轮，每轮重启服务）</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="56"  y="368" width="108" height="34" rx="6" fill="#ffffff" stroke="#0891b2"/><text x="110" y="389" fill="#155e75">启动服务</text>
    <rect x="178" y="368" width="108" height="34" rx="6" fill="#ffffff" stroke="#0891b2"/><text x="232" y="389" fill="#155e75">健康检查</text>
    <rect x="300" y="368" width="108" height="34" rx="6" fill="#e2e8f0" stroke="#64748b"/><text x="354" y="389" fill="#334155">warmup（丢弃）</text>
    <rect x="422" y="368" width="108" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="476" y="389" fill="#1e3a8a" font-weight="bold">正式采集</text>
    <rect x="544" y="368" width="108" height="34" rx="6" fill="#ffffff" stroke="#0891b2"/><text x="598" y="389" fill="#155e75">/metrics 快照</text>
    <rect x="666" y="368" width="108" height="34" rx="6" fill="#ffffff" stroke="#0891b2"/><text x="720" y="389" fill="#155e75">停服</text>
    <rect x="788" y="368" width="108" height="34" rx="6" fill="#ffffff" stroke="#0891b2"/><text x="842" y="389" fill="#155e75">冷却 30 s</text>
    <line x1="164" y1="385" x2="176" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="286" y1="385" x2="298" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="408" y1="385" x2="420" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="530" y1="385" x2="542" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="652" y1="385" x2="664" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="774" y1="385" x2="786" y2="385" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>
  <path d="M 896 402 L 896 424 L 110 424 L 110 406" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="500" y="420" text-anchor="middle" font-size="11" fill="#0e7490">× 3~5 个 seed（随机化请求顺序 → 轮间方差可统计）</text>

  <line x1="480" y1="440" x2="480" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 4: statistics -->
  <text x="40" y="483" font-size="14" font-weight="bold" fill="#334155">④ 统计聚合 → 结论</text>
  <g text-anchor="middle">
    <rect x="60" y="494" width="250" height="62" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="185" y="518" font-size="12.5" font-weight="bold" fill="#334155">每场景 × 每指标</text>
    <text x="185" y="538" font-size="11.5" fill="#475569">均值 ± σ（轮间）· p50/p99</text>
    <rect x="360" y="494" width="250" height="62" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="485" y="518" font-size="12.5" font-weight="bold" fill="#334155">显著性检验</text>
    <text x="485" y="538" font-size="11.5" fill="#475569">Welch t / 配对 Δ；σ 与 Δ/3 比较</text>
    <rect x="660" y="494" width="250" height="62" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="785" y="518" font-size="12.5" font-weight="bold" fill="#5b21b6">前后对比表</text>
    <text x="785" y="538" font-size="11.5" fill="#6d28d9">Δ% + 显著性标注 + 环境指纹</text>
    <line x1="310" y1="525" x2="356" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="610" y1="525" x2="656" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="480" y="584" text-anchor="middle" font-size="12" fill="#475569">产出：一张可进 PR 的前后对比表 —— Day 45 PR 描述的 Benchmarks 段、简历数字的唯一来源</text>
</svg>
