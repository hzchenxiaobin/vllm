<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr45c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr45d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr45e" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">PR 拆分策略：一个 1800 行大 PR vs 三个可独立审查的 PR 序列</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#64748b">review 成本随 diff 超线性增长：先合入无行为变化的重构，后面的语义 diff 才能被"增量"审查</text>

  <!-- Top: monolithic PR -->
  <rect x="60" y="76" width="860" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="90" y="102" font-size="13.5" font-weight="bold" fill="#991b1b">方案 A：三合一 monolith（1 个 PR，~1800 行）</text>
  <g text-anchor="middle">
    <rect x="90" y="116" width="250" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="215" y="138" font-size="11.5" font-weight="bold" fill="#7f1d1d">重构 helper（纯移动）</text>
    <text x="215" y="156" font-size="10" fill="#991b1b">~500 行 · 无行为变化</text>
    <rect x="360" y="116" width="250" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="485" y="138" font-size="11.5" font-weight="bold" fill="#7f1d1d">kernel 优化（语义核心）</text>
    <text x="485" y="156" font-size="10" fill="#991b1b">~700 行 · 需对拍验证</text>
    <rect x="630" y="116" width="250" height="56" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="755" y="138" font-size="11.5" font-weight="bold" fill="#7f1d1d">单测 + CI 适配</text>
    <text x="755" y="156" font-size="10" fill="#991b1b">~600 行 · 机制测试</text>
  </g>
  <text x="90" y="188" font-size="10.5" fill="#7f1d1d">reviewer 视角：三种验证强度混在一起，只能整体扫描 → 周转以周计，且任何一处质疑都会阻塞全部</text>

  <line x1="490" y1="194" x2="490" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#arr45c)"/>
  <text x="510" y="210" font-size="11" fill="#475569">拆分</text>

  <!-- Bottom: PR sequence -->
  <rect x="60" y="222" width="860" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="248" font-size="13.5" font-weight="bold" fill="#14532d">方案 B：PR 序列（依赖链，每个 200~600 行）</text>
  <g text-anchor="middle">
    <rect x="90" y="262" width="240" height="62" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="210" y="284" font-size="11.5" font-weight="bold" fill="#14532d">PR#1 refactor: 提取 helper</text>
    <text x="210" y="301" font-size="10" fill="#166534">纯移动 · 位级等价</text>
    <text x="210" y="315" font-size="10" fill="#166534">验证 = 回归测试（零 diff）→ 快速合入</text>

    <rect x="360" y="262" width="240" height="62" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="480" y="284" font-size="11.5" font-weight="bold" fill="#14532d">PR#2 perf: kernel 优化</text>
    <text x="480" y="301" font-size="10" fill="#166534">语义核心 · 类别②对拍</text>
    <text x="480" y="315" font-size="10" fill="#166534">diff 干净 → 对比表即全部证据</text>

    <rect x="630" y="262" width="240" height="62" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="750" y="284" font-size="11.5" font-weight="bold" fill="#14532d">PR#3 test: 边界矩阵</text>
    <text x="750" y="301" font-size="10" fill="#166534">锁定回归 · 独立价值</text>
    <text x="750" y="315" font-size="10" fill="#166534">即使 PR#2 被搁置也不浪费</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.8">
    <line x1="330" y1="293" x2="356" y2="293" marker-end="url(#arr45e)"/>
    <line x1="600" y1="293" x2="626" y2="293" marker-end="url(#arr45e)"/>
  </g>
  <text x="90" y="348" font-size="10.5" fill="#166534">依赖标注：PR#2 描述里写 "based on #PR1编号"；PR#1 合入后 rebase，语义 diff 保持最小</text>
  <text x="90" y="364" font-size="10.5" fill="#166534">每个 PR 独立满足"单一验证强度"——reviewer 可以用对应的最廉价手段审查每一环</text>

  <!-- bottom summary -->
  <rect x="60" y="384" width="860" height="26" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="490" y="401" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">拆分原则：按"验证强度"切，不按"文件目录"切——每一环都能用最便宜的验证手段独立确认</text>
</svg>
