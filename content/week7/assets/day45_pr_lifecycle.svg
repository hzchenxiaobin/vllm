<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr45a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arr45r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr45g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">PR 生命周期：从本地分支到合并（或拿到 review 反馈）</text>
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#64748b">两条铁律：CI 红了当天修；review 意见 24 小时内逐条响应——沉默的 PR 会被遗忘</text>

  <!-- Lane 1: local -->
  <rect x="24" y="72" width="300" height="24" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  <text x="174" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">本地（你的机器）</text>
  <rect x="656" y="72" width="300" height="24" rx="12" fill="#f1f5f9" stroke="#64748b"/>
  <text x="806" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">上游（vllm-ascend / vLLM）</text>

  <!-- local chain -->
  <g text-anchor="middle">
    <rect x="34" y="112" width="130" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="99" y="136" font-size="12.5" font-weight="bold" fill="#334155">feature 分支</text>
    <text x="99" y="154" font-size="10.5" fill="#64748b">1 分支 = 1 个主题</text>
    <text x="99" y="168" font-size="10.5" fill="#64748b">从最新 main 切出</text>

    <rect x="186" y="112" width="130" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="251" y="136" font-size="12.5" font-weight="bold" fill="#334155">整理 commit</text>
    <text x="251" y="154" font-size="10.5" fill="#64748b">rebase -i / fixup</text>
    <text x="251" y="168" font-size="10.5" fill="#64748b">1 commit = 1 逻辑单元</text>

    <rect x="338" y="112" width="120" height="64" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="398" y="136" font-size="12.5" font-weight="bold" fill="#713f12">pre-commit</text>
    <text x="398" y="154" font-size="10.5" fill="#854d0e">lint / 格式 / yaml</text>
    <text x="398" y="168" font-size="10.5" fill="#854d0e">本地过不了别 push</text>

    <rect x="478" y="112" width="120" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="538" y="136" font-size="12.5" font-weight="bold" fill="#334155">本地单测</text>
    <text x="538" y="154" font-size="10.5" fill="#64748b">只跑改动相关模块</text>
    <text x="538" y="168" font-size="10.5" fill="#64748b">pytest -k xxx</text>

    <rect x="618" y="112" width="130" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="683" y="136" font-size="12.5" font-weight="bold" fill="#14532d">push 分支</text>
    <text x="683" y="154" font-size="10.5" fill="#166534">git push -u fork</text>
    <text x="683" y="168" font-size="10.5" fill="#166534">gh pr create</text>
  </g>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="164" y1="144" x2="182" y2="144" marker-end="url(#arr45a)"/>
    <line x1="316" y1="144" x2="334" y2="144" marker-end="url(#arr45a)"/>
    <line x1="458" y1="144" x2="474" y2="144" marker-end="url(#arr45a)"/>
    <line x1="598" y1="144" x2="614" y2="144" marker-end="url(#arr45a)"/>
  </g>

  <!-- PR creation -->
  <line x1="683" y1="176" x2="683" y2="204" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr45g)"/>
  <rect x="558" y="208" width="250" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="683" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">PR 创建：四段式描述</text>
  <text x="683" y="245" text-anchor="middle" font-size="10.5" fill="#1e40af">WHY → WHAT → BENCHMARKS → TEST PLAN</text>

  <!-- CI stage -->
  <line x1="683" y1="254" x2="683" y2="282" stroke="#475569" stroke-width="1.8" marker-end="url(#arr45a)"/>
  <rect x="528" y="286" width="310" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="683" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">CI 检查（远端 runner）</text>
  <text x="683" y="324" text-anchor="middle" font-size="10.5" fill="#64748b">lint / 单测 / 需要昇腾硬件的 job / docker 构建</text>

  <!-- CI red loop -->
  <rect x="130" y="286" width="330" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="295" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">CI 红 → 当天修：本地复现 → fix commit → push</text>
  <text x="295" y="324" text-anchor="middle" font-size="10.5" fill="#7f1d1d">先看日志定位是环境问题还是代码问题，别盲目重跑</text>
  <line x1="528" y1="312" x2="462" y2="312" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arr45r)"/>
  <path d="M 295 286 L 295 144 L 186 144" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr45r)"/>

  <!-- review stage -->
  <line x1="683" y1="338" x2="683" y2="366" stroke="#475569" stroke-width="1.8" marker-end="url(#arr45a)"/>
  <rect x="470" y="370" width="426" height="70" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="683" y="392" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Review 循环（可能 0~N 轮）</text>
  <text x="683" y="410" text-anchor="middle" font-size="10.5" fill="#5b21b6">reviewer 逐条评论 → 你逐条回复（同意则改，不同意则给数据/引用讲理由）→ push 新 commit</text>
  <text x="683" y="426" text-anchor="middle" font-size="10.5" fill="#5b21b6">每条意见都要闭环：不是"改了"，就是"为什么不改"——不允许静默跳过</text>

  <!-- review loop back -->
  <path d="M 470 405 L 398 405 L 398 176" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr45a)"/>

  <!-- merge -->
  <line x1="896" y1="405" x2="916" y2="405" stroke="#16a34a" stroke-width="2" marker-end="url(#arr45g)"/>
  <rect x="920" y="384" width="46" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="943" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">合并</text>
  <text x="943" y="418" text-anchor="middle" font-size="9.5" fill="#166534">或闭环</text>

  <!-- bottom-left note -->
  <rect x="34" y="356" width="380" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="224" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">即使最终没合并，review 过程本身就是材料</text>
  <text x="224" y="398" text-anchor="middle" font-size="10.5" fill="#475569">reviewer 的每条意见 = 一次免费的专家 code review</text>
  <text x="224" y="414" text-anchor="middle" font-size="10.5" fill="#475569">面试讲稿素材：被挑战的点 → 你如何用数据回应</text>
  <text x="224" y="430" text-anchor="middle" font-size="10.5" fill="#475569">（Day 49 将把这些整理进项目讲稿）</text>
</svg>
