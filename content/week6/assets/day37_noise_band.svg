<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">噪声带与显著性判据：提升多大才算数</text>

  <!-- ===== Left panel: TPOT vs concurrency ===== -->
  <text x="270" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">TPOT p50 vs 并发（示例数据，方法示意）</text>

  <!-- gridlines + y labels -->
  <line x1="80" y1="310" x2="470" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="240" x2="470" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="170" x2="470" y2="170" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="100" x2="470" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="314" text-anchor="end" font-size="11" fill="#64748b">0</text>
  <text x="72" y="244" text-anchor="end" font-size="11" fill="#64748b">20</text>
  <text x="72" y="174" text-anchor="end" font-size="11" fill="#64748b">40</text>
  <text x="72" y="104" text-anchor="end" font-size="11" fill="#64748b">60</text>
  <text x="60" y="200" font-size="12" fill="#334155" transform="rotate(-90 60 200)" text-anchor="middle">TPOT p50 (ms)</text>

  <!-- axes -->
  <line x1="80" y1="65" x2="80" y2="310" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="310" x2="470" y2="310" stroke="#475569" stroke-width="1.5"/>
  <text x="110" y="330" text-anchor="middle" font-size="12" fill="#334155">C=1</text>
  <text x="220" y="330" text-anchor="middle" font-size="12" fill="#334155">C=4</text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#334155">C=16</text>
  <text x="440" y="330" text-anchor="middle" font-size="12" fill="#334155">C=64</text>
  <text x="275" y="352" text-anchor="middle" font-size="12" fill="#334155">并发（ShareGPT，seed 固定）</text>

  <!-- theory lower bound dashed line: 21, 22, 25, 45 -->
  <polyline points="110,236 220,233 330,222 440,152" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="110" cy="236" r="3" fill="#f59e0b"/>
  <circle cx="220" cy="233" r="3" fill="#f59e0b"/>
  <circle cx="330" cy="222" r="3" fill="#f59e0b"/>
  <circle cx="440" cy="152" r="3" fill="#f59e0b"/>

  <!-- measured line with error bars: 42, 44, 48, 58 (±9px) -->
  <line x1="110" y1="154" x2="110" y2="172" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="104" y1="154" x2="116" y2="154" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="104" y1="172" x2="116" y2="172" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="220" y1="147" x2="220" y2="165" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="214" y1="147" x2="226" y2="147" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="214" y1="165" x2="226" y2="165" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="330" y1="133" x2="330" y2="151" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="324" y1="133" x2="336" y2="133" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="324" y1="151" x2="336" y2="151" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="440" y1="98" x2="440" y2="116" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="434" y1="98" x2="446" y2="98" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="434" y1="116" x2="446" y2="116" stroke="#2563eb" stroke-width="1.8"/>
  <polyline points="110,163 220,156 330,142 440,107" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="110" cy="163" r="4.5" fill="#2563eb"/>
  <circle cx="220" cy="156" r="4.5" fill="#2563eb"/>
  <circle cx="330" cy="142" r="4.5" fill="#2563eb"/>
  <circle cx="440" cy="107" r="4.5" fill="#2563eb"/>

  <!-- legend -->
  <line x1="96" y1="80" x2="124" y2="80" stroke="#2563eb" stroke-width="2.5"/>
  <text x="130" y="84" font-size="11.5" fill="#334155">实测 TPOT p50（误差棒 = ±2CV）</text>
  <line x1="96" y1="98" x2="124" y2="98" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="130" y="102" font-size="11.5" fill="#334155">理论下界 t_lb（Day 2 公式）</text>

  <text x="270" y="386" text-anchor="middle" font-size="11" fill="#64748b">η = t_lb / 实测：C=1 示例 ≈ 21/42 = 50% —— 差距即 Day 38-40 的剖析对象</text>

  <!-- ===== Right panel: significance gauge ===== -->
  <text x="715" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">单指标显著性（TPOT p50 @ C=1）</text>

  <!-- vertical scale 50ms(top,80) ~ 32ms(bottom,300), 12.2 px/ms -->
  <line x1="620" y1="80" x2="620" y2="300" stroke="#475569" stroke-width="1.5"/>
  <text x="640" y="84" font-size="11" fill="#64748b">50</text>
  <text x="640" y="186" font-size="11" fill="#64748b">42 (μ)</text>
  <text x="640" y="304" font-size="11" fill="#64748b">32</text>
  <text x="600" y="190" font-size="12" fill="#334155" transform="rotate(-90 600 190)" text-anchor="middle">改后 TPOT p50 (ms)</text>

  <!-- noise band: 44.5ms(y=147) ~ 39.5ms(y=208) -->
  <rect x="586" y="147" width="68" height="61" fill="#93c5fd" fill-opacity="0.45" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="586" y1="178" x2="654" y2="178" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="660" y="150" font-size="11" fill="#1d4ed8">噪声带上界 μ+2CV</text>
  <text x="660" y="212" font-size="11" fill="#1d4ed8">噪声带下界 μ−2CV</text>

  <!-- point A: 41.5ms inside band -->
  <circle cx="620" cy="184" r="6" fill="#ef4444"/>
  <text x="662" y="240" font-size="11.5" fill="#991b1b">✗ A：41.5ms（带内）→ 不显著，不能声称提升</text>

  <!-- point B: 37.5ms below band -->
  <circle cx="620" cy="233" r="6" fill="#059669"/>
  <text x="662" y="266" font-size="11.5" fill="#065f46">✓ B：37.5ms（带外）→ 显著，且需 3 次方向一致</text>

  <!-- rules box -->
  <rect x="530" y="290" width="350" height="118" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="546" y="314" font-size="12" font-weight="bold" fill="#334155">判据（今天定死，写进 baseline.md）</text>
  <text x="546" y="336" font-size="11.5" fill="#475569">· 噪声带 = μ ± 2·CV·μ（CV = σ/μ，复测 ≥3 次标定）</text>
  <text x="546" y="356" font-size="11.5" fill="#475569">· |Δ| ≤ 2CV → 视为噪声；|Δ| &gt; 2CV 且方向一致 → 提升</text>
  <text x="546" y="376" font-size="11.5" fill="#475569">· 示例门槛：TPOT p50(CV≈2%) 需 &gt;4%；TTFT p99(CV≈10%) 需 &gt;20%</text>
  <text x="546" y="396" font-size="11.5" fill="#475569">· 期望收益小于门槛的指标 → 换指标或降低其测量方差</text>
</svg>
