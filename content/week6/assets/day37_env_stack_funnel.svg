<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">版本五元组 · 依赖栈（左） × 分层冒烟漏斗（右）</text>

  <!-- ===== Left: dependency stack ===== -->
  <text x="205" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">依赖栈（上层依赖下层）</text>

  <!-- Layer 1: vllm-ascend (yours, orange) -->
  <rect x="30" y="84" width="350" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="46" y="108" font-size="14" font-weight="bold" fill="#92400e">⑤ vllm-ascend @ main（editable）</text>
  <text x="46" y="128" font-size="11" fill="#78350f">git rev-parse --short HEAD ← 你能直接改的层</text>

  <line x1="205" y1="142" x2="205" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="156" font-size="10" fill="#64748b">Python API</text>

  <!-- Layer 2: vllm -->
  <rect x="30" y="162" width="350" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="46" y="186" font-size="14" font-weight="bold" fill="#1e3a5f">④ vLLM 主仓（V1 引擎核心）</text>
  <text x="46" y="206" font-size="11" fill="#475569">pip show vllm —— 硬件无关，Day 8-16 已吃透</text>

  <line x1="205" y1="220" x2="205" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="234" font-size="10" fill="#64748b">pybind / C++ ABI</text>

  <!-- Layer 3: torch_npu -->
  <rect x="30" y="240" width="350" height="58" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="46" y="264" font-size="14" font-weight="bold" fill="#1e3a5f">③ torch + torch_npu</text>
  <text x="46" y="284" font-size="11" fill="#475569">pip list | grep torch —— 两者必须互相配套</text>

  <line x1="205" y1="298" x2="205" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="312" font-size="10" fill="#64748b">aclnn 调用</text>

  <!-- Layer 4: CANN -->
  <rect x="30" y="318" width="350" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="46" y="342" font-size="14" font-weight="bold" fill="#334155">② CANN Toolkit（ascend-toolkit）</text>
  <text x="46" y="362" font-size="11" fill="#475569">cat .../ascend-toolkit/latest/version.cfg —— aclnn 算子库</text>

  <line x1="205" y1="376" x2="205" y2="394" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="218" y="390" font-size="10" fill="#64748b">驱动接口</text>

  <!-- Layer 5: driver -->
  <rect x="30" y="396" width="350" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="46" y="420" font-size="14" font-weight="bold" fill="#334155">① 驱动 / 固件</text>
  <text x="46" y="440" font-size="11" fill="#475569">npu-smi info —— 与 CANN 有配套关系</text>

  <!-- Left bottom note -->
  <rect x="30" y="486" width="350" height="64" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="46" y="510" font-size="12" font-weight="bold" fill="#9a3412">任意一层错配 → 上层全部不可信</text>
  <text x="46" y="530" font-size="11.5" fill="#9a3412">第一排查动作永远是「对表」，不是「搜报错」</text>

  <!-- Middle divider -->
  <line x1="412" y1="80" x2="412" y2="455" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="386" y1="265" x2="448" y2="265" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="417" y="252" text-anchor="middle" font-size="10.5" fill="#475569">下层就位</text>
  <text x="417" y="282" text-anchor="middle" font-size="10.5" fill="#475569">上层冒烟才可能通过</text>

  <!-- ===== Right: smoke funnel ===== -->
  <text x="665" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a5f">分层冒烟漏斗（自下而上验证）</text>

  <!-- L0 -->
  <rect x="455" y="84" width="420" height="58" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="475" y="108" font-size="14" font-weight="bold" fill="#065f46">L0 进程可见 —— npu-smi info / import torch_npu</text>
  <text x="475" y="128" font-size="11" fill="#047857">失败 → 查驱动/固件、set_env.sh、容器设备映射</text>

  <!-- L1 -->
  <rect x="470" y="162" width="390" height="58" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="490" y="186" font-size="14" font-weight="bold" fill="#134e4a">L1 离线推理 —— LLM().generate() 出文本</text>
  <text x="490" y="206" font-size="11" fill="#0f766e">失败 → 查 torch_npu × CANN 配套、模型加载</text>

  <!-- L2 -->
  <rect x="485" y="240" width="360" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="505" y="264" font-size="14" font-weight="bold" fill="#1e3a5f">L2 服务链路 —— vllm serve + curl 200</text>
  <text x="505" y="284" font-size="11" fill="#475569">失败 → 查 V1 配置、backend 选路、fallback 日志</text>

  <!-- L3 -->
  <rect x="500" y="318" width="330" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="520" y="342" font-size="14" font-weight="bold" fill="#312e81">L3 回归入口 —— pytest 最小集全绿</text>
  <text x="520" y="362" font-size="11" fill="#4338ca">失败 → 查测试环境依赖（docker / CI runner）</text>

  <!-- L4 -->
  <rect x="515" y="396" width="300" height="58" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="535" y="420" font-size="14" font-weight="bold" fill="#713f12">L4 基线压测 —— 指标量级合理</text>
  <text x="535" y="440" font-size="11" fill="#a16207">失败 → 查测量方法本身（§4.3 sanity check）</text>

  <!-- funnel arrows -->
  <line x1="665" y1="142" x2="665" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="220" x2="665" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="298" x2="665" y2="316" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="665" y1="376" x2="665" y2="394" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right bottom note -->
  <rect x="455" y="486" width="420" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="471" y="510" font-size="12" font-weight="bold" fill="#334155">分层的意义：把「环境有问题」定位成「哪一层、哪条命令挂了」</text>
  <text x="471" y="530" font-size="11.5" fill="#475569">每层通过都留一行证据 —— 失败时排查半径从「全栈」缩到「一层」</text>
</svg>
