<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">η 分解链与可回收池：一个总差距，三级因子，三个互斥池</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">η_step = t_lb / T_step = β × φ × η_kernel —— 乘法链（时间的嵌套比率），每级 (1−因子) 就是该级的可回收池</text>

  <!-- Chain equation strip -->
  <rect x="30" y="70" width="240" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="150" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a5f">β = 0.80</text>
  <text x="150" y="112" text-anchor="middle" font-size="10.5" fill="#475569">busy 率 = T_busy / T_step</text>
  <text x="150" y="128" text-anchor="middle" font-size="9.5" fill="#64748b">来源：Day 38 四本账（38.4/48）</text>

  <text x="286" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">×</text>

  <rect x="300" y="70" width="240" height="72" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.6"/>
  <text x="420" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#064e3b">φ = 0.865</text>
  <text x="420" y="112" text-anchor="middle" font-size="10.5" fill="#475569">kernel 份额 = T_kernel / T_busy</text>
  <text x="420" y="128" text-anchor="middle" font-size="9.5" fill="#64748b">来源：Day 38（含重叠修正，TP=1 无重叠）</text>

  <text x="556" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">×</text>

  <rect x="570" y="70" width="240" height="72" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.6"/>
  <text x="690" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">η_kernel = 0.70</text>
  <text x="690" y="112" text-anchor="middle" font-size="10.5" fill="#475569">贴界度 = Σt_lb,k / T_kernel</text>
  <text x="690" y="128" text-anchor="middle" font-size="9.5" fill="#64748b">来源：Day 39 逐算子 η 加权（23.2/33.2）</text>

  <text x="826" y="112" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">=</text>

  <rect x="838" y="70" width="100" height="72" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="888" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">η_step</text>
  <text x="888" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">0.48</text>

  <!-- arrows down from each factor to its pool -->
  <line x1="150" y1="142" x2="150" y2="168" stroke="#475569" stroke-width="1.5"/>
  <polygon points="145,166 155,166 150,174" fill="#475569"/>
  <line x1="420" y1="142" x2="420" y2="168" stroke="#475569" stroke-width="1.5"/>
  <polygon points="415,166 425,166 420,174" fill="#475569"/>
  <line x1="690" y1="142" x2="690" y2="168" stroke="#475569" stroke-width="1.5"/>
  <polygon points="685,166 695,166 690,174" fill="#475569"/>

  <!-- Three pools -->
  <rect x="30" y="176" width="240" height="128" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="150" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">gap 池 = (1−β)·T_step</text>
  <text x="150" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">9.6 ms</text>
  <text x="150" y="244" text-anchor="middle" font-size="10.5" fill="#475569">host 5.8 + sync 3.8</text>
  <text x="150" y="262" text-anchor="middle" font-size="10.5" fill="#475569">归属：D5（图模式 / async）</text>
  <text x="150" y="284" text-anchor="middle" font-size="9.5" fill="#64748b">lb = 0：整条账都是差距</text>

  <rect x="300" y="176" width="240" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="420" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">通信池 = (1−φ)·T_busy</text>
  <text x="420" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a5f">5.2 ms</text>
  <text x="420" y="244" text-anchor="middle" font-size="10.5" fill="#475569">归属：D6（先诊断！）</text>
  <text x="420" y="262" text-anchor="middle" font-size="10.5" fill="#b45309">TP=1 下本应 ≈ 0 —— 异常账</text>
  <text x="420" y="284" text-anchor="middle" font-size="9.5" fill="#64748b">Day 37 §5 已知异常的回响</text>

  <rect x="570" y="176" width="240" height="128" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="690" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">kernel 组织池 = (1−η_k)·T_kernel</text>
  <text x="690" y="222" text-anchor="middle" font-size="16" font-weight="bold" fill="#7f1d1d">10.0 ms</text>
  <text x="690" y="244" text-anchor="middle" font-size="10.5" fill="#475569">o_proj 5.3 + 其余GEMM 3.3</text>
  <text x="690" y="262" text-anchor="middle" font-size="10.5" fill="#475569">+ attention 0.7 + elem 0.7</text>
  <text x="690" y="284" text-anchor="middle" font-size="9.5" fill="#64748b">归属：D1~D4（贴顶类）</text>

  <!-- right of pools: step composition bar -->
  <rect x="838" y="176" width="100" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="888" y="196" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">T_step 48ms</text>
  <rect x="852" y="204" width="72" height="33" fill="#b91c1c"/>
  <rect x="852" y="237" width="72" height="5" fill="#2563eb"/>
  <rect x="852" y="242" width="72" height="6" fill="#7c3aed"/>
  <rect x="852" y="248" width="72" height="4" fill="#c4b5fd"/>
  <text x="888" y="270" text-anchor="middle" font-size="8.5" fill="#475569">kernel 33.2</text>
  <text x="888" y="282" text-anchor="middle" font-size="8.5" fill="#475569">comm 5.2</text>
  <text x="888" y="294" text-anchor="middle" font-size="8.5" fill="#475569">host+sync 9.6</text>

  <!-- conservation strip -->
  <rect x="30" y="324" width="908" height="92" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="484" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">守恒律（闭合校验）：三池互斥、加得平，这是"最多快多少"的算法</text>
  <text x="484" y="376" text-anchor="middle" font-size="12" fill="#334155">gap 9.6 + 通信 5.2 + 组织 10.0 = 24.8 ms = T_step 48 − t_lb 23.2 ✓</text>
  <text x="484" y="398" text-anchor="middle" font-size="10.5" fill="#475569">池子互斥：修 host 不碰 kernel 池，改 kernel 不影响 gap 池——六个池各自封顶后求和 = 总空间（面试标准答法）</text>

  <!-- t_lb composition -->
  <rect x="30" y="434" width="908" height="112" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="484" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">t_lb 23.2 ms 的字节口径（分子，逐项可辩护 —— 9.06 GB @ 392 GB/s 示例）</text>
  <!-- bar: 908-60=848px wide? use inner width 848 for 23.2ms → 36.55px/ms; x from 60 to 908 -->
  <rect x="60"  y="472" width="57"  height="22" fill="#b91c1c"/>
  <rect x="117" y="472" width="650" height="22" fill="#f59e0b"/>
  <rect x="767" y="472" width="112" height="22" fill="#2563eb"/>
  <rect x="879" y="472" width="29"  height="22" fill="#64748b"/>
  <rect x="60"  y="472" width="848" height="22" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="88"  y="488" text-anchor="middle" font-size="9" fill="#fff">1.6</text>
  <text x="442" y="488" text-anchor="middle" font-size="10.5" fill="#fff">其余 GEMM + lm_head 17.8（16.2 + 1.6）</text>
  <text x="823" y="488" text-anchor="middle" font-size="9" fill="#fff">3.1</text>
  <text x="893" y="488" text-anchor="middle" font-size="8.5" fill="#fff">0.8</text>
  <text x="60" y="512" font-size="10" fill="#475569">■ o_proj 权重 0.60GB　■ 其余 GEMM+lm_head 6.96GB　■ KV cache 1.20GB（16×512×147KB）　■ 激活/写回/采样 ~0.3GB</text>
  <text x="60" y="532" font-size="10" fill="#64748b">口径提醒：Day 37 的"权重 8.2GB"是含 embedding 的容量口径；本表是"每 step 必须过 HBM"口径——混用是闭合偏差的头号病因</text>

  <text x="480" y="572" text-anchor="middle" font-size="10" fill="#94a3b8">数字皆为示例（Qwen3-8B W8A8、单卡 TP=1、392GB/s 示例带宽、C=16 剖析档），以你的 ledger.md 为准</text>
</svg>
