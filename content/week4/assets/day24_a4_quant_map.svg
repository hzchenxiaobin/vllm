<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect width="980" height="760" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A365D">专题 A4：《量化》一页地图 —— 原理 / 场景 / 权衡 / 失效模式</text>

  <!-- center node -->
  <rect x="390" y="350" width="200" height="60" rx="12" fill="#1A365D"/>
  <text x="490" y="377" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">量化</text>
  <text x="490" y="396" text-anchor="middle" font-size="10.5" fill="#BEE3F8">缩放 · 取整 · 截断 —— 一切方案的同一句话</text>

  <!-- Q1: 原理 (top-left) -->
  <rect x="30" y="60" width="440" height="260" rx="10" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="50" y="88" font-size="14" font-weight="bold" fill="#2B6CB0">① 原理（为什么能用）</text>

  <text x="50" y="115" font-size="11" font-weight="bold" fill="#2D3748">统一框架</text>
  <text x="50" y="132" font-size="10.5" fill="#2D3748">q = clamp(round(x/s)+z)，误差 = 噪声(良性, ~6dB/bit) + 截断(恶性, outlier 连锁)</text>

  <text x="50" y="157" font-size="11" font-weight="bold" fill="#2D3748">粒度光谱</text>
  <text x="50" y="174" font-size="10.5" fill="#2D3748">per-tensor → channel / token → group：粒度越细 outlier 隔离越好，kernel 越难写</text>

  <text x="50" y="199" font-size="11" font-weight="bold" fill="#2D3748">FP8 E4M3 格点特性</text>
  <text x="50" y="216" font-size="10.5" fill="#2D3748">指数位 → 每个数量级自带格点密度 → outlier 不拖垮小值 → 免校准（W8A8-dyn 主线）</text>

  <text x="50" y="241" font-size="11" font-weight="bold" fill="#2D3748">三大 PTQ 算法一句话</text>
  <text x="50" y="258" font-size="10.5" fill="#2D3748">SmoothQuant 搬家（α 迁移，代数恒等）· AWQ 保重点（~1% 显著通道）· GPTQ 边量边修</text>

  <text x="50" y="283" font-size="11" font-weight="bold" fill="#2D3748">收益的第一性原理</text>
  <text x="50" y="300" font-size="10.5" fill="#2D3748">decode 赚带宽（TPOT↓，Day 22 §5.1）· prefill 赚算力（TTFT↓, Amdahl）· 显存赚容量（Day 23）</text>

  <!-- Q2: 场景 (top-right) -->
  <rect x="510" y="60" width="440" height="260" rx="10" fill="#C6F6D5" stroke="#276749"/>
  <text x="530" y="88" font-size="14" font-weight="bold" fill="#276749">② 场景（什么时候用哪个）</text>

  <text x="530" y="112" font-size="10.5" font-weight="bold" fill="#22543D">瓶颈 → 首选</text>
  <text x="530" y="130" font-size="10.5" fill="#22543D">decode 重 / TPOT SLO 紧 → FP8 W8A8-dynamic（带宽 ÷2，kernel 成熟）</text>
  <text x="530" y="148" font-size="10.5" fill="#22543D">prefill 重（长文档、RAG 注入）→ FP8（算力 ×2，Amdahl 后 ~1.3-1.4×）</text>
  <text x="530" y="166" font-size="10.5" fill="#22543D">显存装不下模型 → W4A16 GPTQ/AWQ（权重 ÷4；TTFT 不受益甚至负）</text>
  <text x="530" y="184" font-size="10.5" fill="#22543D">并发 / 上下文被 KV 卡 → KV FP8（容量 ×2，Day 23）</text>
  <text x="530" y="202" font-size="10.5" fill="#22543D">Ampere 及更老硬件（无 FP8）→ W4A16 Marlin / INT8+SmoothQuant</text>
  <text x="530" y="220" font-size="10.5" fill="#22543D">精度敏感（金融/医疗/长 CoT）→ BF16 或 FP8 + 三道闸强验证</text>

  <text x="530" y="248" font-size="10.5" font-weight="bold" fill="#22543D">获取途径</text>
  <text x="530" y="266" font-size="10.5" fill="#22543D">官方 FP8 ckpt（快）· llm-compressor 自产（可控，compressed-tensors 格式）· 社区 GPTQ/AWQ（存量兜底）</text>
  <text x="530" y="290" font-size="10.5" font-weight="bold" fill="#22543D">校准集（3.3 节）</text>
  <text x="530" y="308" font-size="10.5" fill="#22543D">512×2048 经验值（Hessian 噪声 ∝ √(d/n)）；分布贴目标域 > 数量</text>

  <!-- Q3: 权衡 (bottom-left) -->
  <rect x="30" y="450" width="440" height="260" rx="10" fill="#FFFAF0" stroke="#DD6B20"/>
  <text x="50" y="478" font-size="14" font-weight="bold" fill="#9C4221">③ 权衡（四维对比）</text>

  <text x="50" y="502" font-size="10.5" font-weight="bold" fill="#7B341E">FP8 W8A8-dyn：TPOT ÷~1.3 · TTFT ×1.3-1.4 · 显存 ÷2 · 精度近无损 · 工程最省</text>
  <text x="50" y="520" font-size="10.5" fill="#7B341E">W4A16 GPTQ：TPOT 低并发最优 · TTFT ≤1× · 显存 ÷4 · 精度 1~3% · 依赖 Marlin 覆盖度</text>
  <text x="50" y="538" font-size="10.5" fill="#7B341E">INT8 W8A8+SQ：FP8 的无 FP8 硬件替身 · 多一步搬家校准 · kernel 生态弱于 FP8</text>
  <text x="50" y="556" font-size="10.5" fill="#7B341E">KV FP8：并发/上下文 ×2（goodput）· 长上下文 TPOT↓ · K 敏感要盯（Day 23）</text>

  <text x="50" y="584" font-size="10.5" font-weight="bold" fill="#7B341E">收益随 batch 衰减</text>
  <text x="50" y="602" font-size="10.5" fill="#7B341E">TPOT 比 ≈ (W_q+KV+ovh)/(W+KV+ovh)：batch 大 → KV 主导 → 权重量化稀释到不可见</text>

  <text x="50" y="630" font-size="10.5" font-weight="bold" fill="#7B341E">验收公式</text>
  <text x="50" y="648" font-size="10.5" fill="#7B341E">PPL 比 = e^ΔNLL（0.01 → +1%）；TTFT 加速 = 1/((1-f)+f/2)，f≈GEMM 占比</text>
  <text x="50" y="666" font-size="10.5" fill="#7B341E">W4 每 128 权重 +1 个 FP16 scale ≈ +3% 体积（4.125 bit/weight）</text>

  <!-- Q4: 失效模式 (bottom-right) -->
  <rect x="510" y="450" width="440" height="260" rx="10" fill="#FFF5F5" stroke="#C53030"/>
  <text x="530" y="478" font-size="14" font-weight="bold" fill="#C53030">④ 失效模式（症状 → 机制 → 处置）</text>

  <text x="530" y="502" font-size="10.5" fill="#742A2A">PPL 好 but 生成崩 → lm_head 被量化（采样分布偏移）→ ignore lm_head</text>
  <text x="530" y="520" font-size="10.5" fill="#742A2A">目标域劣化 → 校准分布漂移（代码 vs 对话）→ 换贴域校准集 / 动态激活</text>
  <text x="530" y="538" font-size="10.5" fill="#742A2A">INT8 激活雪崩 → per-tensor 扛不住 outlier → SmoothQuant / FP8</text>
  <text x="530" y="556" font-size="10.5" fill="#742A2A">长上下文注意力漂移 → K 的 channel 误差被 softmax 放大 → KV scale 校准 / 回 BF16 KV</text>
  <text x="530" y="574" font-size="10.5" fill="#742A2A">大 batch 吞吐反降 → W4 dequant 开销 + BF16 计算 → 该负载用 FP8</text>
  <text x="530" y="592" font-size="10.5" fill="#742A2A">kernel fallback → 形状/MoE 结构不被 Marlin 覆盖 → 看启动日志换路径</text>
  <text x="530" y="610" font-size="10.5" fill="#742A2A">P/D 或跨实例 KV 错乱 → 两端 dtype+scale 不一致（block hash 不含 dtype）→ 部署强约束</text>
  <text x="530" y="634" font-size="10.5" font-weight="bold" fill="#C53030">验收三道闸（漏一道 = 裸奔上线）</text>
  <text x="530" y="652" font-size="10.5" fill="#742A2A">精度：PPL(≤1%/2~3%) + 生成 diff + lm-eval 掉点 ≤1~2pt</text>
  <text x="530" y="670" font-size="10.5" fill="#742A2A">性能：TTFT/TPOT p99 + goodput（对照预期公式）· 资源：weights GiB / GPU blocks</text>

  <!-- arrows from center -->
  <line x1="430" y1="350" x2="300" y2="330" stroke="#4A5568" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="550" y1="350" x2="690" y2="330" stroke="#4A5568" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="430" y1="410" x2="300" y2="444" stroke="#4A5568" stroke-width="1.5" marker-end="url(#b)"/>
  <line x1="550" y1="410" x2="690" y2="444" stroke="#4A5568" stroke-width="1.5" marker-end="url(#b)"/>

  <text x="490" y="340" text-anchor="middle" font-size="10" fill="#A0AEC0">Day 22（框架/算法）+ Day 23（KV/容量）+ Day 24（工具链/验收）三页收拢</text>
  <text x="30" y="742" font-size="10" fill="#A0AEC0">打印为独立 A4；数字均为 H100-80G · Qwen3-8B 设定下的量级参考，上线前以自己的三道闸实测为准</text>
</svg>
