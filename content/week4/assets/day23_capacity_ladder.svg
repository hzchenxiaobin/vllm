<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C53030"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1A365D">同一张 80GB 卡的三种活法 —— KV 量化 = 容量翻倍（Qwen3-8B，平均上下文 16K）</text>
  <text x="450" y="56" text-anchor="middle" font-size="12" fill="#718096">假设：H100-80G · gpu_memory_utilization=0.92（预算 73.6GB）· 预留 5GB（激活峰值 + CUDA Graph）· 柱高约 5px/GB</text>

  <!-- Bar A: BF16 weights + BF16 KV -->
  <rect x="95" y="63" width="140" height="260" fill="#3182CE"/>
  <rect x="95" y="323" width="140" height="25" fill="#A0AEC0"/>
  <rect x="95" y="348" width="140" height="82" fill="#E53E3E"/>
  <text x="165" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">KV 池 52.2 GB</text>
  <text x="165" y="203" text-anchor="middle" font-size="11" fill="#EBF8FF">每 token 144 KB</text>
  <text x="165" y="339" text-anchor="middle" font-size="10" fill="#2D3748">预留 5 GB</text>
  <text x="165" y="383" text-anchor="middle" font-size="11" fill="#ffffff">权重 BF16</text>
  <text x="165" y="398" text-anchor="middle" font-size="11" fill="#ffffff">16.4 GB</text>
  <text x="165" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A365D">A：BF16 权重 + BF16 KV</text>

  <!-- Bar B: BF16 weights + FP8 KV -->
  <rect x="375" y="63" width="140" height="260" fill="#3182CE"/>
  <rect x="375" y="323" width="140" height="25" fill="#A0AEC0"/>
  <rect x="375" y="348" width="140" height="82" fill="#E53E3E"/>
  <text x="445" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">KV 池 52.2 GB</text>
  <text x="445" y="203" text-anchor="middle" font-size="11" fill="#EBF8FF">每 token 72 KB（FP8）</text>
  <text x="445" y="339" text-anchor="middle" font-size="10" fill="#2D3748">预留 5 GB</text>
  <text x="445" y="383" text-anchor="middle" font-size="11" fill="#ffffff">权重 BF16</text>
  <text x="445" y="398" text-anchor="middle" font-size="11" fill="#ffffff">16.4 GB</text>
  <text x="445" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A365D">B：BF16 权重 + FP8 KV</text>

  <!-- Bar C: FP8 weights + FP8 KV -->
  <rect x="655" y="62" width="140" height="302" fill="#3182CE"/>
  <rect x="655" y="364" width="140" height="25" fill="#A0AEC0"/>
  <rect x="655" y="389" width="140" height="41" fill="#DD6B20"/>
  <text x="725" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">KV 池 60.4 GB</text>
  <text x="725" y="203" text-anchor="middle" font-size="11" fill="#EBF8FF">每 token 72 KB（FP8）</text>
  <text x="725" y="380" text-anchor="middle" font-size="10" fill="#2D3748">预留 5 GB</text>
  <text x="725" y="404" text-anchor="middle" font-size="10.5" fill="#ffffff">权重 FP8 8.2 GB</text>
  <text x="725" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1A365D">C：FP8 权重 + FP8 KV</text>

  <!-- Capacity chips -->
  <rect x="70" y="470" width="190" height="52" rx="8" fill="#EBF8FF" stroke="#3182CE"/>
  <text x="165" y="491" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">token 容量 ≈ 354K</text>
  <text x="165" y="511" text-anchor="middle" font-size="11.5" fill="#2D3748">并发（16K ctx）≈ 21 条</text>

  <line x1="262" y1="496" x2="344" y2="496" stroke="#C53030" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="305" y="490" text-anchor="middle" font-size="20" font-weight="bold" fill="#C53030">×2</text>
  <text x="305" y="516" text-anchor="middle" font-size="10" fill="#C53030">b: 2 → 1</text>

  <rect x="350" y="470" width="190" height="52" rx="8" fill="#EBF8FF" stroke="#3182CE"/>
  <text x="445" y="491" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">token 容量 ≈ 708K</text>
  <text x="445" y="511" text-anchor="middle" font-size="11.5" fill="#2D3748">并发（16K ctx）≈ 43 条</text>

  <text x="585" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#718096">+8.2 GB</text>
  <text x="585" y="510" text-anchor="middle" font-size="10" fill="#718096">权重省出</text>

  <rect x="630" y="470" width="190" height="52" rx="8" fill="#EBF8FF" stroke="#3182CE"/>
  <text x="725" y="491" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">token 容量 ≈ 819K</text>
  <text x="725" y="511" text-anchor="middle" font-size="11.5" fill="#2D3748">并发（16K ctx）≈ 50 条</text>

  <!-- Propagation strip -->
  <text x="450" y="548" text-anchor="middle" font-size="11" font-style="italic" fill="#718096">容量收益沿调度链路传导（串起 Day 10 / 12 / 15）</text>

  <rect x="25" y="562" width="150" height="46" rx="8" fill="#2B6CB0"/>
  <text x="100" y="582" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">KV FP8</text>
  <text x="100" y="599" text-anchor="middle" font-size="10.5" fill="#EBF8FF">b: 2 → 1</text>
  <line x1="177" y1="585" x2="201" y2="585" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="205" y="562" width="150" height="46" rx="8" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="280" y="582" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2B6CB0">每 block 字节 ÷2</text>
  <text x="280" y="599" text-anchor="middle" font-size="10.5" fill="#2D3748">结构不变（Day 15）</text>
  <line x1="357" y1="585" x2="381" y2="585" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="385" y="562" width="150" height="46" rx="8" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="460" y="582" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2B6CB0">可用 block ×2</text>
  <text x="460" y="599" text-anchor="middle" font-size="10.5" fill="#2D3748">KVCacheManager</text>
  <line x1="537" y1="585" x2="561" y2="585" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="565" y="562" width="150" height="46" rx="8" fill="#EBF8FF" stroke="#2B6CB0"/>
  <text x="640" y="582" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2B6CB0">调度 budget ×2</text>
  <text x="640" y="599" text-anchor="middle" font-size="10.5" fill="#2D3748">preemption ↓ → 0</text>
  <line x1="717" y1="585" x2="741" y2="585" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="745" y="562" width="150" height="46" rx="8" fill="#C6F6D5" stroke="#276749"/>
  <text x="820" y="582" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">goodput ↑</text>
  <text x="820" y="599" text-anchor="middle" font-size="10.5" fill="#22543D">尾延迟 ↓</text>
</svg>
