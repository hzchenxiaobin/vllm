<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d51a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="d51r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1060" height="520" fill="#fafbfc"/>
  <text x="530" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">抢占循环：触发 → 选受害者 → 释放 → 排队 → 全量重算恢复</text>
  <text x="530" y="52" text-anchor="middle" font-size="12" fill="#64748b">vllm/v1/core/scheduler.py: schedule() 抢占分支 ｜ vllm/v1/core/kv_cache_manager.py: allocate_slots() / free()</text>

  <!-- A trigger -->
  <rect x="40" y="80" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="140" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">running 中请求跨块边界</text>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#166534">token 数 &gt; 16 × 已有块数，需 +1 新块</text>

  <!-- B decision -->
  <polygon points="320,60 410,110 320,160 230,110" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="320" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">空闲块 ≥ 1 ?</text>
  <text x="320" y="124" text-anchor="middle" font-size="10.5" fill="#854d0e">allocate_slots()</text>

  <!-- C yes -->
  <rect x="480" y="80" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="580" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">分配新块</text>
  <text x="580" y="124" text-anchor="middle" font-size="11" fill="#166534">继续 decode，无感知</text>

  <!-- D victim -->
  <rect x="230" y="200" width="220" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="340" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">抢占：running 队尾弹出受害者</text>
  <text x="340" y="243" text-anchor="middle" font-size="10.5" fill="#991b1b">FCFS 保老弃新 · 不看完成度</text>
  <text x="340" y="258" text-anchor="middle" font-size="10.5" fill="#991b1b">例：R10 已 79/80 token 仍被抢</text>

  <!-- E free -->
  <rect x="510" y="200" width="220" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="620" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">释放受害者【全部】块</text>
  <text x="620" y="243" text-anchor="middle" font-size="10.5" fill="#991b1b">kv_cache_manager.free(victim)</text>
  <text x="620" y="258" text-anchor="middle" font-size="10.5" fill="#991b1b">例：R9 释放 11 块（176 tok）</text>

  <!-- F waiting -->
  <rect x="790" y="200" width="230" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="905" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">受害者 → waiting 队首</text>
  <text x="905" y="243" text-anchor="middle" font-size="10.5" fill="#334155">status = PREEMPTED</text>
  <text x="905" y="258" text-anchor="middle" font-size="10.5" fill="#334155">已生成 token 保留（G 不丢）</text>

  <!-- G wait condition -->
  <rect x="790" y="310" width="230" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="905" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854d0e">等待恢复条件</text>
  <text x="905" y="354" text-anchor="middle" font-size="11" fill="#854d0e">闲块 ≥ ceil((P + G) / 16)</text>

  <!-- H resume -->
  <rect x="510" y="310" width="220" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">恢复 = 全量重算</text>
  <text x="620" y="354" text-anchor="middle" font-size="11" fill="#1e40af">prefill (P + G) 个 token，回 running</text>

  <!-- arrows -->
  <line x1="240" y1="110" x2="228" y2="110" stroke="#475569" stroke-width="1.8" marker-end="url(#d51a)"/>
  <line x1="410" y1="110" x2="478" y2="110" stroke="#16a34a" stroke-width="1.8" marker-end="url(#d51a)"/>
  <text x="444" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">是</text>
  <line x1="320" y1="160" x2="320" y2="198" stroke="#dc2626" stroke-width="1.8" marker-end="url(#d51r)"/>
  <text x="332" y="182" font-size="11" font-weight="700" fill="#dc2626">否：触发抢占</text>
  <line x1="450" y1="232" x2="508" y2="232" stroke="#dc2626" stroke-width="1.8" marker-end="url(#d51r)"/>
  <line x1="730" y1="232" x2="788" y2="232" stroke="#dc2626" stroke-width="1.8" marker-end="url(#d51r)"/>
  <line x1="905" y1="264" x2="905" y2="308" stroke="#475569" stroke-width="1.8" marker-end="url(#d51a)"/>
  <line x1="788" y1="340" x2="732" y2="340" stroke="#475569" stroke-width="1.8" marker-end="url(#d51a)"/>
  <path d="M 508 340 L 140 340 L 140 144" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#d51a)"/>
  <text x="300" y="332" font-size="11" fill="#64748b">重算后回到 decode 循环（TTFT 视角：该请求等效排了两次队）</text>

  <!-- cost panel -->
  <rect x="40" y="396" width="980" height="104" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60" y="420" font-size="13" font-weight="700" fill="#0f172a">代价对比（以 R9 为例：P + G = 176 token，Qwen3-8B，k_v ≈ 144 KB/token）</text>
  <rect x="60" y="432" width="460" height="54" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="290" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">recompute：FLOPs = 2 · N_params · (P+G)</text>
  <text x="290" y="472" text-anchor="middle" font-size="11" fill="#1e3a8a">2 × 8.2e9 × 176 ≈ 2.9 TFLOP → A100 约 15~25 ms</text>
  <rect x="540" y="432" width="460" height="54" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="770" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">swap（V0 遗产）：字节 = (P+G) · k_v</text>
  <text x="770" y="472" text-anchor="middle" font-size="11" fill="#7f1d1d">176 × 144KB ≈ 25 MB → PCIe4.0×16 约 1.6 ms，但需 CPU 池 + 异步链路</text>
</svg>
