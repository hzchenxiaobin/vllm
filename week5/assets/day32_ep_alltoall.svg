  <text x="290" y="362" font-size="11" font-weight="bold" fill="#B9770E" text-anchor="middle">combine：all-to-all ②（各专家输出加权收回，token 回原卡）</text>
  <line x1="97" y1="326" x2="97" y2="342" stroke="#E67E22" stroke-width="1.4" marker-end="url(#a3o)"/>
  <line x1="222" y1="326" x2="222" y2="342" stroke="#E67E22" stroke-width="1.4" marker-end="url(#a3o)"/>
  <line x1="347" y1="326" x2="347" y2="342" stroke="#E67E22" stroke-width="1.4" marker-end="url(#a3o)"/>
  <line x1="472" y1="326" x2="472" y2="342" stroke="#E67E22" stroke-width="1.4" marker-end="url(#a3o)"/>

  <text x="290" y="396" font-size="10" fill="#7F8C8D" text-anchor="middle">每 token 通信量 ≈ 2·E·H·b（E ≤ top-k 个不同目的卡）；DeepSeek-V3：256 专家选 8 + 1 共享，671B 总参 / 37B 激活</text>
  <text x="290" y="414" font-size="10" fill="#B9770E" text-anchor="middle" font-weight="bold">对比 TP 切专家：GEMM 更碎 + 每层 2 次 all-reduce → EP 用 all-to-all 换完整 GEMM 形状</text>

