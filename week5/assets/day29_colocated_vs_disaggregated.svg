<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2C3E50"/>
    </marker>
    <marker id="a3r" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
    <marker id="a3g" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27AE60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#1e3a5f">图 3｜Colocated vs P/D 分离：把两个打架的 SLO 拆到两池资源上</text>

  <!-- ============ divider ============ -->
  <line x1="476" y1="50" x2="476" y2="600" stroke="#D5DBDB" stroke-width="1.5" stroke-dasharray="2 4"/>

  <!-- ============ LEFT: colocated ============ -->
  <rect x="150" y="58" width="180" height="36" rx="6" fill="#F4F6F7" stroke="#7F8C8D"/>
  <text x="240" y="81" font-size="12" fill="#2C3E50" text-anchor="middle" font-weight="bold">客户端（流式）</text>
  <line x1="240" y1="94" x2="240" y2="122" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="40" y="126" width="400" height="264" rx="8" fill="#FEF9F2" stroke="#E67E22" stroke-width="2"/>
  <text x="240" y="150" font-size="14" font-weight="bold" fill="#B9770E" text-anchor="middle">Colocated 实例池（vLLM V1 默认形态）</text>
  <text x="240" y="166" font-size="10" fill="#9C640C" text-anchor="middle">prefill 与 decode 混在同一实例、同一条调度队列</text>

  <!-- step strip -->
  <g>
    <rect x="60"  y="180" width="40" height="34" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="105" y="180" width="80" height="34" fill="#FDEBD0" stroke="#E67E22"/>
    <rect x="190" y="180" width="40" height="34" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="235" y="180" width="80" height="34" fill="#FDEBD0" stroke="#E67E22"/>
    <rect x="320" y="180" width="40" height="34" fill="#EBF5FB" stroke="#2E86C1"/>
    <rect x="365" y="180" width="55" height="34" fill="#F4F6F7" stroke="#BDC3C7"/>
    <text x="80"  y="201" font-size="9"  fill="#2E86C1" text-anchor="middle">dec</text>
    <text x="145" y="201" font-size="9"  fill="#B9770E" text-anchor="middle">chunk+dec</text>
    <text x="210" y="201" font-size="9"  fill="#2E86C1" text-anchor="middle">dec</text>
    <text x="275" y="201" font-size="9"  fill="#B9770E" text-anchor="middle">chunk+dec</text>
    <text x="340" y="201" font-size="9"  fill="#2E86C1" text-anchor="middle">dec</text>
    <text x="392" y="201" font-size="9"  fill="#7F8C8D" text-anchor="middle">…</text>
  </g>
  <text x="240" y="232" font-size="10" fill="#9C640C" text-anchor="middle">同一个 token budget 里混排 chunk 与 decode（图 1 的机制）</text>

  <g font-size="12" fill="#2C3E50">
    <text x="62" y="262">• TTFT 与 TPOT 挤同一条调度队列</text>
    <text x="62" y="286">• chunk 大小 C = 在两个 SLO 之间搬代价（图 2 窗口）</text>
    <text x="62" y="310">• 容量配比锁死 1:1，无法按负载画像（L_in:L_out）扩</text>
    <text x="62" y="334">• 混批形状波动 → kernel 选择 / CUDA Graph 双输</text>
    <text x="62" y="358">• KV 池与算力同卡耦合：扩并发就要复制整套实例</text>
  </g>

  <rect x="55" y="404" width="370" height="52" rx="6" fill="#FDEDEC" stroke="#C0392B"/>
  <text x="240" y="425" font-size="12" font-weight="bold" fill="#C0392B" text-anchor="middle">结果：goodput = f(唯一参数 C) —— 窗口外必违约</text>
  <text x="240" y="443" font-size="11" fill="#C0392B" text-anchor="middle">chunk 小 → TTFT p99 ↑　　chunk 大 → TPOT p99 ↑</text>

  <rect x="55" y="472" width="370" height="40" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="240" y="497" font-size="11" fill="#2C3E50" text-anchor="middle">优点（诚实）：无 KV 跨实例搬运、部署最简单、低负载够用</text>

  <!-- ============ RIGHT: disaggregated ============ -->
  <rect x="630" y="58" width="180" height="36" rx="6" fill="#F4F6F7" stroke="#7F8C8D"/>
  <text x="720" y="81" font-size="12" fill="#2C3E50" text-anchor="middle" font-weight="bold">客户端（流式）</text>
  <line x1="700" y1="94" x2="700" y2="118" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>
  <text x="690" y="110" font-size="9" fill="#7F8C8D" text-anchor="end">请求</text>

  <rect x="600" y="122" width="240" height="44" rx="8" fill="#F4ECF7" stroke="#8E44ED" stroke-width="2"/>
  <text x="720" y="141" font-size="13" font-weight="bold" fill="#6C3483" text-anchor="middle">Router</text>
  <text x="720" y="158" font-size="10" fill="#6C3483" text-anchor="middle">KV 亲和 / 负载感知路由（Day 34）</text>

  <line x1="740" y1="94" x2="740" y2="70" stroke="#27AE60" stroke-width="1.5" marker-end="url(#a3g)"/>
  <text x="752" y="110" font-size="9" fill="#27AE60">token 流回</text>
  <path d="M 720 166 L 720 190 L 605 190 L 605 244" fill="none" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>
  <path d="M 720 166 L 720 190 L 835 190 L 835 240" fill="none" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- prefill pool -->
  <rect x="505" y="246" width="200" height="150" rx="8" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
  <text x="605" y="270" font-size="13" font-weight="bold" fill="#B9770E" text-anchor="middle">Prefill 池 · n_p 台</text>
  <g font-size="11" fill="#2C3E50">
    <text x="520" y="296">• 大 chunk、奔满 MFU</text>
    <text x="520" y="318">• 队列长度控制 TTFT</text>
    <text x="520" y="340">• 无需大 KV 显存</text>
    <text x="520" y="362">• 选算力强的卡/精度</text>
  </g>

  <!-- decode pool -->
  <rect x="745" y="246" width="200" height="150" rx="8" fill="#EBF5FB" stroke="#2E86C1" stroke-width="2"/>
  <text x="845" y="270" font-size="13" font-weight="bold" fill="#1A5276" text-anchor="middle">Decode 池 · n_d 台</text>
  <g font-size="11" fill="#2C3E50">
    <text x="760" y="296">• 稳定 batch + CUDA Graph</text>
    <text x="760" y="318">• TPOT 平稳无尖刺</text>
    <text x="760" y="340">• 大 KV 池（并发资产）</text>
    <text x="760" y="362">• 选带宽/显存优的配置</text>
  </g>

  <!-- KV transfer -->
  <line x1="705" y1="400" x2="745" y2="400" stroke="#C0392B" stroke-width="4" marker-end="url(#a3r)"/>
  <text x="725" y="424" font-size="10" font-weight="bold" fill="#C0392B" text-anchor="middle">KV 传输</text>
  <text x="725" y="438" font-size="9" fill="#C0392B" text-anchor="middle">逐层流水隐藏（Day 30）</text>

  <!-- token return path -->
  <path d="M 835 396 L 835 210 L 716 210 L 716 168" fill="none" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a3g)"/>
  <text x="850" y="300" font-size="9" fill="#27AE60">生成 token</text>
  <text x="850" y="312" font-size="9" fill="#27AE60">经 router 回流</text>

  <!-- capacity ratio -->
  <rect x="505" y="452" width="440" height="44" rx="6" fill="#EAF2F8" stroke="#2E86C1"/>
  <text x="725" y="470" font-size="12" font-weight="bold" fill="#1A5276" text-anchor="middle">容量配比独立扩展：n_p : n_d ≈ (λ·L_in / C_p) : (λ·L_out / C_d)</text>
  <text x="725" y="488" font-size="10" fill="#1A5276" text-anchor="middle">对话 ~1:1～1:3、摘要 ~10:1、分类 ~100:1 —— 按负载画像配，不再锁死 1:1</text>

  <!-- goodput -->
  <rect x="505" y="508" width="440" height="40" rx="6" fill="#E9F7EF" stroke="#27AE60"/>
  <text x="725" y="526" font-size="12" font-weight="bold" fill="#1E8449" text-anchor="middle">goodput ↑ 1.5-3×（DistServe 论文口径最高 ~4.5×）</text>
  <text x="725" y="542" font-size="10" fill="#1E8449" text-anchor="middle">SLO 越严、模型越大（M* 矛盾尖锐）、负载越重，收益越明显</text>

  <!-- cost -->
  <rect x="505" y="560" width="440" height="44" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="725" y="578" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">代价：三个新故障域 —— ① 路由 ② KV 传输 ③ 双池容量管理</text>
  <text x="725" y="595" font-size="10" fill="#7F8C8D" text-anchor="middle">（分别对应 Day 34 / Day 30 / Day 31 的主题）</text>

  <!-- bottom strip -->
  <rect x="30" y="618" width="900" height="32" rx="6" fill="#1e3a5f"/>
  <text x="480" y="638" font-size="12" fill="#FFFFFF" text-anchor="middle">同一份硬件，两种自由度：colocated 用一个参数 C 在两个 SLO 之间搬代价；分离把约束拆开，让每侧各自奔满自己的最优点。</text>
</svg>
