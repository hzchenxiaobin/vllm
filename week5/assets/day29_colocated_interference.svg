<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7F8C8D"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="580" fill="#FFFFFF"/>
  <text x="30" y="34" font-size="18" font-weight="bold" fill="#1e3a5f">图 1｜Colocated 混跑：一个 chunk 如何打爆 decode 的 ITL（示意，非严格比例）</text>

  <!-- ===== Lane A: GPU step timeline ===== -->
  <text x="30" y="72" font-size="14" font-weight="bold" fill="#2C3E50">GPU 侧：同一实例的 step 时间线（step 串行执行）</text>

  <!-- decode steps -->
  <rect x="40"  y="88" width="62" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5"/>
  <rect x="112" y="88" width="62" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5"/>
  <rect x="184" y="88" width="62" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="71"  y="112" font-size="11" fill="#2E86C1" text-anchor="middle">decode</text>
  <text x="71"  y="127" font-size="11" fill="#2E86C1" text-anchor="middle">step</text>
  <text x="71"  y="142" font-size="11" font-weight="bold" fill="#2E86C1" text-anchor="middle">~10ms</text>
  <text x="143" y="112" font-size="11" fill="#2E86C1" text-anchor="middle">decode</text>
  <text x="143" y="127" font-size="11" fill="#2E86C1" text-anchor="middle">step</text>
  <text x="143" y="142" font-size="11" font-weight="bold" fill="#2E86C1" text-anchor="middle">~10ms</text>
  <text x="215" y="112" font-size="11" fill="#2E86C1" text-anchor="middle">decode</text>
  <text x="215" y="127" font-size="11" fill="#2E86C1" text-anchor="middle">step</text>
  <text x="215" y="142" font-size="11" font-weight="bold" fill="#2E86C1" text-anchor="middle">~10ms</text>

  <!-- mixed step -->
  <rect x="258" y="88" width="440" height="58" rx="4" fill="#FDEBD0" stroke="#E67E22" stroke-width="2"/>
  <text x="478" y="108" font-size="12" font-weight="bold" fill="#B9770E" text-anchor="middle">混合 step：chunk 2048 tok ＋ B 个 decode token（同批一起算）</text>
  <text x="478" y="126" font-size="12" fill="#B9770E" text-anchor="middle">耗时 ≈ 2048 / 5654 tok/s ≈ 360ms（Llama-3-70B FP8，40% MFU）</text>
  <text x="478" y="141" font-size="10" fill="#9C640C" text-anchor="middle">vLLM V1 默认 max_num_batched_tokens = 2048</text>

  <!-- decode steps after -->
  <rect x="712" y="88" width="62" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5"/>
  <rect x="784" y="88" width="62" height="58" rx="4" fill="#EBF5FB" stroke="#2E86C1" stroke-width="1.5"/>
  <text x="743" y="112" font-size="11" fill="#2E86C1" text-anchor="middle">decode</text>
  <text x="743" y="127" font-size="11" fill="#2E86C1" text-anchor="middle">step</text>
  <text x="743" y="142" font-size="11" font-weight="bold" fill="#2E86C1" text-anchor="middle">~10ms</text>
  <text x="815" y="112" font-size="11" fill="#2E86C1" text-anchor="middle">decode</text>
  <text x="815" y="127" font-size="11" fill="#2E86C1" text-anchor="middle">step</text>
  <text x="815" y="142" font-size="11" font-weight="bold" fill="#2E86C1" text-anchor="middle">~10ms</text>

  <!-- time axis -->
  <line x1="40" y1="162" x2="900" y2="162" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="905" y="166" font-size="11" fill="#7F8C8D">t</text>

  <!-- middle annotation -->
  <rect x="150" y="182" width="660" height="40" rx="6" fill="#FDEDEC" stroke="#C0392B" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="480" y="199" font-size="13" font-weight="bold" fill="#C0392B" text-anchor="middle">chunk 计算期间，同批的 decode token 一个都吐不出来 —— 路径①：批同步排队</text>
  <text x="480" y="215" font-size="11" fill="#C0392B" text-anchor="middle">（路径②：即使拆成独立 step，prefill step 期间 decode 依旧全停；路径③：混批形状波动毁 kernel/CUDA Graph）</text>

  <!-- ===== Lane B: client-side ITL ===== -->
  <text x="30" y="262" font-size="14" font-weight="bold" fill="#2C3E50">客户端侧：某 decode 请求相邻 token 的间隔（ITL）</text>

  <!-- SLO line: 360ms->170px scale 0.472px/ms; 80ms -> 38px -->
  <line x1="40" y1="440" x2="870" y2="440" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="874" y="444" font-size="11" fill="#C0392B">TPOT SLO</text>
  <text x="874" y="457" font-size="11" fill="#C0392B">= 80ms(p99)</text>

  <!-- baseline -->
  <line x1="40" y1="478" x2="870" y2="478" stroke="#BDC3C7" stroke-width="1.5"/>
  <text x="42" y="493" font-size="11" fill="#7F8C8D">token 到达时刻 →</text>

  <!-- normal stems -->
  <g stroke="#27AE60" stroke-width="2.5">
    <line x1="70"  y1="478" x2="70"  y2="466"/>
    <line x1="105" y1="478" x2="105" y2="466"/>
    <line x1="140" y1="478" x2="140" y2="466"/>
    <line x1="175" y1="478" x2="175" y2="466"/>
    <line x1="210" y1="478" x2="210" y2="466"/>
    <line x1="245" y1="478" x2="245" y2="466"/>
    <line x1="280" y1="478" x2="280" y2="466"/>
    <line x1="315" y1="478" x2="315" y2="466"/>
  </g>
  <g stroke="#2E86C1" stroke-width="2.5">
    <line x1="600" y1="478" x2="600" y2="466"/>
    <line x1="635" y1="478" x2="635" y2="466"/>
    <line x1="670" y1="478" x2="670" y2="466"/>
    <line x1="705" y1="478" x2="705" y2="466"/>
    <line x1="740" y1="478" x2="740" y2="466"/>
    <line x1="775" y1="478" x2="775" y2="466"/>
    <line x1="810" y1="478" x2="810" y2="466"/>
    <line x1="845" y1="478" x2="845" y2="466"/>
  </g>
  <text x="180" y="455" font-size="11" fill="#27AE60" text-anchor="middle">正常 ITL ~5-15ms（受 batch、KV 读取影响）</text>

  <!-- spike stem -->
  <line x1="480" y1="478" x2="480" y2="308" stroke="#C0392B" stroke-width="5"/>
  <circle cx="480" cy="308" r="5" fill="#C0392B"/>
  <line x1="480" y1="300" x2="480" y2="290" stroke="#C0392B" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="497" y="318" font-size="13" font-weight="bold" fill="#C0392B">ITL 尖刺 ≈ T_chunk ＋ T_decode ≈ 360ms</text>
  <text x="497" y="336" font-size="11" fill="#C0392B">= 该 step 排队的 decode token 的实际等待时长</text>
  <text x="497" y="352" font-size="11" fill="#C0392B">≈ 36 × 正常 ITL，直接击穿 p99 SLO</text>

  <!-- bracket showing chunk period -->
  <line x1="330" y1="470" x2="620" y2="470" stroke="#E67E22" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="475" y="462" font-size="10" fill="#E67E22" text-anchor="middle">混合 step 时间窗</text>

  <!-- bottom note -->
  <rect x="30" y="510" width="900" height="56" rx="6" fill="#F4F6F7" stroke="#BDC3C7"/>
  <text x="480" y="531" font-size="12" fill="#2C3E50" text-anchor="middle">尖刺长度与 chunk 大小 C 成正比：C 受 TPOT SLO 约束（上界）；但 C 太小则 prefill GEMM 落入访存 bound、MFU 崩塌（下界）——</text>
  <text x="480" y="550" font-size="12" font-weight="bold" fill="#1e3a5f" text-anchor="middle">两个方向的约束合起来就是 §3.3 的"可行窗口"，本图与图 2 对照阅读。</text>
</svg>
