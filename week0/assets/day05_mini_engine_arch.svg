<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
    <marker id="aD" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="820" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">mini 引擎架构：一条 step 主循环 + 三个调度对象</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">Engine.step() = 调度 → 假执行 → 回收；数据结构只有 Scheduler / BlockPool / Request —— 对应 vLLM 的 EngineCore / block_pool.py / request.py</text>

  <!-- ================= Panel A: step loop ================= -->
  <rect x="40" y="68" width="920" height="165" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="88" font-size="13" font-weight="bold" fill="#475569">Engine.step() 主循环（假执行：前向 = generated += 1）</text>

  <g>
    <rect x="60" y="100" width="195" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="157" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">① schedule()</text>
    <text x="157" y="140" text-anchor="middle" font-size="10.5" fill="#334155">两段式决策：先 running 后 waiting</text>
    <text x="157" y="156" text-anchor="middle" font-size="10.5" fill="#334155">token budget / 抢占判定</text>
    <text x="157" y="176" text-anchor="middle" font-size="9.5" fill="#64748b">vLLM: Scheduler.schedule()</text>

    <rect x="290" y="100" width="195" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="387" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">② 施工单 plan</text>
    <text x="387" y="140" text-anchor="middle" font-size="10.5" fill="#334155">{rid: num_new_tokens}</text>
    <text x="387" y="156" text-anchor="middle" font-size="10.5" fill="#334155">decode=1 / prefill=整段</text>
    <text x="387" y="176" text-anchor="middle" font-size="9.5" fill="#64748b">vLLM: SchedulerOutput（丰富一个量级）</text>

    <rect x="520" y="100" width="195" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="617" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">③ 假执行</text>
    <text x="617" y="140" text-anchor="middle" font-size="10.5" fill="#334155">num_computed += plan[rid]</text>
    <text x="617" y="156" text-anchor="middle" font-size="10.5" fill="#334155">generated += 1（假 token 流）</text>
    <text x="617" y="176" text-anchor="middle" font-size="9.5" fill="#64748b">vLLM: ModelRunner.execute（CUDA Graph 重放）</text>

    <rect x="750" y="100" width="195" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="847" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">④ 回收</text>
    <text x="847" y="140" text-anchor="middle" font-size="10.5" fill="#334155">完成 → free 全部 block、出队</text>
    <text x="847" y="156" text-anchor="middle" font-size="10.5" fill="#334155">被抢 → 已在①处理（回 waiting）</text>
    <text x="847" y="176" text-anchor="middle" font-size="9.5" fill="#64748b">vLLM: update_from_output()</text>

    <line x1="255" y1="145" x2="286" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
    <line x1="485" y1="145" x2="516" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
    <line x1="715" y1="145" x2="746" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#aB)"/>
  </g>
  <path d="M 847 190 L 847 215 L 157 215 L 157 194" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aD)"/>
  <text x="502" y="209" text-anchor="middle" font-size="10.5" fill="#b91c1c">下一个 step —— batch 每步重组，这就是 continuous batching 的本体（Day 3 机制一）</text>

  <!-- ================= Panel B: three objects ================= -->
  <rect x="40" y="248" width="920" height="470" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="270" font-size="13" font-weight="bold" fill="#475569">调度核心三对象与数据流（虚线下方为 vLLM 对应）</text>

  <!-- Scheduler -->
  <rect x="55" y="285" width="300" height="420" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="205" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Scheduler</text>
  <text x="205" y="323" text-anchor="middle" font-size="9.5" fill="#64748b">vllm/v1/core/scheduler.py</text>

  <text x="75" y="350" font-size="11" font-weight="bold" fill="#334155">waiting（deque，FCFS）</text>
  <rect x="85" y="358" width="120" height="24" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="374" text-anchor="middle" font-size="11" fill="#1e293b">r9</text>
  <rect x="85" y="386" width="120" height="24" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="402" text-anchor="middle" font-size="11" fill="#1e293b">r10</text>
  <text x="215" y="372" font-size="9.5" fill="#dc2626">← 被抢请求 appendleft</text>
  <text x="215" y="384" font-size="9.5" fill="#dc2626">　　（队首 = 尽快恢复）</text>
  <text x="215" y="402" font-size="9.5" fill="#16a34a">新请求 append →（队尾）</text>

  <text x="75" y="440" font-size="11" font-weight="bold" fill="#334155">running（list，每步重组）</text>
  <g font-size="10.5" fill="#1e293b">
    <rect x="85" y="448" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="115" y="463" text-anchor="middle" font-weight="bold">r1</text>
    <rect x="149" y="448" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="179" y="463" text-anchor="middle">r2</text>
    <rect x="213" y="448" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="243" y="463" text-anchor="middle">r3</text>
    <rect x="277" y="448" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="307" y="463" text-anchor="middle">r4</text>
    <rect x="85" y="474" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="115" y="489" text-anchor="middle">r5</text>
    <rect x="149" y="474" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="179" y="489" text-anchor="middle">r6</text>
    <rect x="213" y="474" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="243" y="489" text-anchor="middle">r7</text>
    <rect x="277" y="474" width="60" height="22" fill="#dcfce7" stroke="#4ade80" stroke-width="1.2"/><text x="307" y="489" text-anchor="middle">r8</text>
  </g>

  <rect x="75" y="512" width="260" height="96" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="205" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">schedule() 两段式</text>
  <text x="85" y="552" font-size="10.5" fill="#334155">① 保 running（decode 优先，池不够→抢占队尾）</text>
  <text x="85" y="570" font-size="10.5" fill="#334155">② 准入 waiting（原子 prefill：n &gt; budget → 不进）</text>
  <text x="85" y="588" font-size="10.5" fill="#334155">产出 plan；budget = 512 · max_seqs = 6</text>
  <text x="205" y="604" text-anchor="middle" font-size="9.5" fill="#64748b">vLLM: schedule_running() → schedule_waiting()</text>

  <text x="205" y="635" text-anchor="middle" font-size="10.5" fill="#7c2d12">⚠ 队首长 prompt 装不进预算 → 队首阻塞（HOL）</text>
  <text x="205" y="651" text-anchor="middle" font-size="10.5" fill="#7c2d12">　—— 本版无 chunked prefill 的代价（差距清单 #2）</text>
  <text x="205" y="680" text-anchor="middle" font-size="10" fill="#94a3b8">plan: {r1:1, r3:1, r6:64, ...}</text>

  <!-- Request -->
  <rect x="400" y="285" width="260" height="250" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="530" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Request r1</text>
  <text x="530" y="323" text-anchor="middle" font-size="9.5" fill="#64748b">vllm/v1/request.py</text>
  <g font-size="11" fill="#334155">
    <text x="420" y="348">prompt_len　= 64</text>
    <text x="420" y="368">generated　 = 37</text>
    <text x="420" y="388">num_computed = 101</text>
    <text x="420" y="408">num_tokens　= 102</text>
    <text x="420" y="428">status　　　 = RUNNING</text>
  </g>
  <text x="420" y="450" font-size="9.5" fill="#b45309">num_tokens 比 num_computed 多 1：新 token 采样了但还没写 KV</text>
  <text x="420" y="478" font-size="11" font-weight="bold" fill="#334155">block_table（逻辑块 → 物理块）</text>
  <g>
    <rect x="420" y="488" width="48" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="472" y="488" width="48" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="524" y="488" width="48" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <rect x="576" y="488" width="48" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <g font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="444" y="505">3</text><text x="496" y="505">12</text><text x="548" y="505">27</text><text x="600" y="505">33</text>
    </g>
  </g>

  <!-- BlockPool -->
  <rect x="695" y="285" width="250" height="420" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="820" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">BlockPool</text>
  <text x="820" y="323" text-anchor="middle" font-size="9.5" fill="#64748b">vllm/v1/core/block_pool.py · 100 块 × 16 token = 1600 token</text>

  <g font-size="9" text-anchor="middle">
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1">
      <rect x="708" y="335" width="42" height="24"/><rect x="754" y="335" width="42" height="24"/><rect x="800" y="335" width="42" height="24"/><rect x="846" y="335" width="42" height="24"/><rect x="892" y="335" width="42" height="24"/>
      <rect x="708" y="363" width="42" height="24" fill="#dcfce7"/><rect x="754" y="363" width="42" height="24"/><rect x="800" y="363" width="42" height="24" fill="#dcfce7"/><rect x="846" y="363" width="42" height="24" fill="#dcfce7"/><rect x="892" y="363" width="42" height="24"/>
      <rect x="708" y="391" width="42" height="24" fill="#dcfce7"/><rect x="754" y="391" width="42" height="24" fill="#dcfce7"/><rect x="800" y="391" width="42" height="24"/><rect x="846" y="391" width="42" height="24"/><rect x="892" y="391" width="42" height="24" fill="#dcfce7"/>
      <rect x="708" y="419" width="42" height="24"/><rect x="754" y="419" width="42" height="24" fill="#dcfce7"/><rect x="800" y="419" width="42" height="24" fill="#dcfce7"/><rect x="846" y="419" width="42" height="24"/><rect x="892" y="419" width="42" height="24" fill="#dcfce7"/>
      <rect x="708" y="447" width="42" height="24" fill="#dcfce7"/><rect x="754" y="447" width="42" height="24"/><rect x="800" y="447" width="42" height="24" fill="#dcfce7"/><rect x="846" y="447" width="42" height="24"/><rect x="892" y="447" width="42" height="24"/>
      <rect x="708" y="475" width="42" height="24" fill="#dcfce7"/><rect x="754" y="475" width="42" height="24" fill="#dcfce7"/><rect x="800" y="475" width="42" height="24"/><rect x="846" y="475" width="42" height="24" fill="#dcfce7"/><rect x="892" y="475" width="42" height="24" fill="#dcfce7"/>
      <rect x="708" y="503" width="42" height="24"/><rect x="754" y="503" width="42" height="24" fill="#dcfce7"/><rect x="800" y="503" width="42" height="24" fill="#dcfce7"/><rect x="846" y="503" width="42" height="24"/><rect x="892" y="503" width="42" height="24"/>
    </g>
    <!-- r1's blocks: 3, 12, 27, 33 -->
    <rect x="846" y="335" width="42" height="24" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <rect x="800" y="391" width="42" height="24" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <rect x="800" y="475" width="42" height="24" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <rect x="846" y="503" width="42" height="24" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
    <g fill="#334155">
      <text x="729" y="351">0</text><text x="775" y="351">1</text><text x="821" y="351">2</text><text x="913" y="351">4</text>
      <text x="729" y="379">5</text><text x="775" y="379">6</text><text x="821" y="379">7</text><text x="867" y="379">8</text><text x="913" y="379">9</text>
      <text x="729" y="407">10</text><text x="775" y="407">11</text><text x="867" y="407">13</text><text x="913" y="407">14</text>
      <text x="729" y="435">15</text><text x="775" y="435">16</text><text x="821" y="435">17</text><text x="867" y="435">18</text><text x="913" y="435">19</text>
      <text x="729" y="463">20</text><text x="775" y="463">21</text><text x="821" y="463">22</text><text x="867" y="463">23</text><text x="913" y="463">24</text>
      <text x="729" y="491">25</text><text x="775" y="491">26</text><text x="867" y="491">28</text><text x="913" y="491">29</text>
      <text x="729" y="519">30</text><text x="775" y="519">31</text><text x="821" y="519">32</text><text x="913" y="519">34</text>
    </g>
    <g fill="#ffffff" font-weight="bold">
      <text x="867" y="351">3</text><text x="821" y="407">12</text><text x="821" y="491">27</text><text x="867" y="519">33</text>
    </g>
  </g>
  <text x="820" y="545" text-anchor="middle" font-size="9" fill="#94a3b8">… 共 100 块（展示前 35）</text>
  <g font-size="10">
    <rect x="710" y="560" width="14" height="14" fill="#2563eb"/>
    <text x="730" y="571" fill="#334155">r1 占用</text>
    <rect x="790" y="560" width="14" height="14" fill="#dcfce7" stroke="#4ade80"/>
    <text x="810" y="571" fill="#334155">其他请求占用</text>
    <rect x="900" y="560" width="14" height="14" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="920" y="571" fill="#334155">free</text>
  </g>
  <text x="710" y="598" font-size="10" fill="#166534" font-weight="bold">free_ids: deque —— alloc 摘头 / free 挂尾，全 O(1)</text>
  <text x="710" y="614" font-size="9.5" fill="#64748b">（vLLM: free_block_queue 双向链表）</text>
  <text x="710" y="638" font-size="10" fill="#334155">ref_cnt[]: 本版全为 0/1 —— 没有任何路径</text>
  <text x="710" y="653" font-size="10" fill="#334155">让它 &gt; 1：prefix caching 被砍掉的留白</text>
  <text x="710" y="668" font-size="10" fill="#334155">（差距清单 #3：接上需要 hash + COW）</text>

  <!-- block_table arrows -->
  <g stroke="#2563eb" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M 444 514 C 500 560, 760 300, 860 342" marker-end="url(#aB)"/>
    <path d="M 496 514 C 540 560, 700 420, 815 394" marker-end="url(#aB)"/>
    <path d="M 548 514 C 580 570, 720 520, 813 479" marker-end="url(#aB)"/>
    <path d="M 600 514 C 650 590, 780 560, 862 505" marker-end="url(#aB)"/>
  </g>

  <!-- scheduler -> pool arrow -->
  <line x1="355" y1="640" x2="693" y2="640" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#aG)"/>
  <text x="524" y="632" text-anchor="middle" font-size="10.5" fill="#475569">alloc(n) / free(ids) / can_alloc(n)</text>
  <text x="524" y="655" text-anchor="middle" font-size="10.5" fill="#94a3b8">调度期就按「执行后容量」要块 —— 对应 vLLM allocate_slots()</text>

  <!-- bottom strip -->
  <rect x="40" y="730" width="920" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="500" y="755" text-anchor="middle" font-size="11.5" fill="#1e293b">block table = 逻辑块 → 物理块的<b>间接寻址</b>：attention kernel 拿它逐层找到每个 token 的 KV（Day 1 论文图 / Day 2 BlockTable）</text>
  <text x="500" y="778" text-anchor="middle" font-size="11.5" fill="#1e293b">整个池是一维数组：分配 / 释放 / 抢占 / 恢复全部只是 <b>ref_cnt 与 free_ids 的增减</b> —— 没有一次内存搬移（swap 除外，V1 已砍掉）</text>
</svg>
