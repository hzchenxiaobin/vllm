  <rect x="640" y="562" width="320" height="140" rx="6" fill="#f0fdf4" stroke="#059669"/>
  <text x="658" y="584" font-size="12" font-weight="bold" fill="#047857">收益与兜底</text>
  <g font-size="10" fill="#334155">
    <text x="658" y="606">· prefill 只算 32/64 token → TTFT↓</text>
    <text x="658" y="624">· 不占 2 个新块 → 同显存更多并发</text>
    <text x="658" y="642">· 请求结束 ref→0，块回 LRU 当缓存</text>
    <text x="658" y="660">· 新块数 = ceil((64 − 32 − 尾块剩余)/16)</text>
    <text x="658" y="678">· free 不足：先逐出 LRU 缓存块</text>
    <text x="658" y="694">  还不够 → None → scheduler 抢占</text>
  </g>

