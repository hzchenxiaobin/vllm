    <text x="575" y="328">    block_id · ref_cnt · block_hash</text>
    <text x="575" y="344">    prev / next  # free 队列双向指针</text>
  </g>
  <g font-size="10" fill="#334155">
    <text x="575" y="368">· BlockTable：逻辑块 → 物理块（每请求一个，kernel 间接寻址）</text>
    <text x="575" y="386">· 分配 O(1) 摘头 · 释放 O(1) 挂尾 · 命中 O(1) hash 直查</text>
    <text x="575" y="404">· 满块才记 hash；未满尾块可能继续写，不进缓存</text>
  </g>

