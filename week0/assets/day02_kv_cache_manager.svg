  <g font-family="monospace" font-size="10.5" fill="#1e293b">
    <text x="715" y="110">h0 = hash(∅)</text>
    <text x="715" y="130">h(i) = hash(h(i-1),</text>
    <text x="715" y="146">        tokens[i], extra)</text>
    <text x="715" y="168">extra = hash(lora_id,</text>
    <text x="715" y="184">        mm_hash, salt)</text>
    <text x="715" y="210" font-size="9.5">查表：cached_block{h → 块}</text>
  </g>

  <text x="40" y="234" font-size="10.5" fill="#c2410c">前缀不同 → 后续所有块 hash 必变 → 杜绝「中段相同、前缀不同」的误命中（attention 输出依赖全部前缀，KV 不可共享）</text>

