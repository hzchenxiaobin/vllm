  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">KVCacheManager：BlockPool · BlockTable · 链式 Hash</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">vllm/v1/core/kv_cache_manager.py ＋ block_pool.py ＋ kv_cache_utils.py —— Day 1 PagedAttention 论文图的 V1 工程版</text>

  <!-- ============ Panel 1: chained hash ============ -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#1e293b">① 链式 hash：块指纹逐块依赖（Merkle 式）—— kv_cache_utils.py</text>

