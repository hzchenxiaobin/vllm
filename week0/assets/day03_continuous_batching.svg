<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2.5"/>
    </pattern>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Static vs Continuous Batching：调度粒度从「批次」降到「迭代步」</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">例：4 个在跑请求输出长度 10/100/200/500，waiting 里还有 E/F/G/H/I；单步 20ms；利用率 U = ΣLᵢ / (B × max Lᵢ)</text>

  <!-- ================= Panel 1: static ================= -->
  <rect x="40" y="70" width="920" height="270" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#7f1d1d">① Static Batching：凑一批 → 全部跑完才放下一批（batch 生命周期内组成不变）</text>

  <!-- gridlines: steps 0..500 mapped x=150..850 -->
  <g stroke="#fecaca" stroke-width="1">
    <line x1="290" y1="112" x2="290" y2="262"/>
    <line x1="430" y1="112" x2="430" y2="262"/>
    <line x1="570" y1="112" x2="570" y2="262"/>
    <line x1="710" y1="112" x2="710" y2="262"/>
    <line x1="850" y1="112" x2="850" y2="262"/>
  </g>
  <g font-size="9.5" fill="#b91c1c" text-anchor="middle">
    <text x="150" y="276">0</text><text x="290" y="276">100</text><text x="430" y="276">200</text>
    <text x="570" y="276">300</text><text x="710" y="276">400</text><text x="850" y="276">500 步</text>
  </g>

  <g font-size="10.5" fill="#334155">
    <text x="58" y="132">Req A · 10</text>
    <text x="58" y="172">Req B · 100</text>
    <text x="58" y="212">Req C · 200</text>
    <text x="58" y="252">Req D · 500</text>
  </g>

  <!-- lane A -->
  <rect x="150" y="115" width="14" height="26" fill="#16a34a" stroke="#166534" stroke-width="1.5"/>
  <text x="157" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">A</text>
  <rect x="164" y="115" width="686" height="26" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- lane B -->
  <rect x="150" y="155" width="140" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="220" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">B</text>
  <rect x="290" y="155" width="560" height="26" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- lane C -->
  <rect x="150" y="195" width="280" height="26" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
  <text x="290" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">C</text>
  <rect x="430" y="195" width="420" height="26" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- lane D -->
  <rect x="150" y="235" width="700" height="26" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="500" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">D（batch 要等 D 跑满 500 步才结束）</text>

  <text x="507" y="133" text-anchor="middle" font-size="10" fill="#94a3b8">← 空转：占着槽位和 KV 显存等 D</text>
  <text x="500" y="318" text-anchor="middle" font-size="11.5" fill="#7f1d1d">有效利用率 U = (10+100+200+500) / (4×500) = <tspan font-weight="bold">40.5%</tspan>　·　A 的端到端时延 = 整批 10s 而不是自己的 0.2s　·　新请求必须等整批结束</text>

  <!-- ================= Panel 2: continuous ================= -->
  <rect x="40" y="370" width="920" height="330" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="395" font-size="14" font-weight="bold" fill="#14532d">② Continuous Batching：每个 iteration 重组 batch（完成者出队释放 KV → waiting 者立即补位）</text>

  <g stroke="#bbf7d0" stroke-width="1">
    <line x1="290" y1="408" x2="290" y2="568"/>
    <line x1="430" y1="408" x2="430" y2="568"/>
    <line x1="570" y1="408" x2="570" y2="568"/>
    <line x1="710" y1="408" x2="710" y2="568"/>
    <line x1="850" y1="408" x2="850" y2="568"/>
  </g>
  <g font-size="9.5" fill="#166534" text-anchor="middle">
    <text x="150" y="582">0</text><text x="290" y="582">100</text><text x="430" y="582">200</text>
    <text x="570" y="582">300</text><text x="710" y="582">400</text><text x="850" y="582">500 步</text>
  </g>

  <g font-size="10.5" fill="#334155">
    <text x="92" y="432">GPU 槽 1</text>
    <text x="92" y="472">GPU 槽 2</text>
    <text x="92" y="512">GPU 槽 3</text>
    <text x="92" y="552">GPU 槽 4</text>
  </g>

  <!-- slot 1: A(0-10) E(11-90) F(91-120) G(121-270) H(271-330) -->
  <rect x="150" y="415" width="14" height="26" fill="#16a34a" stroke="#166534" stroke-width="1.5"/>
  <text x="157" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">A</text>
  <rect x="165" y="415" width="112" height="26" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="221" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">E</text>
  <rect x="278" y="415" width="42" height="26" fill="#0891b2" stroke="#155e75" stroke-width="1.5"/>
  <text x="299" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">F</text>
  <rect x="321" y="415" width="209" height="26" fill="#65a30d" stroke="#3f6212" stroke-width="1.5"/>
  <text x="425" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">G</text>
  <rect x="531" y="415" width="83" height="26" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
  <text x="572" y="432" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">H</text>
  <line x1="619" y1="428" x2="845" y2="428" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="735" y="432" text-anchor="middle" font-size="9.5" fill="#94a3b8">waiting 队列已空</text>

  <!-- slot 2: B(0-100) I(101-220) -->
  <rect x="150" y="455" width="140" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="220" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">B</text>
  <rect x="292" y="455" width="168" height="26" fill="#ca8a04" stroke="#854d0e" stroke-width="1.5"/>
  <text x="376" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">I</text>
  <line x1="465" y1="468" x2="845" y2="468" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- slot 3: C(0-200) -->
  <rect x="150" y="495" width="280" height="26" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
  <text x="290" y="512" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">C</text>
  <line x1="435" y1="508" x2="845" y2="508" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- slot 4: D(0-500) -->
  <rect x="150" y="535" width="700" height="26" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="500" y="552" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">D</text>

  <!-- step-10 annotation -->
  <line x1="164" y1="405" x2="164" y2="566" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="404" font-size="10" fill="#dc2626">第 10 步：A 完成 → 立即释放 KV → E 第 11 步补位（不等任何「批」）</text>

  <text x="500" y="604" text-anchor="middle" font-size="11" fill="#166534">每个竖格边界都是一次 <tspan font-family="monospace">EngineCore.step()</tspan>：<tspan font-family="monospace">schedule()</tspan> 重组 batch → 前向 → <tspan font-family="monospace">update_from_output()</tspan> 完成检测/释放</text>

  <!-- takeaway -->
  <rect x="60" y="622" width="880" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="645" text-anchor="middle" font-size="11.5" fill="#14532d" font-weight="bold">队列不空时 GPU 始终满载：U 从 40.5% → ~100%，本例加速 ≈ 2.5×</text>
  <text x="500" y="666" text-anchor="middle" font-size="11" fill="#166534">吞吐「数倍」= 消除空转（2~3×）× PagedAttention 配套放开并发后的权重摊销（Day 1 公式的 B 项）——两层都要讲</text>

  <!-- bottom note -->
  <text x="500" y="730" text-anchor="middle" font-size="11" fill="#475569">代价：调度器每步都要跑（亚 ms 预算）· batch 每步变形 → 必须配分页 KV · 形状每步变化 → 逼出 CUDA Graph 分桶（模块四）</text>
  <text x="500" y="752" text-anchor="middle" font-size="11" fill="#475569">失效：离线吞吐场景（可先按长度排序装箱再静态分批）· 单请求 · 小模型小 batch（CPU-bound，先治 CPU）</text>
</svg>
