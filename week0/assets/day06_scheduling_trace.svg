  <!-- ================= Event callouts ================= -->
  <rect x="90" y="612" width="280" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="105" y="633" font-size="11" font-weight="bold" fill="#991b1b">E1 · 第 6 步：KV 门控</text>
  <text x="105" y="651" font-size="10" fill="#334155">R6 要 256 块、free≈252 → 滞留 waiting。</text>
  <text x="105" y="667" font-size="10" fill="#334155">卡的是 KV：budget 还剩 ~4091、seqs=32 没到</text>

  <rect x="390" y="612" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
