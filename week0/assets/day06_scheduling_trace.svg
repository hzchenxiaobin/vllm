  <text x="400" y="100" text-anchor="middle" font-size="10.5" fill="#1d4ed8">88%</text>
  <text x="505" y="100" text-anchor="middle" font-size="10.5" fill="#166534">↓71%→87%</text>
  <text x="690" y="100" text-anchor="middle" font-size="10.5" fill="#1d4ed8">~87% 波动</text>
  <text x="890" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">100%（free=0）</text>
  <text x="1014" y="135" font-size="10" fill="#64748b">↦ 块</text>

