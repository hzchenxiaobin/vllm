  <text x="405" y="667" font-size="10" fill="#334155">下一步 R6 以整段 prefill 准入（FCFS 队首）</text>

  <rect x="650" y="612" width="360" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="665" y="633" font-size="11" font-weight="bold" fill="#991b1b">E3 · free=0：抢占队尾 R7</text>
  <text x="665" y="651" font-size="10" fill="#334155">R3 要新块失败 → 抢占 running 队尾 R7：</text>
  <text x="665" y="667" font-size="10" fill="#334155">free 306 块 · num_computed=0 · 放回 waiting 队首</text>

  <rect x="90" y="698" width="560" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="105" y="719" font-size="11" font-weight="bold" fill="#9a3412">E4 · R7 恢复 = 全量重算</text>
  <text x="105" y="737" font-size="10" fill="#334155">「重算 prefill」= prompt + 已生成 = 4096 + 800 = 4896 token 全部重算</text>
  <text x="105" y="753" font-size="10" fill="#334155">（Day 5 mini 引擎场景 2 实测：浪费 39.5% —— 宁可排队，不可抢占）</text>

  <rect x="670" y="698" width="340" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="685" y="719" font-size="11" font-weight="bold" fill="#1e40af">评分点（面试官在看什么）</text>
  <text x="685" y="737" font-size="10" fill="#334155">① 先 running 后 waiting　② 门控三分 budget/seqs/KV</text>
  <text x="685" y="753" font-size="10" fill="#334155">③ 抢占三连：挑谁/去哪/代价　④ recompute vs swap</text>
