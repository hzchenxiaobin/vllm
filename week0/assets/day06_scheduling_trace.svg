  <rect x="530" y="371" width="60" height="18" rx="3" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="560" y="384" text-anchor="middle" font-size="9" fill="#1e40af">prefill</text>
  <line x1="590" y1="380" x2="1010" y2="380" stroke="#2563eb" stroke-width="2.5"/>

