  <rect width="1060" height="800" fill="#ffffff"/>
  <text x="530" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">白板第 3 件 · 调度推演时间线：10 请求 / KV 池 1536 块（满载 6 条）/ budget 4096</text>
  <text x="530" y="52" text-anchor="middle" font-size="12" fill="#64748b">prompt 均 4096 · block_size=16 · max_num_seqs=32（非约束）—— 上面是 KV 池占用，中间是各请求生命线，下面是四个关键事件</text>

  <!-- ================= KV pool gauge ================= -->
