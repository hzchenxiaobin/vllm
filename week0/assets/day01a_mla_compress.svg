<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">MLA：不压头数，把每 token 的 KV 压成一份低秩潜向量</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">DeepSeek-V2/V3：kv_lora_rank = 512 + RoPE 64 ｜ 上投影 W^UK / W^UV 推理时被矩阵吸收——不存、不算</text>

  <!-- ================= Left: GQA-8 baseline ================= -->
  <rect x="20" y="72" width="470" height="308" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="255" y="98" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#334155">对照：GQA-8 按「头」缓存</text>

  <rect x="50" y="160" width="110" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="105" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">x_t</text>
  <text x="105" y="198" text-anchor="middle" font-size="10" fill="#475569">4096 维</text>

  <line x1="160" y1="176" x2="183" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrS)"/>
  <line x1="160" y1="192" x2="183" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrS)"/>

  <rect x="185" y="120" width="110" height="40" rx="6" fill="#b45309"/>
  <text x="240" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">W_K</text>
  <rect x="185" y="208" width="110" height="40" rx="6" fill="#7c3aed"/>
  <text x="240" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">W_V</text>

  <line x1="295" y1="140" x2="318" y2="140" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrA)"/>
  <line x1="295" y1="228" x2="318" y2="228" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrP)"/>

  <rect x="320" y="120" width="130" height="40" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="385" y="144" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">K：8 头 × 128</text>
  <rect x="320" y="208" width="130" height="40" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="385" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">V：8 头 × 128</text>

  <line x1="370" y1="160" x2="370" y2="314" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrS)"/>
  <line x1="400" y1="248" x2="400" y2="314" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrS)"/>
  <text x="245" y="290" text-anchor="middle" font-size="10.5" fill="#64748b">逐头原样缓存；GQA 已把头数压到 8，再压只能换赛道</text>

  <rect x="50" y="318" width="410" height="54" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="255" y="340" text-anchor="middle" font-size="12" fill="#334155">每 token 每层缓存：K 8×128 + V 8×128</text>
  <text x="255" y="360" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">= 2048 个数 → ×61 层 ≈ 244 KiB/token</text>

  <!-- ================= Right: MLA ================= -->
  <rect x="510" y="72" width="470" height="308" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="745" y="98" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f766e">MLA：K/V 共用一份低秩潜向量</text>

  <rect x="540" y="160" width="110" height="48" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="595" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">x_t</text>
  <text x="595" y="198" text-anchor="middle" font-size="10" fill="#475569">4096 维</text>

  <line x1="650" y1="176" x2="673" y2="142" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrS)"/>
  <line x1="650" y1="192" x2="673" y2="226" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrS)"/>

  <rect x="675" y="120" width="110" height="40" rx="6" fill="#0d9488"/>
  <text x="730" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">W^DKV</text>
  <text x="730" y="153" text-anchor="middle" font-size="9.5" fill="#ccfbf1">下投影</text>

  <line x1="785" y1="140" x2="803" y2="140" stroke="#0d9488" stroke-width="1.8" marker-end="url(#arrT)"/>
  <rect x="805" y="110" width="150" height="60" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="880" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f766e">c_KV 潜向量</text>
  <text x="880" y="152" text-anchor="middle" font-size="10" fill="#0f766e">512 维 · 唯一缓存主体</text>

  <rect x="675" y="208" width="110" height="36" rx="6" fill="#64748b"/>
  <text x="730" y="230" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">W^KR</text>
  <line x1="785" y1="226" x2="803" y2="226" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrS)"/>
  <rect x="805" y="208" width="150" height="36" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="880" y="230" text-anchor="middle" font-size="10.5" fill="#334155">k_RoPE · 64 维（位置编码）</text>

  <line x1="860" y1="170" x2="830" y2="254" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrS)"/>

  <rect x="675" y="258" width="280" height="46" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="815" y="276" text-anchor="middle" font-size="10.5" fill="#64748b">每头 K/V = W^UK·c_KV、W^UV·c_KV</text>
  <text x="815" y="292" text-anchor="middle" font-size="10.5" fill="#64748b">上投影吸收进 W_Q / W_O —— 不存、不算</text>

  <rect x="530" y="318" width="430" height="54" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="745" y="340" text-anchor="middle" font-size="12" fill="#334155">每 token 每层缓存：c_KV 512 + k_RoPE 64（K/V 共用，无 ×2）</text>
  <text x="745" y="360" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f766e">= 576 个数 → ×61 层 ≈ 70 KiB/token</text>

  <!-- ================= Bottom strip ================= -->
  <rect x="20" y="396" width="960" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="500" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">同为 128 头 × 128 维 × 61 层（BF16）：MHA 3.8 MiB/token ｜ GQA-8 244 KiB ｜ MLA ≈ 70 KiB</text>
  <text x="500" y="442" text-anchor="middle" font-size="12" fill="#475569">MLA ≈ MHA 的 1/57、GQA-8 的 1/3.5，且质量不降（DeepSeek-V2 论文：同缓存预算下优于 GQA/MQA）</text>

  <defs>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#b45309"/></marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#7c3aed"/></marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0d9488"/></marker>
  </defs>
</svg>
