  </g>

  <!-- stats -->
  <rect x="100" y="572" width="880" height="60" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="540" y="596" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">重算浪费 1011 token / 有效产出 2560 token = 39.5% 白算 —— 真机上每次抢占 ≈ 2×P×T_已算token FLOPs（Day 2 公式）⇒ 抢占是最后手段</text>
  <text x="540" y="618" text-anchor="middle" font-size="11" fill="#334155">抢占 5 次全部发生在 step 98~194 的「池满窗口」；恢复集中在 step 257~259（r1~r5 释放池之后，budget 限制每步只进 2 个）</text>

  <!-- takeaways -->
  <rect x="100" y="648" width="880" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="120" y="672" font-size="11.5" fill="#1e293b">① 恢复 = 全部进度重来：r6 的恢复 prefill 是 <tspan font-weight="bold">257 = prompt 64 + 已生成 193</tspan>（num_computed 清零的语义在数字上显形）</text>
  <text x="120" y="692" font-size="11.5" fill="#1e293b">② 一次过准入的债用连环抢占来还：抢 r10 后池仍不够 → 准入失败 → 下个增长点抢 r9 …… 对应 vLLM 的旋钮 <tspan font-weight="bold">max_num_seqs</tspan>（Day 6 诊断树：preemption↑ → 调小并发）</text>
  <text x="120" y="712" font-size="11.5" fill="#1e293b">③ r1~r5 全程无感、256 步准时完成 —— 「先 running 后 waiting + 抢队尾」让老请求零波及（Day 2 Q1 的实证）</text>
</svg>
