  <text x="530" y="48" text-anchor="middle" font-size="11.5" fill="#64748b">10 请求 × (prompt=64, output=256)，NUM_BLOCKS=100（稳态只够 5 个）· 横轴 = step · 抢占 5 次：r10@98 → r9@114 → r8@130 → r7@162 → r6@194（每次抢 running 队尾/LRU）</text>

