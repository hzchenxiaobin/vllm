<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">TP / PP / EP：三种切法，一张图 + 一条铁律「能单卡放下就别上 TP」</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">TP 层内切矩阵（通信频繁）· PP 按层切段（通信少但服务端 bubble）· EP 只为 MoE（all-to-all）· DP 整模型复制（无通信，吞吐扩展首选）</text>

  <!-- ================= Panel A: TP ================= -->
  <rect x="40" y="70" width="300" height="360" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="95" font-size="13" font-weight="bold" fill="#1e3a8a">TP（张量并行）：单层内切权重</text>
  <!-- matrix split -->
  <g>
    <rect x="70" y="115" width="50" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="95" y="139" text-anchor="middle" font-size="10">W₀</text>
    <rect x="122" y="115" width="50" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="147" y="139" text-anchor="middle" font-size="10">W₁</text>
    <rect x="174" y="115" width="50" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="199" y="139" text-anchor="middle" font-size="10">W₂</text>
    <rect x="226" y="115" width="50" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/><text x="251" y="139" text-anchor="middle" font-size="10">W₃</text>
    <text x="95" y="170" text-anchor="middle" font-size="9" fill="#64748b">GPU0</text>
    <text x="147" y="170" text-anchor="middle" font-size="9" fill="#64748b">GPU1</text>
    <text x="199" y="170" text-anchor="middle" font-size="9" fill="#64748b">GPU2</text>
    <text x="251" y="170" text-anchor="middle" font-size="9" fill="#64748b">GPU3</text>
  </g>
  <!-- all-reduce arrows -->
  <g>
    <rect x="70" y="185" width="206" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="173" y="204" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="bold">每层 2 次 all-reduce</text>
    <text x="58" y="238" font-size="10" fill="#334155">attn o_proj 一次 + MLP down_proj 一次</text>
    <text x="58" y="256" font-size="10" fill="#334155">Qwen3-8B：36 层 × 2 = 72 次/步</text>
  </g>
  <!-- decode math -->
  <rect x="58" y="272" width="264" height="140" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="70" y="292" font-size="10.5" font-weight="bold" fill="#1e3a8a">decode 收益手推（bs=1, Qwen3-8B）</text>
  <text x="70" y="310" font-size="10" fill="#334155">单卡：16.4GiB / 3.35TB/s ≈ 4.9 ms</text>
  <text x="70" y="328" font-size="10" fill="#334155">TP=2 理想：读权重 2.45 ms</text>
  <text x="70" y="346" font-size="10" fill="#b91c1c">+ 72 次 all-reduce（在关键路径上，</text>
  <text x="70" y="362" font-size="10" fill="#b91c1c">难隐藏）× ~15µs ≈ 1.1 ms</text>
  <text x="70" y="382" font-size="10.5" font-weight="bold" fill="#1e3a8a">→ ~3.5 ms，实际只有 1.4×（非 2×）</text>
  <text x="70" y="400" font-size="9.5" fill="#64748b">跨节点：all-reduce 延迟 5~10× → 收益归零甚至为负</text>

  <!-- ================= Panel B: PP ================= -->
  <rect x="360" y="70" width="300" height="360" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="378" y="95" font-size="13" font-weight="bold" fill="#78350f">PP（流水并行）：按层切段</text>
  <g>
    <rect x="378" y="115" width="58" height="34" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="407" y="132" text-anchor="middle" font-size="9">L0-8</text><text x="407" y="143" text-anchor="middle" font-size="8.5" fill="#92400e">stage0</text>
    <rect x="440" y="115" width="58" height="34" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="469" y="132" text-anchor="middle" font-size="9">L9-17</text><text x="469" y="143" text-anchor="middle" font-size="8.5" fill="#92400e">stage1</text>
    <rect x="502" y="115" width="58" height="34" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="531" y="132" text-anchor="middle" font-size="9">L18-26</text><text x="531" y="143" text-anchor="middle" font-size="8.5" fill="#92400e">stage2</text>
    <rect x="564" y="115" width="58" height="34" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="593" y="132" text-anchor="middle" font-size="9">L27-35</text><text x="593" y="143" text-anchor="middle" font-size="8.5" fill="#92400e">stage3</text>
  </g>
  <g font-size="10" fill="#78350f">
    <text x="378" y="180">· 通信：stage 边界点对点传激活</text>
    <text x="378" y="196">（B×h×2B，bs=1 才 8KB；频率低）</text>
    <text x="378" y="220">· 通信量小 → 跨节点友好（IB 够用）</text>
    <text x="378" y="244">· 但在线服务少见：continuous batching</text>
    <text x="378" y="260">每步全 batch 跨 stage 同步一次，</text>
    <text x="378" y="276">变长请求 → stage 负载不均 → bubble 放大</text>
    <text x="378" y="300">· 定位：单机放不下、跨节点扩展时的</text>
    <text x="378" y="316">「算力纵向」手段，吞吐换规模</text>
  </g>
  <!-- bubble diagram -->
  <g>
    <text x="378" y="352" font-size="10" font-weight="bold" fill="#92400e">bubble 示意（4 stage，变长请求）：</text>
    <rect x="378" y="362" width="60" height="16" fill="#fde68a" stroke="#d97706"/><rect x="378" y="380" width="60" height="16" fill="#fde68a" stroke="#d97706"/>
    <rect x="440" y="362" width="60" height="16" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="2,2"/><rect x="440" y="380" width="60" height="16" fill="#fde68a" stroke="#d97706"/>
    <rect x="502" y="362" width="60" height="16" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="2,2"/><rect x="502" y="380" width="60" height="16" fill="#fde68a" stroke="#d97706"/>
    <rect x="564" y="362" width="60" height="16" fill="#fee2e2" stroke="#dc2626" stroke-dasharray="2,2"/><rect x="564" y="380" width="60" height="16" fill="#fde68a" stroke="#d97706"/>
    <text x="630" y="372" font-size="9" fill="#b91c1c">虚线 = 空等</text>
    <text x="630" y="386" font-size="9" fill="#b91c1c">（bubble）</text>
  </g>

  <!-- ================= Panel C: EP ================= -->
  <rect x="680" y="70" width="280" height="360" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="698" y="95" font-size="13" font-weight="bold" fill="#14532d">EP（专家并行）：只为 MoE</text>
  <g>
    <!-- tokens -->
    <text x="698" y="125" font-size="10" fill="#166534">token（top-k 选路）</text>
    <rect x="698" y="132" width="18" height="14" fill="#bbf7d0" stroke="#16a34a"/><rect x="718" y="132" width="18" height="14" fill="#bbf7d0" stroke="#16a34a"/><rect x="738" y="132" width="18" height="14" fill="#bbf7d0" stroke="#16a34a"/><rect x="758" y="132" width="18" height="14" fill="#bbf7d0" stroke="#16a34a"/>
    <!-- dispatch -->
    <line x1="716" y1="150" x2="716" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#arrD)"/>
    <text x="760" y="166" font-size="9.5" fill="#166534">all-to-all dispatch</text>
    <!-- experts -->
    <rect x="698" y="176" width="54" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="725" y="193" text-anchor="middle" font-size="9">E1..E64</text>
    <rect x="756" y="176" width="54" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="783" y="193" text-anchor="middle" font-size="9">E65..E128</text>
    <rect x="814" y="176" width="54" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="841" y="193" text-anchor="middle" font-size="9">E129..E192</text>
    <rect x="872" y="176" width="54" height="26" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="899" y="193" text-anchor="middle" font-size="9">E193..E256</text>
    <text x="725" y="216" text-anchor="middle" font-size="8.5" fill="#64748b">GPU0</text>
    <text x="783" y="216" text-anchor="middle" font-size="8.5" fill="#64748b">GPU1</text>
    <text x="841" y="216" text-anchor="middle" font-size="8.5" fill="#64748b">GPU2</text>
    <text x="899" y="216" text-anchor="middle" font-size="8.5" fill="#64748b">GPU3</text>
    <!-- combine -->
    <line x1="716" y1="222" x2="716" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrD)"/>
    <text x="760" y="238" font-size="9.5" fill="#166534">all-to-all combine</text>
    <text x="698" y="262" font-size="10" fill="#334155">DeepSeek-V3：256 路由专家（top-8）</text>
    <text x="698" y="278" font-size="10" fill="#334155">+ 1 共享专家，58 个 MoE 层</text>
  </g>
  <rect x="698" y="296" width="244" height="112" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="710" y="316" font-size="10.5" font-weight="bold" fill="#7f1d1d">EP 的坑：hot expert</text>
  <text x="710" y="334" font-size="9.5" fill="#7f1d1d">· 某几个专家被频繁选中 → 所在卡</text>
  <text x="710" y="349" font-size="9.5" fill="#7f1d1d">成为短板（all-to-all 全体等它）</text>
  <text x="710" y="367" font-size="9.5" fill="#7f1d1d">· 解法：冗余专家（DeepSeek 生产</text>
  <text x="710" y="382" font-size="9.5" fill="#7f1d1d">做法：热点专家复制多份）+</text>
  <text x="710" y="397" font-size="9.5" fill="#7f1d1d">负载感知的 expert placement</text>

  <!-- ================= Panel D: rules ================= -->
  <rect x="40" y="450" width="920" height="250" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="58" y="478" font-size="14" font-weight="bold" fill="#1e293b">铁律与决策顺序（Day 6 高频题 7 的标准答案骨架）</text>
  <g font-size="11">
    <rect x="58" y="495" width="440" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="70" y="516" font-weight="bold" fill="#7f1d1d">① 能单卡放下就别上 TP</text>
    <text x="70" y="534" font-size="10" fill="#7f1d1d">all-reduce 延迟进每步 TPOT（72 次 × µs 级，且在关键路径）；</text>
    <text x="70" y="548" font-size="10" fill="#7f1d1d">吞吐不够优先 DP：整模型复制、零通信、外部路由，故障域还小</text>

    <rect x="510" y="495" width="430" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="522" y="516" font-weight="bold" fill="#7f1d1d">② TP 不跨节点</text>
    <text x="522" y="534" font-size="10" fill="#7f1d1d">NVLink ~900 GB/s → IB ~50 GB/s（18× 衰减），小消息延迟 5~10×；</text>
    <text x="522" y="548" font-size="10" fill="#7f1d1d">跨节点扩展用 PP / EP / DP；TP ≤ 单机卡数（8×H100 内）</text>

    <rect x="58" y="565" width="440" height="56" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="70" y="586" font-weight="bold" fill="#78350f">③ TP 的合法场景</text>
    <text x="70" y="604" font-size="10" fill="#78350f">a. 模型单卡放不下（70B FP8 需 ~70GB &gt; 80GB 减去 KV/开销）；</text>
    <text x="70" y="618" font-size="10" fill="#78350f">b. decode 时延敏感：聚合多卡 HBM 带宽（TPOT 4.9ms → ~3.5ms）</text>

    <rect x="510" y="565" width="430" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="522" y="586" font-weight="bold" fill="#14532d">④ EP 只为 MoE；DP 首选扩吞吐</text>
    <text x="522" y="604" font-size="10" fill="#166534">EP：MoE 专家天然可切，代价是 all-to-all + hot expert；</text>
    <text x="522" y="618" font-size="10" fill="#166534">DP：N 份实例 + 负载均衡路由，吞吐近线性、互不干扰</text>
  </g>
  <text x="58" y="652" font-size="10.5" fill="#334155">vLLM V1：--tensor-parallel-size ｜ --pipeline-parallel-size ｜ --enable-expert-parallel ｜ --data-parallel-size（+ 外部 LB）｜ --enable-dp-attention（DeepSeek MLA 混合并行）</text>
  <text x="58" y="672" font-size="10.5" fill="#334155">代码主线：vllm/distributed/parallel_state.py（TP/PP 分组初始化）；小消息 all-reduce 走 vllm/distributed/device_communicators/ 下的定制 kernel（比 NCCL 快数倍）</text>

  <!-- footer -->
  <text x="500" y="720" text-anchor="middle" font-size="10.5" fill="#64748b">与 Day 1 的衔接：TP decode 收益 = 带宽聚合（W/(k·BW)），代价 = 通信税；与 Day 2 的衔接：V1 DP = 多个 EngineCore 挂同一入口（拆进程铺好的路）</text>
  <text x="500" y="740" text-anchor="middle" font-size="10.5" fill="#64748b">与 P/D 的衔接（今天模块三）：DP+P/D 组合 = 集群里「横向复制 × 纵向分工」两个正交维度，大集群推理的完整答案是两者叠加</text>
  <text x="500" y="760" text-anchor="middle" font-size="10.5" fill="#64748b">与昇腾挂钩：TP 的 all-reduce ↔ 昇腾 HCCS 集合通信；「通信藏进计算」的流水思想与 kernel 内双缓冲是同一课</text>
</svg>
