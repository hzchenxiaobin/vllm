<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">投机解码：草稿 k 个 → 大模型一次前向并行验证 → 接受最长前缀（数学无损）</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">decode 是 memory-bound：AI≈1 vs 脊点≈296 → 算力闲置 &gt;99%。用闲置算力「并行算 k 个候选位置」几乎免费——这是全部收益的来源</text>

  <!-- ================= Panel A: baseline ================= -->
  <rect x="40" y="70" width="920" height="120" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="58" y="95" font-size="13" font-weight="bold" fill="#7f1d1d">① 基线 decode：每步读一遍全部权重，只产出 1 个 token</text>
  <g>
    <rect x="70" y="115" width="150" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="145" y="132" text-anchor="middle" font-size="10">读权重 16.4 GiB</text>
    <text x="145" y="147" text-anchor="middle" font-size="10">算 1 个 token</text>
    <text x="228" y="140" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">→</text>
    <rect x="240" y="115" width="100" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="290" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">t+1</text>
    <text x="350" y="140" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">→</text>
    <rect x="365" y="115" width="150" height="40" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="440" y="132" text-anchor="middle" font-size="10">再读权重 16.4 GiB</text>
    <text x="440" y="147" text-anchor="middle" font-size="10">再算 1 个 token</text>
    <text x="523" y="140" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">→</text>
    <rect x="535" y="115" width="100" height="40" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="585" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">t+2</text>
    <text x="650" y="132" font-size="11" fill="#7f1d1d">N 个 token = N 次全量读权重</text>
    <text x="650" y="148" font-size="11" fill="#7f1d1d">算力利用率 &lt; 1%（AI≈1 / 296）</text>
  </g>

  <!-- ================= Panel B: spec pipeline ================= -->
  <rect x="40" y="205" width="920" height="270" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="58" y="230" font-size="13" font-weight="bold" fill="#14532d">② 投机一步：draft 猜 k=4 → target 一次前向验证 5 个位置 → 接受最长前缀</text>

  <!-- draft stage -->
  <rect x="58" y="248" width="420" height="88" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="70" y="268" font-size="11" font-weight="bold" fill="#155e75">Draft 阶段（便宜）：轻量草稿头自回归出 4 个候选</text>
  <g font-size="10" font-family="monospace">
    <rect x="70" y="280" width="70" height="24" fill="#cffafe" stroke="#0891b2" stroke-width="1"/><text x="105" y="296" text-anchor="middle">"for"</text>
    <rect x="150" y="280" width="70" height="24" fill="#cffafe" stroke="#0891b2" stroke-width="1"/><text x="185" y="296" text-anchor="middle">" "</text>
    <rect x="230" y="280" width="70" height="24" fill="#cffafe" stroke="#0891b2" stroke-width="1"/><text x="265" y="296" text-anchor="middle">"i"</text>
    <rect x="310" y="280" width="70" height="24" fill="#cffafe" stroke="#0891b2" stroke-width="1"/><text x="345" y="296" text-anchor="middle">"in"</text>
    <text x="390" y="296" fill="#155e75">…k=4</text>
  </g>
  <text x="70" y="326" font-size="9.5" fill="#155e75">来源（四选一）：EAGLE 特征级轻量头 ｜ MTP 模型自带多头 ｜ 外挂小模型 ｜ ngram 从 prompt/历史匹配</text>

  <!-- verify stage -->
  <rect x="498" y="248" width="444" height="88" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="510" y="268" font-size="11" font-weight="bold" fill="#713f12">Verify 阶段（target 一次前向，5 个位置并行）</text>
  <g font-size="10" font-family="monospace" text-anchor="middle">
    <rect x="510" y="280" width="60" height="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/><text x="540" y="296">pos t+1</text>
    <rect x="580" y="280" width="60" height="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/><text x="610" y="296">pos t+2</text>
    <rect x="650" y="280" width="60" height="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/><text x="680" y="296">pos t+3</text>
    <rect x="720" y="280" width="60" height="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/><text x="750" y="296">pos t+4</text>
    <rect x="790" y="280" width="60" height="24" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/><text x="820" y="296">pos t+5</text>
  </g>
  <text x="510" y="326" font-size="9.5" fill="#713f12">关键：M=5 与 M=1 的 GEMM 权重读取量相同 → memory-bound 下验证的额外 FLOPs 近乎免费</text>

  <!-- accept stage -->
  <rect x="58" y="348" width="884" height="56" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="70" y="368" font-size="11" font-weight="bold" fill="#14532d">接受判定（拒绝采样，保证输出分布与纯自回归完全一致）：</text>
  <g font-size="10" font-family="monospace">
    <rect x="70" y="378" width="70" height="20" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="105" y="392" text-anchor="middle">✓ "for"</text>
    <rect x="150" y="378" width="70" height="20" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="392" text-anchor="middle">✓ " "</text>
    <rect x="230" y="378" width="70" height="20" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="265" y="392" text-anchor="middle">✗ "was"</text>
    <rect x="310" y="378" width="150" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/><text x="385" y="392" text-anchor="middle">丢弃后续草稿</text>
    <rect x="480" y="378" width="220" height="20" fill="#86efac" stroke="#15803d" stroke-width="2"/><text x="590" y="392" text-anchor="middle" font-weight="bold">本步产出 3 token（含修正的 "i"→target 采样）</text>
  </g>
  <text x="720" y="392" font-size="9.5" fill="#166534">验证步错在哪，target 的 logits 就在哪补一个正确分布的采样</text>
  <text x="58" y="424" font-size="10" fill="#166534">时间线：draft（4 小步，可 CUDA Graph 加速）→ verify（1 步 ≈ 常规 decode 步长）→ 循环。理想情况：读一次权重，出 ~3 个 token</text>

  <!-- ================= Panel C: math ================= -->
  <rect x="40" y="495" width="470" height="230" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="520" font-size="13" font-weight="bold" fill="#1e3a8a">③ 收益模型（能手推）</text>
  <text x="58" y="546" font-size="12" fill="#1e3a8a" font-family="monospace">E[tokens/step] = Σᵢ₌₀..ₖ pⁱ = (1 − p^(k+1)) / (1 − p)</text>
  <text x="58" y="566" font-size="10" fill="#475569">p = 单 token 接受率；每步至少 1 个（修正/bonus token 保底）</text>
  <text x="58" y="590" font-size="12" fill="#1e3a8a" font-family="monospace">加速比 ≈ E[tokens] / (1 + k·r)　（r = 草稿每步开销 / target 步长）</text>

  <g font-size="10.5">
    <rect x="58" y="608" width="434" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="68" y="625">p=0.8, k=3, r=0.08（EAGLE 级）</text><text x="478" y="625" text-anchor="end" fill="#15803d" font-weight="bold">2.95/1.24 ≈ 2.4× ✓</text>
    <rect x="58" y="638" width="434" height="26" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
    <text x="68" y="655">p=0.4, k=3, r=0.08</text><text x="478" y="655" text-anchor="end" fill="#a16207" font-weight="bold">1.62/1.24 ≈ 1.3×（勉强）</text>
    <rect x="58" y="668" width="434" height="26" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <text x="68" y="685">p=0.2, k=3, r=0.15（外挂大 draft）</text><text x="478" y="685" text-anchor="end" fill="#b91c1c" font-weight="bold">1.25/1.45 ≈ 0.86× ✗ 负收益</text>
  </g>
  <text x="58" y="714" font-size="9.5" fill="#64748b">k 的选择：增大 k 边际收益递减（p^k 衰减），草稿/验证开销线性涨 → 最优 k 通常 3~8</text>

  <!-- ================= Panel D: routes & failure ================= -->
  <rect x="530" y="495" width="430" height="230" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="548" y="520" font-size="13" font-weight="bold" fill="#4c1d95">④ 四条路线 与 三条失效</text>
  <g font-size="10">
    <rect x="548" y="534" width="196" height="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="556" y="548" font-weight="bold" fill="#4c1d95">EAGLE(-3)</text>
    <text x="556" y="562" font-size="9" fill="#6b21a8">特征级轻量头，接受率高、r 小，vLLM 主推</text>
    <rect x="752" y="534" width="196" height="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="760" y="548" font-weight="bold" fill="#4c1d95">MTP</text>
    <text x="760" y="562" font-size="9" fill="#6b21a8">模型自带多 token 头（DeepSeek-V3），需模型原生支持</text>
    <rect x="548" y="574" width="196" height="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="556" y="588" font-weight="bold" fill="#4c1d95">Draft model</text>
    <text x="556" y="602" font-size="9" fill="#6b21a8">外挂同家族小模型：通用但 r 大、双模型维护</text>
    <rect x="752" y="574" width="196" height="34" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="760" y="588" font-weight="bold" fill="#4c1d95">Ngram</text>
    <text x="760" y="602" font-size="9" fill="#6b21a8">纯 CPU 匹配 prompt/历史 n-gram，零 GPU 开销的免费彩票</text>
  </g>
  <rect x="548" y="618" width="400" height="94" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="638" font-size="11" font-weight="bold" fill="#7f1d1d">失效三连（必背）：</text>
  <text x="560" y="656" font-size="10" fill="#7f1d1d">① 低接受率负载（开放式/高温度生成，p≈0.2-0.4）→ 负收益</text>
  <text x="560" y="674" font-size="10" fill="#7f1d1d">② 大 batch：decode 趋近 compute-bound，验证不再免费</text>
  <text x="566" y="690" font-size="10" fill="#7f1d1d">（加速比 → E/(k+1) &lt; 1）→ 小 batch/低并发专属优化</text>
  <text x="560" y="706" font-size="10" fill="#7f1d1d">③ 甜场景：代码补全/模板化输出，p≈0.7-0.9 → 2~3×</text>

  <!-- footer -->
  <text x="500" y="756" text-anchor="middle" font-size="10.5" fill="#64748b">与 Day 2/3 的衔接：draft+verify 都可进 CUDA Graph 分桶；调度视角 = num_computed_tokens 一次追 k 个；vLLM V1：--speculative-config + vllm/v1/spec_decode/（ngram / eagle / mtp + rejection_sampler，选项随版本演进）</text>
  <text x="500" y="776" text-anchor="middle" font-size="10.5" fill="#64748b">与 Day 1 的衔接：本质是「用闲置算力（&gt;99%）买带宽时间」——roofline 左下角状态下的唯一杠杆</text>
</svg>
