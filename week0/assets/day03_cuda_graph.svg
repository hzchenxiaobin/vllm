<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="830" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">CUDA Graph：把一步的整串 kernel 录制重放（decode 专用）</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">Qwen3-8B decode 一步 ≈ 36 层 × 10+ kernel ≈ 500 个 · launch ~5µs/个 → CPU 提交 ≈ 2.5ms，与 GPU 步（5~8ms）同量级 → CPU-bound</text>

  <!-- ================= Panel 1: eager ================= -->
  <rect x="40" y="70" width="920" height="240" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#7f1d1d">① Eager：CPU 逐个 launch，GPU 喂不上 → 空泡</text>

  <text x="60" y="130" font-size="11" font-weight="bold" fill="#b45309">CPU</text>
  <g>
    <rect x="100" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="128" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="156" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="184" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="212" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="240" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="268" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="296" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="324" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="352" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="380" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="408" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="436" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="464" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="492" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="520" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="548" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="576" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="604" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
    <rect x="632" y="116" width="18" height="18" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  </g>
  <text x="660" y="130" font-size="10" fill="#9a3412">每格 = 一次 launch（驱动提交 + ATen 派发，3~10µs）</text>
  <text x="660" y="146" font-size="10" fill="#9a3412">× ~500 个 kernel ≈ 2.5ms，还不含 Python 开销</text>

  <text x="60" y="200" font-size="11" font-weight="bold" fill="#1e3a8a">GPU</text>
  <g>
    <rect x="100" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="122" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="144" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="166" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  </g>
  <rect x="192" y="186" width="56" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="220" y="222" text-anchor="middle" font-size="9.5" fill="#b91c1c">空泡</text>
  <g>
    <rect x="252" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="274" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="296" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  </g>
  <rect x="320" y="186" width="56" height="18" fill="#fee2e2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <g>
    <rect x="380" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="402" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="424" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="446" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="468" y="186" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  </g>
  <text x="660" y="200" font-size="10" fill="#1e3a8a">GPU 跑完已提交的 kernel 就得等 CPU ——</text>
  <text x="660" y="216" font-size="10" fill="#1e3a8a">B=1 时 GPU 步仅 ~5ms，CPU 更慢，彻底 CPU-bound</text>
  <text x="660" y="232" font-size="10" fill="#1e3a8a">（Day 2 压测里 B=1 的 TPOT 超出理论值的去向）</text>

  <line x1="100" y1="256" x2="930" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrT)"/>
  <text x="515" y="278" text-anchor="middle" font-size="10" fill="#64748b">时间（一次 decode step，目标 5~8ms）</text>
  <text x="500" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">TPOT 实测 = GPU 时间 + 空泡 → 均值偏高、方差大（launch 抖动直接进时延）</text>

  <!-- ================= Panel 2: graph ================= -->
  <rect x="40" y="330" width="920" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="60" y="355" font-size="14" font-weight="bold" fill="#14532d">② Graph：capture once → 一次 replay 提交全部</text>

  <text x="60" y="390" font-size="11" font-weight="bold" fill="#b45309">CPU</text>
  <rect x="140" y="376" width="250" height="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <text x="265" y="391" text-anchor="middle" font-size="11" font-family="monospace" fill="#14532d">graph.replay()（1 次提交）</text>
  <text x="420" y="391" font-size="10" fill="#166534">CPU 开销 O(K) → O(1)，还能腾出手干别的（async scheduling）</text>

  <text x="60" y="436" font-size="11" font-weight="bold" fill="#1e3a8a">GPU</text>
  <g>
    <rect x="140" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="162" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="184" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="206" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="228" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="250" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="272" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="294" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="316" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="338" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="360" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="382" y="422" width="20" height="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  </g>
  <text x="420" y="436" font-size="10" fill="#166534">连续执行无空泡；TPOT 均值与方差双降</text>

  <text x="500" y="466" text-anchor="middle" font-size="10.5" fill="#166534">capture 在启动时逐桶完成（日志 <tspan font-family="monospace">Capturing CUDA graphs…</tspan>，冷启动多几十秒~分钟级）；静态 buffer 显存计入 <tspan font-family="monospace">gpu_memory_utilization</tspan></text>

  <!-- ================= Panel 3: buckets ================= -->
  <rect x="40" y="500" width="460" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="56" y="525" font-size="13" font-weight="bold" fill="#1e3a8a">③ 难点一：batch 每步变 → 分桶抓图 + padding</text>

  <g font-size="11" text-anchor="middle" font-family="monospace">
    <rect x="60" y="545" width="44" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="82" y="563">1</text>
    <rect x="112" y="545" width="44" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="134" y="563">2</text>
    <rect x="164" y="545" width="44" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="186" y="563">4</text>
    <rect x="216" y="545" width="44" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="238" y="563">8</text>
    <rect x="268" y="545" width="44" height="28" fill="#86efac" stroke="#16a34a" stroke-width="2.5"/><text x="290" y="563" font-weight="bold">16</text>
    <rect x="320" y="545" width="30" height="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="335" y="563">…</text>
    <rect x="358" y="545" width="118" height="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="417" y="563">max_num_seqs</text>
  </g>
  <text x="56" y="600" font-size="10.5" fill="#334155">运行时实际 bs=13 → 取 16 号桶，padding 3 个槽位：</text>
  <g>
    <rect x="60" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="73" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="86" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="99" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="112" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="125" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="138" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="151" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="164" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="177" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="190" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="203" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/><rect x="216" y="610" width="13" height="20" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
    <rect x="229" y="610" width="13" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/><rect x="242" y="610" width="13" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/><rect x="255" y="610" width="13" height="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  </g>
  <text x="285" y="624" font-size="9.5" fill="#64748b">13 实槽 + 3 padding（block table → null block）</text>

  <text x="56" y="664" font-size="10.5" fill="#334155">· 桶 = 2 的幂到 <tspan font-family="monospace">max_num_seqs</tspan>（<tspan font-family="monospace">--cuda-graph-sizes</tspan> 可自定义）；超过最大桶 → 回退 eager</text>
  <text x="56" y="688" font-size="10.5" fill="#334155">· 代价：每桶一份静态 buffer + 图（显存 ↔ KV 池的 trade-off）</text>
  <text x="56" y="712" font-size="10.5" fill="#334155">· 代价：padding 浪费槽位（decode 是 memory-bound，</text>
  <text x="68" y="728" font-size="10.5" fill="#334155">　主要代价是多读的 KV）</text>
  <text x="56" y="756" font-size="10.5" fill="#334155">· 显存极度紧张时：<tspan font-family="monospace">--enforce-eager</tspan> 换 KV 池是正确调优</text>

  <!-- ================= Panel 4: piecewise ================= -->
  <rect x="520" y="500" width="440" height="300" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="536" y="525" font-size="13" font-weight="bold" fill="#4c1d95">④ 难点二：KV 长度动态 → Piecewise（V1 默认）</text>

  <g font-size="9.5" text-anchor="middle">
    <rect x="540" y="545" width="88" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="584" y="558" fill="#14532d">图段</text><text x="584" y="572" fill="#14532d">qkv+RoPE+norm</text>
    <rect x="636" y="545" width="80" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <text x="676" y="558" fill="#881337">attention（图外）</text><text x="676" y="572" fill="#881337">动态 KV 长度</text>
    <rect x="724" y="545" width="88" height="34" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="768" y="558" fill="#14532d">图段</text><text x="768" y="572" fill="#14532d">o_proj+FFN</text>
    <rect x="820" y="545" width="80" height="34" fill="#fecdd3" stroke="#e11d48" stroke-width="1.5"/>
    <text x="860" y="558" fill="#881337">attention（图外）</text><text x="860" y="572" fill="#881337">varlen</text>
    <text x="910" y="566" fill="#64748b">…×36 层</text>
  </g>
  <text x="536" y="604" font-size="10.5" fill="#334155">· <tspan font-family="monospace">splitting_ops</tspan> 默认在 attention 处切分；其余段给定 bs 后形状静态 → 逐段抓图</text>
  <text x="536" y="626" font-size="10.5" fill="#334155">· FULL 模式（整步一张图）要求 backend 支持，版本相关；</text>
  <text x="548" y="642" font-size="10.5" fill="#334155"><tspan font-family="monospace">--enforce-eager</tspan> 一键全关（A/B 对照组）</text>

  <rect x="536" y="660" width="408" height="78" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="548" y="682" font-size="11" font-weight="bold" fill="#7f1d1d">高频题：为什么 prefill 不抓图？（两条说全）</text>
  <text x="548" y="702" font-size="10.5" fill="#7f1d1d">① 形状动态：chunk = 剩余预算（任意值）+ 序列长度任意 → 桶组合爆炸</text>
  <text x="548" y="722" font-size="10.5" fill="#7f1d1d">② 开销占比低：prefill 单步几十~几百 ms，2.5ms launch &lt; 5% → 不值得</text>

  <text x="740" y="768" text-anchor="middle" font-size="10" fill="#64748b">协同：静态输出 buffer 是 async scheduling 的前提（机制间依存，面试加分项）</text>
</svg>
