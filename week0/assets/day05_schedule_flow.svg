<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
    <marker id="aR2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#dc2626"/>
    </marker>
    <marker id="aS2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="950" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">schedule() 两段式决策流程：先保 running（decode），再准入 waiting（prefill）</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">本图与 Day 2 §2.1 的 vLLM 伪代码逐行对应 —— 对应 vLLM 的 schedule_running() → schedule_waiting() → SchedulerOutput</text>

  <!-- ================= Panel 1: running ================= -->
  <rect x="40" y="70" width="920" height="350" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#7f1d1d">第一段：保 running —— decode 优先</text>
  <text x="430" y="95" font-size="10.5" fill="#b91c1c">SLO 是连续的 TPOT：running 每步必须喂到（Day 2 Q1）</text>

  <rect x="310" y="112" width="380" height="58" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="500" y="134" text-anchor="middle" font-size="11" fill="#334155">① 取 req ∈ running（list 快照迭代；本步刚被抢的跳过）</text>
  <text x="500" y="152" text-anchor="middle" font-size="11" fill="#334155">num_new = req.num_new_tokens（decode 时 = 1）</text>

  <rect x="310" y="190" width="380" height="58" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#334155">② need = ⌈(num_computed + num_new) / 16⌉ − len(block_table)</text>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#334155">调度期就按「执行后容量」要块（对应 allocate_slots 语义）</text>

  <polygon points="500,272 592,308 500,344 408,308" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">③ can_alloc(need)?</text>

  <rect x="690" y="274" width="250" height="72" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="815" y="296" text-anchor="middle" font-size="11" fill="#334155">④ alloc(need) → 追加 block_table</text>
  <text x="815" y="314" text-anchor="middle" font-size="11" fill="#334155">plan[rid] = num_new，budget −= num_new</text>
  <text x="815" y="332" text-anchor="middle" font-size="10" fill="#64748b">（budget ≤ 0 → 提前结束第一段）</text>

  <rect x="60" y="274" width="270" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="195" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">_preempt(victim)</text>
  <text x="195" y="312" text-anchor="middle" font-size="10.5" fill="#334155">victim = running[-1] 队尾（LRU，排除自己）</text>
  <text x="195" y="328" text-anchor="middle" font-size="10.5" fill="#334155">free 全部块 · num_computed=0 → waiting 队首</text>

  <line x1="500" y1="170" x2="500" y2="188" stroke="#2563eb" stroke-width="2" marker-end="url(#aB2)"/>
  <line x1="500" y1="248" x2="500" y2="266" stroke="#2563eb" stroke-width="2" marker-end="url(#aB2)"/>
  <line x1="592" y1="308" x2="686" y2="308" stroke="#16a34a" stroke-width="2" marker-end="url(#aB2)"/>
  <text x="640" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">是</text>
  <line x1="408" y1="308" x2="334" y2="308" stroke="#dc2626" stroke-width="2" marker-end="url(#aR2)"/>
  <text x="372" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">否</text>
  <path d="M 195 346 C 195 380, 380 380, 470 350" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#aR2)"/>
  <text x="330" y="390" text-anchor="middle" font-size="10" fill="#b91c1c">重试（可能连环抢占，直到够或只剩自己）</text>
  <path d="M 940 340 L 948 340 L 948 408" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="700" y="408" text-anchor="middle" font-size="10.5" fill="#64748b">① → ④ 构成 decode 批：全部 O(1) 操作，整段亚 ms 级（Day 2 §2.4）</text>

  <!-- ================= Panel 2: waiting ================= -->
  <rect x="40" y="440" width="920" height="420" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="60" y="465" font-size="14" font-weight="bold" fill="#1e40af">第二段：准入 waiting —— 原子 prefill（一次追平，不切块）</text>
  <text x="470" y="465" font-size="10.5" fill="#1d4ed8">waiting 晚进一个 step 只推高一次性的 TTFT，感知弱于 TPOT</text>

  <rect x="310" y="478" width="380" height="56" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="500" y="500" text-anchor="middle" font-size="11" fill="#334155">⑤ while waiting 且 budget &gt; 0 且 len(running) &lt; max_seqs：</text>
  <text x="500" y="518" text-anchor="middle" font-size="11" fill="#334155">取 waiting[0]（队首，FCFS）</text>

  <rect x="310" y="552" width="380" height="56" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="500" y="574" text-anchor="middle" font-size="11" fill="#334155">⑥ n = num_new_tokens</text>
  <text x="500" y="592" text-anchor="middle" font-size="11" fill="#334155">新请求 = prompt_len ｜ 被抢恢复 = prompt + generated（全量重算）</text>

  <polygon points="500,628 592,664 500,700 408,664" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="669" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">⑦ n &gt; budget?</text>

  <rect x="700" y="626" width="240" height="80" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="820" y="648" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">break：队首阻塞（HOL）</text>
  <text x="820" y="666" text-anchor="middle" font-size="10.5" fill="#334155">长 prompt 挡住全队 —— 这正是 vLLM</text>
  <text x="820" y="682" text-anchor="middle" font-size="10.5" fill="#334155">需要 chunked prefill 的原因（Day 3 机制二）</text>
  <text x="820" y="698" text-anchor="middle" font-size="10" fill="#64748b">无 chunked 时须保证 budget ≥ 最长 prompt</text>

  <polygon points="500,724 600,760 500,796 400,760" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="500" y="765" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">⑧ can_alloc(need blocks)?</text>

  <rect x="60" y="724" width="270" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="195" y="746" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">break：KV 不足，停止准入</text>
  <text x="195" y="764" text-anchor="middle" font-size="10.5" fill="#334155">waiting 里的继续排队，等完成释放块</text>
  <text x="195" y="780" text-anchor="middle" font-size="10" fill="#64748b">（vLLM：先逐出 LRU 缓存块，还不够才轮到抢占）</text>

  <rect x="700" y="724" width="240" height="112" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="820" y="746" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">vLLM 在这里多两行 = chunked prefill</text>
  <text x="820" y="764" text-anchor="middle" font-size="10.5" fill="#334155">n = min(n, budget)（按剩余预算切块）</text>
  <text x="820" y="780" text-anchor="middle" font-size="10.5" fill="#334155">被切请求转 running → 下步在第一段续切</text>
  <text x="820" y="798" text-anchor="middle" font-size="10" fill="#166534">→ HOL 消失；TPOT 抖动被预算平滑</text>
  <text x="820" y="814" text-anchor="middle" font-size="10" fill="#64748b">—— 差距清单 #2</text>

  <rect x="310" y="812" width="380" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="830" text-anchor="middle" font-size="11" fill="#1e40af">⑨ alloc → plan[rid] = n → budget −= n</text>
  <text x="500" y="846" text-anchor="middle" font-size="11" fill="#1e40af">running.append(waiting.popleft())（while 成立则回到 ⑤）</text>

  <line x1="500" y1="534" x2="500" y2="550" stroke="#2563eb" stroke-width="2" marker-end="url(#aB2)"/>
  <line x1="500" y1="608" x2="500" y2="624" stroke="#2563eb" stroke-width="2" marker-end="url(#aB2)"/>
  <line x1="592" y1="664" x2="696" y2="664" stroke="#dc2626" stroke-width="2" marker-end="url(#aR2)"/>
  <text x="644" y="656" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">是</text>
  <line x1="500" y1="700" x2="500" y2="720" stroke="#2563eb" stroke-width="2" marker-end="url(#aB2)"/>
  <text x="512" y="714" font-size="11" font-weight="bold" fill="#166534">否</text>
  <line x1="400" y1="760" x2="334" y2="760" stroke="#64748b" stroke-width="2" marker-end="url(#aS2)"/>
  <text x="368" y="752" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">否</text>
  <line x1="500" y1="796" x2="500" y2="810" stroke="#16a34a" stroke-width="2" marker-end="url(#aB2)"/>
  <text x="512" y="806" font-size="11" font-weight="bold" fill="#166534">是</text>

  <!-- return -->
  <rect x="230" y="880" width="540" height="48" rx="8" fill="#1e293b"/>
  <text x="500" y="902" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">return plan —— 本步施工单 {rid: num_new_tokens}</text>
  <text x="500" y="919" text-anchor="middle" font-size="10" fill="#cbd5e1">vLLM 返回的是 SchedulerOutput：block_tables 增量、slot_mapping、COW 副本……（差距清单 #1）</text>
  <line x1="500" y1="860" x2="500" y2="876" stroke="#1e293b" stroke-width="2.2" marker-end="url(#aS2)"/>
  <path d="M 948 408 L 948 904 L 774 904" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#aS2)"/>
</svg>
