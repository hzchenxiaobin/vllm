name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'build/**'
      - 'static/**'
      - 'README.md'
      - 'prompt.md'
      - 'week0/**'
      - 'week1/**'
      - 'week2/**'
      - 'week3/**'
      - 'week4/**'
      - 'week5/**'
      - 'week6/**'
      - 'week7/**'
      - 'week8/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build website
        run: |
          python3 build.py
          echo "--- public directory structure ---"
          ls -la public/
          echo "--- file count ---"
          find public -type f | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
