  <!-- Bottom discipline strip -->
  <rect x="40" y="400" width="890" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="56" y="424" font-size="12" font-weight="bold" fill="#78350f">两条防坑纪律</text>
  <text x="56" y="444" font-size="11.5" fill="#475569">① Ratio 是"时间占比"不是"效率"：判定必须 AI 手算、Ratio 组合、多核均衡三证据交叉，单指标下结论 = 误诊</text>
  <text x="56" y="462" font-size="11.5" fill="#475569">② 版本敏感项（列名/文件名/参数集）以你机器的实际产物为准——本篇所有 CSV 列名均为"典型列"示意</text>
</svg>
