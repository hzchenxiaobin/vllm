<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Helvetica, Arial, sans-serif">
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Day 39 下钻流水线：从四本账到 kernel 级精确指控</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">纪律：先裁决 Day 38 的假设清单，再做补充扫描——不是漫无目的地"看热点"</text>

  <!-- ===== Row 1 ===== -->
  <!-- Box 1 -->
  <rect x="40" y="70" width="200" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">① 输入（Day 38 产出）</text>
  <text x="52" y="116" font-size="10.5" fill="#475569">· step_decomposition.md</text>
  <text x="60" y="132" font-size="10.5" fill="#475569">Top kernel 表（名字/次数/shape）</text>
  <text x="52" y="152" font-size="10.5" fill="#475569">· hypotheses.md（按 ROI 排序）</text>
  <text x="60" y="168" font-size="10.5" fill="#475569">每条都指定了"看什么指标"</text>

  <!-- Box 2 -->
  <rect x="280" y="70" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="380" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#064e3b">② kernel 级采集（三选一）</text>
  <text x="292" y="116" font-size="10.5" fill="#475569">A 在线 start/stop：便捷但难注入</text>
  <text x="296" y="132" font-size="10.5" fill="#475569">pipe 指标（experimental_config）</text>
  <text x="292" y="152" font-size="10.5" font-weight="bold" fill="#047857">B 离线 torch_npu.profiler ★主推</text>
  <text x="292" y="168" font-size="10.5" fill="#475569">C msprof CLI 全量，交叉验证</text>

  <!-- Box 3 -->
  <rect x="520" y="70" width="200" height="120" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="620" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#064e3b">③ Top-N 热点表</text>
  <text x="532" y="116" font-size="10.5" fill="#475569">· kernel_details.csv 按 Name 聚合</text>
  <text x="532" y="132" font-size="10.5" fill="#475569">· 次数 / 单次 p50·p99 / 总占比</text>
  <text x="532" y="152" font-size="10.5" fill="#475569">· Block Dim / shape / Ratio 摘要</text>
  <text x="532" y="168" font-size="10.5" fill="#475569">→ 落表 kernel_topn.md</text>

  <!-- Box 4 -->
  <rect x="760" y="70" width="170" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="845" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">④ 选中目标 kernel</text>
  <text x="772" y="116" font-size="10.5" fill="#475569">ROI = 占比 × 差距</text>
  <text x="776" y="132" font-size="10.5" fill="#475569">× 可改性 × 可验证</text>
  <text x="772" y="152" font-size="10.5" fill="#475569">· 与 Day 36 选题对齐</text>
  <text x="772" y="168" font-size="10.5" fill="#475569">· 通常 1 个，最多 2 个</text>

  <!-- Arrows row 1 -->
  <line x1="240" y1="130" x2="272" y2="130" stroke="#475569" stroke-width="1.8"/>
  <polygon points="278,130 268,125 268,135" fill="#475569"/>
