  <!-- Box 5 rightmost under box4 -->
  <rect x="760" y="250" width="170" height="120" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="845" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#064e3b">⑤ pipe 指标深挖</text>
  <text x="772" y="296" font-size="10.5" fill="#475569">· Cube/Vector/MTE 组合</text>
  <text x="772" y="312" font-size="10.5" fill="#475569">· 逐条裁决 hypotheses</text>
  <text x="776" y="328" font-size="10.5" fill="#475569">（已证实/证伪/待定）</text>
  <text x="772" y="348" font-size="10.5" fill="#475569">· 证据 = CSV 行号</text>

  <!-- Box 6 -->
  <rect x="520" y="250" width="200" height="120" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.5"/>
  <text x="620" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">⑥ 达芬奇数据流图</text>
  <text x="532" y="296" font-size="10.5" fill="#475569">· HBM→L2→L1→L0→Cube→写回</text>
  <text x="532" y="312" font-size="10.5" fill="#475569">· 逐段标 bytes 与理论耗时</text>
  <text x="532" y="332" font-size="10.5" fill="#475569">· 串行Σ / 全重叠max / 实测</text>
  <text x="532" y="348" font-size="10.5" fill="#475569">三列对比 → 差距=组织开销</text>

  <!-- Box 7 -->
  <rect x="280" y="250" width="200" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4c1d95">⑦ bound 判定（三证据）</text>
  <text x="292" y="296" font-size="10.5" fill="#475569">· AI vs ridge（手算先验）</text>
  <text x="292" y="312" font-size="10.5" fill="#475569">· η_mem（实测效率）</text>
  <text x="292" y="328" font-size="10.5" fill="#475569">· Block Dim vs AI Core 数</text>
  <text x="292" y="348" font-size="10.5" fill="#475569">→ 落表 kernel_bound.md</text>

  <!-- Box 8 -->
  <rect x="40" y="250" width="200" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">⑧ 交给 Day 40</text>
  <text x="52" y="296" font-size="10.5" fill="#475569">· bound 建模收口（η 分解）</text>
  <text x="52" y="312" font-size="10.5" fill="#475569">· 汇总《瓶颈分析报告》：</text>
  <text x="58" y="328" font-size="10.5" fill="#475569">现状数据 → 理论上限 → 优化空间</text>
  <text x="52" y="348" font-size="10.5" fill="#475569">· 优化方向按 ROI 排序</text>

  <!-- Arrows row 2 (right to left) -->
  <line x1="752" y1="310" x2="728" y2="310" stroke="#475569" stroke-width="1.8"/>
