<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Day 41 优化内循环：每一刀都是一次受控实验</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">纪律：门禁先于代码，便宜的门先过，任一门红 → revert 代码、保留认知</text>

  <!-- ===== Row 1: hypothesis -> design -> SMV ===== -->
  <rect x="40" y="72" width="250" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">① 假设（Day 40 报告）</text>
  <text x="54" y="118" font-size="10.5" fill="#475569">· 一句话指控：搬运组织问题</text>
  <text x="54" y="134" font-size="10.5" fill="#475569">· η=0.23 vs t_lb=43µs（优化空间）</text>
  <text x="54" y="150" font-size="10.5" fill="#475569">· 写成可裁决的形式：</text>
  <text x="54" y="166" font-size="10.5" fill="#475569">  预期区间 90~130µs（非理想值）</text>

  <rect x="355" y="72" width="250" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a5f">② 改动设计表</text>
  <text x="369" y="118" font-size="10.5" fill="#475569">· 文件 / 函数 / 参数（改哪）</text>
  <text x="369" y="134" font-size="10.5" fill="#475569">· 预期收益 + 传导链（为何）</text>
  <text x="369" y="150" font-size="10.5" fill="#475569">· 回滚方式：一个 commit（怎么退）</text>
  <text x="369" y="166" font-size="10.5" fill="#475569">· 边界：在 vllm_ascend 侧还是 CANN 侧</text>

  <rect x="670" y="72" width="250" height="110" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="795" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">③ 最小可测改动（SMV）</text>
  <text x="684" y="118" font-size="10.5" fill="#475569">· 单变量 diff（典型 &lt; 50 行）</text>
  <text x="684" y="134" font-size="10.5" fill="#475569">· 带自己的测试（单测可自动化）</text>
  <text x="684" y="150" font-size="10.5" fill="#475569">· 一个 commit → revert 成本恒定</text>
  <text x="684" y="166" font-size="10.5" fill="#475569">· 禁止：tiling+融合+重排一把梭</text>

  <line x1="290" y1="127" x2="347" y2="127" stroke="#475569" stroke-width="1.8"/>
  <polygon points="353,127 343,122 343,132" fill="#475569"/>
  <line x1="605" y1="127" x2="662" y2="127" stroke="#475569" stroke-width="1.8"/>
  <polygon points="668,127 658,122 658,132" fill="#475569"/>

  <!-- Down arrow from SMV to gates -->
  <line x1="795" y1="182" x2="795" y2="222" stroke="#475569" stroke-width="1.8"/>
  <polygon points="795,228 790,218 800,218" fill="#475569"/>

  <!-- ===== Gates stack (right-middle) ===== -->
  <text x="795" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">三道门禁（便宜 → 贵）</text>
  <rect x="670" y="262" width="250" height="58" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.5"/>
  <text x="795" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">G1 正确性（分钟级）</text>
  <text x="684" y="302" font-size="10.5" fill="#475569">单测全绿 + logits diff &lt; 阈值（Day 37 回归集）</text>
  <rect x="670" y="330" width="250" height="58" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.5"/>
  <text x="795" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">G2 microbench（十分钟级）</text>
  <text x="684" y="370" font-size="10.5" fill="#475569">p50 改善 &gt; 3× 噪声带；p99 不劣化</text>
  <rect x="670" y="398" width="250" height="58" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.5"/>
  <text x="795" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">G3 e2e（半小时级）</text>
  <text x="684" y="438" font-size="10.5" fill="#475569">TPOT / 吞吐超 baseline.md 噪声带</text>
  <line x1="795" y1="320" x2="795" y2="324" stroke="#475569" stroke-width="1.8"/>
  <line x1="795" y1="388" x2="795" y2="392" stroke="#475569" stroke-width="1.8"/>
  <polygon points="795,396 790,388 800,388" fill="#475569"/>

  <!-- ===== Judgment (left-middle) ===== -->
  <line x1="670" y1="427" x2="560" y2="427" stroke="#475569" stroke-width="1.8"/>
  <polygon points="554,427 564,422 564,432" fill="#475569"/>

  <rect x="300" y="398" width="250" height="58" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
  <text x="425" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">三绿 → commit（+ logbook 一行）</text>
  <text x="314" y="438" font-size="10.5" fill="#475569">传导链预测 vs G3 实测对齐 → 归因成立</text>

  <rect x="300" y="262" width="250" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="425" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">任一红 → revert</text>
  <text x="314" y="306" font-size="10.5" fill="#475569">· 代码回滚，认知不回滚</text>
  <text x="314" y="322" font-size="10.5" fill="#475569">· 失败原因 = 数据，写进 logbook</text>
  <text x="314" y="338" font-size="10.5" fill="#475569">· G2 赢 G3 输 → 查 §3.2 四道稀释表</text>

  <!-- Failure loop: revert -> back to design -->
  <path d="M 300 307 L 240 307 L 240 127 L 347 127" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <polygon points="353,127 343,122 343,132" fill="#dc2626"/>
  <text x="252" y="222" font-size="10" fill="#dc2626">换下一刀（回到设计）</text>

  <!-- ===== Bottom: logbook bar ===== -->
  <rect x="40" y="486" width="880" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="508" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">logbook.md —— 每刀一行：假设 / 改动 / G1-G3 数字 / 传导链 / 结论</text>
  <text x="480" y="526" text-anchor="middle" font-size="10.5" fill="#475569">5~15 把刀的原始档案 → 周末复盘（Day 42）"确保思路可对外讲述" → W7 PR 的证据链与 Day 53 讲稿素材</text>

  <line x1="425" y1="456" x2="425" y2="480" stroke="#047857" stroke-width="1.8"/>
  <polygon points="425,484 420,475 430,475" fill="#047857"/>
  <line x1="425" y1="352" x2="425" y2="392" stroke="#475569" stroke-width="0" />
</svg>
