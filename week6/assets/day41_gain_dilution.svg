<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <text x="480" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">收益传导链：kernel 微秒如何变成 TPOT 百分比（在哪里被稀释）</text>
  <text x="480" y="50" text-anchor="middle" font-size="12" fill="#64748b">Δt_step = Δt_kernel × N_calls/step × σ　　ΔTPOT% ≈ Δt_step / t_step × 100%　（示例：o_proj 融合，190→118µs）</text>

  <!-- ===== Main pipeline (top) ===== -->
  <rect x="30" y="80" width="200" height="96" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.8"/>
  <text x="130" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#064e3b">① kernel 级</text>
  <text x="130" y="126" text-anchor="middle" font-size="11" fill="#475569">p50：190 → 118 µs</text>
  <text x="130" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">-38%（G2 判据）</text>
  <text x="130" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">microbench 直接裁决</text>

  <line x1="230" y1="128" x2="282" y2="128" stroke="#475569" stroke-width="1.8"/>
  <polygon points="288,128 278,123 278,133" fill="#475569"/>
  <text x="259" y="118" text-anchor="middle" font-size="9.5" fill="#475569">× 36 次/step</text>

  <rect x="290" y="80" width="200" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="390" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">② step 级</text>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#475569">-72µs × 36 × σ=1</text>
  <text x="390" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">step：48 → 45.4 ms</text>
  <text x="390" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">σ：与 comm 重叠时 &lt; 1</text>

  <line x1="490" y1="128" x2="542" y2="128" stroke="#475569" stroke-width="1.8"/>
  <polygon points="548,128 538,123 538,133" fill="#475569"/>
  <text x="519" y="118" text-anchor="middle" font-size="9.5" fill="#475569">/ 48ms</text>

  <rect x="550" y="80" width="180" height="96" rx="8" fill="#fefce8" stroke="#b45309" stroke-width="1.8"/>
  <text x="640" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">③ 服务级（G3）</text>
  <text x="640" y="126" text-anchor="middle" font-size="11" fill="#475569">TPOT：48.2 → 45.6 ms</text>
  <text x="640" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">-5.4%（预测）</text>
  <text x="640" y="164" text-anchor="middle" font-size="9.5" fill="#64748b">需超噪声带才算数</text>

  <line x1="730" y1="128" x2="782" y2="128" stroke="#475569" stroke-width="1.8"/>
  <polygon points="788,128 778,123 778,133" fill="#475569"/>
  <text x="760" y="118" text-anchor="middle" font-size="9.5" fill="#475569">调度</text>

  <rect x="790" y="80" width="140" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="860" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">④ 反馈</text>
  <text x="860" y="126" text-anchor="middle" font-size="10.5" fill="#475569">TPOT↓ → batch↑</text>
  <text x="860" y="142" text-anchor="middle" font-size="10.5" fill="#475569">（Day 10 budget）</text>
  <text x="860" y="160" text-anchor="middle" font-size="10.5" fill="#991b1b">TPOT 部分回吐</text>

  <!-- ===== Dilution factors (bottom) ===== -->
  <text x="480" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">四道稀释因素 —— G3 实测对不上预测时的排查表（自上而下，先便宜后贵）</text>

  <rect x="40" y="232" width="205" height="120" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="142" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">① 重叠系数 σ &lt; 1</text>
  <text x="142" y="278" text-anchor="middle" font-size="10" fill="#475569">kernel 省的时间被</text>
  <text x="142" y="294" text-anchor="middle" font-size="10" fill="#475569">comm 重叠吃掉</text>
  <text x="142" y="318" font-size="10" fill="#047857">查：Day 38 trace 的</text>
  <text x="142" y="334" font-size="10" fill="#047857">kernel/comm 时间线</text>

  <rect x="275" y="232" width="205" height="120" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="377" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">② β = 0.80 天花板</text>
  <text x="377" y="278" text-anchor="middle" font-size="10" fill="#475569">device 账只占 step 80%；</text>
  <text x="377" y="294" text-anchor="middle" font-size="10" fill="#475569">kernel 收益还要乘</text>
  <text x="377" y="310" text-anchor="middle" font-size="10" fill="#475569">"该 kernel 占 kernel 账比"</text>
  <text x="377" y="334" font-size="10" fill="#047857">查：Day 38 四本账</text>

  <rect x="510" y="232" width="205" height="120" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="612" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">③ 调度反馈</text>
  <text x="612" y="278" text-anchor="middle" font-size="10" fill="#475569">TPOT 降 → 同 budget 下</text>
  <text x="612" y="294" text-anchor="middle" font-size="10" fill="#475569">running batch 变大</text>
  <text x="612" y="310" text-anchor="middle" font-size="10" fill="#475569">→ 单 step 变慢（回吐）</text>
  <text x="612" y="334" font-size="10" fill="#047857">查：num_running_seqs</text>

  <rect x="745" y="232" width="185" height="120" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="837" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">④ 图 / 内存行为</text>
  <text x="837" y="278" text-anchor="middle" font-size="10" fill="#475569">CG 重捕获、布局变化</text>
  <text x="837" y="294" text-anchor="middle" font-size="10" fill="#475569">影响其他 kernel</text>
  <text x="837" y="318" font-size="10" fill="#047857">查：enforce-eager</text>
  <text x="837" y="334" font-size="10" fill="#047857">对照支线（§4.3）</text>

  <!-- Arrows from pipeline down to dilution band -->
  <line x1="130" y1="176" x2="130" y2="228" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="640" y1="176" x2="612" y2="228" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="860" y1="176" x2="837" y2="228" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ===== Bottom: full-family extrapolation ===== -->
  <rect x="80" y="392" width="800" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">全家族外推（示意，写进 PR 要实测）：四类线性层同机理</text>
  <text x="480" y="438" text-anchor="middle" font-size="10.5" fill="#475569">量化 GEMM 占 kernel 账 ~70% ≈ 20.9ms（Day 38）× 同比例 -38% ≈ -8ms/step → TPOT -15% 量级</text>
  <text x="480" y="460" text-anchor="middle" font-size="10.5" fill="#64748b">注意：这是上限——四道稀释各咬一口；每一刀的 logbook 传导链就是拿实测去核对这条外推的地方</text>
</svg>
