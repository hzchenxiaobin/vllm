<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d21a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="d21r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="d21g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <pattern id="d21hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cbd5e1" stroke-width="2.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Static（request-level）vs Continuous（iteration-level）Batching</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">同一组请求（r1:P8/O6 · r2:P12/O3 · r3:P6/O10 · r4:P20/O4 · r5 晚到 P10/O5）· 成本模型：prefill ∝ token 数（0.2ms/tok）、decode 步长 ≈ 常数（6ms）+ 固定开销 1ms —— 与 §5 demo 一致</text>

  <!-- ================= LEFT: static batching ================= -->
  <rect x="40" y="64" width="600" height="556" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="340" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Static batching：批边界 = 批内最长请求（request-level）</text>

  <!-- legend -->
  <rect x="60" y="100" width="16" height="12" fill="#dbeafe" stroke="#2563eb"/><text x="80" y="110" font-size="8.6" fill="#475569">prefill（一次进批）</text>
  <rect x="176" y="100" width="16" height="12" fill="#dcfce7" stroke="#16a34a"/><text x="196" y="110" font-size="8.6" fill="#475569">decode</text>
  <rect x="256" y="100" width="16" height="12" fill="url(#d21hatch)" stroke="#cbd5e1"/><text x="276" y="110" font-size="8.6" fill="#475569">座位空闲（浪费）</text>
  <rect x="368" y="100" width="16" height="12" fill="#fef3c7" stroke="#d97706"/><text x="388" y="110" font-size="8.6" fill="#475569">晚到者 r5（批 2）</text>

  <!-- queue row -->
  <text x="92" y="137" font-size="9" font-weight="bold" fill="#64748b">queue</text>
  <rect x="130" y="122" width="294" height="22" fill="url(#d21hatch)" stroke="#cbd5e1"/>
  <text x="277" y="136" text-anchor="middle" font-size="8.4" fill="#9a3412">r5 在 t=0 已到达，但要等批 1 跑完（队头阻塞）</text>
  <line x1="424" y1="133" x2="446" y2="152" stroke="#d97706" stroke-width="1.6" marker-end="url(#d21a)"/>

  <!-- seat rows -->
  <text x="92" y="167" font-size="9" font-weight="bold" fill="#64748b">S1</text>
  <text x="92" y="197" font-size="9" font-weight="bold" fill="#64748b">S2</text>
  <text x="92" y="227" font-size="9" font-weight="bold" fill="#64748b">S3</text>
  <text x="92" y="257" font-size="9" font-weight="bold" fill="#64748b">S4</text>

  <!-- S1: r1 prefill + 5 decode + 4 idle ; then r5 in batch2 -->
  <rect x="130" y="152" width="54" height="22" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="166" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#1e3a8a">r1 P:8</text>
  <rect x="184" y="152" width="150" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="259" y="166" text-anchor="middle" font-size="8.2" fill="#14532d">r1 decode ×5</text>
  <rect x="334" y="152" width="90" height="22" fill="url(#d21hatch)" stroke="#cbd5e1"/>
  <rect x="424" y="152" width="40" height="22" fill="#fef3c7" stroke="#d97706"/><text x="444" y="166" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#78350f">r5 P</text>
  <rect x="464" y="152" width="120" height="22" fill="#dcfce7" stroke="#d97706" stroke-dasharray="4,2"/><text x="524" y="166" text-anchor="middle" font-size="8.2" fill="#78350f">r5 decode ×4</text>

  <!-- S2: r2 -->
  <rect x="130" y="182" width="54" height="22" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="196" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#1e3a8a">r2 P:12</text>
  <rect x="184" y="182" width="60" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="214" y="196" text-anchor="middle" font-size="8.2" fill="#14532d">r2 ×2</text>
  <rect x="244" y="182" width="180" height="22" fill="url(#d21hatch)" stroke="#cbd5e1"/>

  <!-- S3: r3 (longest) -->
  <rect x="130" y="212" width="54" height="22" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="226" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#1e3a8a">r3 P:6</text>
  <rect x="184" y="212" width="270" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="319" y="226" text-anchor="middle" font-size="8.2" fill="#14532d">r3 decode ×9 —— 全批等它（批边界由最长请求决定）</text>

  <!-- S4: r4 -->
  <rect x="130" y="242" width="54" height="22" fill="#dbeafe" stroke="#2563eb"/><text x="157" y="256" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#1e3a8a">r4 P:20</text>
  <rect x="184" y="242" width="90" height="22" fill="#dcfce7" stroke="#16a34a"/><text x="229" y="256" text-anchor="middle" font-size="8.2" fill="#14532d">r4 ×3</text>
  <rect x="274" y="242" width="150" height="22" fill="url(#d21hatch)" stroke="#cbd5e1"/>

  <!-- batch boundary + time axis -->
  <line x1="424" y1="118" x2="424" y2="284" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="424" y="296" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#dc2626">批 1 结束 = 73.2ms</text>
  <line x1="130" y1="278" x2="584" y2="278" stroke="#475569" stroke-width="1.2" marker-end="url(#d21a)"/>
  <text x="130" y="272" font-size="8" fill="#64748b">0</text>
  <text x="157" y="272" font-size="8" fill="#64748b">10.2</text>
  <text x="464" y="272" font-size="8" fill="#64748b">82.2</text>
  <text x="584" y="272" font-size="8" fill="#64748b">110.2 ms</text>
  <text x="357" y="308" text-anchor="middle" font-size="8" fill="#94a3b8">（时间轴按 4.4px/ms 概略缩放；decode 步长 7ms = 1+6）</text>

  <!-- callouts -->
  <rect x="60" y="322" width="560" height="120" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="76" y="342" font-size="10" font-weight="bold" fill="#991b1b">静态账单（本例手算，§3.1）</text>
  <text x="76" y="360" font-size="9" fill="#475569">舱位浪费  waste = 1 − Σdᵢ / (n·D) = 1 − (6+3+10+4) / (4×10) = 42.5%（d=输出长度，D=最长）</text>
  <text x="76" y="378" font-size="9" fill="#475569">r5 的 TTFT = 82.2ms（与它自己多长无关——批边界拦住了它）</text>
  <text x="76" y="396" font-size="9" fill="#475569">makespan = 110.2ms；decode 阶段 36 个座位步里只有 19 个在干活（47.2%）</text>
  <text x="76" y="418" font-size="8.6" fill="#9a3412">输出长度方差越大浪费越大：d ~ U[1,D] 时期望 waste → 50%；LLM 输出长度天然高方差</text>

  <rect x="60" y="452" width="560" height="52" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="76" y="472" font-size="9.4" font-weight="bold" fill="#0f172a">request-level 调度的两个结构性问题</text>
  <text x="76" y="490" font-size="8.8" fill="#475569">① 批边界由最长请求决定 → 短请求的座位空转；② 批进行中无法接纳新请求 → 队头阻塞（r5）</text>

  <text x="340" y="536" text-anchor="middle" font-size="8.8" fill="#64748b">对照实验（真实 GPU）留到 Day 27：届时 mini 引擎带上 chunked prefill + preemption 再比，更公平</text>
  <text x="340" y="556" text-anchor="middle" font-size="8.8" fill="#94a3b8">论文口径：Orca（OSDI'22）报告 iteration-level 调度相对当时的 request-level 系统端到端吞吐最高提升 36.9×</text>

  <!-- ================= RIGHT: continuous batching ================= -->
  <rect x="660" y="64" width="540" height="556" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="930" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">Continuous batching：iteration 级调度（§5 demo 实测轨迹，11 步）</text>

  <!-- step header -->
  <text x="712" y="114" font-size="8.4" font-weight="bold" fill="#64748b">step→</text>
  <g font-size="8.6" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="734" y="114">1</text><text x="776" y="114">2</text><text x="818" y="114">3</text><text x="860" y="114">4</text>
    <text x="902" y="114">5</text><text x="944" y="114">6</text><text x="986" y="114">7</text><text x="1028" y="114">8</text>
    <text x="1070" y="114">9</text><text x="1112" y="114">10</text><text x="1154" y="114">11</text>
  </g>

  <!-- rows r1..r5 ; cells 42x22, x0=716 ; y0=122 step 28 -->
  <g font-size="8.6" font-weight="bold" fill="#334155">
    <text x="712" y="138">r1</text><text x="712" y="166">r2</text><text x="712" y="194">r3</text>
    <text x="712" y="222">r4</text><text x="712" y="250">r5</text>
  </g>

  <!-- step 1: prefills r1,r2,r3 -->
  <rect x="716" y="124" width="38" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="735" y="137" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1e3a8a">P:8</text>
  <rect x="716" y="152" width="38" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="735" y="165" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1e3a8a">P:12</text>
  <rect x="716" y="180" width="38" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="735" y="193" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1e3a8a">P:6</text>
  <!-- step 2 -->
  <rect x="758" y="124" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="758" y="152" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="758" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 3: r2 done -->
  <rect x="800" y="124" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="800" y="152" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><text x="819" y="166" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#059669">✓</text>
  <rect x="800" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 4: r4 admitted (prefill 20) -->
  <rect x="842" y="124" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="842" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="842" y="210" width="38" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="861" y="223" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1e3a8a">P:20</text>
  <!-- step 5 -->
  <rect x="884" y="124" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="884" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="884" y="210" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 6: r1 done -->
  <rect x="926" y="124" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><text x="945" y="138" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#059669">✓</text>
  <rect x="926" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="926" y="210" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 7: r5 admitted (prefill 10), r4 done -->
  <rect x="968" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="968" y="210" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><text x="987" y="224" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#059669">✓</text>
  <rect x="968" y="238" width="38" height="20" fill="#dbeafe" stroke="#2563eb"/><text x="987" y="251" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#1e3a8a">P:10</text>
  <!-- step 8,9 -->
  <rect x="1010" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="1010" y="238" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="1052" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><rect x="1052" y="238" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 10: r3 done -->
  <rect x="1094" y="180" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><text x="1113" y="194" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#059669">✓</text>
  <rect x="1094" y="238" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/>
  <!-- step 11: r5 done -->
  <rect x="1136" y="238" width="38" height="20" fill="#dcfce7" stroke="#16a34a"/><text x="1155" y="252" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#059669">✓</text>

  <!-- step durations -->
  <text x="712" y="282" font-size="8.4" font-weight="bold" fill="#64748b">ms/步</text>
  <g font-size="8" fill="#475569" text-anchor="middle">
    <text x="735" y="282">6.2</text><text x="777" y="282">7</text><text x="819" y="282">7</text><text x="861" y="282">11</text>
    <text x="903" y="282">7</text><text x="945" y="282">7</text><text x="987" y="282">9</text><text x="1029" y="282">7</text>
    <text x="1071" y="282">7</text><text x="1113" y="282">7</text><text x="1155" y="282">7</text>
  </g>
  <text x="930" y="300" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#065f46">makespan = 82.2ms（步长含混排：step4/7 带 prefill）</text>

  <!-- admission annotations -->
  <path d="M 861 232 C 861 320 720 320 720 268" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#d21r)"/>
  <text x="762" y="330" font-size="8.2" fill="#b91c1c">r4 的 prefill 被 budget 闸推迟到 step 4（预算 32 − 26 = 6 &lt; 20）——Day 11 的 SLO 权衡</text>
  <path d="M 987 260 C 987 344 880 344 880 268" fill="none" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,2" marker-end="url(#d21r)"/>
  <text x="1000" y="348" font-size="8.2" fill="#b91c1c">r5 被 KV+reserve 闸推迟到 step 7</text>

  <!-- callout box -->
  <rect x="680" y="362" width="500" height="142" rx="7" fill="#f0fdf4" stroke="#86efac"/>
  <text x="696" y="382" font-size="10" font-weight="bold" fill="#065f46">连续账单（同成本模型）</text>
  <text x="696" y="400" font-size="9" fill="#475569">座位浪费 ≈ 0：队列非空时每个 decode 步都满座（r2/r1/r4 走了 r4/r5 立刻补位）</text>
  <text x="696" y="418" font-size="9" fill="#475569">r5 TTFT = 54.2ms（vs 82.2，−34%）；makespan = 82.2ms（vs 110.2，−25%）</text>
  <text x="696" y="436" font-size="9" fill="#475569">诚实代价①：r3（最长请求）E2E = 75.2ms，反而比 static 的 73.2 慢 2ms——混排步（4/7）垫高了它的 ITL</text>
  <text x="696" y="454" font-size="9" fill="#475569">诚实代价②：r4 TTFT = 31.2ms（vs 10.2）——budget 保护 decode 平滑的代价（Day 11 结论重现）</text>
  <text x="696" y="478" font-size="8.6" fill="#047857">本质：调度粒度从「请求」降到「迭代」——每个 step 都是重新组批的机会，批内成员可变</text>
  <text x="696" y="494" font-size="8.6" fill="#047857">术语：NVIDIA TensorRT-LLM 称同一机制为 in-flight batching（调度粒度 = 单个 iteration）</text>

  <text x="930" y="536" text-anchor="middle" font-size="8.8" fill="#64748b">完成序 = r2 → r1 → r4 → r3 → r5：由「输出长度 × 入场时机」共同决定（r4 比 r1 短却更晚完成——它 step 4 才入场）</text>
  <text x="930" y="556" text-anchor="middle" font-size="8.8" fill="#94a3b8">vLLM V1 的统一调度模型（Day 11）：没有 prefill/decode 批的概念，只有「每步让 computed 追上 tokens」</text>

  <!-- ================= bottom strip ================= -->
  <rect x="40" y="640" width="1160" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="620" y="664" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">三行结论（面试可直接背）</text>
  <g font-size="9.4" fill="#334155">
    <text x="70" y="688">① static batching 的两个结构性浪费——舱位空转（waste = 1 − Σdᵢ/(n·D)，本例 42.5%，均匀分布期望 ~50%）与队头阻塞（批进行中新请求进不来）</text>
    <text x="70" y="710">② continuous batching 把调度粒度从请求级降到迭代级：每个 step 重新组批，完成即离席、有座即入场——本例 makespan −25%、晚到者 TTFT −34%、座位浪费 → 0</text>
    <text x="70" y="732">③ 代价：完成检测/调度每步都要做（CPU 开销，Day 19 的主题）、混排步垫高在跑请求的 ITL（Day 11 的 chunked prefill 权衡）、准入控制复杂化（KV/budget/seqs 三道闸，今天 mini 的实现）</text>
  </g>
  <text x="70" y="760" font-size="8.8" fill="#64748b">本图数据 = mini 引擎 demo（§5 实验 1）与 static 手算（§3.1 对账题 1）的逐格可视化——把这张图和你的 demo 输出并排贴进项目 README（Day 27）</text>
</svg>
