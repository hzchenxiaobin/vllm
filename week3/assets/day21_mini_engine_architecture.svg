<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d21ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="d21bb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="d21bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="d21bd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">mini 引擎（项目 B · Day 21 版）：组件图与 schedule() 决策流程</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">左：端到端数据流（Schedule → KV 分配 → 模拟执行 → update 回写的闭环） · 右：schedule() 的两段循环与四道闸（灰字 = vLLM V1 对照，v0.11.0）</text>

  <!-- ================= LEFT: components ================= -->
  <rect x="40" y="64" width="560" height="830" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="320" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">组件图：一个 step 的完整闭环</text>

  <!-- requests -->
  <rect x="200" y="102" width="240" height="34" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text x="320" y="123" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#334155">add_request()：长度校验 → waiting</text>
  <line x1="320" y1="136" x2="320" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- scheduler box -->
  <rect x="80" y="152" width="480" height="170" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="96" y="174" font-size="11" font-weight="bold" fill="#1e3a8a">Scheduler（vllm/v1/core/sched/scheduler.py 的微缩版）</text>
  <rect x="96" y="184" width="200" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="196" y="200" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">waiting: deque（FCFS）</text>
  <text x="196" y="214" text-anchor="middle" font-size="8" fill="#475569">队头进不来不跳队</text>
  <text x="196" y="228" text-anchor="middle" font-size="8" fill="#475569">↔ Scheduler.waiting</text>
  <rect x="344" y="184" width="200" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="444" y="200" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">running: list（入场序）</text>
  <text x="444" y="214" text-anchor="middle" font-size="8" fill="#475569">稳态每请求每步 1 token</text>
  <text x="444" y="228" text-anchor="middle" font-size="8" fill="#475569">↔ Scheduler.running</text>
  <text x="96" y="258" font-size="8.6" fill="#475569">旋钮：token_budget ↔ max_num_batched_tokens（:197-198）· max_seqs ↔ max_num_seqs（默认 128）</text>
  <text x="96" y="274" font-size="8.6" fill="#475569">max_model_len（入场长度校验）· reserve_per_running（watermark 式余量，vLLM v0.11.0 已删，Day 12）</text>
  <text x="96" y="294" font-size="8.8" font-weight="bold" fill="#9a3412">账本字段 num_computed_tokens：本步调多少 = num_tokens − computed（Day 11 统一模型）</text>

  <!-- arrows to block table -->
  <line x1="180" y1="322" x2="150" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <line x1="280" y1="322" x2="250" y2="352" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <line x1="420" y1="352" x2="450" y2="322" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="118" y="342" font-size="8" fill="#475569">①peek</text>
  <text x="238" y="342" font-size="8" fill="#475569">②allocate</text>
  <text x="432" y="342" font-size="8" fill="#475569">③free</text>

  <!-- day20 box -->
  <rect x="80" y="354" width="300" height="150" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="96" y="376" font-size="11" font-weight="bold" fill="#4c1d95">Day 20 成品：BlockTable + BlockPool</text>
  <text x="96" y="396" font-size="8.6" fill="#475569">① would_allocate(rid, n) → 新块数（不动池）</text>
  <text x="96" y="410" font-size="8" fill="#64748b">   ↔ get_num_blocks_to_allocate（Day 15 三笔账）</text>
  <text x="96" y="428" font-size="8.6" fill="#475569">② append_slots(rid, n)：尾块空位先用满再开新块</text>
  <text x="96" y="442" font-size="8" fill="#64748b">   ↔ allocate_slots（kv_cache_manager.py:193-304）</text>
  <text x="96" y="460" font-size="8.6" fill="#475569">③ free_request(rid)：ref_cnt−1，归零回队尾</text>
  <text x="96" y="474" font-size="8" fill="#64748b">   ↔ free（hash 保留——Day 16 驱逐语义的地基）</text>
  <text x="96" y="494" font-size="8.6" font-weight="bold" fill="#7c3aed">不变式 I1~I4 全程有效（Day 20 的测试是今天的安全网）</text>

  <!-- scheduler output -->
  <line x1="560" y1="236" x2="600" y2="236" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <rect x="404" y="524" width="236" height="86" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="522" y="544" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">SchedulerOutput</text>
  <text x="522" y="560" text-anchor="middle" font-size="8.4" fill="#475569">scheduled: [(rid, num_new_tokens)]</text>
  <text x="522" y="574" text-anchor="middle" font-size="8.4" fill="#475569">stalled: [rid] · total_tokens ≤ token_budget</text>
  <text x="522" y="592" text-anchor="middle" font-size="8" fill="#64748b">↔ token_ids / block 增量 / positions（真版还带这些）</text>
  <line x1="522" y1="322" x2="522" y2="520" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <path d="M 522 524 C 522 500 500 430 430 344" fill="none" stroke="none"/>

  <!-- executor -->
  <line x1="522" y1="610" x2="522" y2="628" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <rect x="404" y="630" width="236" height="110" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="522" y="650" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">SimulatedExecutor.execute()</text>
  <text x="522" y="668" text-anchor="middle" font-size="8.4" fill="#475569">t = T_fixed(1ms) + α·prefill_tokens(0.2ms/tok)</text>
  <text x="522" y="682" text-anchor="middle" font-size="8.4" fill="#475569">        + T_decode(6ms)·[本步含 decode]</text>
  <text x="522" y="700" text-anchor="middle" font-size="8.2" fill="#92400e">prefill ∝ token 数（compute-bound，Day 1）</text>
  <text x="522" y="714" text-anchor="middle" font-size="8.2" fill="#92400e">decode ≈ 常数步长（memory-bound，Day 1/2）</text>
  <text x="522" y="732" text-anchor="middle" font-size="8" fill="#64748b">↔ execute_model：prep → CG replay → sample（Day 17/18）</text>

  <!-- update -->
  <line x1="522" y1="740" x2="522" y2="758" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <rect x="404" y="760" width="236" height="120" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="522" y="780" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">update_from_output(out, sampled)</text>
  <text x="522" y="798" text-anchor="middle" font-size="8.4" fill="#475569">token 到账 → output_token_ids += 1（记 TTFT）</text>
  <text x="522" y="812" text-anchor="middle" font-size="8.4" fill="#475569">「EOS」判定：len(output) ≥ output_len → finish</text>
  <text x="522" y="826" text-anchor="middle" font-size="8.4" fill="#475569">finish → free_request（I1 守恒）→ 出 running</text>
  <text x="522" y="846" text-anchor="middle" font-size="8" fill="#64748b">↔ update_from_output：stop 检查/finish/free</text>
  <text x="522" y="860" text-anchor="middle" font-size="8" fill="#64748b">本版同步到账——Day 19 的 async 版要晚一步</text>

  <!-- loop back arrow -->
  <path d="M 404 820 L 56 820 L 56 236 L 74 236" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#d21bd)"/>
  <text x="66" y="530" font-size="8.4" fill="#047857" transform="rotate(-90 66 530)">下一个 step：完成者已离席、waiting 重试准入 —— 这就是 iteration 级调度</text>

  <!-- stall branch -->
  <rect x="80" y="524" width="286" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="96" y="544" font-size="10" font-weight="bold" fill="#991b1b">停摆分支（本周语义）</text>
  <text x="96" y="562" font-size="8.4" fill="#475569">running 尾块满 + 池空 → stalled（本步 0 token，仍留 running）</text>
  <text x="96" y="576" font-size="8.4" fill="#475569">连续 MAX_STALL=8 步空转 → RuntimeError（主动报死锁）</text>
  <text x="96" y="596" font-size="8.4" fill="#9a3412">vLLM 在此触发 preemption（scheduler.py:254-292）：</text>
  <text x="96" y="610" font-size="8.4" fill="#9a3412">free 最新 running + computed=0 + 塞回 waiting 队首 →</text>
  <text x="96" y="624" font-size="8.4" font-weight="bold" fill="#b91c1c">Day 27 实现（实验 2 场景 4 亲眼看到它的必要性）</text>

  <text x="320" y="668" text-anchor="middle" font-size="8.8" fill="#64748b">MiniEngine.step() = schedule → execute → update（↔ EngineCore.step，core.py:272-291）</text>
  <text x="320" y="686" text-anchor="middle" font-size="8.8" fill="#64748b">clock += dt · finished[] 记 TTFT/E2E · last_total_tokens ≤ token_budget（测试 3 的不变量）</text>

  <!-- ================= RIGHT: schedule() flowchart ================= -->
  <rect x="630" y="64" width="570" height="830" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="915" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">schedule() 决策流程（伪代码 ↔ 源码同构）</text>

  <!-- start -->
  <rect x="800" y="102" width="230" height="28" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="915" y="120" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e3a8a">budget = token_budget</text>
  <line x1="915" y1="130" x2="915" y2="142" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- running loop header -->
  <rect x="770" y="144" width="290" height="26" rx="5" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="915" y="161" text-anchor="middle" font-size="9.4" font-weight="bold" fill="#1e3a8a">① running 循环（FCFS，先到先得）</text>
  <line x1="915" y1="170" x2="915" y2="180" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- gate 1 -->
  <polygon points="915,182 1035,214 915,246 795,214" fill="#ffffff" stroke="#94a3b8"/>
  <text x="915" y="210" text-anchor="middle" font-size="8.6" fill="#334155">num_new = tokens−computed</text>
  <text x="915" y="222" text-anchor="middle" font-size="8.6" fill="#334155">num_new &gt; budget ?</text>
  <line x1="1035" y1="214" x2="1090" y2="214" stroke="#dc2626" stroke-width="1.3" marker-end="url(#d21bc)"/>
  <text x="1062" y="208" text-anchor="middle" font-size="7.8" fill="#b91c1c">是</text>
  <text x="1100" y="210" font-size="8" fill="#b91c1c">break：预算性空洞</text>
  <text x="1100" y="222" font-size="7.6" fill="#94a3b8">↔ :238-252 continue</text>
  <line x1="915" y1="246" x2="915" y2="256" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="922" y="254" font-size="7.8" fill="#475569">否</text>

  <!-- gate 2 -->
  <polygon points="915,258 1035,290 915,322 795,290" fill="#ffffff" stroke="#94a3b8"/>
  <text x="915" y="286" text-anchor="middle" font-size="8.6" fill="#334155">would_allocate(rid, num_new)</text>
  <text x="915" y="298" text-anchor="middle" font-size="8.6" fill="#334155">&gt; num_free_blocks ?</text>
  <line x1="1035" y1="290" x2="1090" y2="290" stroke="#dc2626" stroke-width="1.3" marker-end="url(#d21bc)"/>
  <text x="1062" y="284" text-anchor="middle" font-size="7.8" fill="#b91c1c">是</text>
  <text x="1100" y="286" font-size="8" fill="#b91c1c">stalled += rid；continue</text>
  <text x="1100" y="298" font-size="7.6" fill="#94a3b8">↔ vLLM 此处 preempt（D12）</text>
  <line x1="915" y1="322" x2="915" y2="332" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="922" y="330" font-size="7.8" fill="#475569">否</text>

  <!-- action 1 -->
  <rect x="800" y="334" width="230" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="915" y="350" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#14532d">append_slots(rid, num_new)；computed += num_new</text>
  <text x="915" y="366" text-anchor="middle" font-size="8.4" fill="#14532d">scheduled += (rid, num_new)；budget −= num_new</text>
  <line x1="915" y1="376" x2="915" y2="388" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- waiting loop header -->
  <rect x="770" y="390" width="290" height="26" rx="5" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="915" y="407" text-anchor="middle" font-size="9.4" font-weight="bold" fill="#1e3a8a">② waiting 循环（FCFS 准入）</text>
  <line x1="915" y1="416" x2="915" y2="426" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- gate 3: loop condition + budget -->
  <polygon points="915,428 1040,462 915,496 790,462" fill="#ffffff" stroke="#94a3b8"/>
  <text x="915" y="456" text-anchor="middle" font-size="8.4" fill="#334155">waiting 非空 且 budget&gt;0</text>
  <text x="915" y="468" text-anchor="middle" font-size="8.4" fill="#334155">且 len(running) &lt; max_seqs ?</text>
  <text x="915" y="484" text-anchor="middle" font-size="7.6" fill="#94a3b8">（循环三条件不满足即整体退出）</text>
  <line x1="915" y1="496" x2="915" y2="508" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="922" y="506" font-size="7.8" fill="#475569">满足</text>

  <!-- gate 4: prompt vs budget -->
  <polygon points="915,510 1040,542 915,574 790,542" fill="#ffffff" stroke="#94a3b8"/>
  <text x="915" y="538" text-anchor="middle" font-size="8.6" fill="#334155">head.prompt_len &gt; budget ?</text>
  <line x1="1040" y1="542" x2="1090" y2="542" stroke="#dc2626" stroke-width="1.3" marker-end="url(#d21bc)"/>
  <text x="1064" y="536" text-anchor="middle" font-size="7.8" fill="#b91c1c">是</text>
  <text x="1096" y="538" font-size="7.8" fill="#b91c1c">break：FCFS 不跳队</text>
  <text x="1096" y="550" font-size="7.6" fill="#94a3b8">插队是 threshold 旋钮（D11）</text>
  <line x1="915" y1="574" x2="915" y2="586" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="922" y="584" font-size="7.8" fill="#475569">否</text>

  <!-- gate 5: KV + reserve -->
  <polygon points="915,588 1050,624 915,660 780,624" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="915" y="616" text-anchor="middle" font-size="8.4" fill="#334155">need + reserve·(len(running)+1)</text>
  <text x="915" y="628" text-anchor="middle" font-size="8.4" fill="#334155">&gt; num_free_blocks ?</text>
  <text x="915" y="646" text-anchor="middle" font-size="7.4" fill="#92400e">reserve = watermark 余量（v0.11.0 已删，Day 12）</text>
  <line x1="1050" y1="624" x2="1090" y2="624" stroke="#dc2626" stroke-width="1.3" marker-end="url(#d21bc)"/>
  <text x="1068" y="618" text-anchor="middle" font-size="7.8" fill="#b91c1c">是</text>
  <text x="1096" y="620" font-size="7.8" fill="#b91c1c">break：停在 waiting</text>
  <text x="1096" y="632" font-size="7.6" fill="#94a3b8">free 后自动重试（场景 2）</text>
  <line x1="915" y1="660" x2="915" y2="672" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>
  <text x="922" y="670" font-size="7.8" fill="#475569">否</text>

  <!-- action 2: admit -->
  <rect x="790" y="674" width="250" height="58" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="915" y="692" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#14532d">准入（= 本版 prefill，一步完成）</text>
  <text x="915" y="706" text-anchor="middle" font-size="8.4" fill="#14532d">append_slots(rid, prompt_len)；computed = prompt_len</text>
  <text x="915" y="720" text-anchor="middle" font-size="8.4" fill="#14532d">running += head；budget −= prompt_len</text>
  <line x1="915" y1="732" x2="915" y2="744" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- chunked hook note -->
  <rect x="770" y="746" width="290" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="915" y="762" text-anchor="middle" font-size="8.2" font-weight="bold" fill="#78350f">Day 27 的口子（chunked prefill）</text>
  <text x="915" y="776" text-anchor="middle" font-size="7.8" fill="#78350f">把「prompt_len 整段」改成 min(欠账, budget) 即长出切块</text>
  <line x1="915" y1="790" x2="915" y2="802" stroke="#475569" stroke-width="1.4" marker-end="url(#d21ba)"/>

  <!-- end -->
  <rect x="800" y="804" width="230" height="28" rx="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="915" y="822" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#1e3a8a">return SchedulerOutput</text>

  <!-- config invariant note -->
  <rect x="650" y="848" width="530" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="915" y="864" text-anchor="middle" font-size="8.4" fill="#475569">启动校验（本版 __init__ 同款）：token_budget ≥ max_seqs —— 否则排后的 running 拿不到 token</text>
  <text x="915" y="876" text-anchor="middle" font-size="8" fill="#94a3b8">↔ config/scheduler.py:245-249（Day 11 的「ITL 平滑靠不变量不靠运气」）</text>
</svg>
