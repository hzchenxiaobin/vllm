<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d20f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">四条不变式的精确版（I1~I4）与 checker 设计</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">week3 README 措辞 → 可测试断言（共享语义下的两处歧义在此修正） · 底部：checker 用法与复杂度速查 —— 产出物公式卡的底稿</text>

  <!-- ============ I1 ============ -->
  <rect x="40" y="64" width="580" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="56" y="80" width="60" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="86" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">I1 守恒</text>
  <text x="128" y="96" font-size="9.6" font-weight="bold" fill="#0f172a">空闲块数 + 被引用块数 == 总块数</text>

  <rect x="56" y="110" width="548" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="66" y="126" font-size="9.6" font-weight="bold" fill="#334155">len(free_queue)  +  |{ b : b.ref_cnt &gt; 0 }|  ==  num_blocks</text>
  <text x="500" y="126" font-size="8.5" fill="#7c3aed">← 共享块只计一次</text>

  <text x="64" y="156" font-size="8.5" fill="#64748b">池 16 块的水位图：</text>
  <rect x="64" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="96" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="128" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="160" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="192" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="224" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="256" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="288" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="320" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="352" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="384" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="416" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/><rect x="448" y="162" width="32" height="22" fill="#f1f5f9" stroke="#94a3b8"/>
  <rect x="480" y="162" width="32" height="22" fill="#bfdbfe" stroke="#2563eb"/><text x="496" y="177" text-anchor="middle" font-size="8" fill="#1e3a8a">b5</text>
  <rect x="512" y="162" width="32" height="22" fill="#bfdbfe" stroke="#2563eb"/><text x="528" y="177" text-anchor="middle" font-size="8" fill="#1e3a8a">b6</text>
  <rect x="544" y="162" width="32" height="22" fill="#ddd6fe" stroke="#7c3aed"/><text x="560" y="177" text-anchor="middle" font-size="8" fill="#4c1d95">b0</text>
  <circle cx="572" cy="162" r="9" fill="#7c3aed"/><text x="572" y="165.5" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#fff">2</text>

  <line x1="64" y1="194" x2="480" y2="194" stroke="#475569" stroke-width="1.2"/>
  <line x1="64" y1="190" x2="64" y2="198" stroke="#475569" stroke-width="1.2"/><line x1="480" y1="190" x2="480" y2="198" stroke="#475569" stroke-width="1.2"/>
  <text x="272" y="208" text-anchor="middle" font-size="8.5" fill="#475569">len(free_queue) = 13（含可驱逐缓存块）</text>
  <line x1="480" y1="194" x2="576" y2="194" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="576" y1="190" x2="576" y2="198" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="528" y="208" text-anchor="middle" font-size="8.5" fill="#7c3aed">占用 3 块</text>
  <text x="64" y="230" font-size="9" font-weight="bold" fill="#166534">13 + 3 == 16 ✓（b0 被 A、B 共享：ref=2，仍只算一块）</text>

  <rect x="56" y="244" width="548" height="56" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="68" y="262" font-size="8.6" font-weight="bold" fill="#991b1b">⚠ README 原文「free_queue 中块数 + Σ ref 计数占用块数」的歧义：</text>
  <text x="68" y="278" font-size="8.4" fill="#7c2d12">若把「Σ ref 计数」读作计数和 Σref_cnt = 1+1+2 = 4 → 13+4 ≠ 16 ✗；精确版取「ref&gt;0 的块数」= 3 ✓</text>
  <text x="68" y="292" font-size="8.4" fill="#7c2d12">测试照精确版写（§4.3 checker 第一条断言），否则共享一出现就误报</text>

  <!-- ============ I2 ============ -->
  <rect x="620" y="64" width="580" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="636" y="80" width="60" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="666" y="96" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">I2 无重叠</text>
  <text x="708" y="96" font-size="9.6" font-weight="bold" fill="#0f172a">与 I1 合成一个双条件（checker 一次遍历锁两条）</text>

  <rect x="636" y="110" width="548" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="646" y="126" font-size="9.6" font-weight="bold" fill="#334155">∀ b :  b 在 free 队列中  ⇔  b.ref_cnt == 0</text>

  <text x="644" y="156" font-size="8.5" fill="#64748b">队里全是无主块（✓）：</text>
  <rect x="644" y="162" width="52" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="670" y="178" text-anchor="middle" font-size="8.5" fill="#475569">b4 0</text>
  <rect x="700" y="162" width="52" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="726" y="178" text-anchor="middle" font-size="8.5" fill="#475569">b7 0</text>
  <rect x="756" y="162" width="52" height="24" rx="4" fill="#fef9c3" stroke="#eab308"/><text x="782" y="178" text-anchor="middle" font-size="8.5" fill="#713f12">b9 h</text>
  <text x="820" y="178" font-size="8" fill="#64748b">（缓存块：ref=0 且带 hash，可被 touch 复活 / 被分配驱逐）</text>

  <text x="644" y="206" font-size="8.5" fill="#64748b">队外全是被引用块（✓）：</text>
  <rect x="644" y="212" width="52" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="670" y="228" text-anchor="middle" font-size="8.5" fill="#1e3a8a">b5 1</text>
  <rect x="700" y="212" width="52" height="24" rx="4" fill="#ddd6fe" stroke="#7c3aed"/><text x="726" y="228" text-anchor="middle" font-size="8.5" fill="#4c1d95">b0 2</text>
  <text x="764" y="228" font-size="8" fill="#64748b">（共享块：ref=2，两张大表各挂一次）</text>

  <rect x="636" y="246" width="262" height="54" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="646" y="264" font-size="8.6" font-weight="bold" fill="#991b1b">禁止态（✗）：ref&gt;0 的块在队里</text>
  <text x="646" y="280" font-size="8.2" fill="#7c2d12">同一块既可被分配又还被引用</text>
  <text x="646" y="294" font-size="8.2" fill="#7c2d12">→ 双写 = 写覆盖（I4 连锁崩）</text>
  <rect x="910" y="246" width="274" height="54" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="920" y="264" font-size="8.6" font-weight="bold" fill="#166534">checker 写法（§4.3）</text>
  <text x="920" y="280" font-size="8.2" fill="#166534">in_queue = {b.id for b in free_queue}</text>
  <text x="920" y="294" font-size="8.2" fill="#166534">for b: assert (b.id ∈ in_queue) == (b.ref==0)</text>

  <!-- ============ I3 ============ -->
  <rect x="40" y="326" width="580" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="56" y="342" width="60" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="86" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">I3 容量</text>
  <text x="128" y="358" font-size="9.6" font-weight="bold" fill="#0f172a">精确版三条 + 共享增益公式</text>

  <text x="64" y="384" font-size="8.6" fill="#991b1b">✗ README 原文「Σ(每请求已分配 token 数) ≤ num_blocks × block_size」在共享下不成立：</text>
  <text x="64" y="398" font-size="8.4" fill="#7c2d12">图 2 场景结束时 A、B 各 41 个逻辑 token，Σ = 82 &gt; 物理 4 块 × 16 = 64 槽 —— 但这不是违约，是收益：</text>

  <rect x="64" y="410" width="100" height="36" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="114" y="426" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a">b0</text><text x="114" y="438" text-anchor="middle" font-size="7.5" fill="#1e3a8a">16/16</text>
  <rect x="168" y="410" width="100" height="36" rx="4" fill="#bfdbfe" stroke="#2563eb"/><text x="218" y="426" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a">b1</text><text x="218" y="438" text-anchor="middle" font-size="7.5" fill="#1e3a8a">16/16</text>
  <rect x="272" y="410" width="100" height="36" rx="4" fill="#ffffff" stroke="#2563eb"/><rect x="274" y="430" width="96" height="14" fill="#a7f3d0"/><text x="322" y="426" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#065f46">b2（A）</text><text x="322" y="438" text-anchor="middle" font-size="7.5" fill="#065f46">9/16</text>
  <rect x="376" y="410" width="100" height="36" rx="4" fill="#ffffff" stroke="#dc2626"/><rect x="378" y="430" width="96" height="14" fill="#fecaca"/><text x="426" y="426" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#991b1b">b3（B）</text><text x="426" y="438" text-anchor="middle" font-size="7.5" fill="#991b1b">9/16</text>
  <text x="490" y="424" font-size="8.6" font-weight="bold" fill="#334155">物理占用 T_phy = 50</text>
  <text x="490" y="438" font-size="8.4" fill="#475569">（每槽至多一 token）</text>

  <text x="64" y="466" font-size="8.8" font-weight="bold" fill="#0f172a">精确版：</text>
  <text x="64" y="482" font-size="8.4" fill="#334155">(a) ∀b: len(token_ids) ≤ B（一槽至多一 token） · (b) ∀rid: req_used == Σ len（账本一致） · (c) 占用块数 ≤ N（由 I1）</text>
  <text x="64" y="502" font-size="8.8" font-weight="bold" fill="#0f172a">共享增益：</text>
  <text x="64" y="518" font-size="8.6" fill="#334155">G = T_log − T_phy = 82 − 50 = 32 = 2 个共享满块</text>
  <text x="64" y="534" font-size="8.4" fill="#64748b">G 与 Day 16 命中率是同一收益的两面：hit rate 是 TTFT 面（省重算），G 是显存面（省存储）—— §3.4</text>

  <!-- ============ I4 ============ -->
  <rect x="620" y="326" width="580" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="636" y="342" width="60" height="24" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="666" y="358" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">I4 COW 安全</text>
  <text x="708" y="358" font-size="9.6" font-weight="bold" fill="#0f172a">写入位置约束（比「内容独立」更根本）</text>

  <rect x="636" y="370" width="548" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="646" y="386" font-size="9.4" font-weight="bold" fill="#334155">任何写入只落【写入者自己的表尾】，且该表尾要么私有（ref==1）要么已先 fork</text>

  <text x="644" y="416" font-size="8.5" font-weight="bold" fill="#334155">A：</text>
  <rect x="664" y="402" width="52" height="26" rx="4" fill="#ddd6fe" stroke="#7c3aed"/><text x="690" y="419" text-anchor="middle" font-size="8.5" fill="#4c1d95">b0 r2</text>
  <line x1="716" y1="415" x2="730" y2="415" stroke="#475569" stroke-width="1.2" marker-end="url(#d20f)"/>
  <rect x="732" y="402" width="52" height="26" rx="4" fill="#ddd6fe" stroke="#7c3aed"/><text x="758" y="419" text-anchor="middle" font-size="8.5" fill="#4c1d95">b1 r2</text>
  <line x1="784" y1="415" x2="798" y2="415" stroke="#475569" stroke-width="1.2" marker-end="url(#d20f)"/>
  <rect x="800" y="402" width="52" height="26" rx="4" fill="#a7f3d0" stroke="#059669"/><text x="826" y="419" text-anchor="middle" font-size="8.5" fill="#065f46">b2 r1</text>
  <text x="862" y="419" font-size="8.5" font-weight="bold" fill="#047857">✍ 写自己私有尾块 ✓</text>

  <text x="644" y="456" font-size="8.5" font-weight="bold" fill="#7c3aed">B：</text>
  <rect x="664" y="442" width="52" height="26" rx="4" fill="#ddd6fe" stroke="#7c3aed"/><text x="690" y="459" text-anchor="middle" font-size="8.5" fill="#4c1d95">b0 r2</text>
  <line x1="716" y1="455" x2="730" y2="455" stroke="#475569" stroke-width="1.2" marker-end="url(#d20f)"/>
  <rect x="732" y="442" width="52" height="26" rx="4" fill="#ddd6fe" stroke="#7c3aed"/><text x="758" y="459" text-anchor="middle" font-size="8.5" fill="#4c1d95">b1 r2</text>
  <line x1="784" y1="455" x2="798" y2="455" stroke="#475569" stroke-width="1.2" marker-end="url(#d20f)"/>
  <rect x="800" y="442" width="52" height="26" rx="4" fill="#fecaca" stroke="#dc2626"/><text x="826" y="459" text-anchor="middle" font-size="8.5" fill="#991b1b">b3 r1</text>
  <text x="862" y="459" font-size="8.5" font-weight="bold" fill="#b91c1c">✍ 写 fork 出的私有尾块 ✓</text>

  <line x1="690" y1="428" x2="690" y2="442" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="758" y1="428" x2="758" y2="442" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="960" y="440" font-size="8" fill="#64748b">紫色 = 共享前缀（只读）</text>
  <text x="960" y="454" font-size="8" fill="#64748b">绿色/红色 = 各自私有尾块</text>

  <rect x="636" y="478" width="548" height="82" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="648" y="496" font-size="8.6" font-weight="bold" fill="#78350f">运行时内核（append_slots 内的两条 assert）：</text>
  <text x="648" y="512" font-size="8.3" fill="#7c2d12">① 槽位非空即拒绝：「len(blk.token_ids) == pos % B」—— 写覆盖当场抓获</text>
  <text x="648" y="528" font-size="8.3" fill="#7c2d12">② fork 前置：尾块 ref&gt;1 且有空位且 n&gt;0 —— 三条件缺一不可（尾块已满则写新块，无需 fork）</text>
  <text x="648" y="546" font-size="8.3" fill="#92400e">反向验证（实验 2 步骤 3）：注释掉 COW 分支 → 后写者的 assert ① 先炸 / 中插 checker 则 I3(b) 账目不平先炸</text>

  <!-- ============ bottom: checker + complexity ============ -->
  <rect x="40" y="588" width="580" height="94" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="56" y="610" font-size="10.5" font-weight="bold" fill="#065f46">check_invariants(pool, table) —— 安全网的用法</text>
  <text x="56" y="628" font-size="8.4" fill="#166534">I1+I2 双条件遍历 + 守恒计数 + I3(a)(b)(c) · O(N) 仅测试用（生产靠构造保证，Day 15）</text>
  <text x="56" y="644" font-size="8.4" fill="#166534">fuzz：2000 步随机操作 × 每步校验；换 5 个种子仍全绿 —— 对任意操作序列成立，不靠幸运种子</text>
  <text x="56" y="660" font-size="8.4" font-weight="bold" fill="#047857">Day 27 加 preemption 后重跑同一套：不变式崩在哪一步，bug 就在哪条路径</text>
  <text x="56" y="676" font-size="8.2" fill="#64748b">（实测首跑高概率踩中 §4.4-1「复用块不清残留」—— 修到绿的过程就是本实验的核心学习）</text>

  <rect x="630" y="588" width="570" height="94" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="646" y="610" font-size="10.5" font-weight="bold" fill="#1e3a8a">复杂度速查（§3.1 账单卡）</text>
  <text x="646" y="628" font-size="8.4" fill="#334155">would_allocate O(1)（req_used 计数器） · append 簿记 O(⌈n/B⌉) · decode 摊销 1/B 块/token</text>
  <text x="646" y="644" font-size="8.4" fill="#334155">touch O(1)/块（双向链表的回报） · free O(L) · fork ≤ 1 次/共享对 · checker O(N)</text>
  <text x="646" y="660" font-size="8.4" fill="#334155">簿记成本 ∝ 块数而非 token 数 —— B=16→128 时簿记降 8 倍，但 hash 粒度变粗 / gather tile 变大</text>
  <text x="646" y="676" font-size="8.2" fill="#64748b">（block_size 三重身份：分配粒度 / hash 粒度 / gather tile —— Day 15/17，W7 消融实验④ 的旋钮）</text>

  <text x="620" y="706" text-anchor="middle" font-size="9.5" fill="#64748b">图 3 · I1~I4 精确版图解 —— 与 §2.6 的推导、§4.3 的 checker/测试一一对应；手画本图 = W8 Day 50 白板四件套的 block table 题预演</text>
</svg>
