<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar18i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar18j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar18k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="ar18l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">full CG vs piecewise CG：切在哪、怎么降级、-O 怎么选（v0.11.0）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">上：一层 forward 的覆盖方式（attention 是天然切分点）· 中左：CUDAGraphMode 五枚举 · 中右：由 AttentionCGSupport 决定的降级链 · 下：-O 档位矩阵</text>

  <!-- ================= Top: operator flow, two coverages ================= -->
  <text x="60" y="76" font-size="13.5" font-weight="bold" fill="#0f172a">切在哪：full 一张图 vs piecewise 按 attention 切段</text>
  <rect x="40" y="88" width="1160" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="60" y="110" font-size="10" font-weight="bold" fill="#334155">一层 forward 的算子序列（× 36 层，前后还有 embed / final norm / lm_head）</text>
  <g font-size="8.2" fill="#334155">
    <rect x="60"  y="118" width="74" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="97"  y="132" text-anchor="middle">rmsnorm</text>
    <rect x="138" y="118" width="66" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="171" y="132" text-anchor="middle">qkv GEMM</text>
    <rect x="208" y="118" width="58" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="237" y="132" text-anchor="middle">rope</text>
    <rect x="270" y="118" width="92" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="316" y="132" text-anchor="middle">写 KV(scatter)</text>
    <rect x="366" y="118" width="120" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="426" y="132" text-anchor="middle" font-weight="bold" fill="#991b1b">ATTENTION(gather)</text>
    <rect x="490" y="118" width="70" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="525" y="132" text-anchor="middle">o_proj</text>
    <rect x="564" y="118" width="52" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="590" y="132" text-anchor="middle">add</text>
    <rect x="620" y="118" width="74" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="657" y="132" text-anchor="middle">rmsnorm</text>
    <rect x="698" y="118" width="84" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="740" y="132" text-anchor="middle">gate_up GEMM</text>
    <rect x="786" y="118" width="62" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="817" y="132" text-anchor="middle">silu·mul</text>
    <rect x="852" y="118" width="76" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="890" y="132" text-anchor="middle">down GEMM</text>
    <rect x="932" y="118" width="52" height="22" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/><text x="958" y="132" text-anchor="middle">add</text>
    <text x="1000" y="132" fill="#94a3b8">… × 36 层 …</text>
  </g>

  <!-- FULL coverage -->
  <text x="60" y="166" font-size="10.5" font-weight="bold" fill="#065f46">FULL：整段一张图（attention 也在图内）</text>
  <rect x="60" y="174" width="924" height="26" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="522" y="191" text-anchor="middle" font-size="9" fill="#065f46">cudaGraphLaunch ×1 —— 要求 attention 的 kernel 与 metadata 全部静态化（FA3 AOT scheduler / Triton unified kernel）</text>

  <!-- PIECEWISE coverage -->
  <text x="60" y="222" font-size="10.5" font-weight="bold" fill="#7c2d12">PIECEWISE：以 attention 为界切段（splitting_ops = unified_attention，Day 17 的 opaque op）</text>
  <rect x="60" y="230" width="294" height="26" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="207" y="247" text-anchor="middle" font-size="9" fill="#065f46">子图 replay（GEMM/rmsnorm/rope 静态）</text>
  <rect x="366" y="230" width="120" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="426" y="247" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">eager attention</text>
  <rect x="498" y="230" width="486" height="26" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="741" y="247" text-anchor="middle" font-size="9" fill="#065f46">子图 replay（下一段）—— 36 层 = 37 段小图 + 36 次 eager attention</text>
  <!-- scissors -->
  <g stroke="#dc2626" stroke-width="1.6" stroke-dasharray="3,2">
    <line x1="360" y1="112" x2="360" y2="264"/><line x1="492" y1="112" x2="492" y2="264"/>
  </g>
  <text x="426" y="272" text-anchor="middle" font-size="8.4" fill="#dc2626">切分点：唯一 shape 随 batch/seq 剧变、metadata 复杂（block_table）的算子；其余算子 bucket 化容易</text>

  <rect x="1010" y="118" width="176" height="156" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1098" y="138" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">分图的源码落点</text>
  <g font-size="8.2" fill="#334155">
    <text x="1020" y="156">split_graph（backends.py:235）</text>
    <text x="1020" y="170">按 splitting_ops 切 fx 图</text>
    <text x="1020" y="188">PiecewiseCompileInterpreter</text>
    <text x="1020" y="202">（:286）逐段编译 + 每段包</text>
    <text x="1020" y="216">CUDAGraphWrapper(PIECEWISE)</text>
    <text x="1020" y="234">_attention_ops 列表在</text>
    <text x="1020" y="248">config/compilation.py:354：</text>
    <text x="1020" y="262">vllm.unified_attention 等</text>
  </g>

  <!-- ================= Middle left: CUDAGraphMode table ================= -->
  <text x="60" y="356" font-size="13.5" font-weight="bold" fill="#0f172a">CUDAGraphMode 五枚举（config/compilation.py:34-65）</text>
  <rect x="40" y="368" width="580" height="216" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <g font-size="8.8">
    <rect x="52" y="382" width="150" height="22" fill="#e2e8f0"/><text x="60" y="397" font-weight="bold" fill="#0f172a">mode</text>
    <rect x="202" y="382" width="80" height="22" fill="#e2e8f0"/><text x="210" y="397" font-weight="bold" fill="#0f172a">decode</text>
    <rect x="282" y="382" width="80" height="22" fill="#e2e8f0"/><text x="290" y="397" font-weight="bold" fill="#0f172a">mixed</text>
    <rect x="362" y="382" width="248" height="22" fill="#e2e8f0"/><text x="370" y="397" font-weight="bold" fill="#0f172a">语义（decode_mode() / mixed_mode() 拆元组）</text>

    <rect x="52" y="404" width="150" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="60" y="422" fill="#334155">NONE</text>
    <rect x="202" y="404" width="80" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="210" y="422" fill="#334155">—</text>
    <rect x="282" y="404" width="80" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="290" y="422" fill="#334155">—</text>
    <rect x="362" y="404" width="248" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="370" y="416" fill="#334155">无图（enforce-eager / -O0 / 平台</text><text x="370" y="428" fill="#334155">不支持静态图）</text>

    <rect x="52" y="434" width="150" height="30" fill="#fef3c7" stroke="#d97706"/><text x="60" y="452" fill="#78350f" font-weight="bold">PIECEWISE</text>
    <rect x="202" y="434" width="80" height="30" fill="#fef3c7" stroke="#d97706"/><text x="210" y="452" fill="#78350f">PIECEWISE</text>
    <rect x="282" y="434" width="80" height="30" fill="#fef3c7" stroke="#d97706"/><text x="290" y="452" fill="#78350f">PIECEWISE</text>
    <rect x="362" y="434" width="248" height="30" fill="#fef3c7" stroke="#d97706"/><text x="370" y="448" fill="#78350f">只 piecewise；pooling / encoder-</text><text x="370" y="460" fill="#78350f">decoder 模型的默认</text>

    <rect x="52" y="464" width="150" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="60" y="482" fill="#14532d" font-weight="bold">FULL</text>
    <rect x="202" y="464" width="80" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="210" y="482" fill="#14532d">FULL</text>
    <rect x="282" y="464" width="80" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="290" y="482" fill="#14532d">FULL</text>
    <rect x="362" y="464" width="248" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="370" y="478" fill="#14532d">全 batch（含 mixed）full 图；小模型/</text><text x="370" y="490" fill="#14532d">短 prompt 场景，需 backend=ALWAYS</text>

    <rect x="52" y="494" width="150" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="60" y="512" fill="#14532d" font-weight="bold">FULL_DECODE_ONLY</text>
    <rect x="202" y="494" width="80" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="210" y="512" fill="#14532d">FULL</text>
    <rect x="282" y="494" width="80" height="30" fill="#f1f5f9" stroke="#cbd5e1"/><text x="290" y="512" fill="#334155">NONE</text>
    <rect x="362" y="494" width="248" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="370" y="508" fill="#14532d">decode 全图、mixed 走 eager；P/D 部署的</text><text x="370" y="520" fill="#14532d">decode 实例可省一份图显存</text>

    <rect x="52" y="524" width="150" height="32" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="60" y="542" fill="#4c1d95" font-weight="bold">FULL_AND_PIECEWISE</text>
    <rect x="202" y="524" width="80" height="32" fill="#dcfce7" stroke="#16a34a"/><text x="210" y="542" fill="#14532d">FULL</text>
    <rect x="282" y="524" width="80" height="32" fill="#fef3c7" stroke="#d97706"/><text x="290" y="542" fill="#78350f">PIECEWISE</text>
    <rect x="362" y="524" width="248" height="32" fill="#ede9fe" stroke="#7c3aed"/><text x="370" y="538" fill="#4c1d95" font-weight="bold">decode 全图 + mixed piecewise</text><text x="370" y="550" fill="#4c1d95" font-weight="bold">—— V1 默认（most performant）</text>
  </g>

  <!-- ================= Middle right: downgrade chain ================= -->
  <text x="660" y="356" font-size="13.5" font-weight="bold" fill="#0f172a">降级链：AttentionCGSupport 定上限（initialize_cudagraph_capture :3611）</text>
  <rect x="640" y="368" width="560" height="216" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>

  <text x="656" y="388" font-size="9.2" font-weight="bold" fill="#7c2d12">第 1 步：取所有 attention group 的最低支持等级（Day 17 的伏笔）</text>
  <g font-size="8.8">
    <rect x="656" y="396" width="528" height="30" rx="5" fill="#ffffff" stroke="#fdba74"/>
    <text x="668" y="414" fill="#7c2d12">ALWAYS(3) &gt; UNIFORM_BATCH(2) &gt; UNIFORM_SINGLE_TOKEN_DECODE(1) &gt; NEVER(0)</text>
    <text x="668" y="424" font-size="8" fill="#9a3412">Triton=ALWAYS · FA3=ALWAYS · FA2=UNIFORM_BATCH · FlashInfer=UNIFORM_SINGLE_TOKEN_DECODE（D17 §2.7 表）</text>
  </g>

  <text x="656" y="448" font-size="9.2" font-weight="bold" fill="#334155">第 2 步：用户想要的 mode × 支持等级 → 自动降级（只降不升）</text>
  <g font-size="8.8">
    <rect x="656" y="456" width="120" height="34" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/><text x="716" y="472" text-anchor="middle" fill="#14532d" font-weight="bold">用户请求 FULL</text><text x="716" y="484" text-anchor="middle" fill="#14532d" font-size="8">/ FULL_AND_…</text>
    <line x1="776" y1="473" x2="800" y2="473" stroke="#475569" stroke-width="1.3" marker-end="url(#ar18i)"/>
    <rect x="802" y="456" width="150" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="877" y="472" text-anchor="middle" fill="#78350f">support=UNIFORM_*：</text><text x="877" y="484" text-anchor="middle" fill="#78350f">→ FULL_AND_PIECEWISE</text>
    <line x1="952" y1="473" x2="976" y2="473" stroke="#475569" stroke-width="1.3" marker-end="url(#ar18i)"/>
    <rect x="978" y="456" width="206" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1081" y="472" text-anchor="middle" fill="#334155">attention 未 piecewise 编译：</text><text x="1081" y="484" text-anchor="middle" fill="#334155">→ FULL_DECODE_ONLY（:3640）</text>

    <rect x="656" y="500" width="120" height="34" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="716" y="516" text-anchor="middle" fill="#991b1b" font-weight="bold">support=NEVER</text><text x="716" y="528" text-anchor="middle" fill="#991b1b" font-size="8">（如 ChunkedLocal）</text>
    <line x1="776" y1="517" x2="800" y2="517" stroke="#475569" stroke-width="1.3" marker-end="url(#ar18i)"/>
    <rect x="802" y="500" width="150" height="34" rx="5" fill="#fef3c7" stroke="#d97706"/><text x="877" y="516" text-anchor="middle" fill="#78350f">level=PIECEWISE：</text><text x="877" y="528" text-anchor="middle" fill="#78350f">→ PIECEWISE（:3657）</text>
    <line x1="952" y1="517" x2="976" y2="517" stroke="#475569" stroke-width="1.3" marker-end="url(#ar18i)"/>
    <rect x="978" y="500" width="206" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1081" y="516" text-anchor="middle" fill="#334155">否则 → NONE；仍坚持 full 则</text><text x="1081" y="528" text-anchor="middle" fill="#334155">raise ValueError（:3687）</text>

    <rect x="656" y="544" width="528" height="30" rx="5" fill="#ecfdf5" stroke="#10b981"/>
    <text x="920" y="562" text-anchor="middle" fill="#065f46" font-size="8.8">spec-decode（uniform_decode_query_len&gt;1）还有第三级校验：support &lt; UNIFORM_BATCH 时再降（:3667-3681）——W4 投机解码的伏笔</text>
  </g>

  <!-- ================= Bottom: -O matrix ================= -->
  <text x="60" y="614" font-size="13.5" font-weight="bold" fill="#0f172a">-O 档位矩阵（实验 2 的分组设计；-O = --compilation-config 的短写法）</text>
  <rect x="40" y="626" width="1160" height="212" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <g font-size="8.8">
    <rect x="52" y="640" width="340" height="22" fill="#e2e8f0"/><text x="60" y="655" font-weight="bold" fill="#0f172a">启动方式（vllm serve …）</text>
    <rect x="392" y="640" width="120" height="22" fill="#e2e8f0"/><text x="400" y="655" font-weight="bold" fill="#0f172a">level</text>
    <rect x="512" y="640" width="180" height="22" fill="#e2e8f0"/><text x="520" y="655" font-weight="bold" fill="#0f172a">cudagraph_mode</text>
    <rect x="692" y="640" width="496" height="22" fill="#e2e8f0"/><text x="700" y="655" font-weight="bold" fill="#0f172a">效果（对 TPOT 的作用通道）</text>

    <rect x="52" y="662" width="340" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="60" y="679" fill="#991b1b">--enforce-eager</text>
    <rect x="392" y="662" width="120" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="400" y="679" fill="#991b1b">0</text>
    <rect x="512" y="662" width="180" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="520" y="679" fill="#991b1b">NONE</text>
    <rect x="692" y="662" width="496" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="700" y="679" fill="#991b1b">纯 eager 基线：440×launch 全额支付</text>

    <rect x="52" y="688" width="340" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="60" y="705" fill="#991b1b">-O0（= -O.level=0）</text>
    <rect x="392" y="688" width="120" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="400" y="705" fill="#991b1b">0</text>
    <rect x="512" y="688" width="180" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="520" y="705" fill="#991b1b">NONE</text>
    <rect x="692" y="688" width="496" height="26" fill="#fef2f2" stroke="#fecaca"/><text x="700" y="705" fill="#991b1b">同上（level≠3 → 默认链给 NONE）——与 eager 组等价</text>

    <rect x="52" y="714" width="340" height="26" fill="#ecfdf5" stroke="#a7f3d0"/><text x="60" y="731" fill="#065f46" font-weight="bold">默认（V1 不加任何参数）</text>
    <rect x="392" y="714" width="120" height="26" fill="#ecfdf5" stroke="#a7f3d0"/><text x="400" y="731" fill="#065f46">3 PIECEWISE</text>
    <rect x="512" y="714" width="180" height="26" fill="#ecfdf5" stroke="#a7f3d0"/><text x="520" y="731" fill="#065f46" font-weight="bold">FULL_AND_PIECEWISE</text>
    <rect x="692" y="714" width="496" height="26" fill="#ecfdf5" stroke="#a7f3d0"/><text x="700" y="731" fill="#065f46">torch.compile + decode 全图 + mixed piecewise（config/__init__.py:364-371）</text>

    <rect x="52" y="740" width="340" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="60" y="757" fill="#334155">-O '{"level":3,"cudagraph_mode":"PIECEWISE"}'</text>
    <rect x="392" y="740" width="120" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="757" fill="#334155">3</text>
    <rect x="512" y="740" width="180" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="757" fill="#334155">PIECEWISE</text>
    <rect x="692" y="740" width="496" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="700" y="757" fill="#334155">编译 + 只 piecewise：验证 full 图的边际收益</text>

    <rect x="52" y="766" width="340" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="60" y="783" fill="#334155">-O '{"level":3,"cudagraph_mode":"NONE"}'</text>
    <rect x="392" y="766" width="120" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="783" fill="#334155">3</text>
    <rect x="512" y="766" width="180" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="783" fill="#334155">NONE</text>
    <rect x="692" y="766" width="496" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="700" y="783" fill="#334155">编译但无图：把 torch.compile 的贡献与 CG 的贡献拆开</text>

    <rect x="52" y="792" width="340" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="60" y="809" fill="#334155">-O '{"level":3,"cudagraph_mode":"FULL"}'</text>
    <rect x="392" y="792" width="120" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="809" fill="#334155">3</text>
    <rect x="512" y="792" width="180" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="809" fill="#334155">FULL</text>
    <rect x="692" y="792" width="496" height="26" fill="#f1f5f9" stroke="#cbd5e1"/><text x="700" y="809" fill="#334155">全 batch full（需 backend=ALWAYS，否则自动降级，见上图）</text>
  </g>
  <text x="620" y="832" text-anchor="middle" font-size="8.4" fill="#64748b">-O3 由 FlexibleArgumentParser 改写为 -O.level=3（utils/__init__.py:1891-1897）；档位语义随版本演进，跑之前先 vllm serve --help 对口径</text>
</svg>
