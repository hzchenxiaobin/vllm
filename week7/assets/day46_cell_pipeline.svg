<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">单格流水线 run.sh + 指标采集（Day 46 交付，Day 47 循环 84 次）</text>

  <!-- ============ left: pipeline ============ -->
  <rect x="40" y="52" width="360" height="470" rx="10" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="56" y="76" font-size="13" font-weight="bold" fill="#0c4a6e">run.sh：单格流水线（一事务）</text>
  <g font-size="10.5">
    <rect x="60" y="90" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="107" fill="#0c4a6e" font-weight="bold">1. 读 cases.yaml 一格</text><text x="72" y="122" fill="#64748b">组 / case / seed → serve 参数 + 负载 + 速率</text>
    <rect x="60" y="142" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="159" fill="#0c4a6e" font-weight="bold">2. 启动 serve（后台）</text><text x="72" y="174" fill="#64748b">全日志落盘；启动回显核对参数生效（防"载参失败"）</text>
    <rect x="60" y="194" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="211" fill="#0c4a6e" font-weight="bold">3. 健康检查</text><text x="72" y="226" fill="#64748b">curl /health + kill -0 探活（僵尸进程不等 10 min）</text>
    <rect x="60" y="246" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="263" fill="#0c4a6e" font-weight="bold">4. 锁频确认</text><text x="72" y="278" fill="#64748b">nvidia-smi -q -d CLOCK（温度 / 降频写进快照）</text>
    <rect x="60" y="298" width="320" height="42" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="72" y="315" fill="#9a3412" font-weight="bold">5. warmup：随机前缀（丢弃）</text><text x="72" y="330" fill="#c2410c">触发 CUDA Graph / 编译；不污染 hit0 档命中率</text>
    <rect x="60" y="350" width="320" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="72" y="367" fill="#1e3a8a" font-weight="bold">6. 正式采集</text><text x="72" y="382" fill="#334155">vllm bench serve --seed S → results/&lt;组&gt;/&lt;case&gt;_&lt;seed&gt;.json</text>
    <rect x="60" y="402" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="419" fill="#0c4a6e" font-weight="bold">7. metrics 快照（停服前！）</text><text x="72" y="434" fill="#64748b">/metrics + GPU 状态 + 日志 grep preempt/evict/graph</text>
    <rect x="60" y="454" width="320" height="42" rx="6" fill="#ffffff" stroke="#0369a1"/><text x="72" y="471" fill="#0c4a6e" font-weight="bold">8. 停服 → 冷却 30 s</text><text x="72" y="486" fill="#64748b">确认显存干净再进下一格（协议同 Day 43）</text>
    <line x1="220" y1="132" x2="220" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="184" x2="220" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="236" x2="220" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="288" x2="220" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="340" x2="220" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="392" x2="220" y2="400" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="220" y1="444" x2="220" y2="452" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- ============ right top: prometheus ============ -->
  <rect x="420" y="52" width="500" height="66" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="436" y="76" font-size="12.5" font-weight="bold" fill="#065f46">Prometheus（复用 Day 6 环境）</text>
  <text x="436" y="94" font-size="10.5" fill="#047857">scrape vLLM 的 /metrics，interval 5 s —— "记录"清单的落地；</text>
  <text x="436" y="109" font-size="10.5" fill="#047857">指标名以 vllm/v1/metrics.py 实测为准（版本可能演进）</text>

  <!-- P1 -->
  <rect x="420" y="132" width="245" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="432" y="152" font-size="11.5" font-weight="bold" fill="#1e3a8a">P1 · TPOT p99 时序</text>
  <line x1="432" y1="236" x2="652" y2="236" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="432" y1="236" x2="432" y2="162" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 436 196 L 456 194 L 476 197 L 496 150 L 516 196 L 536 194 L 556 197 L 576 150 L 596 196 L 616 194 L 636 197 L 650 192" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="432" y="252" font-size="8.5" fill="#64748b">histogram_quantile(0.99,</text>
  <text x="432" y="263" font-size="8.5" fill="#64748b">rate(vllm:time_per_output_token_seconds_bucket[30s]))</text>
  <text x="500" y="270" font-size="9" fill="#dc2626">↑ 周期性尖刺 = 巨石 step（消融一）</text>

  <!-- P2 -->
  <rect x="675" y="132" width="245" height="140" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="687" y="152" font-size="11.5" font-weight="bold" fill="#115e59">P2 · running / waiting</text>
  <line x1="687" y1="236" x2="907" y2="236" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="687" y1="236" x2="687" y2="162" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 691 190 L 706 178 L 721 192 L 736 180 L 751 193 L 766 179 L 781 193 L 796 181 L 811 194 L 826 180" fill="none" stroke="#0d9488" stroke-width="2"/>
  <path d="M 691 232 L 716 230 L 741 210 L 766 226 L 791 196 L 816 224 L 841 176 L 866 222 L 891 226" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="687" y="252" font-size="8.5" fill="#64748b">vllm:num_requests_running</text>
  <text x="687" y="263" font-size="8.5" fill="#c2410c">vllm:num_requests_waiting（堆积 = 容量越界）</text>

  <!-- P3 -->
  <rect x="420" y="282" width="245" height="140" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="432" y="302" font-size="11.5" font-weight="bold" fill="#92400e">P3 · cache usage + 命中率</text>
  <line x1="432" y1="386" x2="652" y2="386" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="432" y1="386" x2="432" y2="312" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 436 378 C 480 360, 520 340, 560 336 C 600 332, 630 330, 648 330" fill="none" stroke="#d97706" stroke-width="2"/>
  <path d="M 436 374 L 456 344 L 476 348 L 496 322 L 516 330 L 536 316 L 556 326 L 576 312 L 596 320 L 616 308 L 636 318 L 648 314" fill="none" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="432" y="402" font-size="8.5" fill="#64748b">vllm:gpu_cache_usage_perc</text>
  <text x="432" y="413" font-size="8.5" fill="#115e59">hits / queries = 实测命中率（消融二横轴）</text>
  <text x="432" y="424" font-size="9" fill="#dc2626">高载不升反降 = prefix 颠簸</text>

  <!-- P4 -->
  <rect x="675" y="282" width="245" height="140" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="687" y="302" font-size="11.5" font-weight="bold" fill="#991b1b">P4 · preemption / 队列</text>
  <line x1="687" y1="386" x2="907" y2="386" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="687" y1="386" x2="687" y2="312" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="691" y="384" width="14" height="2" fill="#dc2626"/><rect x="711" y="384" width="14" height="2" fill="#dc2626"/>
  <rect x="731" y="384" width="14" height="2" fill="#dc2626"/><rect x="751" y="360" width="14" height="26" fill="#dc2626"/>
  <rect x="771" y="346" width="14" height="40" fill="#dc2626"/><rect x="791" y="372" width="14" height="14" fill="#dc2626"/>
  <rect x="811" y="384" width="14" height="2" fill="#dc2626"/><rect x="831" y="352" width="14" height="34" fill="#dc2626"/>
  <rect x="851" y="384" width="14" height="2" fill="#dc2626"/><rect x="871" y="384" width="14" height="2" fill="#dc2626"/>
  <text x="687" y="402" font-size="8.5" fill="#991b1b">rate(preemption 计数)（名字以 /metrics 实测为准）</text>
  <text x="687" y="413" font-size="8.5" fill="#64748b">vllm:request_queue_time_seconds（排队直方图）</text>
  <text x="687" y="424" font-size="9" fill="#dc2626">风暴 = KV 超配 / 换手（消融二四）</text>

  <!-- products -->
  <rect x="420" y="432" width="500" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="436" y="454" font-size="12" font-weight="bold" fill="#5b21b6">一格的产物（幂等键 = 组 / case / seed）</text>
  <g font-size="10.5" fill="#6d28d9">
    <text x="436" y="474">results/&lt;组&gt;/&lt;case&gt;_&lt;seed&gt;.json　（bench 原始输出，含逐请求 ITL）</text>
    <text x="436" y="491">results/&lt;组&gt;/&lt;case&gt;/metrics_&lt;seed&gt;_&lt;ts&gt;.txt（快照）+ serve 全程日志</text>
    <text x="436" y="508">env.txt（commit hash / 锁频 / 驱动）——Day 43 环境指纹协议原样搬来</text>
  </g>

  <!-- handover -->
  <rect x="40" y="540" width="880" height="44" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Day 47 交接：run_matrix.sh = 把这条单格流水线循环 ~84 次（失败隔离 + 幂等续跑）—— 今天跑通一格，明天就跑得通全部</text>
  <text x="480" y="577" text-anchor="middle" font-size="10.5" fill="#475569">四张面板今天建好、明天盯防：P1 尖刺 / P2 堆积 / P3 颠簸 / P4 风暴 —— 每种签名都有对应的 V1 源码机制（Day 47 §2.2 的四行表）</text>
</svg>
