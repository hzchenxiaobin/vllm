<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="670" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">四类异常的曲线签名与机制链（Day 47 盯防目标）</text>

  <!-- Panel 1: TPOT spikes -->
  <rect x="40" y="56" width="420" height="260" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="52" y="78" font-size="12.5" font-weight="bold" fill="#991b1b">① TPOT 周期性尖刺（chunked prefill 关闭 / budget 过小）</text>
  <line x1="95" y1="101" x2="95" y2="226" stroke="#64748b" stroke-width="1.5"/>
  <line x1="95" y1="226" x2="440" y2="226" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="104" font-size="9" fill="#475569">ITL (ms)</text>
  <text x="440" y="240" text-anchor="end" font-size="9" fill="#475569">time →</text>
  <line x1="95" y1="210" x2="440" y2="210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="100" y="206" font-size="9" fill="#475569">T_D ≈ 20 ms（decode step）</text>
  <line x1="95" y1="122" x2="440" y2="122" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="100" y="118" font-size="9" fill="#475569">T_D + T_P ≈ 370 ms（巨石 step）</text>
  <polyline points="95,210 150,210 156,122 162,210 240,210 246,122 252,210 330,210 336,122 342,210 420,210 426,122 432,210 440,210"
            fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="267" y="98" text-anchor="middle" font-size="9.5" fill="#991b1b">每个巨石 step = 一次完整长 prompt prefill，running 全体停摆</text>
  <text x="52" y="252" font-size="9.5" fill="#64748b">曲线：平峰 20ms + 周期尖刺 → 单请求 ITL 双峰，p99 由尖刺决定（均值几乎不动）</text>
  <text x="52" y="268" font-size="9.5" fill="#64748b">盯防：TPOT/ITL 时序面板 ｜ 常见于消融一（关 chunk / budget 过小档）</text>

  <!-- Panel 2: preemption storm -->
  <rect x="500" y="56" width="420" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="512" y="78" font-size="12.5" font-weight="bold" fill="#1e3a8a">② preemption 风暴（KV 耗尽 → 重算循环）</text>
  <line x1="555" y1="101" x2="555" y2="226" stroke="#64748b" stroke-width="1.5"/>
  <line x1="555" y1="226" x2="900" y2="226" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="104" font-size="9" fill="#475569">请求数</text>
  <text x="900" y="240" text-anchor="end" font-size="9" fill="#475569">time →</text>
  <polyline points="555,130 615,130 623,170 660,170 667,130 727,130 735,170 772,170 779,130 839,130 847,170 884,170 900,140"
            fill="none" stroke="#2563eb" stroke-width="2"/>
  <polyline points="555,220 619,220 623,184 640,184 658,220 727,220 731,184 748,184 766,220 839,220 843,184 860,184 878,220 900,220"
            fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="560" y="122" font-size="9" fill="#2563eb">running（锯齿骤降）</text>
  <text x="898" y="178" text-anchor="end" font-size="9" fill="#ea580c">waiting（同步尖峰）</text>
  <text x="727" y="105" text-anchor="middle" font-size="9.5" fill="#1e3a8a">抢占释放的 block 立即被新请求占用 → 再抢占（正反馈）</text>
  <text x="512" y="252" font-size="9.5" fill="#64748b">曲线：running 锯齿 + waiting 尖峰 + 引擎日志 preemption 行连刷</text>
  <text x="512" y="268" font-size="9.5" fill="#64748b">机制：抢占 → num_computed_tokens=0 → 全量重算（V1 仅 recompute）</text>

  <!-- Panel 3: prefix thrashing -->
  <rect x="40" y="336" width="420" height="260" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="52" y="358" font-size="12.5" font-weight="bold" fill="#115e59">③ prefix 颠簸（LRU 换手 + 部分命中）</text>
  <line x1="95" y1="381" x2="95" y2="506" stroke="#64748b" stroke-width="1.5"/>
  <line x1="95" y1="506" x2="440" y2="506" stroke="#64748b" stroke-width="1.5"/>
  <text x="60" y="384" font-size="9" fill="#475569">命中率</text>
  <text x="440" y="520" text-anchor="end" font-size="9" fill="#475569">time →（并发 256 持续压测）</text>
  <line x1="95" y1="396" x2="440" y2="396" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="100" y="392" font-size="9" fill="#475569">构造命中率 90%（请求侧）</text>
  <polyline points="95,398 125,396 155,401 185,398 215,404 245,400 275,407 305,403 335,410 365,407 395,415 425,420 440,422"
            fill="none" stroke="#0d9488" stroke-width="2"/>
  <text x="350" y="440" font-size="9" fill="#0d9488">实测命中率（/metrics）</text>
  <text x="267" y="462" text-anchor="middle" font-size="9.5" fill="#115e59">命中 → 引用归零（evictable）→ 被 LRU 淘汰 → 下个请求 miss → 重算写回</text>
  <text x="52" y="532" font-size="9.5" fill="#64748b">曲线：实测命中率震荡下行、偏离构造值；gpu_cache_usage 高位锯齿</text>
  <text x="52" y="548" font-size="9.5" fill="#64748b">坑：Day 48 画图必须用实测命中率作横轴，否则「收益-命中率」曲线整体右移</text>

  <!-- Panel 4: waiting buildup -->
  <rect x="500" y="336" width="420" height="260" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="512" y="358" font-size="12.5" font-weight="bold" fill="#5b21b6">④ waiting 堆积（容量边界读数）</text>
  <line x1="555" y1="381" x2="555" y2="506" stroke="#64748b" stroke-width="1.5"/>
  <line x1="555" y1="506" x2="900" y2="506" stroke="#64748b" stroke-width="1.5"/>
  <text x="520" y="384" font-size="9" fill="#475569">waiting 深度</text>
  <text x="900" y="520" text-anchor="end" font-size="9" fill="#475569">负载（并发 / request rate）→</text>
  <line x1="700" y1="381" x2="700" y2="506" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="706" y="395" font-size="9.5" fill="#5b21b6">容量边界 n*（Day 2 手算公式可预测）</text>
  <polyline points="555,500 695,500 702,496 715,490 730,483 745,475 760,466 775,456 790,445 805,433 820,420 835,406 850,393 865,384 900,376"
            fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="560" y="492" font-size="9" fill="#7c3aed">num_requests_waiting</text>
  <text x="800" y="440" text-anchor="middle" font-size="9.5" fill="#5b21b6">越过边界：waiting 单调爬升</text>
  <text x="512" y="532" font-size="9.5" fill="#64748b">曲线：waiting 单调爬升 + TTFT 同步恶化 → goodput 崩塌点在此</text>
  <text x="512" y="548" font-size="9.5" fill="#64748b">用法：固定 rate，看堆积起点右移多少 = 该配置买到的容量（消融四量化档）</text>

  <text x="480" y="612" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">共同纪律：监控曲线只用于「发现」（存在性证明），定量一律以 client 侧逐请求计时的 bench JSON 为准（Day 43 §6.3）</text>
  <text x="480" y="634" text-anchor="middle" font-size="10.5" fill="#475569">四张图对应 Grafana 四面板：TPOT/ITL 时序 · running/waiting · gpu_cache_usage 与命中率 · 引擎日志 preemption 行 —— 看板 Day 46 已建好</text>
</svg>
