<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">消融三：投机解码加速比 S(k, α) 预测模型（Day 46）</text>

  <!-- ============ left: model ============ -->
  <rect x="40" y="52" width="350" height="438" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="56" y="78" font-size="13" font-weight="bold" fill="#991b1b">预测模型（写进 predictions.md）</text>
  <g font-size="12" fill="#b91c1c">
    <text x="56" y="106">每 verify step 期望接受 token 数：</text>
    <text x="66" y="128" font-size="13.5" font-weight="bold">E[T] = (1 − α^(k+1)) / (1 − α)</text>
    <text x="56" y="156">单 step 耗时（相对 spec-off）：</text>
    <text x="66" y="178" font-size="13.5" font-weight="bold">1 + k·c，c = c_d（草稿）+ c_v（验证放大）</text>
    <text x="66" y="204" font-size="13.5" font-weight="bold">S(k, α, c) = E[T] / (1 + k·c)</text>
  </g>
  <g font-size="11" fill="#7f1d1d">
    <text x="56" y="236">· 低并发 decode 访存 bound：验证 k+1 个 token</text>
    <text x="66" y="252">权重只读一遍 → c_v ≈ 0 —— "用计算换访存"（Day 25）</text>
    <text x="56" y="278">· 高并发：KV 与激活随 (k+1) 增长 → c_v 上升，</text>
    <text x="66" y="294">曲线整体下压（图中红色虚线）</text>
    <text x="56" y="320">· 负收益条件：S &lt; 1 ⟺ E[T] &lt; 1 + k·c</text>
    <text x="66" y="336">低 α × 深 k × 高并发，三者叠加才触发</text>
  </g>
  <rect x="56" y="356" width="318" height="118" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="70" y="378" font-size="11" font-weight="bold" fill="#991b1b">k = 4 时的 S 预测（示例参数 c=0.1 / 高并发 c=0.4）</text>
  <g font-size="11" fill="#7f1d1d">
    <text x="70" y="400">α=0.85（code）　S ≈ 2.65　→ 开，收益大</text>
    <text x="70" y="420">α=0.50　　　　　S ≈ 1.39　→ 边际收益已薄</text>
    <text x="70" y="440">α=0.35（chat）　S ≈ 1.09　→ 盈亏边缘</text>
    <text x="70" y="460" fill="#dc2626" font-weight="bold">α=0.35 × 高并发  S ≈ 0.59 → 负收益失效模式</text>
  </g>

  <!-- ============ right: chart ============ -->
  <rect x="410" y="52" width="510" height="438" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <!-- negative region shading -->
  <rect x="450" y="365" width="440" height="95" fill="#fef2f2"/>
  <text x="670" y="452" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="bold">负收益区（S &lt; 1）</text>

  <!-- axes -->
  <line x1="450" y1="460" x2="900" y2="460" stroke="#475569" stroke-width="1.5"/>
  <line x1="450" y1="460" x2="450" y2="80" stroke="#475569" stroke-width="1.5"/>
  <g font-size="10" fill="#64748b">
    <text x="450" y="476" text-anchor="middle">1</text><text x="560" y="476" text-anchor="middle">2</text>
    <text x="670" y="476" text-anchor="middle">3</text><text x="780" y="476" text-anchor="middle">4</text>
    <text x="890" y="476" text-anchor="middle">5</text>
    <text x="675" y="494" text-anchor="middle" font-size="11.5" fill="#334155" font-weight="bold">k（num_speculative_tokens）</text>
    <text x="442" y="369" text-anchor="end">1.0×</text>
    <text x="442" y="211" text-anchor="end">2.0×</text>
    <text x="442" y="448" text-anchor="end">0.5×</text>
    <text x="442" y="80" text-anchor="end" font-size="11">S</text>
  </g>
  <line x1="450" y1="207" x2="895" y2="207" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="450" y1="365" x2="895" y2="365" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="893" y="358" text-anchor="end" font-size="10.5" fill="#334155" font-weight="bold">S = 1 盈亏线</text>

  <!-- curves -->
  <path d="M 450 286 L 560 213 L 670 164 L 780 132 L 890 113" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 450 306 L 560 262 L 670 243 L 780 238 L 890 241" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 450 338 L 560 322 L 670 325 L 780 333 L 890 341" fill="none" stroke="#0d9488" stroke-width="2"/>
  <path d="M 450 373 L 560 358 L 670 368 L 780 381 L 890 390" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <path d="M 450 414 L 560 427 L 670 434 L 780 437 L 890 450" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,4"/>

  <!-- matrix cell markers -->
  <g fill="#2563eb" stroke="#1e3a8a">
    <circle cx="560" cy="213" r="5"/><circle cx="670" cy="164" r="5"/><circle cx="780" cy="132" r="5"/>
  </g>
  <g fill="#d97706" stroke="#92400e">
    <circle cx="560" cy="358" r="5"/><circle cx="780" cy="381" r="5"/>
  </g>
  <circle cx="780" cy="437" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>

  <!-- legend -->
  <g font-size="10.5">
    <rect x="462" y="92" width="204" height="126" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="474" y1="110" x2="500" y2="110" stroke="#2563eb" stroke-width="2.5"/>
    <text x="506" y="114" fill="#1e3a8a">α=0.85（code 负载预测）</text>
    <line x1="474" y1="132" x2="500" y2="132" stroke="#7c3aed" stroke-width="2"/>
    <text x="506" y="136" fill="#5b21b6">α=0.70</text>
    <line x1="474" y1="154" x2="500" y2="154" stroke="#0d9488" stroke-width="2"/>
    <text x="506" y="158" fill="#115e59">α=0.50</text>
    <line x1="474" y1="176" x2="500" y2="176" stroke="#d97706" stroke-width="2.5"/>
    <text x="506" y="180" fill="#92400e">α=0.35（chat 负载预测）</text>
    <line x1="474" y1="198" x2="500" y2="198" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7,4"/>
    <text x="506" y="202" fill="#991b1b">α=0.35 × 高并发（c≈0.4）</text>
  </g>
  <text x="742" y="120" text-anchor="middle" font-size="10" fill="#1e3a8a">● = 矩阵里的格子（code 扫 k2/3/4）</text>
  <text x="742" y="137" text-anchor="middle" font-size="10" fill="#92400e">● = chat 扫 k2/k4（锁两端点）</text>
  <text x="742" y="154" text-anchor="middle" font-size="10" fill="#991b1b">○ = k4_chat 高并发外推（负收益验证）</text>

  <!-- bottom note -->
  <text x="480" y="520" text-anchor="middle" font-size="11" fill="#475569">设计含义：code 找收益饱和点（k=3-4 处平台期）· chat 用两个端点锁定盈亏边界 · 曲线位置随 (c_d, c_v) 平移——所以横轴 α 也要用 /metrics 实测值校验</text>
</svg>
