<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d55d" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <marker id="d55e" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="650" fill="#fafbfc"/>
  <text x="480" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">终局分诊：两场卡壳点的最后去向</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#64748b">资源有限（今晚 ≤60 分钟补漏 + 明天零输入）——按投入产出比给每个卡壳点定去向，而不是试图全部治好</text>

  <!-- input -->
  <rect x="330" y="80" width="300" height="62" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">两场卡壳点汇总</text>
  <text x="480" y="128" text-anchor="middle" font-size="11.5" fill="#475569">Day 54 清单 + Day 55 新增（逐条过堂，不许跳问）</text>
  <line x1="480" y1="142" x2="480" y2="166" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55d)"/>

  <!-- diamond 1 -->
  <polygon points="480,170 685,235 480,300 275,235" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="228" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">第二场复测接住了吗？</text>
  <text x="480" y="250" text-anchor="middle" font-size="11.5" fill="#475569">（≤30 秒 + 数字 + 口径）</text>
  <text x="264" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">是</text>
  <line x1="275" y1="235" x2="256" y2="235" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55d)"/>
  <text x="494" y="322" font-size="12.5" font-weight="700" fill="#dc2626">否</text>
  <line x1="480" y1="300" x2="480" y2="328" stroke="#475569" stroke-width="2.5" marker-end="url(#d55e)"/>

  <!-- cleared box -->
  <g>
    <rect x="52" y="186" width="200" height="98" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="80" cy="212" r="12" fill="#16a34a"/>
    <text x="80" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="146" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">清零</text>
    <text x="152" y="242" text-anchor="middle" font-size="11.5" fill="#334155">从清单划掉</text>
    <text x="152" y="262" text-anchor="middle" font-size="11.5" fill="#334155">Day 56 索引卡区</text>
    <text x="152" y="282" text-anchor="middle" font-size="11.5" fill="#334155">只留一行"已验证"</text>
  </g>

  <!-- diamond 2 -->
  <polygon points="480,330 695,398 480,466 265,398" fill="#fffbeb" stroke="#ca8a04" stroke-width="2"/>
  <text x="480" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">高频考点 且 60 分钟内</text>
  <text x="480" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">能补到"说清边界"？</text>
  <text x="712" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">是</text>
  <path d="M695,398 H760 V474" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55d)"/>
  <text x="244" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">否</text>
  <path d="M265,398 H152 V474" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#d55e)"/>

  <!-- give-up box -->
  <g>
    <rect x="52" y="478" width="200" height="104" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <circle cx="80" cy="504" r="12" fill="#64748b"/>
    <text x="80" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="148" y="509" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">放弃</text>
    <text x="152" y="533" text-anchor="middle" font-size="11" fill="#475569">写诚实应对脚本：</text>
    <text x="152" y="551" text-anchor="middle" font-size="11" fill="#475569">承认 + 相邻能力</text>
    <text x="152" y="569" text-anchor="middle" font-size="11" fill="#475569">+ 交还主动权</text>
  </g>

  <!-- tonight rule box -->
  <g>
    <rect x="292" y="478" width="300" height="104" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="442" y="502" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">今晚补漏规则（最后一次）</text>
    <text x="308" y="524" font-size="11" fill="#475569">· 只处理兜底类新卡壳点</text>
    <text x="308" y="543" font-size="11" fill="#475569">· ≤60 分钟，22:30 硬截止</text>
    <text x="308" y="562" font-size="11" fill="#475569">· 清零 / 放弃类不再耗时间</text>
    <text x="308" y="581" font-size="11" fill="#475569">· 睡眠优先于补漏</text>
  </g>

  <!-- fallback box -->
  <g>
    <rect x="632" y="478" width="200" height="104" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="660" cy="504" r="12" fill="#ca8a04"/>
    <text x="660" y="509" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="726" y="509" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">兜底</text>
    <text x="732" y="533" text-anchor="middle" font-size="11" fill="#475569">写兜底口径卡：</text>
    <text x="732" y="551" text-anchor="middle" font-size="11" fill="#475569">我到哪层 + 深入入口</text>
    <text x="732" y="569" text-anchor="middle" font-size="11" fill="#475569">进 Day 56 索引卡区</text>
  </g>

  <!-- bottom strip -->
  <rect x="52" y="602" width="856" height="36" rx="9" fill="#0f172a"/>
  <text x="480" y="625" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">三类去向全部写入《终局分诊清单》→ 无悬项移交 Day 56 收官日：只看自己的材料，不再输入新知识</text>
</svg>
