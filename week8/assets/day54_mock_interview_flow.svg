  <!-- Arrows between cards -->
  <g fill="#94a3b8">
    <path d="M200,218 L214,218 L214,222 L200,222 Z" transform="translate(2,0)"/>
    <path d="M388,220 L402,220 L402,224 L388,224 Z" transform="translate(2,0)"/>
    <path d="M576,220 L590,220 L590,224 L576,224 Z" transform="translate(2,0)"/>
    <path d="M764,220 L778,220 L778,224 L764,224 Z" transform="translate(2,0)"/>
  </g>

  <!-- Time axis -->
  <line x1="28" y1="380" x2="930" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#d54a)"/>
  <text x="479" y="404" text-anchor="middle" font-size="12" fill="#64748b">时间流（②③ 两环节合计 40 分钟，是评分的主要来源）</text>

  <!-- Three probes -->
  <text x="490" y="442" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">三类探针：面试官下钻的三种固定姿势（贯穿 ②③④）</text>
  <g>
    <rect x="40" y="460" width="286" height="150" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
