  <!-- Card 5 -->
  <g>
    <rect x="780" y="90" width="172" height="260" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <circle cx="804" cy="116" r="14" fill="#475569"/>
