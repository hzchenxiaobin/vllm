    <rect x="262" y="136" width="80" height="20" rx="10" fill="#e0e7ff"/>
    <text x="302" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">20 分钟</text>
    <line x1="232" y1="168" x2="372" y2="168" stroke="#c7d2fe" stroke-width="1.5"/>
