    <text x="866" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">反问环节</text>
    <rect x="826" y="136" width="68" height="20" rx="10" fill="#e2e8f0"/>
    <text x="860" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">5 分钟</text>
    <line x1="796" y1="168" x2="936" y2="168" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="796" y="192" font-size="12" font-weight="700" fill="#334155">考察</text>
