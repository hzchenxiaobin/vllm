<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d54a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#fafbfc"/>
  <text x="490" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">第一次模拟面试：60 分钟全真结构</text>
  <text x="490" y="60" text-anchor="middle" font-size="13" fill="#64748b">五个环节的时长、考察点与弹药来源｜三类探针贯穿 ②③④ 全程</text>

  <!-- Phase cards -->
  <!-- Card 1 -->
  <g>
    <rect x="28" y="90" width="172" height="260" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="52" cy="116" r="14" fill="#2563eb"/>
