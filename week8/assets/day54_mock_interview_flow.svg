    <text x="490" y="514" text-anchor="middle" font-size="12.5" fill="#334155">"具体多少？这个 2 倍怎么算的？"</text>
    <line x1="367" y1="530" x2="613" y2="530" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="490" y="554" text-anchor="middle" font-size="12" fill="#64748b">检验：手算能力 + 量级直觉</text>
    <text x="490" y="578" text-anchor="middle" font-size="12" fill="#64748b">弹药：Day 2 / 50 显存与时延公式</text>
  </g>
  <g>
    <rect x="654" y="460" width="286" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
