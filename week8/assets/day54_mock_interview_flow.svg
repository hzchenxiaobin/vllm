    <text x="420" y="322" font-size="12" fill="#334155">· Day 50 五步法开场</text>
  </g>
  <!-- Card 4 -->
  <g>
    <rect x="592" y="90" width="172" height="260" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <circle cx="616" cy="116" r="14" fill="#d97706"/>
