    <text x="183" y="554" text-anchor="middle" font-size="12" fill="#64748b">检验：收益与代价的双向因果链</text>
    <text x="183" y="578" text-anchor="middle" font-size="12" fill="#64748b">弹药：Day 11 / 22-24 / 29-33 专题</text>
  </g>
  <g>
    <rect x="347" y="460" width="286" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
