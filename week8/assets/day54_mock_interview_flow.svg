    <text x="797" y="514" text-anchor="middle" font-size="12.5" fill="#334155">"线上 TTFT 涨了 3 倍，怎么定位？"</text>
    <line x1="674" y1="530" x2="920" y2="530" stroke="#fef08a" stroke-width="1.5"/>
    <text x="797" y="554" text-anchor="middle" font-size="12" fill="#64748b">检验：症状 → 分层 → 动作 → 验证</text>
    <text x="797" y="578" text-anchor="middle" font-size="12" fill="#64748b">弹药：Day 13 / 51 诊断树</text>
