    <text x="114" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">开场自我介绍</text>
    <rect x="74" y="136" width="68" height="20" rx="10" fill="#dbeafe"/>
    <text x="108" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">5 分钟</text>
    <line x1="44" y1="168" x2="184" y2="168" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="44" y="192" font-size="12" font-weight="700" fill="#1e40af">考察</text>
    <text x="44" y="212" font-size="12" fill="#334155">· 主线叙事是否清晰</text>
    <text x="44" y="232" font-size="12" fill="#334155">· 表达结构（非背简历）</text>
    <text x="44" y="262" font-size="12" font-weight="700" fill="#1e40af">弹药</text>
    <text x="44" y="282" font-size="12" fill="#334155">· Day 53 三分钟讲稿</text>
    <text x="44" y="302" font-size="12" fill="#334155">  压缩为 90 秒版</text>
  </g>
