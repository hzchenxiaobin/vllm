<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 840" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d55b" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f766e"/>
    </marker>
    <marker id="d55c" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="980" height="840" fill="#fafbfc"/>
  <text x="490" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">根链：decode memory-bound 的 L0→L6 深钻（一条规律生长出全部优化）</text>
  <text x="490" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">面试官问："如果整个推理系统只允许你记住一条物理规律，你记哪条？"——下面是六层追问的完整走法</text>

  <!-- L0 -->
  <g>
    <rect x="60" y="74" width="860" height="58" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="92" cy="103" r="16" fill="#059669"/>
    <text x="92" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L0</text>
    <text x="120" y="98" font-size="13.5" font-weight="700" fill="#065f46">结论</text>
    <text x="170" y="98" font-size="12.5" fill="#334155">「decode 是访存带宽瓶颈，prefill 是算力瓶颈——我记前半条：goodput 上限几乎总由 decode 带宽决定」</text>
    <text x="170" y="118" font-size="12" fill="#64748b">主动封口：结论里已经埋了"带宽"和"算力"两个可追问的钩子</text>
  </g>
  <line x1="490" y1="132" x2="490" y2="152" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>

  <!-- L1 -->
  <g>
    <rect x="60" y="154" width="860" height="70" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="92" cy="189" r="16" fill="#2563eb"/>
    <text x="92" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L1</text>
    <text x="120" y="182" font-size="13.5" font-weight="700" fill="#1e3a8a">机制</text>
    <text x="170" y="180" font-size="12.5" fill="#334155">「每 token FLOPs ≈ 2N，字节 ≈ N·b_w → AI ≈ 2/b_w：BF16 约 1、FP8 约 2 FLOP/B</text>
    <text x="170" y="200" font-size="12.5" fill="#334155">而 H100 平衡点 ≈ 990 TFLOPS ÷ 3.35 TB/s ≈ 295 FLOP/B——低两个数量级，算力空转」</text>
    <text x="170" y="217" font-size="12" fill="#64748b">口径提示：平衡点也可写作 ≈3.4×10⁻³ B/FLOP，报数必须带单位，否则 295 与 3.4 会打架</text>
  </g>
  <line x1="490" y1="224" x2="490" y2="244" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>

  <!-- L2 -->
  <g>
    <rect x="60" y="246" width="860" height="70" rx="9" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="92" cy="281" r="16" fill="#ca8a04"/>
    <text x="92" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L2</text>
    <text x="120" y="274" font-size="13.5" font-weight="700" fill="#713f12">数字</text>
    <text x="170" y="272" font-size="12.5" fill="#334155">「Llama-3-70B FP8 @H100：70 GB ÷ 3.35 TB/s ≈ 21 ms/token（口径：不含 KV 与 CPU、带宽打满）</text>
    <text x="170" y="292" font-size="12.5" fill="#334155">GQA KV 320 KB/token → B=64、ctx=4K 时一步 KV ≈ 86 GB，反超权重 70 GB」</text>
    <text x="170" y="309" font-size="12" fill="#64748b">报数三件套示范：量级（21ms）+ 口径（FP8 权重项）+ 条件（H100 峰值带宽）</text>
  </g>
  <line x1="490" y1="316" x2="490" y2="336" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>

  <!-- L3 -->
  <g>
    <rect x="60" y="338" width="860" height="70" rx="9" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <circle cx="92" cy="373" r="16" fill="#db2777"/>
    <text x="92" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L3</text>
    <text x="120" y="366" font-size="13.5" font-weight="700" fill="#9d174d">边界</text>
    <text x="170" y="364" font-size="12.5" fill="#334155">「batch 大到 B* ≈ 21 ms ÷ 141 μs ≈ 150 时翻转为 compute-bound</text>
    <text x="170" y="384" font-size="12.5" fill="#334155">→ decode 甜点区在百级；大 batch 下量化 TPOT 收益缩水；max_num_seqs 配过头 → preemption（Day 12-13）」</text>
    <text x="170" y="401" font-size="12" fill="#64748b">每 token 计算时间 = 2×70e9 FLOP ÷ 990 TFLOPS ≈ 141 μs（BF16 算力口径）</text>
  </g>
  <line x1="490" y1="408" x2="490" y2="428" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>

  <!-- L4 -->
  <g>
    <rect x="60" y="430" width="860" height="64" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="92" cy="462" r="16" fill="#7c3aed"/>
    <text x="92" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L4</text>
    <text x="120" y="456" font-size="13.5" font-weight="700" fill="#4c1d95">迁移</text>
    <text x="170" y="454" font-size="12.5" fill="#334155">「换昇腾：方法不变、数字重算——查峰值算力（分 Cube/Vector 口径）与 DDR 带宽，重算平衡点」</text>
    <text x="170" y="474" font-size="12.5" fill="#334155">「数字是硬件的，方法是我的——'从昇腾到 GPU'迁移的正是这套 bound 建模（Day 53 主线落地）」</text>
  </g>
  <line x1="490" y1="494" x2="490" y2="514" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>

  <!-- L5 -->
  <g>
    <rect x="60" y="516" width="860" height="64" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <circle cx="92" cy="548" r="16" fill="#ea580c"/>
    <text x="92" y="554" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L5</text>
    <text x="120" y="542" font-size="13.5" font-weight="700" fill="#9a3412">串联</text>
    <text x="170" y="540" font-size="12.5" fill="#334155">「四大优化方向全部是这条规律的推论（见下方分支）——另外 prefill 侧的对称推论是 prefix caching：」</text>
    <text x="170" y="560" font-size="12.5" fill="#334155">「prefill 是 compute-bound，最高效的优化是根本不算（命中前缀直接跳过整段 prefill 计算）」</text>
  </g>

  <!-- L5 branches: five optimization boxes -->
  <g>
    <line x1="150" y1="580" x2="150" y2="608" stroke="#7c3aed" stroke-width="2" marker-end="url(#d55c)"/>
    <line x1="325" y1="580" x2="325" y2="608" stroke="#7c3aed" stroke-width="2" marker-end="url(#d55c)"/>
    <line x1="500" y1="580" x2="500" y2="608" stroke="#7c3aed" stroke-width="2" marker-end="url(#d55c)"/>
    <line x1="675" y1="580" x2="675" y2="608" stroke="#7c3aed" stroke-width="2" marker-end="url(#d55c)"/>
    <line x1="830" y1="580" x2="830" y2="608" stroke="#7c3aed" stroke-width="2" marker-end="url(#d55c)"/>

    <rect x="60" y="610" width="176" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="148" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">量化（W8/FP8/KV）</text>
    <text x="148" y="654" text-anchor="middle" font-size="11.5" fill="#334155">b_w 减半 → AI ≈ 2/b_w 翻倍</text>
    <text x="148" y="672" text-anchor="middle" font-size="11.5" fill="#334155">时间近似减半（Day 22-24）</text>
    <text x="148" y="690" text-anchor="middle" font-size="11.5" fill="#334155">KV FP8 砍 86 GB 大头</text>

    <rect x="246" y="610" width="176" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="334" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">投机解码</text>
    <text x="334" y="654" text-anchor="middle" font-size="11.5" fill="#334155">一次权重访存摊 E 个 token</text>
    <text x="334" y="672" text-anchor="middle" font-size="11.5" fill="#334155">E=(1-α^(γ+1))/(1-α)</text>
    <text x="334" y="690" text-anchor="middle" font-size="11.5" fill="#334155">代价：草稿自身开销（Day 25-26）</text>

    <rect x="432" y="610" width="176" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="520" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">P/D 分离</text>
    <text x="520" y="654" text-anchor="middle" font-size="11.5" fill="#334155">算力瓶颈与带宽瓶颈</text>
    <text x="520" y="672" text-anchor="middle" font-size="11.5" fill="#334155">各自独占硬件、互不侵占</text>
    <text x="520" y="690" text-anchor="middle" font-size="11.5" fill="#334155">（Day 29-31）</text>

    <rect x="618" y="610" width="176" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="706" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">CUDA Graph + async</text>
    <text x="706" y="654" text-anchor="middle" font-size="11.5" fill="#334155">带宽瓶颈时 CPU 开销</text>
    <text x="706" y="672" text-anchor="middle" font-size="11.5" fill="#334155">都在浪费带宽利用时间</text>
    <text x="706" y="690" text-anchor="middle" font-size="11.5" fill="#334155">（Day 18-19）</text>

    <rect x="804" y="610" width="116" height="104" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
    <text x="862" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">prefix caching</text>
    <text x="862" y="654" text-anchor="middle" font-size="11.5" fill="#334155">prefill 对称推论：</text>
    <text x="862" y="672" text-anchor="middle" font-size="11.5" fill="#334155">最优是不算</text>
    <text x="862" y="690" text-anchor="middle" font-size="11.5" fill="#334155">（Day 16/34）</text>
  </g>

  <!-- L6 -->
  <line x1="490" y1="714" x2="490" y2="734" stroke="#0f766e" stroke-width="2.5" marker-end="url(#d55b)"/>
  <g>
    <rect x="60" y="736" width="860" height="76" rx="9" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <circle cx="92" cy="774" r="16" fill="#334155"/>
    <text x="92" y="780" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">L6</text>
    <text x="120" y="764" font-size="13.5" font-weight="700" fill="#0f172a">开放反问（你主动提出失效条件）</text>
    <text x="170" y="762" font-size="12.5" fill="#334155">「三个失效方向：①近存计算/超大带宽 HBM 把平衡点压到 decode AI 附近；</text>
    <text x="170" y="782" font-size="12.5" fill="#334155">②超长上下文下 attention O(L²) 计算与 KV 项主导；③MoE 每 token 只激活部分专家——但访存未必同比例缩小」</text>
    <text x="170" y="802" font-size="12" fill="#64748b">能讲清失效条件，规律才真的属于你——L3/L6 是"做没做过系统"的分水岭</text>
  </g>
</svg>
