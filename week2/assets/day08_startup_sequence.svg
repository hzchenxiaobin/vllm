<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">启动时序：从 vllm serve 到第一条日志归属哪个进程</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">泳道 = 进程（按 Day 8 图 1 的 P0/P1/P2）· 时间自上而下 · 日志行加粗处可对账 Day 2/6 的手算 · 源码坐标 v0.10~v0.11</text>

  <!-- 泳道头 -->
  <rect x="40" y="62" width="210" height="40" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="145" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">终端 / CLI</text>
  <text x="145" y="95" text-anchor="middle" font-size="8.5" fill="#64748b">用户侧</text>

  <rect x="270" y="62" width="260" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="400" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">P0 · API Server 进程</text>
  <text x="400" y="95" text-anchor="middle" font-size="8.5" fill="#64748b">entrypoints/openai/api_server.py</text>

  <rect x="550" y="62" width="290" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="695" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">P1 · EngineCore 进程（VLLM::EngineCore）</text>
  <text x="695" y="95" text-anchor="middle" font-size="8.5" fill="#a16207">v1/engine/core.py · 被动创建</text>

  <rect x="860" y="62" width="340" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1030" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">P2..Pn · Worker 进程 × TP（VLLM::Worker_TPr）</text>
  <text x="1030" y="95" text-anchor="middle" font-size="8.5" fill="#166534">v1/worker/gpu_worker.py · 每卡一个</text>

  <!-- 步骤 1: CLI -->
  <rect x="52" y="118" width="186" height="46" rx="6" fill="#f8fafc" stroke="#475569"/>
  <text x="62" y="136" font-size="10" font-weight="bold" fill="#0f172a">1. vllm serve Qwen/Qwen3-8B</text>
  <text x="62" y="151" font-size="8.5" fill="#64748b">vllm/entrypoints/cli/main.py</text>

  <line x1="238" y1="141" x2="266" y2="141" stroke="#475569" stroke-width="1.6" marker-end="url(#ar3)"/>

  <!-- 步骤 2: run_server -->
  <rect x="270" y="118" width="260" height="46" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="280" y="136" font-size="10" font-weight="bold" fill="#1e3a8a">2. run_server() 解析 EngineArgs</text>
  <text x="280" y="151" font-size="8.5" fill="#64748b">FastAPI 装配 → build_async_engine_client()</text>

  <line x1="400" y1="164" x2="400" y2="190" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arB)"/>

  <!-- 步骤 3: AsyncLLM -->
  <rect x="270" y="192" width="260" height="52" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="210" font-size="10" font-weight="bold" fill="#1e3a8a">3. AsyncLLM(...) 构造</text>
  <text x="280" y="225" font-size="8.5" fill="#475569">Processor / OutputProcessor / StatLoggerManager 就位</text>
  <text x="280" y="238" font-size="8.5" fill="#64748b">（v1/engine/async_llm.py）</text>

  <line x1="530" y1="218" x2="546" y2="218" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arB)"/>
  <text x="538" y="208" text-anchor="middle" font-size="8" fill="#64748b">fork</text>

  <!-- 步骤 4: make_async_mp_client + 5 -->
  <rect x="550" y="192" width="290" height="78" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="560" y="210" font-size="10" font-weight="bold" fill="#92400e">4. EngineCoreClient.make_async_mp_client()</text>
  <text x="560" y="225" font-size="8.5" fill="#475569">CoreEngineProcManager 拉起 P1 进程 + ZMQ 握手</text>
  <text x="560" y="240" font-size="8.5" fill="#475569">（v1/engine/utils.py；两个进程间只留两条 socket）</text>
  <text x="560" y="258" font-size="10" font-weight="bold" fill="#92400e">5. run_engine_core：set_process_title("EngineCore")</text>

  <rect x="860" y="118" width="340" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="872" y="138" font-size="10" font-weight="bold" fill="#0f172a">日志归属判据</text>
  <text x="872" y="154" font-size="8.8" fill="#475569">无前缀的行 = P0 打印；（EngineCore_0 pid=xxx）= P1；</text>
  <text x="872" y="168" font-size="8.8" fill="#475569">（Worker 前缀 = P2 —— decorate_logs() 加的前缀，实验 1 验证）</text>

  <!-- 步骤 6 -->
  <line x1="695" y1="270" x2="695" y2="296" stroke="#d97706" stroke-width="1.6" marker-end="url(#arO)"/>
  <rect x="550" y="298" width="290" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="316" font-size="10" font-weight="bold" fill="#92400e">6. EngineCore.__init__</text>
  <text x="560" y="331" font-size="8.5" fill="#475569">日志 "Initializing a V1 LLM engine (vX.Y.Z)"</text>

  <line x1="695" y1="344" x2="695" y2="370" stroke="#d97706" stroke-width="1.6" marker-end="url(#arO)"/>

  <!-- 步骤 7 -->
  <rect x="550" y="372" width="290" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="390" font-size="10" font-weight="bold" fill="#92400e">7. Executor.get_class() 选执行器</text>
  <text x="560" y="405" font-size="8.5" fill="#475569">单卡 uniproc（Worker 在 P1 内）；TP≥2 → MultiprocExecutor：</text>
  <text x="560" y="419" font-size="8.5" fill="#475569">make_worker_process() spawn WorkerProc × world_size</text>
  <text x="560" y="431" font-size="8.5" fill="#64748b">（进程名 VllmWorker-{rank}，daemon=True）</text>

  <line x1="840" y1="403" x2="856" y2="403" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arO)"/>

  <!-- 步骤 8-10 在 P2 -->
  <rect x="860" y="372" width="340" height="130" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="872" y="392" font-size="10" font-weight="bold" fill="#14532d">8. init_device()：绑定 GPU · 显存预算检查</text>
  <text x="872" y="418" font-size="10" font-weight="bold" fill="#14532d">9. load_model()：加载权重</text>
  <text x="872" y="433" font-size="8.8" fill="#475569">日志 "Model weights take 16.4 GB"（Day 2 四件套①对账）</text>
  <text x="872" y="458" font-size="10" font-weight="bold" fill="#14532d">10. determine_available_memory()：dummy 前向</text>
  <text x="872" y="473" font-size="8.8" fill="#475569">profiling 一次 → 扣除激活等 → KV 池可用字节数</text>
  <text x="872" y="492" font-size="8.5" fill="#94a3b8">uniproc 时这些直接发生在 P1 内（无本泳道）</text>

  <line x1="856" y1="520" x2="840" y2="520" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG)"/>

  <!-- 步骤 11-13 在 P1 -->
  <rect x="550" y="494" width="290" height="96" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="512" font-size="10" font-weight="bold" fill="#92400e">11. get_kv_cache_specs() → _initialize_kv_caches()</text>
  <text x="560" y="527" font-size="8.8" fill="#475569">按 block_size=16 切池 → 绑定每层 attention</text>
  <text x="560" y="541" font-size="8.8" font-weight="bold" fill="#92400e">日志 "KV cache is allocated. # tokens: 366,xxx"</text>
  <text x="560" y="554" font-size="8.5" fill="#64748b">= 54.1 GB ÷ 144 KiB/token（Day 2/6 手算）</text>
  <text x="560" y="572" font-size="10" font-weight="bold" fill="#92400e">12. collective_rpc("initialize_cache")</text>
  <text x="560" y="586" font-size="8.5" fill="#475569">把块数广播给所有 rank（TP 时 P1 → P2 ②通道）</text>

  <line x1="840" y1="606" x2="856" y2="606" stroke="#d97706" stroke-width="1.6" marker-end="url(#arO)"/>

  <!-- 步骤 13 cudagraph 在 P2 -->
  <rect x="860" y="592" width="340" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="872" y="612" font-size="10" font-weight="bold" fill="#14532d">13. capture CUDA Graphs（除非 --enforce-eager）</text>
  <text x="872" y="627" font-size="8.8" fill="#475569">日志 "Capturing cudagraphs..."：逐 decode batch 桶</text>
  <text x="872" y="641" font-size="8.8" fill="#475569">dummy 跑一遍录进图（启动第二耗时项 · Day 18）</text>

  <line x1="856" y1="676" x2="840" y2="676" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arG)"/>

  <!-- 步骤 14 握手完成 -->
  <rect x="550" y="660" width="290" height="46" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="560" y="678" font-size="10" font-weight="bold" fill="#92400e">14. 启动握手完成</text>
  <text x="560" y="693" font-size="8.5" fill="#475569">EngineCore 向前端回 ready（带 num_gpu_blocks 等元数据）</text>

  <line x1="546" y1="683" x2="530" y2="683" stroke="#d97706" stroke-width="1.6" marker-end="url(#arO)"/>

  <!-- 步骤 15-17 -->
  <rect x="270" y="660" width="260" height="62" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="678" font-size="10" font-weight="bold" fill="#1e3a8a">15. uvicorn 监听 :8000</text>
  <text x="280" y="693" font-size="8.5" fill="#475569">"Application startup complete"</text>
  <text x="280" y="708" font-size="8.5" fill="#64748b">/metrics 同时可用（Day 6 的 curl 验证点）</text>

  <line x1="266" y1="726" x2="238" y2="726" stroke="#475569" stroke-width="1.6" marker-end="url(#ar3)"/>

  <rect x="52" y="712" width="186" height="46" rx="6" fill="#f8fafc" stroke="#475569"/>
  <text x="62" y="730" font-size="10" font-weight="bold" fill="#0f172a">16. curl /v1/completions</text>
  <text x="62" y="745" font-size="8.5" fill="#64748b">→ 进入 Day 9 的请求链路</text>

  <!-- 底部备注 -->
  <rect x="40" y="778" width="373" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="798" font-size="10" font-weight="bold" fill="#0f172a">启动耗时结构（H100 · Qwen3-8B 量级）</text>
  <text x="52" y="816" font-size="9.2" fill="#475569">权重加载 16.4 GB：秒级~十秒级（本地 page cache 热</text>
  <text x="52" y="831" font-size="9.2" fill="#475569">则快，冷启动看磁盘/网络带宽）</text>
  <text x="52" y="849" font-size="9.2" fill="#475569">CUDA Graph 捕获：秒级（桶数 × 每桶 dummy 跑）</text>
  <text x="52" y="867" font-size="9.2" fill="#475569">--enforce-eager 跳过捕获：启动快，decode 慢（Day 18）</text>

  <rect x="433" y="778" width="374" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="445" y="798" font-size="10" font-weight="bold" fill="#0f172a">两次"试跑"，两种用途</text>
  <text x="445" y="816" font-size="9.2" fill="#475569">① determine_available_memory：dummy forward 探显存</text>
  <text x="445" y="831" font-size="9.2" fill="#475569">　→ 决定 KV 池多大（先测量后分配，Day 2 的账本来源）</text>
  <text x="445" y="849" font-size="9.2" fill="#475569">② CUDA Graph capture：dummy 跑进图 → 决定 decode 多快</text>
  <text x="445" y="867" font-size="9.2" fill="#475569">同是"启动期跑模型"，目的一句话讲清 = 面试加分点</text>

  <rect x="827" y="778" width="373" height="104" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="839" y="798" font-size="10" font-weight="bold" fill="#0f172a">对账锚点（把 Day 6 的台账再过一遍）</text>
  <text x="839" y="816" font-size="9.2" fill="#475569">Model weights take 16.4 GB → Day 2 四件套①</text>
  <text x="839" y="831" font-size="9.2" fill="#475569">KV cache # tokens 366,xxx → 54.1 GB ÷ 144 KiB</text>
  <text x="839" y="849" font-size="9.2" fill="#475569">Maximum concurrency：按 max_model_len 满长算</text>
  <text x="839" y="867" font-size="9.2" fill="#475569">（8192 → 44.8×；32768 → 11.2×，Day 4 的口径提醒）</text>
</svg>
