<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 850" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="f14b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="f14g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="f14r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">第 2 周一图流：一个请求的完整生命周期（P0 / P1 / P2 三进程）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">请求 → tokenize(P0) → ZMQ → waiting → schedule(budget / KV / 抢占) → SchedulerOutput → Executor → ModelRunner 组批 → forward → sample → update_from_output → EngineCoreOutputs → ZMQ → detokenize / stop string(P0) → SSE · 站号 ⓪~⑨ 承接 Day 9</text>

  <!-- lane backgrounds -->
  <rect x="40" y="88" width="360" height="650" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="440" y="88" width="360" height="650" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="840" y="88" width="360" height="350" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="220" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">P0 · API Server 进程</text>
  <text x="620" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">P1 · EngineCore 进程</text>
  <text x="1020" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">P2 · Worker 进程（每 GPU 一个）</text>

  <!-- ===== P0 request path ===== -->
  <rect x="90" y="102" width="260" height="36" rx="4" fill="#0f172a"/>
  <text x="220" y="124" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">客户端 · POST /v1/chat/completions</text>
  <line x1="220" y1="138" x2="220" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="90" y="158" width="260" height="62" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="220" y="176" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">⓪① serving 层 · create_chat_completion</text>
  <text x="220" y="190" text-anchor="middle" font-size="8.2" fill="#1e3a8a">chat template 渲染 + tokenize（P0 完成！）</text>
  <text x="220" y="202" text-anchor="middle" font-size="8.2" fill="#1e3a8a">serving_chat.py / _preprocess_chat → prompt_token_ids</text>
  <text x="220" y="214" text-anchor="middle" font-size="8.2" fill="#475569">request_id = "chatcmpl-…"（贯穿全程的路由 key）</text>
  <line x1="220" y1="220" x2="220" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="90" y="240" width="260" height="72" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="220" y="258" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">②③ AsyncLLM.add_request + Processor</text>
  <text x="220" y="272" text-anchor="middle" font-size="8.2" fill="#1e3a8a">RequestOutputCollector（本请求输出队列）</text>
  <text x="220" y="284" text-anchor="middle" font-size="8.2" fill="#1e3a8a">process_inputs：校验 + max_tokens 兜底</text>
  <text x="220" y="296" text-anchor="middle" font-size="8.2" fill="#1e3a8a">→ 组装 DTO：EngineCoreRequest（token ids）</text>
  <text x="220" y="308" text-anchor="middle" font-size="8.2" fill="#475569">arrival_time 在这里打（queue 指标对表用）</text>
  <line x1="220" y1="312" x2="220" y2="328" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="90" y="332" width="260" height="46" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="220" y="350" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">④ 先注册 OutputProcessor.add_request</text>
  <text x="220" y="364" text-anchor="middle" font-size="8.2" fill="#475569">输出路由先建好，再发送——防止输出先到无家可归</text>
  <line x1="220" y1="378" x2="220" y2="394" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="90" y="398" width="260" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="220" y="416" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">⑤⑥ ZMQ send_multipart（msgpack）</text>
  <text x="220" y="430" text-anchor="middle" font-size="8.2" fill="#1e3a8a">跨进程只传 token ids，不传文本（Day 8）</text>

  <!-- ⑤ -> ⑦ -->
  <line x1="350" y1="418" x2="486" y2="418" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#f14b)"/>
  <text x="418" y="410" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#1e40af">══ 进程边界 ══</text>

  <!-- ===== P1 ===== -->
  <rect x="490" y="102" width="260" height="60" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <text x="620" y="120" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">⑦ IO 线程 · process_input_sockets</text>
  <text x="620" y="134" text-anchor="middle" font-size="8.2" fill="#065f46">MsgpackDecoder(DTO) → Request.from_engine_core_request</text>
  <text x="620" y="146" text-anchor="middle" font-size="8.2" fill="#065f46">顺手预计算 block_hashes（Day 16 的伏笔）</text>
  <text x="620" y="156" text-anchor="middle" font-size="8.2" fill="#475569">busy loop 分发：input_queue → _handle_client_request</text>
  <line x1="620" y1="162" x2="620" y2="178" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="490" y="182" width="260" height="50" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <text x="620" y="200" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">⑨ Scheduler.add_request（:1097）</text>
  <text x="620" y="214" text-anchor="middle" font-size="8.2" fill="#065f46">waiting 队尾（FCFS）+ requests 字典</text>
  <text x="620" y="226" text-anchor="middle" font-size="8.2" fill="#065f46">+ record_event(QUEUED) ← queue time 起点</text>
  <line x1="620" y1="232" x2="620" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="490" y="252" width="260" height="128" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="620" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">⑩ Scheduler.schedule()（:179 起）</text>
  <text x="620" y="288" text-anchor="middle" font-size="8.2" fill="#065f46">running 优先（FCFS，Day 10）→ 欠账 = num_tokens − computed</text>
  <text x="620" y="300" text-anchor="middle" font-size="8.2" fill="#065f46">budget 切片刀：min(need, threshold, 剩余预算)（Day 11）</text>
  <text x="620" y="312" text-anchor="middle" font-size="8.2" fill="#065f46">allocate_slots（chunk 粒度）→ None 则抢占六步（Day 12）</text>
  <text x="620" y="324" text-anchor="middle" font-size="8.2" fill="#065f46">waiting 队首过五道闸（FSM/budget/KV/seqs/HOL）</text>
  <text x="620" y="338" text-anchor="middle" font-size="8.2" fill="#065f46">产出 SchedulerOutput：num_scheduled_tokens</text>
  <text x="620" y="350" text-anchor="middle" font-size="8.2" fill="#065f46">/ new_block_ids / resumed_from_preemption（output.py）</text>
  <text x="620" y="366" text-anchor="middle" font-size="8" fill="#991b1b">KV 失守环路：victim=最新者 → free → computed=0 → waiting 队首</text>

  <!-- ⑩ -> ⑪ -->
  <line x1="750" y1="316" x2="886" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#f14b)"/>
  <text x="818" y="306" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#334155">SchedulerOutput</text>

  <!-- ===== P2 ===== -->
  <rect x="890" y="252" width="260" height="54" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="1020" y="270" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">⑪ Executor.execute_model</text>
  <text x="1020" y="284" text-anchor="middle" font-size="8.2" fill="#7c2d12">uniproc / multiproc（TP）/ ray（Day 8）</text>
  <text x="1020" y="296" text-anchor="middle" font-size="8.2" fill="#7c2d12">广播到每 rank 的 Worker</text>
  <line x1="1020" y1="306" x2="1020" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="890" y="326" width="260" height="94" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="1020" y="344" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">⑫ GPUModelRunner.execute_model</text>
  <text x="1020" y="358" text-anchor="middle" font-size="8.2" fill="#7c2d12">InputBatch 持久批：按 num_scheduled_tokens 切变长行</text>
  <text x="1020" y="370" text-anchor="middle" font-size="8.2" fill="#7c2d12">positions = computed + 段内偏移；block table append/替换</text>
  <text x="1020" y="382" text-anchor="middle" font-size="8.2" fill="#7c2d12">forward：prefill chunk + decode 混排一个批（Day 11）</text>
  <text x="1020" y="394" text-anchor="middle" font-size="8.2" fill="#7c2d12">sample（中间 chunk 的采样被丢弃，:1076）</text>
  <text x="1020" y="408" text-anchor="middle" font-size="8.2" fill="#475569">CUDA Graph replay（Day 18）/ attention 后端（Day 17）</text>

  <!-- ⑫ -> ⑬ -->
  <path d="M 890 388 C 810 400 790 440 756 470" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#f14g)"/>
  <text x="838" y="452" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#065f46">ModelRunnerOutput</text>
  <text x="838" y="464" text-anchor="middle" font-size="8" fill="#065f46">sampled ids 留 GPU（Day 19 伏笔）</text>

  <!-- ⑬ update_from_output -->
  <rect x="490" y="474" width="260" height="104" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
  <text x="620" y="494" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">⑬ Scheduler.update_from_output</text>
  <text x="620" y="510" text-anchor="middle" font-size="8.2" fill="#065f46">账本推进：computed += scheduled（已在 :645 提前）</text>
  <text x="620" y="522" text-anchor="middle" font-size="8.2" fill="#065f46">output_token_ids 追加（append_output_token_ids）</text>
  <text x="620" y="534" text-anchor="middle" font-size="8.2" fill="#065f46">终判（P1 半边）：EOS / stop_token_ids / max_tokens</text>
  <text x="620" y="546" text-anchor="middle" font-size="8.2" fill="#065f46">→ FINISHED_STOPPED / LENGTH_CAPPED</text>
  <text x="620" y="558" text-anchor="middle" font-size="8.2" fill="#065f46">→ free 全部 KV 块（hash 保留 → cached，Day 16）</text>
  <text x="620" y="570" text-anchor="middle" font-size="8.2" fill="#475569">take_events() 随最后一条输出回 P0（:972）</text>
  <line x1="620" y1="578" x2="620" y2="594" stroke="#475569" stroke-width="1.5" marker-end="url(#f14b)"/>

  <rect x="490" y="598" width="260" height="40" rx="6" fill="#d1fae5" stroke="#2563eb" stroke-width="1.6"/>
  <text x="620" y="616" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">⑭ EngineCoreOutputs → ZMQ 回传</text>
  <text x="620" y="630" text-anchor="middle" font-size="8.2" fill="#065f46">每请求 new_token_ids + finish/stop_reason + scheduler_stats</text>

  <!-- ⑭ -> P0 output -->
  <line x1="490" y1="618" x2="394" y2="618" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#f14b)"/>
  <text x="442" y="610" text-anchor="middle" font-size="8.4" font-weight="bold" fill="#1e40af">══ 进程边界 ══</text>

  <!-- P1 bottom note: three-stage -->
  <rect x="490" y="652" width="260" height="56" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="620" y="670" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">step 三段式（core.py:283-287）</text>
  <text x="620" y="684" text-anchor="middle" font-size="8.2" fill="#334155">⑩ schedule → ⑪⑫ execute → ⑬ update</text>
  <text x="620" y="698" text-anchor="middle" font-size="8.2" fill="#475569">async scheduling（Day 19）：⑩ 与 ⑪⑫ 重叠</text>

  <!-- ===== P0 output path ===== -->
  <rect x="60" y="540" width="330" height="86" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="225" y="560" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">⑮ OutputProcessor.process_outputs</text>
  <text x="225" y="574" text-anchor="middle" font-size="8.2" fill="#1e3a8a">IncrementalDetokenizer：新 token → 文本增量</text>
  <text x="225" y="586" text-anchor="middle" font-size="8.2" fill="#1e3a8a">stop string 判定（要看文本 → 只能在 P0，Day 8）</text>
  <text x="225" y="598" text-anchor="middle" font-size="8.2" fill="#1e3a8a">命中 → 多算的 token 丢弃（引擎可能已多跑几步）</text>
  <text x="225" y="614" text-anchor="middle" font-size="8.2" fill="#475569">queue/prefill/decode 时间在此换算（Day 5 指标落地）</text>

  <rect x="60" y="640" width="330" height="44" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="225" y="658" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">⑯ RequestOutput → RequestOutputCollector</text>
  <text x="225" y="672" text-anchor="middle" font-size="8.2" fill="#1e3a8a">→ generate() 逐个 yield → SSE 流推给客户端</text>

  <!-- abort path -->
  <path d="M 60 586 C 24 586 24 780 620 780 L 620 716" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#f14r)"/>
  <text x="300" y="772" text-anchor="middle" font-size="8.6" fill="#991b1b">stop string 命中 / 客户端断开 → ABORT 帧（下行通道）→ EngineCore.finish_requests(FINISHED_ABORTED)</text>

  <!-- P0 idle region note -->
  <rect x="60" y="700" width="330" height="30" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="225" y="719" text-anchor="middle" font-size="8.2" fill="#64748b">P0 的重 CPU 工作（tokenize/detokenize/HTTP）与 P1 引擎循环隔离（GIL，Day 8）</text>

  <!-- failure branches strip -->
  <rect x="40" y="790" width="770" height="48" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="425" y="808" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">失败分支三件套（一图流上都要能指出来）</text>
  <text x="425" y="824" text-anchor="middle" font-size="8.4" fill="#7c2d12">FINISHED_IGNORED：waiting 队首检查 prompt 超长 → 不占 KV 直接完成 · PREEMPTED：⑩ 内环路，回 waiting 队首等复活 · FINISHED_ABORTED：客户端断开或 stop string（红色虚线路径）</text>

  <rect x="830" y="790" width="370" height="48" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="1015" y="808" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">读图检验（Day 14 口径）</text>
  <text x="1015" y="824" text-anchor="middle" font-size="8.4" fill="#047857">每个箭头旁说出：所在进程 / 关键数据结构 / 哪天精读的——90 秒讲完即达标</text>
</svg>
