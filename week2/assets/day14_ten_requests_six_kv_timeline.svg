  <text x="490" y="664" font-size="7.8" fill="#7c3aed">6/16384 = 0.04%</text>
  <text x="1000" y="664" font-size="7.8" fill="#7c3aed">4/16384 = 0.02%</text>

  <!-- variant panel -->
  <rect x="40" y="656" width="1160" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="56" y="670" width="570" height="124" rx="6" fill="#fef2f2" stroke="#ef4444"/>
  <text x="341" y="690" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">抢占变体：把 output 从 512 改成 600（6×544 = 3264 装不下 6×550）</text>
  <text x="70" y="708" font-size="8.6" fill="#7c2d12">① step 514：某 running 请求要第 545 块而池空 → allocate_slots → None</text>
  <text x="70" y="722" font-size="8.6" fill="#7c2d12">② victim = R6（最新者，ctx 8702 ≈ 544 块；不是触发失败的请求！）→ 六步复位 → waiting 队首，排在 R7 前</text>
  <text x="70" y="736" font-size="8.6" fill="#7c2d12">③ step 515~600：让路型等待（free − hit ≈ 0），幸存者的增长吃掉它 30 块缓存（544 → 514）</text>
  <text x="70" y="750" font-size="8.6" fill="#7c2d12">④ step 601：R1/R2 完成后复活——自命中 514 块，重算仅 478 token（≈ 2 块）→ @690 完成</text>
  <text x="70" y="764" font-size="8.6" fill="#7c2d12">⑤ 全程：总抢占 1 次 · makespan 1202 步 · R6 的 ITL 有一段 ~86 步的长毛刺（客户端只觉得慢，不失败）</text>
  <text x="70" y="782" font-size="8.6" font-weight="bold" fill="#991b1b">对照 Day 12：形态 A（让路型）+ 缓存被幸存者逐块吃掉（hit 打折）——同一场戏，换个舞台</text>

  <rect x="640" y="670" width="544" height="124" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="912" y="690" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">修复推演：KV FP8（池 ×2 = 6528 块 ≥ 10 × 544）</text>
  <text x="654" y="708" font-size="8.6" fill="#047857">① R7/R8 @step 4、R9/R10 @step 5 全部入场 → 全程 10 路 decode → makespan 517 步（约 2×）</text>
  <text x="654" y="722" font-size="8.6" fill="#047857">② 墙钟口径（Day 6 台账 TPOT ≈ 9ms、prefill ρ ≈ 32µs/tok）：主场景 ≈ 6 个满预算步 ×0.52s + 1020 个 decode 步 ×9ms ≈ 12.3s</text>
  <text x="654" y="736" font-size="8.6" fill="#047857">　 修复后 ≈ 5×0.52s + 512×9ms ≈ 7.2s（1.7×——步数 2× 但 prefill 重步占比变了，墙钟改善打折）</text>
  <text x="654" y="750" font-size="8.6" fill="#047857">③ 收益集中在尾部：R7 的 TTFT 6.7s → 2.1s（3.2×）——goodput 视角（Day 5）的典型形态</text>
  <text x="654" y="764" font-size="8.6" fill="#047857">④ 诊断链：ITL 平滑 + num_preemptions=0 + usage≈1.0 + TTFT 尾部爆炸 → KV 容量问题</text>
  <text x="654" y="782" font-size="8.6" font-weight="bold" fill="#065f46">　→ 旋钮在 KV 侧（FP8 / util↑ / 加卡），budget 与 max_num_seqs 都不是这题的旋钮</text>

  <text x="620" y="838" text-anchor="middle" font-size="9.5" fill="#64748b">一句话：这道题的全部戏剧性来自「池恰好 = 6 × 满上下文」——预算充沛（0.04% 利用率）与 KV 饥饿（usage 1.0）同屏出现；换个池大小，故事就换成抢占或排队</text>
</svg>
