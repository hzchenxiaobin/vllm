  <!-- callouts -->
  <rect x="170" y="420" width="610" height="44" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="475" y="436" text-anchor="middle" font-size="8.6" fill="#1e3a8a">step 1：R1+R2 整段 prefill（16384 = budget 恰好用满）· step 2：R3 整段 + <tspan font-weight="bold">R4 残段 8190</tspan> · step 3：R5 整段 + <tspan font-weight="bold">R6 残段 8187</tspan></text>
  <text x="475" y="450" text-anchor="middle" font-size="8.6" fill="#1e3a8a">残段 = running 的 decode 先扣预算（每路 1~2 token）→ 剩余才给 prefill——README 口径 A/B「两种理解都要会讲」，仿真器 step 日志可直接看到</text>

  <rect x="800" y="420" width="380" height="44" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="990" y="436" text-anchor="middle" font-size="8.6" fill="#991b1b">step 4：R7 首次队首尝试失败（free ≈ 187 &lt; 512）→ :483 break（HOL 保序）</text>
  <text x="990" y="450" text-anchor="middle" font-size="8.6" fill="#991b1b">step 4~511：每步重试每步失败——queue time 全程累积，num_preemptions = 0</text>

  <rect x="640" y="466" width="380" height="30" rx="4" fill="#fefce8" stroke="#fde047"/>
  <text x="830" y="480" text-anchor="middle" font-size="8.6" fill="#713f12">step 512~514：R1-R6 依次 FINISHED_LENGTH_CAPPED，每个让出 544 块（hash 保留 → cached）</text>
  <text x="830" y="491" text-anchor="middle" font-size="8.6" fill="#713f12">step 513：R7/R8 入场（驱逐 R1/R2 缓存块）· R9 @514 · R10 @515</text>

  <!-- metric lanes -->
  <text x="52" y="530" font-size="10" font-weight="bold" fill="#0f172a">指标联动（推演检查点 ④：全程哪些指标怎么动）</text>
  <rect x="40" y="538" width="1160" height="104" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="56" y="558" font-size="8.6" font-weight="bold" fill="#334155">Running 数</text>
  <line x1="170" y1="576" x2="1180" y2="576" stroke="#cbd5e1"/>
  <path d="M 170 576 L 190 566 L 210 556 L 230 546 L 640 546 L 645 576 L 685 560 L 725 550 L 800 550 L 810 586 L 1175 586" fill="none" stroke="#2563eb" stroke-width="1.8"/>
