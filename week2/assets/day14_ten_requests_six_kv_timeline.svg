  <text x="360" y="597" font-size="7.8" fill="#ea580c">0.31→0.63→0.94（step 3 末，free 187）→ 钉在 ~1.0</text>
  <text x="700" y="638" font-size="7.8" fill="#ea580c">完成即 free（APC 下变 cached，指标回落）→ 第二波回升</text>

  <text x="56" y="655" font-size="8.6" font-weight="bold" fill="#334155">budget 利用率</text>
  <line x1="170" y1="668" x2="1180" y2="668" stroke="#cbd5e1"/>
  <path d="M 170 668 L 170 656 L 330 656 L 330 667 L 640 667 L 640 655 L 800 655 L 800 667 L 1180 667" fill="none" stroke="#7c3aed" stroke-width="1.8"/>
