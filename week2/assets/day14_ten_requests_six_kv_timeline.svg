  <text x="980" y="601" font-size="7.8" fill="#2563eb">交接期换血后 4 路 → 0</text>

  <text x="56" y="620" font-size="8.6" font-weight="bold" fill="#334155">gpu_cache_usage</text>
  <line x1="170" y1="634" x2="1180" y2="634" stroke="#cbd5e1"/>
