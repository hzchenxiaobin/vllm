  <rect x="0" y="0" width="1240" height="870" fill="#ffffff"/>
  <text x="620" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">自测推演：10 个请求、KV 只够 6 个（README Day 14.2）</text>
  <text x="620" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">R1..R10 同时到达 · prompt 8192 / output 512 · max_num_batched_tokens 16384 · max_num_seqs 64 · KV 池 3264 块（block 16）· 数字为 day12 仿真器换参复跑实测</text>

  <!-- setting card -->
  <rect x="40" y="54" width="700" height="62" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="390" y="72" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">三行手算（推演前必做）</text>
  <text x="390" y="87" text-anchor="middle" font-size="8.8" fill="#78350f">每请求 prompt = 8192 tok = 512 块 · 满上下文 = 8192+512 = 8704 tok = 544 块</text>
  <text x="390" y="100" text-anchor="middle" font-size="8.8" fill="#78350f">KV 池 = 6 × 544 = 3264 块（"恰好 6 个满上下文"，零冗余）· budget = 2 × 8192（每步恰收 2 个整段 prefill）</text>
  <text x="390" y="113" text-anchor="middle" font-size="8.8" fill="#78350f">结论先行：预算够 ≠ KV 够——第 4 步起瓶颈从 budget 切换为 KV，系统进入"6 路 decode + 4 路干等"</text>

  <!-- legend -->
  <rect x="770" y="54" width="430" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="786" y="68" width="26" height="10" fill="#3b82f6"/><text x="818" y="77" font-size="8.6" fill="#334155">prefill（整段 / chunk / 残段）</text>
  <line x1="950" y1="73" x2="980" y2="73" stroke="#10b981" stroke-width="3"/><text x="986" y="77" font-size="8.6" fill="#334155">decode（每步 +1）</text>
  <rect x="786" y="88" width="26" height="10" fill="url(#wait14)" stroke="#cbd5e1"/><text x="818" y="97" font-size="8.6" fill="#334155">waiting（每步队首尝试、每步失败）</text>
  <path d="M 950 84 L 955 92 L 945 92 z" fill="#0f172a"/><text x="986" y="97" font-size="8.6" fill="#334155">FINISHED_LENGTH_CAPPED</text>
  <path d="M 1120 71 l 5 10 h-10 z" fill="#ef4444"/><text x="1130" y="77" font-size="8.6" fill="#334155">preemption</text>
  <text x="1120" y="101" font-size="8" fill="#64748b">（变体见底栏）</text>

