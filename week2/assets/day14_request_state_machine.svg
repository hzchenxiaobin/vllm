<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar14b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="ar14g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="ar14r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker>
    <marker id="ar14y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">一个请求在 Scheduler 中的状态机（Day 14 产出物）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">左：RequestStatus 全图（vllm/v1/request.py:205-217）· 右：每次迁移的三个平行视角（身份 / 时钟 / 资源） · 坐标按 v0.11.0 核对</text>

  <!-- ================= Left: state machine ================= -->
  <text x="60" y="80" font-size="13.5" font-weight="bold" fill="#0f172a">P1 · RequestStatus 状态机（终态区 + 两个旁路 + 一个环路）</text>
  <rect x="50" y="90" width="740" height="560" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- birth -->
  <rect x="150" y="106" width="200" height="34" rx="4" fill="#fefce8" stroke="#ca8a04"/>
  <text x="250" y="120" text-anchor="middle" font-size="9" font-weight="bold" fill="#713f12">出生：Scheduler.add_request</text>
  <text x="250" y="133" text-anchor="middle" font-size="8.4" fill="#713f12">waiting 队尾 + requests 字典 + QUEUED 事件（:1097）</text>

  <!-- FSM bypass -->
  <rect x="450" y="104" width="170" height="38" rx="19" fill="#fef9c3" stroke="#ca8a04" stroke-dasharray="5 3"/>
  <text x="535" y="120" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#713f12">WAITING_FOR_FSM</text>
  <text x="535" y="134" text-anchor="middle" font-size="8" fill="#713f12">结构化输出：grammar 异步编译（Day 9）</text>
  <path d="M 350 123 C 390 123 405 123 446 123" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar14y)"/>
  <text x="398" y="115" text-anchor="middle" font-size="8" fill="#b45309">有 grammar</text>
  <path d="M 535 142 C 535 168 420 150 340 150" fill="none" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar14y)"/>
  <text x="462" y="163" text-anchor="middle" font-size="8" fill="#b45309">编译完成 → 回 WAITING</text>

  <!-- WAITING -->
  <rect x="110" y="182" width="170" height="48" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="195" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">WAITING</text>
  <text x="195" y="218" text-anchor="middle" font-size="8.2" fill="#1e3a8a">waiting: deque · FCFS（priority 可插队）</text>
  <path d="M 250 140 C 250 160 210 160 200 178" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#ar14b)"/>
  <text x="255" y="152" font-size="8" fill="#475569">构造即 WAITING（request.py）</text>

  <!-- RUNNING -->
  <rect x="520" y="182" width="170" height="48" rx="24" fill="#d1fae5" stroke="#10b981" stroke-width="1.6"/>
  <text x="605" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">RUNNING</text>
  <text x="605" y="218" text-anchor="middle" font-size="8.2" fill="#065f46">running: list · 时间序 = 入场序</text>

  <!-- WAITING -> RUNNING -->
  <line x1="280" y1="196" x2="514" y2="196" stroke="#475569" stroke-width="1.6" marker-end="url(#ar14b)"/>
  <text x="397" y="172" text-anchor="middle" font-size="8.6" fill="#475569">waiting 循环收编（:498-526）：五道闸全过才迁移</text>
  <text x="397" y="184" text-anchor="middle" font-size="7.8" fill="#64748b">FSM 就绪 → budget&gt;0（:437）→ KV allocate 成功（:471）→ max_num_seqs（:337）→ 队首才行（:483）</text>
  <text x="397" y="208" text-anchor="middle" font-size="7.8" fill="#1e3a8a">伴随：SCHEDULED 事件 · status=RUNNING（:525）· computed 回填命中值（:526）</text>

  <!-- RUNNING self loop -->
  <path d="M 690 190 C 740 168 740 148 690 146 L 560 146" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ar14g)"/>
  <text x="640" y="138" text-anchor="middle" font-size="8.2" fill="#065f46">每 step 自环：computed += scheduled（:645）</text>
  <text x="640" y="128" text-anchor="middle" font-size="7.8" fill="#065f46">prefill chunk 逐段推进（Day 11）/ decode 每步 +1</text>

  <!-- PREEMPTED -->
  <rect x="520" y="356" width="170" height="48" rx="24" fill="#fee2e2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="605" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">PREEMPTED</text>
  <text x="605" y="392" text-anchor="middle" font-size="8.2" fill="#991b1b">住在 waiting 队首（不是队尾！）</text>

  <!-- RUNNING -> PREEMPTED -->
  <line x1="620" y1="230" x2="620" y2="350" stroke="#ef4444" stroke-width="1.8" marker-end="url(#ar14r)"/>
  <text x="628" y="262" font-size="8.6" fill="#991b1b">allocate_slots → None（:259 · kv_cache_manager.py:260-273）</text>
  <text x="628" y="274" font-size="8" fill="#991b1b">六步复位（:271-281，Day 12）：victim=最新者</text>
  <text x="628" y="286" font-size="8" fill="#991b1b">→ free 全部块（hash 保留）→ PREEMPTED</text>
  <text x="628" y="298" font-size="8" fill="#991b1b">→ computed=0 · output 保留 → 队首</text>
  <text x="628" y="310" font-size="8" fill="#991b1b">→ 本步 waiting 整体跳过（:335）</text>

  <!-- PREEMPTED -> RUNNING (resume) -->
  <path d="M 560 352 C 470 300 470 250 516 222" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar14g)"/>
  <text x="452" y="300" text-anchor="middle" font-size="8.6" fill="#065f46">复活：队首优先尝试（:340）</text>
  <text x="452" y="312" text-anchor="middle" font-size="8" fill="#065f46">get_computed_blocks 自命中（:380-384）</text>
  <text x="452" y="324" text-anchor="middle" font-size="8" fill="#065f46">→ scheduled_resumed_reqs（:513-514）</text>
  <text x="452" y="336" text-anchor="middle" font-size="8" fill="#065f46">→ P2 block table 整表替换（:646-650）</text>

  <!-- note: status stays PREEMPTED in waiting -->
  <text x="605" y="420" text-anchor="middle" font-size="8" fill="#991b1b">注意：迁移发生在 schedule() 的同一段代码（:498-526），复活请求与新请求统一处理</text>

  <!-- Terminal region -->
  <rect x="86" y="452" width="690" height="160" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 3"/>
  <text x="431" y="474" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">终态区：is_finished(status) = status &gt; PREEMPTED（IntEnum 技巧，Day 9：新增终态零改动）</text>
  <rect x="110" y="490" width="150" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="185" y="504" text-anchor="middle" font-size="8.6" fill="#334155">FINISHED_STOPPED</text><text x="185" y="516" text-anchor="middle" font-size="7.6" fill="#64748b">EOS / stop_token_ids</text>
  <rect x="276" y="490" width="170" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="361" y="504" text-anchor="middle" font-size="8.6" fill="#334155">FINISHED_LENGTH_CAPPED</text><text x="361" y="516" text-anchor="middle" font-size="7.6" fill="#64748b">max_tokens / max_model_len</text>
  <rect x="462" y="490" width="150" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="537" y="504" text-anchor="middle" font-size="8.6" fill="#334155">FINISHED_ABORTED</text><text x="537" y="516" text-anchor="middle" font-size="7.6" fill="#64748b">客户端断开 / stop string</text>
  <rect x="628" y="490" width="130" height="34" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="693" y="504" text-anchor="middle" font-size="8.6" fill="#334155">FINISHED_IGNORED</text><text x="693" y="516" text-anchor="middle" font-size="7.6" fill="#64748b">prompt 超长（队首检查）</text>
  <line x1="605" y1="404" x2="420" y2="484" stroke="#475569" stroke-width="1.5" marker-end="url(#ar14b)"/>
  <text x="536" y="452" text-anchor="middle" font-size="8.4" fill="#475569">update_from_output 终判（:920-937）：EOS / stop_token_ids / max_tokens</text>
  <line x1="195" y1="230" x2="205" y2="484" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar14b)"/>
  <text x="128" y="360" font-size="8.4" fill="#64748b">队首检查：num_tokens &gt; max_model_len</text>
  <text x="128" y="372" font-size="8.4" fill="#64748b">→ 不分配 KV 直接完成（Day 9：</text>
  <text x="128" y="384" font-size="8.4" fill="#64748b">finish reason 映射 "length"）</text>
  <path d="M 690 372 C 740 380 745 440 700 484" fill="none" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar14r)"/>
  <text x="742" y="430" font-size="8.2" fill="#991b1b">死在 waiting：被 abort / 判停</text>
  <text x="742" y="442" font-size="8.2" fill="#991b1b">stopped_preempted_reqs</text>
  <text x="742" y="454" font-size="8.2" fill="#991b1b">（:937 / :984-986）</text>
  <text x="431" y="546" text-anchor="middle" font-size="8.6" fill="#475569">死亡伴随动作：free 全部 KV blocks（引用计数 −1 → hash 保留 → cached 候选，Day 16 的种子）</text>
  <text x="431" y="560" text-anchor="middle" font-size="8.6" fill="#475569">P2 侧：unscheduled_req_ids → input_batch.remove_request（gpu_model_runner.py:552-565）</text>
  <text x="431" y="574" text-anchor="middle" font-size="8.6" fill="#475569">事件收尾：take_events() 随最后一条 EngineCoreOutput 回 P0（:972）→ queue time / TTFT 落账</text>
  <text x="431" y="596" text-anchor="middle" font-size="8.4" fill="#991b1b">stop string 在 P0 判（要看 detokenize 后的文本，Day 8）：命中后回发 ABORT 帧 → P1 标记 FINISHED_ABORTED，可能多算几步</text>

  <!-- ================= Right: three views table ================= -->
  <text x="820" y="80" font-size="13.5" font-weight="bold" fill="#0f172a">三视角对齐表：每次迁移，三张账各记什么</text>
  <rect x="810" y="90" width="410" height="560" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="822" y="104" width="386" height="530" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <line x1="822" y1="130" x2="1208" y2="130" stroke="#cbd5e1"/>
  <line x1="918" y1="104" x2="918" y2="634" stroke="#e2e8f0"/>
  <line x1="1064" y1="104" x2="1064" y2="634" stroke="#e2e8f0"/>
  <text x="870" y="119" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#334155">迁移</text>
  <text x="991" y="119" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#334155">时间面（事件→指标）</text>
  <text x="1136" y="119" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#334155">资源面（KV / 持久批）</text>

  <text x="830" y="144" font-size="8" font-weight="bold" fill="#713f12">出生 add_request</text>
  <text x="924" y="144" font-size="7.8" fill="#334155">QUEUED 打点</text>
  <text x="924" y="155" font-size="7.8" fill="#64748b">（queue time 起点）</text>
  <text x="1070" y="144" font-size="7.8" fill="#334155">0 块；block_hashes</text>
  <text x="1070" y="155" font-size="7.8" fill="#64748b">已预计算（Day 9 ⑦）</text>
  <line x1="822" y1="164" x2="1208" y2="164" stroke="#f1f5f9"/>

  <text x="830" y="180" font-size="8" font-weight="bold" fill="#1e3a8a">WAITING→RUNNING</text>
  <text x="924" y="180" font-size="7.8" fill="#334155">SCHEDULED 打点（首次）</text>
  <text x="924" y="191" font-size="7.8" fill="#64748b">→ queue time 终点</text>
  <text x="1070" y="180" font-size="7.8" fill="#334155">命中回填 → allocate_slots</text>
  <text x="1070" y="191" font-size="7.8" fill="#64748b">→ P2 建槽（new/cached）</text>
  <line x1="822" y1="200" x2="1208" y2="200" stroke="#f1f5f9"/>

  <text x="830" y="216" font-size="8" font-weight="bold" fill="#065f46">RUNNING 每 step</text>
  <text x="924" y="216" font-size="7.8" fill="#334155">无新事件；token 计入</text>
  <text x="924" y="227" font-size="7.8" fill="#64748b">prefill/decode_time</text>
  <text x="1070" y="216" font-size="7.8" fill="#334155">computed += scheduled</text>
  <text x="1070" y="227" font-size="7.8" fill="#64748b">块边界处 +1 块；append</text>
  <line x1="822" y1="236" x2="1208" y2="236" stroke="#f1f5f9"/>

  <text x="830" y="252" font-size="8" font-weight="bold" fill="#991b1b">RUNNING→PREEMPTED</text>
  <text x="924" y="252" font-size="7.8" fill="#334155">PREEMPTED 打点（随下次</text>
  <text x="924" y="263" font-size="7.8" fill="#64748b">输出延迟上报，Day 12 §2.7）</text>
  <text x="1070" y="252" font-size="7.8" fill="#334155">free 全部块（→cached）</text>
  <text x="1070" y="263" font-size="7.8" fill="#64748b">P2 摘批，缓存态保留</text>
  <line x1="822" y1="272" x2="1208" y2="272" stroke="#f1f5f9"/>

  <text x="830" y="288" font-size="8" font-weight="bold" fill="#065f46">PREEMPTED→RUNNING</text>
  <text x="924" y="288" font-size="7.8" fill="#334155">SCHEDULED 不再记</text>
  <text x="924" y="299" font-size="7.8" fill="#64748b">（stats.py:153 只记首次）</text>
  <text x="1070" y="288" font-size="7.8" fill="#334155">自命中认领 + 新分配</text>
  <text x="1070" y="299" font-size="7.8" fill="#64748b">P2 整表替换（:646-650）</text>
  <line x1="822" y1="308" x2="1208" y2="308" stroke="#f1f5f9"/>

  <text x="830" y="324" font-size="8" font-weight="bold" fill="#475569">→ 终态（P1 判）</text>
  <text x="924" y="324" font-size="7.8" fill="#334155">last_token_ts → TTFT</text>
  <text x="924" y="335" font-size="7.8" fill="#64748b">/TPOT 落账（Day 5）</text>
  <text x="1070" y="324" font-size="7.8" fill="#334155">free 全部块 → cached</text>
  <text x="1070" y="335" font-size="7.8" fill="#64748b">P2 摘批删槽</text>
  <line x1="822" y1="344" x2="1208" y2="344" stroke="#f1f5f9"/>

  <text x="830" y="360" font-size="8" font-weight="bold" fill="#475569">终态之后</text>
  <text x="924" y="360" font-size="7.8" fill="#334155">events 随最后一条输出</text>
  <text x="924" y="371" font-size="7.8" fill="#64748b">回 P0（:972）</text>
  <text x="1070" y="360" font-size="7.8" fill="#334155">块在 LRU 里等驱逐</text>
  <text x="1070" y="371" font-size="7.8" fill="#64748b">或等命中（Day 16）</text>

  <rect x="822" y="390" width="386" height="118" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="1015" y="410" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e3a8a">两本账贯穿全程（Day 9 解剖、Day 11/12 消费）</text>
  <text x="1015" y="428" text-anchor="middle" font-size="8.4" fill="#1e3a8a">num_computed_tokens：prefill 到哪了 / chunk 游标 / 抢占清零——schedule() 的追赶目标</text>
  <text x="1015" y="443" text-anchor="middle" font-size="8.4" fill="#1e3a8a">output_token_ids：已生成 token——抢占时保留，恢复时并入"重算的 prompt"（:420-423）</text>
  <text x="1015" y="458" text-anchor="middle" font-size="8.4" fill="#1e3a8a">状态机 = 这两本账 + block table 在时间轴上的投影：读状态先读账</text>
  <text x="1015" y="478" text-anchor="middle" font-size="8.4" fill="#7c2d12">WAITING_FOR_FSM / WAITING_FOR_REMOTE_KV 是"资格旁路"（Day 9），</text>
  <text x="1015" y="492" text-anchor="middle" font-size="8.4" fill="#7c2d12">不改变三视角记账方式——状态机主干只有 WAITING / RUNNING / PREEMPTED 三态</text>

  <rect x="822" y="520" width="386" height="106" rx="6" fill="#f0fdf4" stroke="#10b981"/>
  <text x="1015" y="540" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#065f46">面试检验标准（Day 14 口径）</text>
  <text x="1015" y="558" text-anchor="middle" font-size="8.4" fill="#065f46">① 随机指一条边，说出触发条件 + 源码行号；</text>
  <text x="1015" y="573" text-anchor="middle" font-size="8.4" fill="#065f46">② 说清"PREEMPTED 的请求物理上住在 waiting 队首、逻辑上是独立状态"；</text>
  <text x="1015" y="588" text-anchor="middle" font-size="8.4" fill="#065f46">③ 说清四个终态各自的判定者：P1 判三个半，P0 判 stop string 半个。</text>
  <text x="1015" y="607" text-anchor="middle" font-size="8.4" fill="#047857">每条边都对应 /metrics 的一条曲线——状态机是诊断树（Day 51）的骨架</text>

  <!-- bottom -->
  <rect x="50" y="662" width="1170" height="56" rx="6" fill="#fff7ed" stroke="#f97316"/>
  <text x="635" y="684" text-anchor="middle" font-size="9.8" font-weight="bold" fill="#7c2d12">一句话本质</text>
  <text x="635" y="702" text-anchor="middle" font-size="9.2" fill="#7c2d12">一个请求的一生 = 三次身份迁移（入批 / 抢占-复活 / 终态）× 两本账（computed / output）× 一份资源（block table）——Scheduler 的全部源码，就是这台状态机的转移函数</text>
  <text x="620" y="752" text-anchor="middle" font-size="9.5" fill="#64748b">配套：图 2 一图流（三进程数据流）· 图 3 自测推演（10 个请求、KV 只够 6 个）——本图是 Day 9 图 2 右侧的"完全体"：补上终态区四态、事件面与资源面</text>
  <text x="620" y="770" text-anchor="middle" font-size="9.5" fill="#64748b">版本口径：v0.11.0（2026-10 复核）；FINISHED_IGNORED 的判定位置随版本有差异（schedule() 队首检查 / 入队路径），引用前以你 checkout 的代码为准</text>
</svg>
