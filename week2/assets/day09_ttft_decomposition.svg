<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#ffffff"/>
  <text x="620" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">TTFT 的成分与归属：入口链路占哪几段（衔接 Day 5）</text>
  <text x="620" y="46" text-anchor="middle" font-size="11" fill="#64748b">以 8K prompt · Qwen3-8B · H100 · 低并发 为例的数量级示意（精确值以实测为准）· 段宽不做等比例尺</text>

  <!-- ============ 时间轴 ============ -->
  <line x1="60" y1="120" x2="1180" y2="120" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#ar3)"/>
  <text x="1192" y="124" font-size="9" fill="#64748b">t</text>

  <!-- 段 1: HTTP -->
  <rect x="60" y="76" width="70" height="44" rx="4" fill="#93c5fd"/>
  <text x="95" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#1e3a8a">t_http</text>
  <text x="95" y="106" text-anchor="middle" font-size="7.6" fill="#1e3a8a">~0.1-1 ms</text>
  <text x="95" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">uvicorn/FastAPI</text>
  <text x="95" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">JSON 解析（P0）</text>

  <!-- 段 2: template + tokenize -->
  <rect x="134" y="76" width="150" height="44" rx="4" fill="#60a5fa"/>
  <text x="209" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#0c1e4e">t_template + t_tok</text>
  <text x="209" y="106" text-anchor="middle" font-size="7.6" fill="#0c1e4e">~5-30 ms @8K</text>
  <text x="209" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">Jinja 渲染 + tokenizer.encode</text>
  <text x="209" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">P0 · encode_async（线程池）</text>

  <!-- 段 3: IPC -->
  <rect x="288" y="76" width="46" height="44" rx="4" fill="#fdba74"/>
  <text x="311" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#7c2d12">t_ipc↓</text>
  <text x="311" y="106" text-anchor="middle" font-size="7.6" fill="#7c2d12">~0.05 ms</text>
  <text x="311" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">ZMQ + msgpack</text>
  <text x="311" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">（Day 8 §3.2 的账）</text>

  <!-- 段 4: queue -->
  <rect x="338" y="76" width="140" height="44" rx="4" fill="#fbbf24"/>
  <text x="408" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#78350f">t_queue（排队）</text>
  <text x="408" y="106" text-anchor="middle" font-size="7.6" fill="#78350f">0 ~ N×step</text>
  <text x="408" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">waiting 队列：QUEUED→SCHEDULED</text>
  <text x="408" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">空闲时≈0；拥塞时主导 p99（P1）</text>

  <!-- 段 5: sched -->
  <rect x="482" y="76" width="56" height="44" rx="4" fill="#fcd34d"/>
  <text x="510" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#78350f">t_sched</text>
  <text x="510" y="106" text-anchor="middle" font-size="7.6" fill="#78350f">~0.4 ms</text>
  <text x="510" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">schedule() 组批</text>
  <text x="510" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">（P1，Day 8 图 3）</text>

  <!-- 段 6: prefill -->
  <rect x="542" y="76" width="420" height="44" rx="4" fill="#0f172a"/>
  <text x="752" y="94" text-anchor="middle" font-size="9.2" font-weight="bold" fill="#f1f5f9">t_prefill（计算密集：2·N·L FLOPs ÷ 有效 TFLOPS，Day 1/2 手算）</text>
  <text x="752" y="107" text-anchor="middle" font-size="7.8" fill="#cbd5e1">8B × 8K ≈ 131 GFLOP → H100 实测量级几十 ms（受 MFU 与 batch 影响）</text>
  <text x="752" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">GPU forward + sample（P2）· chunked prefill 会把它切片（Day 11）</text>
  <text x="752" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">注意：排队的人越多，单步 prefill 越大 → t_queue 与 t_prefill 不独立</text>

  <!-- 段 7: out -->
  <rect x="966" y="76" width="90" height="44" rx="4" fill="#93c5fd"/>
  <text x="1011" y="94" text-anchor="middle" font-size="8.6" font-weight="bold" fill="#1e3a8a">t_out</text>
  <text x="1011" y="106" text-anchor="middle" font-size="7.6" fill="#1e3a8a">~1 ms</text>
  <text x="1011" y="136" text-anchor="middle" font-size="7.8" fill="#64748b">首 token detok + SSE</text>
  <text x="1011" y="146" text-anchor="middle" font-size="7.8" fill="#64748b">P0 · output_handler</text>

  <!-- 归属括线 -->
  <path d="M 60 62 H 478" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 478 62 V 70" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <path d="M 60 62 V 70" stroke="#2563eb" stroke-width="1.6" fill="none"/>
  <text x="269" y="56" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2563eb">入口链路（今天 · P0 为主 + 一次 IPC + 进队瞬间）</text>

  <path d="M 482 62 H 1060" stroke="#92400e" stroke-width="1.6" fill="none"/>
  <path d="M 1060 62 V 70" stroke="#92400e" stroke-width="1.6" fill="none"/>
  <path d="M 482 62 V 70" stroke="#92400e" stroke-width="1.6" fill="none"/>
  <text x="771" y="50" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#92400e">排队 + 调度 + prefill（Day 10-12 的地盘 · P1 + GPU）</text>

  <!-- 事件时间戳标尺 -->
  <g font-size="8.2">
    <line x1="288" y1="164" x2="288" y2="184" stroke="#dc2626" stroke-width="1.4"/>
    <text x="288" y="196" text-anchor="middle" fill="#dc2626" font-weight="bold">arrival_time</text>
    <text x="288" y="206" text-anchor="middle" fill="#64748b">P0 process_inputs 起点附近</text>

    <line x1="478" y1="164" x2="478" y2="184" stroke="#dc2626" stroke-width="1.4"/>
    <text x="478" y="196" text-anchor="middle" fill="#dc2626" font-weight="bold">QUEUED 事件</text>
    <text x="478" y="206" text-anchor="middle" fill="#64748b">⑨ Scheduler.add_request</text>

    <line x1="538" y1="164" x2="538" y2="184" stroke="#dc2626" stroke-width="1.4"/>
    <text x="538" y="196" text-anchor="middle" fill="#dc2626" font-weight="bold">SCHEDULED 事件</text>
    <text x="538" y="206" text-anchor="middle" fill="#64748b">首次进 running（Day 10）</text>

    <line x1="966" y1="164" x2="966" y2="184" stroke="#dc2626" stroke-width="1.4"/>
    <text x="966" y="196" text-anchor="middle" fill="#dc2626" font-weight="bold">first_token_ts</text>
    <text x="966" y="206" text-anchor="middle" fill="#64748b">首条含 new_token 的输出</text>
  </g>

  <!-- 区间换算（RequestStats） -->
  <rect x="60" y="222" width="996" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="558" y="239" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#991b1b">P1 侧事件的差值换算（v1/metrics/stats.py::RequestStats，事件随最后的 EngineCoreOutput 回 P0）</text>
  <text x="558" y="254" text-anchor="middle" font-size="9" fill="#475569">queue time = scheduled_ts − queued_ts　　prefill time = first_token_ts − scheduled_ts　　（抢占会打断 scheduled_ts 的唯一性，只记首次）</text>

  <!-- ============ 底部三张卡 ============ -->
  <rect x="40" y="284" width="383" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="306" font-size="10" font-weight="bold" fill="#0f172a">公式卡（Day 5 的成分分解落到代码坐标）</text>
  <text x="52" y="326" font-size="8.8" fill="#475569">TTFT = t_http + t_tpl + t_tok + t_ipc↓ + t_queue</text>
  <text x="52" y="339" font-size="8.8" fill="#475569">　　　+ t_sched + t_prefill + t_out</text>
  <text x="52" y="359" font-size="8.8" fill="#475569">· 入口段（今天）：t_tpl + t_tok 是 L 的线性函数，</text>
  <text x="52" y="372" font-size="8.8" fill="#475569">　128K prompt 可达上百 ms——P0 的串行资源</text>
  <text x="52" y="392" font-size="8.8" fill="#475569">· 排队段：拥塞时被 batch 间隔放大 → p99 主项</text>
  <text x="52" y="412" font-size="8.8" fill="#475569">· prefill 段：计算 bound（Day 1 结论），</text>
  <text x="52" y="425" font-size="8.8" fill="#475569">　长 prompt 下是 TTFT 主体</text>
  <text x="52" y="445" font-size="8.4" fill="#64748b">优化各归其主：入口→P0 扩容；排队→调度参数；prefill→算力/量化</text>

  <rect x="443" y="284" width="374" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="455" y="306" font-size="10" font-weight="bold" fill="#0f172a">tokenize 成本模型（今天的数学）</text>
  <text x="455" y="326" font-size="8.8" fill="#475569">t_tok ≈ L_text / R_tok，R_tok ≈ 1~10 MB/s（HF fast</text>
  <text x="455" y="339" font-size="8.8" fill="#475569">tokenizer 单线程，实测为准）</text>
  <text x="455" y="359" font-size="8.8" fill="#475569">· 8K token ≈ 24 KB 文本 → 约 2~24 ms</text>
  <text x="455" y="372" font-size="8.8" fill="#475569">· 32K token ≈ 96 KB → 约 10~96 ms</text>
  <text x="455" y="392" font-size="8.8" fill="#475569">· 128K token ≈ 384 KB → 约 40~380 ms</text>
  <text x="455" y="412" font-size="8.8" fill="#475569">encode_async 只是丢进线程池不阻塞事件循环，</text>
  <text x="455" y="425" font-size="8.8" fill="#475569">成本本身不消失；大 prompt 高并发 → --api-server-count</text>
  <text x="455" y="445" font-size="8.4" fill="#64748b">（对齐 Day 8 Q6：前端也是要喂饱的资源）</text>

  <rect x="837" y="284" width="363" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="849" y="306" font-size="10" font-weight="bold" fill="#0f172a">怎么实测（把示意变成数据）</text>
  <text x="849" y="326" font-size="8.8" fill="#475569">· vllm bench serve 的 TTFT 分位数随并发曲线（Day 6）</text>
  <text x="849" y="339" font-size="8.8" fill="#475569">· /metrics：vllm time_to_first_token_seconds 直方图；</text>
  <text x="849" y="352" font-size="8.8" fill="#475569">　--log-stats 周期行看 Running/Waiting 分解排队拥塞</text>
  <text x="849" y="372" font-size="8.8" fill="#475569">· 本地 python -c "tokenizer.encode(...)" 单独计时，</text>
  <text x="849" y="385" font-size="8.8" fill="#475569">　把 t_tok 从 TTFT 里剥出来（今天实验 3）</text>
  <text x="849" y="405" font-size="8.8" fill="#475569">· OTel tracing 已内置 queue/prefill/decode 分段</text>
  <text x="849" y="418" font-size="8.8" fill="#475569">　（do_tracing 的 span 属性，开 tracing 即得）</text>
  <text x="849" y="438" font-size="8.4" fill="#64748b">Day 13 会用压测把 t_queue 拉长，观察曲线拐点</text>

  <rect x="40" y="490" width="1160" height="56" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="620" y="510" text-anchor="middle" font-size="10" font-weight="bold" fill="#854d0e">一句话结论：TTFT = 入口段（P0，∝ prompt 长度，今天）+ 排队段（P1 waiting，拥塞时主导 p99，Day 10-13）+ prefill 段（GPU 计算 bound，Day 11/18）——每一段都有独立的代码坐标与测量手段</text>
  <text x="620" y="528" text-anchor="middle" font-size="9" fill="#a16207">Day 5 的"指标是成分的加法"今天完成了第一次坐标落地；后续每天学一段，就把这段的优化手段补进武器库</text>
</svg>
